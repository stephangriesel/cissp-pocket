mpany, the primary risk is unauthorized access to proprietary research and manufacturing processes — which would cause loss of competitive advantage, regulatory breaches, and reputational damage. While integrity and availability matter, confidentiality is the dominant concern given the sensitivity of the data."},{"id":"d1_q_011","domain":"D1","difficulty":"medium","question":"With the CIA triad in mind, if an organization enforces too much confidentiality, which other principle will suffer the MOST?","options":["Availability — excessive access restrictions prevent authorized users from getting to data when needed","Integrity — heavy encryption introduces risks of data corruption or loss","Confidentiality — too many controls can undermine the confidentiality model itself","Accessibility — stricter controls reduce the overall accessibility of systems"],"answer":0,"explanation":"The CIA triad components must be balanced. When confidentiality is over-enforced — too many barriers, strict access controls, heavy encryption — authorized users struggle to access data when needed, directly reducing availability. Integrity is less directly impacted. Accessibility is not a standalone CIA triad component; it falls under availability."},{"id":"d1_q_012","domain":"D1","difficulty":"easy","question":"We often use the IAAA model in IT security. What does it do?","options":["Identifies, authenticates, and authorizes users and resources","Integrates and analyzes security data across the organization","Protects the confidentiality, integrity, and availability of data","Monitors the overall security posture of the organization"],"answer":0,"explanation":"IAAA stands for Identification, Authentication, Authorization, and Accountability. It identifies who is requesting access, authenticates that they are who they claim to be, authorizes what they can do, and maintains accountability through logging. The correct answer omits Accountability but is still the best fit. The other options describe the CIA triad or security monitoring functions, not IAAA."},{"id":"d1_q_013","domain":"D1","difficulty":"easy","question":"What is the difference between authentication and authorization?","options":["Authentication verifies identity; authorization grants access to specific resources","Authentication grants access to resources; authorization verifies identity","Both are the same process performed at different times in a session","Authentication and authorization are unrelated processes"],"answer":0,"explanation":"Authentication confirms who you are (e.g., via password or biometric). Authorization comes after, determining what the authenticated user is allowed to do. They are distinct but interdependent — authentication must succeed before authorization is applied."},{"id":"d1_q_014","domain":"D1","difficulty":"easy","question":"When authenticating against an access control system using a passphrase, which type of authentication are you using?","options":["Password authentication (something you know)","Single-factor authentication","Two-factor authentication","Multi-factor authentication"],"answer":0,"explanation":"A passphrase is a type of password — something you know. This makes it password authentication specifically. While it is also single-factor authentication, that is a broader category. The question asks for the type, so password authentication is the most precise answer. MFA and 2FA require additional factor categories beyond something you know."},{"id":"d1_q_015","domain":"D1","difficulty":"medium","question":"Which of the following is the PRIMARY indicator of good governance in an organization?","options":["Best alignment of resources with business objectives","Highest level of compliance with regulations","Least amount of risk to the organization","Most effective decision-making processes"],"answer":0,"explanation":"Good governance is primarily about aligning all resources — human, financial, technological — with the organization's strategic objectives. Compliance, risk reduction, and effective decisions all matter, but they are components of governance, not the primary indicator. An org can be fully compliant yet govern poorly if its resources don't serve its goals."},{"id":"d1_q_016","domain":"D1","difficulty":"easy","question":"Which type of security governance and management approach should an organization strive for?","options":["Proactive — anticipating threats and addressing vulnerabilities before they are exploited","Reactive — responding to threats and incidents after they occur","Compliant — focusing on meeting the minimum requirements of regulations and standards","Ad hoc — handling security issues as they arise without a structured approach"],"answer":0,"explanation":"Proactive governance means continuously assessing risk, monitoring systems, and training staff before incidents occur. Reactive approaches cost more and cause more damage. Compliance-only thinking creates a checklist mentality that misses org-specific risks. Ad hoc approaches leave gaps due to lack of structure and consistency."},{"id":"d1_q_017","domain":"D1","difficulty":"easy","question":"What is the PRIMARY function of a security management process?","options":["To assess and minimize risk to the organization","To ensure compliance with security policies and standards","To monitor and control access to information and systems","To develop and implement security controls"],"answer":0,"explanation":"The primary function of security management is risk assessment and mitigation. Compliance, access control, and implementing controls are all important — but they are tools in service of the broader goal: reducing risk to the organization's information and systems."},{"id":"d1_q_018","domain":"D1","difficulty":"hard","question":"During a court case, the defense argues that server log files are hearsay. Under what conditions can computer-generated log files be admitted as evidence despite this classification?","options":["They were generated near the time of the attack, have a clear chain of custody, and are proven unaltered via hash verification","Log files are never admissible in court under any circumstances","Only if a human witness personally observed every event recorded in the log","Automatically admissible without conditions because they are machine-generated"],"answer":0,"explanation":"Computer-generated logs are hearsay but qualify as a recognized exception if: (1) created at or near the time of the incident, (2) a documented chain of custody exists, and (3) integrity is verified by comparing hash values at collection with current values. Machine generation alone does not guarantee admissibility — broken chain of custody or altered data can render logs inadmissible."},{"id":"d1_q_019","domain":"D1","difficulty":"easy","question":"Your company's trademark application has been approved. What protection does this grant you?","options":["Protection from others using your trademark without permission","Protection only if the infringer is in the same industry","Protection only if the infringer is located in the same country","Protection only if the infringer is using it for commercial purposes"],"answer":0,"explanation":"Trademark approval grants exclusive rights to use that mark. Others cannot use the same or confusingly similar mark without permission, regardless of industry, country (international agreements like the Madrid Protocol extend protection), or whether the use is commercial. Non-commercial use can still constitute infringement if it causes confusion or dilutes a famous mark."},{"id":"d1_q_020","domain":"D1","difficulty":"medium","question":"In what order should security controls be implemented within a security framework?","options":["Most critical to least critical","Least expensive to most expensive","Most effective to least effective","Most widely used to least widely used"],"answer":0,"explanation":"Implementing controls from most critical to least critical ensures the highest-risk vulnerabilities are addressed first, protecting the most valuable assets before resources run out. Cost and effectiveness matter but should not override urgency. Popularity is irrelevant — a common control may not address your organization's specific threats."},{"id":"d1_q_021","domain":"D1","difficulty":"medium","question":"Which of the following is NOT a requirement for HIPAA compliance?","options":["Ensuring unauthorized access to health information","Encrypting electronic health records (ePHI)","Implementing appropriate physical safeguards","Providing regular security training to employees"],"answer":0,"explanation":"HIPAA requires organizations to PREVENT unauthorized access, not ensure it. The other three are genuine HIPAA requirements: the Security Rule mandates encryption of ePHI, physical safeguards (facility controls, device policies), and regular workforce training for all staff who handle protected health information."},{"id":"d1_q_022","domain":"D1","difficulty":"hard","question":"A company suffers a breach exposing 50,000 customer records, all encrypted with strong encryption. How might the encryption status affect the company's breach notification obligation?","options":["Many state breach notification laws include an encryption clause that may exempt the company from notification","Encryption has no impact on breach notification requirements under any circumstances","Encryption automatically eliminates all legal liability for the breach","The company must notify customers twice — once for the breach and once for the encryption status"],"answer":0,"explanation":"Many US state breach notification laws include an encryption safe harbor: if compromised data was adequately encrypted, the organization may not need to notify affected individuals, since strong encryption renders the data unusable to the attacker. However, encryption does not eliminate all liability — regulatory scrutiny, contractual obligations, and civil exposure may still apply."},{"id":"d1_q_023","domain":"D1","difficulty":"medium","question":"A US-based company collects personal data from customers in both the US and EU. Does GDPR apply, and if so, for which customers?","options":["GDPR applies to all customers physically located in the EU, regardless of the company's location","GDPR does not apply because the company is headquartered in the US","GDPR only applies to EU citizens, even if they live outside the EU","GDPR applies only if the company has a physical office in the EU"],"answer":0,"explanation":"GDPR coverage is based on where data subjects are located, not where the company is based. Any organization processing data of individuals physically present in the EU must comply — even with no EU office. Notably, an EU citizen living outside the EU is NOT covered; a non-EU citizen living in the EU IS covered."},{"id":"d1_q_025","domain":"D1","difficulty":"medium","question":"When you sign the ISC2 Code of Ethics before taking the certification exam, what do you NOT promise to protect?","options":["Your personal reputation","Society and the common good","The information security profession","The interests of your principals (clients/employers)"],"answer":0,"explanation":"The ISC2 Code of Ethics commits signatories to protecting society and public trust, acting with integrity, serving principals diligently, and advancing the profession. Personal reputation is not mentioned — the code focuses on ethical obligations to others and the profession, not on protecting one's own standing."},{"id":"d1_q_026","domain":"D1","difficulty":"easy","question":"Which of the following is NOT a principle of ethical behavior in the information security industry?","options":["Profit-making","Protecting the privacy and confidentiality of personal information","Ensuring the security and integrity of information systems","Professionalism and adherence to industry standards"],"answer":0,"explanation":"Profit-making is a business goal, not an ethical principle. Ethical principles in information security include protecting privacy and confidentiality, ensuring system security and integrity, and maintaining professionalism. While financial sustainability matters to organizations, it is not an ethical principle guiding individual practitioner conduct."},{"id":"d1_q_027","domain":"D1","difficulty":"easy","question":"What is the LEAST important aspect of a mission statement?","options":["Length","Clarity","Alignment with business goals","Compellingness"],"answer":0,"explanation":"A mission statement's effectiveness is determined by its content, not its length. It must be clear so stakeholders understand the company's purpose, aligned with business goals to provide direction, and compelling to inspire employees and guide decisions. Length is irrelevant — a concise statement can be more effective than a long one."},{"id":"d1_q_028","domain":"D1","difficulty":"easy","question":"What is the PRIMARY purpose of a security policy?","options":["To provide guidance to employees on how to properly secure data and systems","To ensure employees are held accountable for their actions","To ensure only authorized personnel have access to sensitive information","To protect the organization from legal liabilities"],"answer":0,"explanation":"A security policy's primary purpose is to outline expectations, procedures, and guidelines for handling and securing data, systems, and resources. Accountability, access control, and legal protection are all valuable secondary benefits, but they flow from the policy's core function of providing clear security guidance."},{"id":"d1_q_029","domain":"D1","difficulty":"easy","question":"An organization has policies, procedures, standards, and guidelines. Which of these is NON-mandatory?","options":["Guidelines","Policies","Procedures","Standards"],"answer":0,"explanation":"Guidelines are recommended actions that help maintain consistency and efficiency but can be deviated from when the situation warrants — they are not enforceable. Policies (mandatory principles), procedures (mandatory step-by-step instructions), and standards (mandatory performance levels) are all required to be followed, and deviation can result in non-compliance or disciplinary action."},{"id":"d1_q_030","domain":"D1","difficulty":"easy","question":"Your organization provides annual corporate security training to all employees. What type of security control is this?","options":["Administrative control","Physical control","Technical control","Operational control"],"answer":0,"explanation":"Administrative controls are management-driven methods that control behavior and minimize risk — including policies, procedures, training programs, and security awareness initiatives. Annual security training shapes employee behavior and promotes compliance. Physical controls protect tangible assets, technical controls use technology, and operational controls govern day-to-day procedures."},{"id":"d1_q_031","domain":"D1","difficulty":"medium","question":"Which of the following is the HIGHEST level of security control developed within an organization?","options":["Administrative controls","Technical controls","Physical controls","Legal controls"],"answer":0,"explanation":"Administrative controls are the highest level because they establish the policies, procedures, and standards that all other controls depend on. Technical controls (firewalls, encryption) and physical controls (locks, cameras) derive their effectiveness from the administrative framework. Legal controls are external to the organization and enforced by outside entities, so they are not in the same classification."},{"id":"d1_q_032","domain":"D1","difficulty":"easy","question":"During the hiring process, your organization conducts background checks on all candidates. What type of security control is a background check?","options":["Administrative control","Detective control","Technical control","Physical control"],"answer":0,"explanation":"A background check is an administrative control — a policy-driven process for verifying candidate identity and suitability before hire. It is not a detective control (which identifies incidents during system operation), not a technical control (no automated system protection involved), and not a physical control (no physical access restriction)."},{"id":"d1_q_033","domain":"D1","difficulty":"easy","question":"Which formula correctly calculates the Annualized Loss Expectancy (ALE)?","options":["ALE = SLE × ARO","ALE = AV × EF","ALE = AV × ARO","ALE = SLE / ARO"],"answer":0,"explanation":"ALE = SLE × ARO. First calculate SLE (Single Loss Expectancy) = AV × EF, then multiply by ARO (Annual Rate of Occurrence) to get the annualized cost of the risk. AV × EF gives you SLE, not ALE. Dividing by ARO would reduce risk impact, which is wrong."},{"id":"d1_q_034","domain":"D1","difficulty":"medium","question":"A company laptop is valued at $10,000 (hardware + PII data). If stolen, the loss is total. The organization loses 25 laptops per year. What is the Annualized Loss Expectancy (ALE)?","options":["$250,000","$10,000","$25,000","$100,000"],"answer":0,"explanation":"SLE = AV × EF = $10,000 × 100% = $10,000. ALE = SLE × ARO = $10,000 × 25 = $250,000. The EF is 100% because a stolen laptop is a total loss. ARO is 25 because 25 laptops are lost per year."},{"id":"d1_q_035","domain":"D1","difficulty":"medium","question":"A data center is valued at $10,000,000. If flooding occurs, 15% of the facility is compromised. Flooding is expected once every 4 years. What is the ALE?","options":["$375,000","$1,500,000","$2,500,000","$150,000"],"answer":0,"explanation":"SLE = AV × EF = $10,000,000 × 15% = $1,500,000. ARO = 1 ÷ 4 = 0.25 (once every 4 years). ALE = SLE × ARO = $1,500,000 × 0.25 = $375,000. A common mistake is using the SLE ($1,500,000) as the answer without multiplying by ARO."},{"id":"d1_q_036","domain":"D1","difficulty":"medium","question":"A web server is valued at $800,000. A successful DDoS attack compromises 60% of its availability. Attacks occur 3 times per year on average. What is the ALE?","options":["$1,440,000","$480,000","$2,400,000","$160,000"],"answer":0,"explanation":"SLE = AV × EF = $800,000 × 60% = $480,000. ALE = SLE × ARO = $480,000 × 3 = $1,440,000. A common mistake is stopping at SLE ($480,000) without multiplying by the ARO of 3."},{"id":"d1_q_037","domain":"D1","difficulty":"medium","question":"A database server is valued at $2,000,000. A data breach exposes 25% of its data. Breaches are expected once every 2 years. What is the ALE?","options":["$250,000","$500,000","$1,000,000","$50,000"],"answer":0,"explanation":"SLE = AV × EF = $2,000,000 × 25% = $500,000. ARO = 1 ÷ 2 = 0.5. ALE = SLE × ARO = $500,000 × 0.5 = $250,000. When an event happens every 2 years, ARO = 0.5, not 2."},{"id":"d1_q_038","domain":"D1","difficulty":"hard","question":"An office building is valued at $5,000,000. A fire would destroy 30% of the facility. A fire is expected once every 10 years. After implementing a $10,000/year sprinkler system that reduces EF to 10%, what is the new ALE?","options":["$50,000","$150,000","$500,000","$15,000"],"answer":0,"explanation":"With the sprinkler system: SLE = $5,000,000 × 10% = $500,000. ARO = 1 ÷ 10 = 0.1. New ALE = $500,000 × 0.1 = $50,000. The original ALE was $5,000,000 × 30% × 0.1 = $150,000. The control saves $100,000/year in risk for $10,000/year — a clear ROI. The $10,000 control cost is separate from ALE."},{"id":"d1_q_039","domain":"D1","difficulty":"easy","question":"Your organization is considering buying insurance to cover identified security risk gaps. Which type of risk response is this?","options":["Transference","Avoidance","Acceptance","Mitigation"],"answer":0,"explanation":"Transference shifts the financial burden of a risk to a third party — most commonly through insurance or contractual agreements. The risk itself is not eliminated; it still exists. Avoidance redesigns around the risk entirely. Acceptance acknowledges the risk without proactive action. Mitigation reduces the probability or impact of the risk."},{"id":"d1_q_040","domain":"D1","difficulty":"easy","question":"Which of the following is the FIRST step in a risk management plan?","options":["Identify the risks","Develop a risk response plan","Assign a risk level to each risk","Implement risk controls"],"answer":0,"explanation":"Risk identification is always the first step — you cannot assess, prioritize, or respond to risks you have not yet identified. Risk response planning, assigning risk levels (assessment), and implementing controls all depend on first knowing what the risks are. Identification provides the foundation for every subsequent step."},{"id":"d1_q_041","domain":"D1","difficulty":"medium","question":"A database server has an asset value of $500,000. A ransomware attack would compromise 60% of the data. What is the Single Loss Expectancy (SLE)?","options":["$300,000","$200,000","$500,000","$800,000"],"answer":0,"explanation":"SLE = AV × EF = $500,000 × 60% = $300,000. The $200,000 distractor uses 40% (the remaining unaffected portion). $500,000 would only be correct if EF were 100%. $800,000 is impossible — SLE can never exceed the total asset value."},{"id":"d1_q_042","domain":"D1","difficulty":"easy","question":"Which of the following is the definition of compliance in a business and security context?","options":["Ensuring the organization operates according to applicable laws, regulations, and standards","Monitoring internal systems and reporting security incidents","Implementing technical security controls to protect assets","Adhering to internal policies and procedures"],"answer":0,"explanation":"Compliance means conforming to external guidelines, laws, and regulations — such as GDPR, HIPAA, or PCI-DSS. Internal monitoring and security controls may support compliance but don't define it. Following internal policies is internal governance. Non-compliance can result in fines, penalties, and loss of customer trust."},{"id":"d1_q_043","domain":"D1","difficulty":"medium","question":"Which is the MOST important security governance principle to consider when evaluating and implementing security controls?","options":["Compliance","Confidentiality","Integrity","Availability"],"answer":0,"explanation":"Compliance is the most important governance principle because it encompasses legal and regulatory obligations that, if unmet, expose the organization to financial penalties and reputational damage. Confidentiality, integrity, and availability are critical security principles, but they are often addressed within the compliance framework — compliance drives which controls must be implemented."},{"id":"d1_q_044","domain":"D1","difficulty":"medium","question":"What is the difference between risk assessment and risk management in information security?","options":["Risk assessment identifies threats and vulnerabilities; risk management implements controls to mitigate those risks","Risk assessment evaluates control effectiveness; risk management develops incident response plans","Risk assessment determines likelihood and impact; risk management monitors and maintains controls","Risk assessment implements controls; risk management identifies potential risks and vulnerabilities"],"answer":0,"explanation":"Risk assessment is the initial phase — identifying threats and vulnerabilities to understand potential impacts. Risk management is the broader, ongoing process that includes assessment but also deciding how to handle risks (mitigate, accept, transfer, avoid), implementing controls, and continuously monitoring effectiveness. Assessment feeds into management; management is not limited to monitoring."},{"id":"d1_q_045","domain":"D1","difficulty":"easy","question":"What is the main difference between a white hat hacker and a black hat hacker?","options":["White hat hackers use their skills to improve security; black hat hackers use them to exploit vulnerabilities for malicious purposes","White hat hackers are authorized by the government; black hat hackers are not","White hat hackers are paid for their work; black hat hackers hack for personal gain","White hat hackers are motivated by money; black hat hackers are motivated by ideology"],"answer":0,"explanation":"White hat (ethical) hackers probe systems with permission to find and fix vulnerabilities before malicious actors exploit them. Black hat hackers exploit systems without authorization for personal or financial gain. Neither group is exclusively government-authorized or exclusively money/ideology-motivated — both distinctions are oversimplifications."},{"id":"d1_q_046","domain":"D1","difficulty":"easy","question":"A DDoS (Distributed Denial of Service) attack is primarily designed to disrupt which leg of the CIA Triad?","options":["Availability","Confidentiality","Integrity","Non-repudiation"],"answer":0,"explanation":"A DDoS attack floods a system with traffic to make it unavailable to legitimate users — directly targeting Availability. Confidentiality (unauthorized disclosure) and Integrity (unauthorized modification) are not the primary targets of DDoS. Non-repudiation is not part of the CIA Triad."},{"id":"d1_q_047","domain":"D1","difficulty":"easy","question":"What type of attack is a phishing email?","options":["Social engineering attack","Physical attack","Malware attack","DDoS attack"],"answer":0,"explanation":"Phishing is a social engineering attack — it uses deception to trick users into revealing credentials or clicking malicious links. It is not a physical attack (no hardware tampering), not purely a malware attack (though it may deliver malware), and not a DDoS attack (no traffic flooding involved)."},{"id":"d1_q_048","domain":"D1","difficulty":"medium","question":"In a Business Impact Analysis (BIA), which statement is MOST accurate?","options":["The BIA should prioritize the assessment of critical business functions","The BIA should be completed as quickly as possible to minimize disruption","The BIA should only be performed by the business owner","The BIA must be performed by a certified professional to ensure accuracy"],"answer":0,"explanation":"The BIA's primary goal is to identify and evaluate the impact of disruptions to critical business functions. Speed should not compromise thoroughness. The BIA requires a cross-functional team (IT, operations, finance, risk) — relying solely on the business owner or a single certified professional risks gaps and bias."},{"id":"d1_q_049","domain":"D1","difficulty":"medium","question":"As CISO, you are asked to develop a Business Continuity Plan after a major cyberattack. What should be the PRIMARY focus of the BCP?","options":["Identifying critical business functions and ensuring they can continue to operate during an incident","Ensuring all employees are trained in cybersecurity best practices","Implementing new cybersecurity technologies and tools","Establishing a comprehensive incident response plan"],"answer":0,"explanation":"A BCP's primary focus is maintaining or restoring critical business operations during disruption. Employee training prevents incidents but is not BCP's focus. New technology is part of a broader cybersecurity strategy. An incident response plan is reactive and handles the immediate event — the BCP is proactive and broader in scope."},{"id":"d1_q_050","domain":"D1","difficulty":"medium","question":"Which of the following is the MOST critical process within a Business Continuity Plan (BCP)?","options":["Business Impact Analysis (BIA)","Incident response","Crisis management","Disaster recovery"],"answer":0,"explanation":"The BIA is the foundation of the entire BCP — it identifies critical functions, acceptable downtime (MTD), and financial impact of disruptions. Incident response, crisis management, and disaster recovery all depend on BIA findings to set their priorities. Without the BIA, the other processes lack the context needed to be effective."},{"id":"d1_q_051","domain":"D1","difficulty":"easy","question":"What does RPO (Recovery Point Objective) define in a BCP/BIA context?","options":["The acceptable amount of data loss — how far back in time recovery can go","The time required to restore hardware after a disaster","The total downtime a system can sustain before the organization is severely impacted","The time required to configure and test a recovered system"],"answer":0,"explanation":"RPO defines the maximum acceptable data loss — measured in time. If a company backs up daily, their RPO is 24 hours, meaning they accept losing up to a day of data. RPO is determined before the disaster (how old can our last good backup be?), while RTO and WRT are measured after the disaster."},{"id":"d1_q_052","domain":"D1","difficulty":"easy","question":"What does RTO (Recovery Time Objective) define?","options":["The amount of time to restore the system hardware after a disaster","The acceptable amount of data that cannot be recovered","The time to configure and test restored software and backups","The maximum total downtime before the organization is severely impacted"],"answer":0,"explanation":"RTO is the time from disaster to hardware recovery — how long to get the system back up. It must not exceed the MTD. RTO covers hardware restoration; WRT covers the subsequent software configuration and testing phase."},{"id":"d1_q_053","domain":"D1","difficulty":"easy","question":"What does WRT (Work Recovery Time) measure?","options":["The time required to configure a recovered system — restoring backups and testing software","The time to restore failed hardware","The acceptable amount of data loss after a disaster","The maximum time a system can be offline before severe business impact"],"answer":0,"explanation":"WRT begins after hardware is restored (after RTO ends). It covers restoring backups, configuring software, and testing before the system resumes production. Together, RTO + WRT must not exceed MTD."},{"id":"d1_q_054","domain":"D1","difficulty":"medium","question":"What is the correct relationship between MTD, RTO, and WRT?","options":["MTD ≥ RTO + WRT","MTD = RTO - WRT","MTD = RPO + RTO","MTD ≤ RTO + WRT"],"answer":0,"explanation":"MTD (Maximum Tolerable Downtime) must be greater than or equal to RTO + WRT. RTO covers hardware restoration; WRT covers software configuration and testing. Both combined must fit within the MTD window. If RTO + WRT exceeds MTD, the organization will be severely impacted before recovery is complete."},{"id":"d1_q_055","domain":"D1","difficulty":"medium","question":"A system has an MTD of 8 hours. Recovery testing shows RTO is 5 hours and WRT is 4 hours. Is the organization meeting its MTD requirement?","options":["No — RTO + WRT (9 hours) exceeds the MTD of 8 hours","Yes — RTO alone (5 hours) is within the MTD","Yes — WRT alone (4 hours) is within the MTD","Yes — either RTO or WRT individually satisfies the MTD requirement"],"answer":0,"explanation":"MTD must be ≥ RTO + WRT. Here RTO (5h) + WRT (4h) = 9 hours, which exceeds the 8-hour MTD. The organization is NOT meeting its requirement — recovery will take longer than the business can tolerate. Both RTO and WRT together must fit within MTD, not individually."},{"id":"d1_q_056","domain":"D1","difficulty":"easy","question":"What does MTD (Maximum Tolerable Downtime) represent?","options":["The total time a system can be inoperable before the organization is severely impacted","The time to restore hardware after a disaster","The acceptable amount of data loss","The time to configure and test a recovered system"],"answer":0,"explanation":"MTD is the absolute ceiling for downtime — beyond this point, the organization suffers severe impact. It is also referred to as MAD (Maximum Allowable Downtime), MTO (Maximum Tolerable Outage), MAO (Maximum Acceptable Outage), MTPoD, or AIW (Allowable Interruption Window). For the CISSP exam, use MTD."},{"id":"d1_q_057","domain":"D1","difficulty":"easy","question":"Which of the following is another accepted term for MTD (Maximum Tolerable Downtime)?","options":["MAD (Maximum Allowable Downtime)","RPO (Recovery Point Objective)","WRT (Work Recovery Time)","MTBF (Mean Time Between Failures)"],"answer":0,"explanation":"MTD is also known as MAD (Maximum Allowable Downtime), MTO (Maximum Tolerable Outage), MAO (Maximum Acceptable Outage), MTPoD (Maximum Tolerable Period of Disruption), and AIW (Allowable Interruption Window). For the CISSP exam, MTD is the preferred term. RPO, WRT, and MTBF are all separate, distinct metrics."},{"id":"d1_q_058","domain":"D1","difficulty":"easy","question":"An organization performs weekly backups every Sunday night. What is the maximum RPO they are accepting?","options":["7 days — they could lose up to a week of data","1 day — backups run overnight","0 — backups guarantee no data loss","24 hours — the backup window"],"answer":0,"explanation":"RPO equals the time since the last backup. If backups run once a week, a disaster on Saturday could mean losing nearly 7 days of data. To reduce RPO, organizations must back up more frequently — daily backups give a 24-hour RPO, hourly backups give a 1-hour RPO."},{"id":"d1_q_059","domain":"D1","difficulty":"easy","question":"What does MTBF (Mean Time Between Failures) measure?","options":["How long a system or component will function on average before failing","How long it takes to repair a failed system","The maximum downtime before severe business impact","The minimum requirements for a system to operate"],"answer":0,"explanation":"MTBF measures reliability — the average time between one failure and the next. A higher MTBF means a more reliable system. It helps organizations plan for spare parts and anticipate how frequently hardware will need to be replaced or repaired."},{"id":"d1_q_060","domain":"D1","difficulty":"easy","question":"What does MTTR (Mean Time to Repair) measure?","options":["How long it takes to recover and restore a failed system","How long a system functions before failing","The acceptable data loss window","The maximum tolerable downtime"],"answer":0,"explanation":"MTTR measures the average time needed to repair or restore a failed system. A lower MTTR means faster recovery. MTBF and MTTR are complementary: MTBF tells you how often failures happen, MTTR tells you how long each failure takes to fix."},{"id":"d1_q_061","domain":"D1","difficulty":"medium","question":"What does MOR (Minimum Operating Requirements) define in a BCP context?","options":["The minimum environmental and connectivity requirements for critical systems to function at a DR site","The maximum time a critical system can be offline","The minimum number of staff required during a disaster","The minimum data retention period under compliance regulations"],"answer":0,"explanation":"MOR defines the bare minimum infrastructure — power, network, hardware specs — needed for critical systems to operate. At a DR site, you may not need full production specs; you only need enough to resume critical business functions. This helps organizations plan cost-effective disaster recovery sites."},{"id":"d1_q_062","domain":"D1","difficulty":"medium","question":"Under a BIA, what qualifies a business function as 'critical'?","options":["Disruption is unacceptable given the cost of recovery, or the function is legally required","The function is used by more than 50% of employees","The function generates the highest revenue for the organization","The function has the most end users"],"answer":0,"explanation":"A BIA classifies a function as critical when its disruption would be unacceptable — either because recovery costs are too high relative to the impact, or because law or regulation mandates continuity. User count or revenue alone don't determine criticality; impact severity and legal obligation do."},{"id":"d1_q_063","domain":"D1","difficulty":"easy","question":"Your organization enforces least privilege in user access management. How are user privileges assigned?","options":["Exactly the minimum access needed to perform their job — no more","The same privileges as the rest of their group","More than needed day-to-day so they can handle emergencies","At the data owner's discretion"],"answer":0,"explanation":"Least privilege means users receive only the access rights essential for their job function. Group-based access can over-provision individuals. Extra 'emergency' privileges should be granted temporarily through an authorized process. Data owner discretion alone is not the governing principle — minimum necessary access is."},{"id":"d1_q_064","domain":"D1","difficulty":"easy","question":"You are explaining the CIA triad to the board of directors. Which three components make up the CIA triad?","options":["Confidentiality, Integrity, and Availability","Confidentiality, Integrity, and Accountability","Confidentiality, Identity, and Availability","Identity, Accountability, and Confidentiality"],"answer":0,"explanation":"The CIA triad stands for Confidentiality (only authorized access), Integrity (data is accurate and unaltered), and Availability (data is accessible when needed). Accountability, identity, and authentication are important security concepts but are not the three pillars of the CIA triad."},{"id":"d1_q_065","domain":"D1","difficulty":"easy","question":"An attacker is targeting your encryption. Which leg of the CIA triad are they MOSTLY attacking?","options":["Confidentiality","Authentication","Availability","Integrity"],"answer":0,"explanation":"Encryption exists to protect confidentiality — keeping data unreadable by unauthorized parties. Attacking encryption is an attempt to access the content of protected information. Availability attacks (e.g., DDoS) disrupt access. Integrity attacks modify data. Authentication verifies identity and is not directly targeted by breaking encryption."},{"id":"d1_q_066","domain":"D1","difficulty":"medium","question":"What was the primary intent of the US Electronic Communications Privacy Act of 1986 (ECPA)?","options":["To protect electronic communications against warrantless wiretapping","To allow search and seizure without immediate disclosure","To mandate service providers to use strong encryption","To allow law enforcement to conduct wiretaps without a warrant"],"answer":0,"explanation":"The ECPA extended government wiretap restrictions from telephone calls to electronic data transmissions, adding protections against unauthorized surveillance and access to stored communications. It requires government entities to obtain a warrant or court order. It does not mandate encryption, authorize warrantless surveillance, or permit search without disclosure."},{"id":"d1_q_067","domain":"D1","difficulty":"easy","question":"Your risk analysis examines risks, vulnerabilities, and threats using categories like low, medium, and high — without assigning dollar values. Which type of risk analysis is this?","options":["Qualitative risk analysis","Quadratic risk analysis","Cumulative risk analysis","Quantitative risk analysis"],"answer":0,"explanation":"Qualitative risk analysis uses descriptive rankings rather than numerical values to assess and prioritize risks. Quantitative analysis assigns monetary values (e.g., ALE). Quadratic and cumulative risk analysis are not standard recognized methodologies in information security."},{"id":"d1_q_068","domain":"D1","difficulty":"medium","question":"Which of the following would NOT be a factor that protects data integrity?","options":["Missing database injection protection","Digital signatures","Message digests (hashes)","Input validation"],"answer":0,"explanation":"Missing injection protection is a vulnerability, not a protection — it allows attackers to alter or corrupt data, directly compromising integrity. Digital signatures verify data authenticity and integrity. Message digests detect unauthorized changes. Input validation prevents injection attacks by ensuring only properly formatted data enters the system."},{"id":"d1_q_069","domain":"D1","difficulty":"easy","question":"Which attack type is MOST commonly focused on compromising availability?","options":["Distributed Denial of Service (DDoS)","Social engineering","Viruses","All of the above equally"],"answer":0,"explanation":"DDoS attacks are specifically designed to overwhelm systems with traffic and make them unavailable to legitimate users — directly targeting availability. Social engineering primarily targets confidentiality (tricking users into revealing information). Viruses most commonly target integrity or confidentiality. Not all attacks equally target availability."},{"id":"d1_q_070","domain":"D1","difficulty":"medium","question":"Your organization wants to implement a governance standard and control framework focused on internal risk analysis. Which framework should you use?","options":["COSO","COBIT","ITIL","FRAP"],"answer":0,"explanation":"COSO (Committee of Sponsoring Organizations) provides a framework focused on internal control, governance, risk management, and compliance — ideal for internal risk analysis. COBIT aligns IT management with business objectives. ITIL focuses on IT service management. FRAP is a qualitative risk analysis methodology, not a governance framework."},{"id":"d1_q_071","domain":"D1","difficulty":"medium","question":"Your organization wants to protect its intellectual property. Which two forms of IP protection require a formal application or registration process?","options":["Trademarks and Patents","Copyright and Trade Secrets","Copyright and Patents","Trademarks and Trade Secrets"],"answer":0,"explanation":"Trademarks require registration to protect brand names, logos, and identifiers. Patents require a formal application granting exclusive rights to an invention. Copyright is automatic upon creation — no registration required. Trade secrets require no application; protection arises by keeping information secret and taking reasonable steps to maintain confidentiality."},{"id":"d1_q_072","domain":"D1","difficulty":"easy","question":"In quantitative risk analysis, what does ALE (Annualized Loss Expectancy) tell you?","options":["The expected monetary loss per year if no controls are implemented","How many times the risk event occurs per year (ARO)","What percentage of the asset is lost per incident (EF)","The cost of a single risk occurrence (SLE)"],"answer":0,"explanation":"ALE = SLE × ARO. It answers: what will this risk cost us per year? ARO tells you frequency, EF tells you the percentage of loss per incident, and SLE (AV × EF) tells you the cost of one occurrence. ALE combines them all into an annualized figure."},{"id":"d1_q_073","domain":"D1","difficulty":"medium","question":"The opposites of the CIA triad are Disclosure (vs Confidentiality), Alteration (vs Integrity), and Destruction (vs Availability). Which of the following is NOT one of these opposites?","options":["Aggregation","Disclosure","Destruction","Alteration"],"answer":0,"explanation":"Aggregation (combining non-sensitive data to reveal sensitive information) is a privacy risk but not a direct opposite of any CIA triad component. The three opposites are: Disclosure (vs Confidentiality), Alteration (vs Integrity), and Destruction (vs Availability) — often remembered as DAD."},{"id":"d1_q_074","domain":"D1","difficulty":"easy","question":"Who in an organization is responsible for determining the risk appetite?","options":["Senior management","Middle management","End users","The IT leadership team"],"answer":0,"explanation":"Risk appetite is a strategic decision made by senior management. They set the tone for the organization's risk culture and define how much risk is acceptable in pursuit of business objectives. Middle management executes within those parameters. IT leadership manages technology risk within the appetite defined by senior management. End users have no role in setting risk appetite."},{"id":"d1_q_075","domain":"D1","difficulty":"medium","question":"Which of the following BEST helps protect data confidentiality?","options":["Multifactor Authentication (MFA)","Hashing","Redundant hardware","Redundant software"],"answer":0,"explanation":"MFA protects confidentiality by ensuring only authorized users can access sensitive data. Hashing protects integrity (verifies data hasn't changed) but doesn't encrypt data. Redundant hardware and software protect availability by maintaining uptime — neither directly protects confidentiality."},{"id":"d1_q_076","domain":"D1","difficulty":"medium","question":"Which of the following is NOT one of the ISC2 Code of Ethics canons?","options":["Think about the social consequences of the program you are writing or designing","Protect society, the common good, necessary public trust and confidence, and the infrastructure","Act honorably, honestly, justly, responsibly, and legally","Provide diligent and competent service to principals"],"answer":0,"explanation":"Considering social consequences of technology is encouraged broadly but is NOT one of the four ISC2 canons. The four canons are: (1) Protect society, common good, public trust, and infrastructure; (2) Act honorably, honestly, justly, responsibly, and legally; (3) Provide diligent and competent service to principals; (4) Advance and protect the profession."},{"id":"d1_q_077","domain":"D1","difficulty":"medium","question":"Your company operates across multiple US states. How are security breach notification laws handled in the United States?","options":["At the state level — each state has its own breach notification laws","By a single federal law that applies uniformly across all states","There is a federal mandate requiring every state to have a breach notification law","By individual organizations according to their own policies"],"answer":0,"explanation":"US breach notification is handled state by state. All 50 states, DC, Guam, Puerto Rico, and the Virgin Islands have enacted their own legislation. There is no single federal law covering all data types and all states, though sector-specific federal laws exist (e.g., HIPAA for healthcare). Organizations must comply with the laws of each state where affected individuals reside."},{"id":"d1_q_078","domain":"D1","difficulty":"medium","question":"During a breach, your organization's honeypot was used to launch a downstream attack on a competitor causing $200,000 in losses. Who is ULTIMATELY liable?","options":["Senior management","The IT security team","Middle management","The individual who deployed the honeypot"],"answer":0,"explanation":"Ultimate liability rests with senior management — they are responsible for the policies, security practices, and oversight that should prevent such incidents. If a company-deployed honeypot is weaponized, it reflects a failure at the organizational level. The IT team has operational responsibility, and the deploying individual may face consequences, but legal and organizational liability escalates to senior management."},{"id":"d1_q_079","domain":"D1","difficulty":"easy","question":"Your organization has identified a risk but has chosen to ignore it rather than respond to it. What type of risk response is this?","options":["Risk rejection — knowingly ignoring an identified risk (never acceptable; creates liability)","Risk transference — shifting the risk to a third party","Risk avoidance — eliminating the risk by changing the activity","Risk mitigation — reducing the likelihood or impact of the risk"],"answer":0,"explanation":"Risk rejection means the organization knows the risk exists but ignores it — this is never acceptable and creates legal liability. It differs from risk acceptance, which is a documented, informed decision to accept a known risk. Transference, avoidance, and mitigation are all active, recognized risk responses."},{"id":"d1_q_080","domain":"D1","difficulty":"easy","question":"Which of the following would NOT be considered a factor in protecting availability?","options":["Non-redundant hardware","Patch management","Redundant hardware","Service Level Agreements (SLAs)"],"answer":0,"explanation":"Non-redundant hardware is a risk to availability — if it fails, there is no backup. Redundant hardware ensures continuity if primary components fail. Patch management keeps systems stable and secure, preventing downtime. SLAs define uptime commitments and the measures required to maintain them."},{"id":"d1_q_081","domain":"D1","difficulty":"medium","question":"Senior management is reviewing the ISO27799 standard. What is its primary focus?","options":["Protecting Personal Health Information (PHI) in healthcare organizations","IT Service Management (ITSM)","General risk management principles","Payment Card Industry (PCI) data security"],"answer":0,"explanation":"ISO27799 provides guidance for healthcare organizations on protecting Personal Health Information (PHI) through information security management, based on ISO/IEC 27002 but tailored for healthcare. ITSM is covered by ISO/IEC 20000. General risk management is ISO 31000. PCI-DSS governs payment card security — unrelated to ISO27799."},{"id":"d1_q_082","domain":"D1","difficulty":"easy","question":"In a court of law, what constitutes 'real evidence'?","options":["Tangible, physical objects directly connected to the case","Data stored on hard drives or digital media","Personal observations made by a witness","Logs, audit trails, and other electronic data from the time of the incident"],"answer":0,"explanation":"Real evidence is physical, tangible objects presented directly to the court — weapons, stolen goods, physical documents. Digital data is electronic/documentary evidence (requires authentication). Personal observations are testimonial evidence. Logs are documentary or digital evidence. Only physical objects constitute 'real' evidence."},{"id":"d1_q_083","domain":"D1","difficulty":"easy","question":"When authenticating using a fingerprint scan, which type of authentication factor are you using?","options":["A biometric factor (something you are)","A possession factor (something you have)","A knowledge factor (something you know)","A location factor (somewhere you are)"],"answer":0,"explanation":"A fingerprint is a biometric factor — Type 3 authentication based on unique physical characteristics (something you are). Possession factors are physical tokens or smart cards. Knowledge factors are passwords or PINs. Location factors use geolocation. Biometrics are considered the strongest single factor but are not revocable if compromised."},{"id":"d1_q_084","domain":"D1","difficulty":"medium","question":"With the CIA triad in mind, if an organization enforces too much integrity, which other control will MOST LIKELY suffer?","options":["Availability — strict integrity controls restrict access and slow down data access for authorized users","Confidentiality — integrity controls expose who accessed data","Identity — integrity verification reveals user identities","Accountability — audit trails needed for integrity compete with privacy"],"answer":0,"explanation":"Over-enforcing integrity means rigorous access restrictions, frequent validation checks, and strict approval workflows — all of which make it harder for authorized users to access data when needed, reducing availability. Confidentiality, identity, and accountability are not the primary casualties of excessive integrity controls."},{"id":"d1_q_085","domain":"D1","difficulty":"easy","question":"Your team is using qualitative risk analysis. Which tool would you MOST likely use?","options":["A risk analysis matrix with rankings like low, medium, and high","Cost per incident calculations","Exposure factor (EF) percentages","Asset value (AV) in monetary terms"],"answer":0,"explanation":"A risk analysis matrix is the hallmark of qualitative analysis — it uses descriptive categories to rank probability and impact without monetary values. Cost per incident, exposure factor, and asset value are all quantitative tools used to calculate SLE and ALE."},{"id":"d1_q_086","domain":"D1","difficulty":"medium","question":"As an IT security professional, you are expected to perform due diligence. What does due diligence mean?","options":["Researching and acquiring the knowledge needed to perform your job correctly — before and after actions","Doing what is right in a situation and acting on your knowledge","Continuing the existing security practices of your organization","Applying patches and updates on an annual schedule"],"answer":0,"explanation":"Due diligence is the process of researching, evaluating, and acquiring knowledge to understand risks and make informed decisions — it occurs before AND after actions to verify they work as expected. Due care is acting on that knowledge responsibly. Continuing existing practices is compliance, not due diligence. Annual patching is far too infrequent to be considered due diligence."},{"id":"d1_q_087","domain":"D1","difficulty":"medium","question":"An attacker launches a SQL injection attack against your application. Which leg of the CIA triad is MOSTLY targeted?","options":["Integrity — the attack modifies or corrupts data and application logic","Authentication — the attack bypasses login","Confidentiality — the attack exposes sensitive data","Availability — the attack crashes the database"],"answer":0,"explanation":"Code injection attacks (SQL, script, command) primarily target integrity by introducing malicious code that modifies data and application behavior. While injection can also expose data (confidentiality) or crash systems (availability), the defining characteristic is unauthorized modification — an integrity violation."},{"id":"d1_q_088","domain":"D1","difficulty":"easy","question":"In a court case, the standard of proof is 'beyond a reasonable doubt.' Which type of court is this?","options":["Criminal court","Civil court","Administrative court","Probation court"],"answer":0,"explanation":"Beyond a reasonable doubt is the highest standard of proof, used exclusively in criminal court where penalties can include loss of liberty. Civil courts use 'preponderance of the evidence' or 'clear and convincing evidence.' Administrative courts have variable, generally lower standards. Probation court is not a distinct court type."},{"id":"d1_q_089","domain":"D1","difficulty":"easy","question":"You are evaluating PURELY physical security controls for a new facility. Which of the following qualifies?","options":["Guard dogs","Regulations and compliance requirements","Biometric authentication systems","Network access control lists (ACLs)"],"answer":0,"explanation":"Guard dogs are a physical control — they deter, detect, and respond to unauthorized physical access. Regulations are administrative controls. Biometric authentication is a technical (logical) control, not purely physical. ACLs are network/logical controls that manage digital access, not physical entry."},{"id":"d1_q_090","domain":"D1","difficulty":"medium","question":"Which of the following correctly identifies the three HIPAA rules that covered entities must follow?","options":["Privacy Rule, Security Rule, and Breach Notification Rule","Privacy Rule, Encryption Rule, and Security Rule","Security Rule, Disclosure Rule, and Breach Notification Rule","Encryption Rule, Privacy Rule, and Disclosure Rule"],"answer":0,"explanation":"The three HIPAA rules are: Privacy Rule (governs use and disclosure of PHI), Security Rule (administrative, physical, and technical safeguards for ePHI), and Breach Notification Rule (notification requirements after a breach). An 'Encryption Rule' doesn't exist — encryption is an addressable safeguard under the Security Rule. A 'Disclosure Rule' doesn't exist as a standalone rule."},{"id":"d1_q_091","domain":"D1","difficulty":"medium","question":"With the CIA triad in mind, if an organization enforces too much availability, which controls will MOST LIKELY suffer?","options":["Both Confidentiality and Integrity","Confidentiality only","Integrity only","Confidence (a fourth triad element)"],"answer":0,"explanation":"Over-prioritizing availability often leads to relaxed access controls, making it easier for unauthorized users to access data (confidentiality breach) and for data to be inadvertently modified (integrity breach). Both suffer together. Confidence is not a CIA triad component — the three components are Confidentiality, Integrity, and Availability."},{"id":"d4_q_010","domain":"D4","question":"On which layer of the OSI model would we consider physical security?","options":["Layer 1 — Physical Layer","Layer 2 — Data Link Layer","Layer 3 — Network Layer","Layer 7 — Application Layer"],"answer":0,"explanation":"Layer 1 (Physical Layer) manages raw bitstream transmission, network topology, electrical signals, and physical connections. Physical security measures — such as locking server rooms or installing security cameras around network infrastructure — are Layer 1 concerns."},{"id":"d4_q_011","domain":"D4","question":"Which protocol is used MOST often at the Presentation Layer (L6) of the OSI model?","options":["SSL (Secure Sockets Layer)","TCP (Transmission Control Protocol)","HTTP (Hypertext Transfer Protocol)","FTP (File Transfer Protocol)"],"answer":0,"explanation":"SSL operates at the Presentation Layer (L6), providing encryption and data formatting services that ensure confidentiality and integrity of data in transit before it reaches the Application layer. TCP is L4, while HTTP and FTP are both L7 protocols."},{"id":"d4_q_012","domain":"D4","question":"In the TCP/IP model, frames and bits are the Protocol Data Units (PDUs) of which layer?","options":["Link / Physical (Network Access) layer","Internetwork (Internet) layer","Transport layer","Application layer"],"answer":0,"explanation":"The Link/Physical layer (Network Access layer) uses frames and bits as its PDUs. The Internetwork layer uses packets, the Transport layer uses segments, and the Application layer uses data."},{"id":"d4_q_013","domain":"D4","question":"Which port and transport protocol does SSH (Secure Shell) use?","options":["Port 22, TCP/UDP","Port 23, TCP","Port 21, TCP","Port 443, TCP"],"answer":0,"explanation":"SSH uses port 22 (TCP/UDP) and provides encrypted remote access, replacing the insecure Telnet (port 23, TCP) which transmits in cleartext."},{"id":"d4_q_014","domain":"D4","question":"FTP uses two TCP ports. Which correctly identifies their roles?","options":["Port 20 for data transfer, port 21 for control","Port 20 for control, port 21 for data transfer","Port 21 for data transfer, port 22 for control","Port 20 and 21 are both used for data transfer"],"answer":0,"explanation":"FTP uses two TCP ports: 20 for active data transfer and 21 for control commands. Both are TCP only — FTP does not use UDP."},{"id":"d4_q_015","domain":"D4","question":"Which of the following best describes UDP (User Datagram Protocol)?","options":["Connectionless and unreliable — prioritises speed; used for VoIP, live video, and gaming","Connection-oriented with guaranteed delivery via a 3-way handshake","Slower than TCP but more reliable due to error correction","Used exclusively for encrypted traffic at the Transport Layer"],"answer":0,"explanation":"UDP is connectionless and unreliable — it sends data without confirming delivery or order. Timing matters more than reliability, making it ideal for VoIP, live video, and gaming. TCP provides reliable, ordered delivery via a 3-way handshake."},{"id":"d4_q_016","domain":"D4","question":"Which attack works like a Smurf attack but uses UDP instead of ICMP?","options":["Fraggle attack","SYN flood","Ping of Death","Teardrop attack"],"answer":0,"explanation":"A Fraggle attack floods a target with UDP packets using spoofed source addresses — the same amplification concept as a Smurf attack (which uses ICMP). Fraggle can be more successful because UDP is less commonly filtered than ICMP."},{"id":"d4_q_017","domain":"D4","question":"What is a SYN flood attack?","options":["Sending thousands of SYN requests without completing the 3-way handshake, exhausting server resources with half-open connections","Flooding a server with UDP packets to disrupt service","Sending oversized ICMP packets to crash a target system","Intercepting and replaying valid TCP packets to hijack a session"],"answer":0,"explanation":"In a SYN flood, the attacker sends thousands of SYN packets but never sends the final ACK, leaving the server with thousands of half-open TCP sessions that consume memory and resources — a classic DoS attack against TCP."},{"id":"d4_q_018","domain":"D4","question":"What is the correct sequence of a TCP 3-way handshake?","options":["SYN → SYN/ACK → ACK","ACK → SYN → SYN/ACK","SYN → ACK → SYN/ACK","SYN/ACK → SYN → ACK"],"answer":0,"explanation":"TCP establishes connections with: (1) Client sends SYN, (2) Server responds SYN/ACK, (3) Client sends ACK. This 3-way handshake confirms both sides can send and receive before data transfer begins."},{"id":"d4_q_019","domain":"D4","question":"In the TCP/IP model, which single layer combines the functions of OSI layers 5 (Session), 6 (Presentation), and 7 (Application)?","options":["Application layer","Transport layer","Internetwork layer","Link layer"],"answer":0,"explanation":"The TCP/IP Application layer merges OSI layers 5, 6, and 7. The TCP/IP model has only 4 layers: Link/Physical (OSI 1-2), Internetwork (OSI 3), Transport (OSI 4), and Application (OSI 5-7)."},{"id":"d4_q_020","domain":"D4","question":"Which of the following correctly pairs a protocol with its default port?","options":["HTTPS → Port 443 TCP","RDP → Port 22 TCP/UDP","SMTP → Port 110 TCP","IMAP → Port 25 TCP"],"answer":0,"explanation":"HTTPS uses port 443 TCP. RDP (Remote Desktop) is port 3389. SMTP is port 25 (not 110 — that is POP3). IMAP is port 143 (not 25). Memorising these port mappings is essential for the CISSP exam."},{"id":"d4_q_021","domain":"D4","question":"Which organization is responsible for governing global IP address allocation?","options":["IANA (Internet Assigned Numbers Authority)","ICANN (Internet Corporation for Assigned Names and Numbers)","ARIN (American Registry for Internet Numbers)","RIPE NCC (Réseaux IP Européens Network Coordination Centre)"],"answer":0,"explanation":"IANA governs IP address allocation globally. IANA is a department of ICANN. The actual regional distribution is then handled by the five RIRs (AFRINIC, ARIN, APNIC, LACNIC, RIPE NCC)."},{"id":"d4_q_022","domain":"D4","question":"IANA (Internet Assigned Numbers Authority) is a department of which organisation?","options":["ICANN (Internet Corporation for Assigned Names and Numbers)","ARIN (American Registry for Internet Numbers)","ITU (International Telecommunication Union)","ISO (International Organization for Standardization)"],"answer":0,"explanation":"IANA is a department of ICANN. ICANN is the overarching body responsible for coordinating the internet's naming systems and address spaces, under which IANA handles IP address allocation."},{"id":"d4_q_023","domain":"D4","question":"Which Regional Internet Registry (RIR) is responsible for IP address allocation in Africa?","options":["AFRINIC (African Network Information Center)","ARIN (American Registry for Internet Numbers)","LACNIC (Latin America and Caribbean Network Information Centre)","APNIC (Asia-Pacific Network Information Centre)"],"answer":0,"explanation":"AFRINIC serves Africa. The five RIRs are: AFRINIC (Africa), ARIN (US/Canada/Caribbean/Antarctica), APNIC (Asia-Pacific), LACNIC (Latin America/Caribbean), and RIPE NCC (Europe/Russia/Middle East/Central Asia)."},{"id":"d4_q_024","domain":"D4","question":"Which RIR manages IP address space for Europe, Russia, the Middle East, and Central Asia?","options":["RIPE NCC","APNIC","AFRINIC","LACNIC"],"answer":0,"explanation":"RIPE NCC (Réseaux IP Européens Network Coordination Centre) covers Europe, Russia, the Middle East, and Central Asia. APNIC covers Asia-Pacific; AFRINIC covers Africa; LACNIC covers Latin America and parts of the Caribbean."},{"id":"d4_q_025","domain":"D4","question":"What is the purpose of the TTL (Time To Live) field in an IPv4 header?","options":["To prevent routing loops by limiting how many hops a packet can traverse before being discarded","To specify the priority of the packet for Quality of Service routing","To identify the upper-layer protocol carried in the packet (e.g. TCP or UDP)","To indicate the total length of the IP header"],"answer":0,"explanation":"TTL is decremented by 1 at each router hop. When it reaches 0 the packet is discarded and an ICMP 'Time Exceeded' message is sent back. This prevents packets from circulating indefinitely in a routing loop."},{"id":"d4_q_026","domain":"D4","question":"Which three IPv4 header fields are specifically used to support IP fragmentation?","options":["Identification, Flags, and Fragment Offset","TTL, Protocol, and Checksum","Version, IHL, and QoS","Source IP, Destination IP, and Protocol"],"answer":0,"explanation":"Fragmentation uses: Identification (links fragments of the same original packet), Flags (e.g. 'More Fragments' bit), and Fragment Offset (position of the fragment within the original packet). These allow the destination to reassemble fragments in the correct order."},{"id":"d4_q_027","domain":"D4","question":"What does MTU stand for, and what is the standard MTU size for Ethernet networks?","options":["Maximum Transmission Unit — 1500 bytes","Maximum Transfer Unit — 1024 bytes","Minimum Transmission Unit — 1500 bytes","Maximum Transmission Unit — 9000 bytes"],"answer":0,"explanation":"MTU (Maximum Transmission Unit) is the largest packet size a network can transmit without fragmentation. Standard Ethernet MTU is 1500 bytes. Jumbo frames (9000 bytes) are used in some high-performance LAN environments but are not the default."},{"id":"d4_q_028","domain":"D4","question":"What happens when an IPv4 packet exceeds the MTU of a network segment it must traverse?","options":["A router along the path fragments the packet into smaller packets that fit within the MTU","The packet is silently dropped with no notification to the sender","The sending host automatically retransmits the packet at a smaller size","The packet is queued at the router until congestion clears"],"answer":0,"explanation":"When a packet exceeds the link MTU, a router fragments it into smaller packets. Each fragment carries the same Identification value and a Fragment Offset so the destination can reassemble them. If the 'Don't Fragment' (DF) flag is set and the packet is too large, the router drops it and sends an ICMP error instead."},{"id":"d4_q_029","domain":"D4","question":"What is the key security difference between HTTP and HTTPS?","options":["HTTPS encrypts data in transit using TLS/SSL; HTTP transmits data in cleartext and is unencrypted","HTTPS uses a different port but the same level of encryption as HTTP","HTTP is faster and more secure because it uses less overhead","HTTPS only encrypts login credentials — page content is still sent in cleartext"],"answer":0,"explanation":"HTTP (port 80) sends all data unencrypted, making it vulnerable to interception. HTTPS (port 443) wraps HTTP in TLS/SSL, encrypting the entire connection so passwords, form data, and page content are all protected in transit."},{"id":"d4_q_030","domain":"D4","question":"A security analyst sees web traffic on port 8443. Which protocol is most likely in use?","options":["HTTPS (alternate port)","HTTP (alternate port)","FTP over TLS","RDP"],"answer":0,"explanation":"HTTPS primarily uses port 443 but also uses 8443 as an alternate. HTTP uses port 80 and alternates 8008/8080. Knowing alternate ports is important because attackers and misconfigured services often use them to bypass port-based firewall rules."},{"id":"d4_q_031","domain":"D4","question":"What is HTML, and how does it differ from HTTP?","options":["HTML is the markup language webpages are written in; HTTP is the protocol that transports HTML data across the network","HTML and HTTP are two names for the same web communication standard","HTML is the encrypted version of HTTP used in secure web connections","HTML is a transport protocol; HTTP is the language used to structure web content"],"answer":0,"explanation":"HTML (Hypertext Markup Language) is the content language — it defines the structure and layout of a webpage. HTTP/HTTPS are transport protocols that carry that HTML data between a web server and a browser. They are distinct concepts often confused on the CISSP exam."},{"id":"d4_q_032","domain":"D4","question":"What is BOOTP (Bootstrap Protocol) primarily designed for?","options":["Diskless workstations — to determine the OS (downloaded via TFTP) and obtain an IP address without a local disk","Dynamically assigning IP addresses with configurable lease times to network devices","Providing encrypted IP address assignment to prevent rogue DHCP attacks","Routing packets between network segments using dynamic path selection"],"answer":0,"explanation":"BOOTP was designed for diskless workstations — devices with no local storage. The BIOS uses BOOTP to get an IP address and download the OS via TFTP. DHCP later evolved from BOOTP and added features like lease times and automatic reclamation of addresses."},{"id":"d4_q_033","domain":"D4","question":"What is the correct sequence of the DHCP address assignment process?","options":["Discovery → Offer → Request → Acknowledge","Offer → Discovery → Request → Acknowledge","Discovery → Request → Offer → Acknowledge","Request → Offer → Discovery → Acknowledge"],"answer":0,"explanation":"DHCP uses the DORA process: (1) Discovery — client broadcasts to find a DHCP server; (2) Offer — server offers an available IP; (3) Request — client formally requests that IP; (4) Acknowledge — server confirms the assignment. Remember: DORA."},{"id":"d4_q_034","domain":"D4","question":"Which ports do both BOOTP and DHCP use, and what is each port's role?","options":["UDP port 67 for the server, UDP port 68 for the client","TCP port 67 for the server, TCP port 68 for the client","UDP port 68 for the server, UDP port 67 for the client","UDP port 67 for both server and client traffic"],"answer":0,"explanation":"Both BOOTP and DHCP use UDP — port 67 for the server (receives client requests) and port 68 for the client (receives server responses). UDP is used because the client has no IP address yet when it sends the initial broadcast and cannot establish a TCP connection."},{"id":"d4_q_035","domain":"D4","question":"During the DHCP process, what does the client send first and why is it a broadcast?","options":["A DHCP Discovery broadcast — because the client has no IP address yet and does not know the server's address","A DHCP Request unicast — because the client already knows the server's IP from a previous session","A DHCP Offer broadcast — to announce its MAC address to all available servers","A DHCP Acknowledge — to confirm the server is reachable before requesting an address"],"answer":0,"explanation":"The client starts with a DHCP Discovery broadcast (sent to 255.255.255.255) because it has no IP address and does not know which server to contact. All DHCP servers on the segment receive it and can respond with an Offer."},{"id":"d4_q_036","domain":"D4","question":"What DNS record type is queried to find the mail server responsible for accepting email for a domain?","options":["MX (Mail eXchange) record","A (Address) record","CNAME (Canonical Name) record","TXT (Text) record"],"answer":0,"explanation":"MX records in DNS identify which mail server (MTA) is responsible for accepting email for a given domain. When the MSA needs to deliver email to jane@b.org, it queries DNS for b.org's MX records to find the correct destination mail server."},{"id":"d4_q_037","domain":"D4","question":"What is the correct order of components in an email delivery path from sender to recipient?","options":["MUA → MSA → MTA → MDA → MUA","MUA → MDA → MTA → MSA → MUA","MSA → MUA → MTA → MDA → MUA","MUA → MTA → MSA → MDA → MUA"],"answer":0,"explanation":"Email flow: (1) Sender's MUA formats and submits via SMTP to the MSA. (2) MSA resolves the destination MX record via DNS. (3) MTA transfers the message between mail servers using SMTP. (4) MDA delivers to the recipient's mailbox. (5) Recipient's MUA retrieves via POP3 or IMAP."},{"id":"d4_q_038","domain":"D4","question":"What is the role of the MTA (Message Transfer Agent) in the email delivery process?","options":["Routes and transfers email between mail servers using SMTP until it reaches the destination MDA","Formats the email message and submits it to the mail server on behalf of the user","Delivers the final email message into the recipient's mailbox","Retrieves email from the server using POP3 or IMAP for the end user"],"answer":0,"explanation":"The MTA routes email between mail servers using SMTP — it may pass through multiple MTAs before reaching the final destination. The MSA accepts from the MUA; the MDA delivers to the mailbox; the MUA retrieves via POP3/IMAP."},{"id":"d4_q_039","domain":"D4","question":"Which protocols can a recipient's MUA (Mail User Agent) use to retrieve email from the mail server?","options":["POP3 (Post Office Protocol v3) or IMAP (Internet Message Access Protocol)","SMTP (Simple Mail Transfer Protocol) or FTP (File Transfer Protocol)","HTTP or HTTPS","SMTP or POP3 — IMAP is only used for sending"],"answer":0,"explanation":"The recipient's MUA retrieves email using POP3 (port 110 — downloads and typically deletes from server) or IMAP (port 143 — keeps email on server and syncs across devices). SMTP is only used for sending and transferring mail between servers."},{"id":"d4_q_040","domain":"D4","question":"An IPv4 address consists of how many bits?","options":["32 bits","16 bits","24 bits","48 bits"],"answer":0,"explanation":"IPv4 addresses are 32 bits, written as 4 octets (e.g. 192.168.1.1), each octet being 8 bits (0–255). This gives 2^32 = ~4.3 billion possible addresses. 48 bits is a MAC address — a common trap on the CISSP exam."},{"id":"d4_q_041","domain":"D4","question":"Which port do DHCP servers use to communicate with DHCP clients?","options":["UDP port 67","TCP port 80","UDP port 69","TCP port 22"],"answer":0,"explanation":"DHCP servers listen on UDP port 67. Clients receive responses on UDP port 68. UDP is used because the client has no IP address yet and cannot form a TCP connection. UDP port 69 is TFTP; TCP port 80 is HTTP; TCP port 22 is SSH."},{"id":"d4_q_042","domain":"D4","question":"Which of the following is NOT a benefit of IPv6 compared to IPv4?","options":["Reduces network congestion","Increased address space (128-bit vs 32-bit)","Enhanced built-in security features (IPsec)","Improved routing efficiency through simplified headers"],"answer":0,"explanation":"IPv6 does NOT inherently reduce network congestion — that depends on network design and traffic management. IPv6 does provide: a vastly larger 128-bit address space, built-in IPsec security (optional in IPv4), and more efficient routing via simplified packet headers and elimination of NAT."},{"id":"d4_q_043","domain":"D4","question":"In MAC security modes, which mode requires ALL users to have clearance for ALL information AND need-to-know for ALL data?","options":["Dedicated security mode","System high security mode","Compartmented security mode","Multi-level security mode"],"answer":0,"explanation":"Dedicated mode is the most restrictive: every user has clearance for ALL data, formal approval, and need-to-know for ALL information on the system. System high requires clearance for all but only need-to-know for SOME data."},{"id":"d4_q_044","domain":"D4","question":"In MAC system high security mode, what distinguishes user access from dedicated mode?","options":["All users have clearance for all data, but need-to-know for only SOME data","All users can access all data without any need-to-know requirement","Users must have clearance for only some data and need-to-know for all data","Access is based on need-to-know, approval, and clearance for each piece of data"],"answer":0,"explanation":"System high: clearance for ALL, but need-to-know for SOME. Dedicated: clearance AND need-to-know for ALL. Compartmented: clearance for all + need-to-know + approval for SOME + information labels. Multi-level: clearance, need-to-know, and approval all vary per user."},{"id":"d4_q_045","domain":"D4","question":"Which type of firewall filters traffic at OSI layers 3/4 using rules based on source IP, destination IP, and port number?","options":["Packet-filtering firewall","Stateful packet inspection firewall","Application proxy firewall","Circuit-level proxy firewall"],"answer":0,"explanation":"Packet-filtering firewalls (L3/4) inspect header fields only — source/destination IP and port — to permit or deny traffic. They are fast but cannot detect attacks embedded in packet content or track connection state."},{"id":"d4_q_046","domain":"D4","question":"Which firewall type maintains a state table to track the context and state of active connections?","options":["Stateful packet inspection firewall (layer 7)","Packet-filtering firewall (layer 3/4)","Circuit-level proxy firewall (layer 5)","Static packet firewall (layer 3)"],"answer":0,"explanation":"Stateful packet inspection firewalls track the state and context of each connection, allowing them to make smarter decisions than simple packet filters. They operate up to layer 7 and can detect anomalies in traffic patterns across a session."},{"id":"d4_q_047","domain":"D4","question":"Which firewall type inspects packet content, supports authentication and encryption, but is the slowest to process traffic?","options":["Application proxy firewall (layer 7)","Packet-filtering firewall (layer 3/4)","Stateful packet inspection firewall","Circuit-level proxy firewall (layer 5)"],"answer":0,"explanation":"Application proxy firewalls (L7) inspect full packet content and can perform authentication and encryption. This deep inspection makes them the most secure but also the slowest. Circuit-level proxies only check headers; packet filters only check IPs and ports."},{"id":"d4_q_048","domain":"D4","question":"Which IEEE 802 standard defines Bluetooth, and which defines LTE?","options":["802.15 = Bluetooth, 802.20 = LTE","802.11 = Bluetooth, 802.15 = LTE","802.3 = Bluetooth, 802.20 = LTE","802.15 = Bluetooth, 802.16 = LTE"],"answer":0,"explanation":"IEEE 802.15 = Bluetooth. 802.20 = LTE (Mobile Broadband). 802.3 = Ethernet. 802.11 = Wi-Fi (wireless networking). 802.16 = WiMAX (Wireless Broadband Access). Knowing which standard maps to which technology is a common CISSP exam topic."},{"id":"d4_q_049","domain":"D4","question":"Which IEEE 802.11 amendment introduced WPA2 using AES and CCMP encryption?","options":["802.11i","802.11a","802.11g","802.11n"],"answer":0,"explanation":"802.11i introduced WPA2 with AES (Advanced Encryption Standard) and CCMP (Counter Mode CBC-MAC Protocol), replacing the weaker WEP and WPA. 802.11a/g are speed amendments; 802.11n added MIMO and dual-band support."},{"id":"d4_q_050","domain":"D4","question":"What is the key security difference between SSH and Telnet for remote administration?","options":["SSH encrypts the entire session; Telnet transmits all data including credentials in cleartext","SSH uses UDP while Telnet uses TCP, making SSH faster","Telnet uses certificates for authentication; SSH relies on passwords only","SSH operates at layer 3; Telnet operates at layer 7 of the OSI model"],"answer":0,"explanation":"Telnet (port 23) sends all traffic including passwords in cleartext — anyone sniffing the network can read it. SSH (port 22) encrypts the entire session using public-key cryptography, making it the secure replacement for Telnet in remote server administration."},{"id":"d4_q_051","domain":"D4","question":"Which IP address class has network numbers beginning at 192 and ending a
