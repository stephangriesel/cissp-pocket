d to access different wards","Job Rotation — they need to rotate roles before accessing different areas"],"answer":1,"explanation":"Need to Know means that even if you have been granted system access, you should only access the specific data that you actually need for your current work. Having permission does not equal having a legitimate reason. In the exam, Need to Know and Least Privilege often appear together — Least Privilege controls what access you are granted; Need to Know controls what access you actually use."},{"id":"d7_q_012","domain":"D7","difficulty":"easy","question":"What is the PRIMARY purpose of Separation of Duties as an administrative security control?","options":["To ensure employees are cross-trained across multiple roles","To evenly distribute workload across the team","To prevent fraud and error by requiring more than one person to complete sensitive tasks","To rotate access rights between employees on a regular schedule"],"answer":2,"explanation":"Separation of Duties is an internal control that prevents any single individual from having full control over a sensitive or high-risk task. By requiring multiple people to complete a process, it prevents both intentional fraud and accidental errors — neither collusion nor a single mistake can go undetected."},{"id":"d7_q_013","domain":"D7","difficulty":"medium","question":"Which classic example BEST illustrates why Separation of Duties is required?","options":["Allowing the same administrator to install software and approve change requests","Letting the same person enter a purchase order AND issue the payment cheque","Granting a developer both read and write access to the production database","Allowing the same manager to approve and deny access requests"],"answer":1,"explanation":"The purchase order + payment cheque scenario is the textbook Separation of Duties example. If the same person can create a purchase order AND issue the payment, they could create fraudulent orders and pay themselves. Separating these two steps means collusion would be required to commit fraud, making it far less likely."},{"id":"d7_q_014","domain":"D7","difficulty":"medium","question":"A small startup does not have enough staff to fully implement Separation of Duties. For the CISSP exam, what is the CORRECT approach for this organisation?","options":["The principle does not apply and can be ignored for small organisations","Hire additional staff immediately to enable full Separation of Duties","Use compensating controls to mitigate the residual risk","Apply Least Privilege more strictly to compensate for the missing control"],"answer":2,"explanation":"For the CISSP exam, assume large organisations can implement full Separation of Duties. When that is not practical (small organisations), compensating controls should be in place to mitigate the risk — for example, enhanced logging, supervisory review, periodic audits, or dual approval for critical transactions."},{"id":"d7_q_015","domain":"D7","difficulty":"easy","question":"What is the PRIMARY security benefit of Job Rotation?","options":["It ensures employees are always working in their area of specialisation","It detects errors and fraud, and reduces the chance of collusion between individuals","It reduces the number of privileged accounts needed across the organisation","It satisfies separation of duties when an organisation is too small to use it fully"],"answer":1,"explanation":"Job Rotation detects errors and fraud because a different employee taking over a role will spot irregularities that the previous person may have been hiding. It also makes collusion harder — two people are less likely to maintain a long-term scheme if their roles change regularly."},{"id":"d7_q_016","domain":"D7","difficulty":"easy","question":"Beyond its security benefits, what additional organisational benefit does Job Rotation provide?","options":["It eliminates the need for formal background checks","It allows the organisation to reduce headcount over time","It helps employees understand the entire business and reduces burnout","It removes the requirement for privileged access management"],"answer":2,"explanation":"Job Rotation has non-security benefits too: employees who rotate across roles develop a broader understanding of how the business works, making them more effective collaborators. It also reduces burnout by providing variety in daily work. On the exam, remember that both the security AND operational benefits support its use."},{"id":"d7_q_017","domain":"D7","difficulty":"medium","question":"A security manager is evaluating whether to implement Job Rotation. What is the KEY limitation to consider before adopting it?","options":["Job Rotation conflicts with the principle of least privilege","It can be cost prohibitive — the cost of implementation must justify the benefit","It increases the risk of data breaches during the transition period","Regulators typically prohibit job rotation in financial institutions"],"answer":1,"explanation":"Job Rotation can be cost prohibitive. Training employees for new roles, reduced productivity during transitions, and operational disruption all carry real costs. For the CISSP exam: always verify that the cost of a control justifies its benefit — Job Rotation is a prime example of a valuable control that may not be feasible in every context."},{"id":"d7_q_018","domain":"D7","difficulty":"medium","question":"When implementing Mandatory Vacations, why is it important NOT to give employees too much advance notice of their scheduled leave?","options":["Advance notice creates scheduling conflicts that are difficult to manage","Employees may transfer sensitive files to personal devices before leaving","An employee conducting fraud could use the advance notice to cover their tracks before accounts are locked and audited","Long advance notice periods reduce the effectiveness of the account lock procedure"],"answer":2,"explanation":"The power of Mandatory Vacations as a fraud-detection control lies in its surprise element. If an employee knows weeks in advance that their accounts will be locked and audited, they have time to falsify records, delete evidence, or otherwise clean up any ongoing fraud. Shorter notice windows reduce this window of opportunity."},{"id":"d7_q_019","domain":"D7","difficulty":"medium","question":"An organisation implements Least Privilege, Need to Know, Separation of Duties, Job Rotation, and Mandatory Vacations together. What is the PRIMARY threat that this combination of controls is designed to minimise?","options":["External phishing and social engineering attacks","Insider threats — fraud, errors, and abuse of access by employees","Advanced Persistent Threats (APTs) targeting sensitive data","Data breaches caused by misconfigured cloud storage"],"answer":1,"explanation":"These five administrative personnel security controls work together specifically to minimise insider threats. Each targets a different angle: Least Privilege and Need to Know limit access, Separation of Duties prevents single-person fraud, Job Rotation detects collusion, and Mandatory Vacations audits accounts when the employee cannot interfere. Together they form a layered defence against trusted insiders."},{"id":"d7_q_020","domain":"D7","difficulty":"medium","question":"Which of the following is the MOST important factor to consider when drafting an NDA (Non-Disclosure Agreement)?","options":["The duration — how long the agreement will remain in force","The scope — clearly defining what information is considered confidential","The penalties — the consequences for breaching the agreement","The number of parties — how many signatories are involved"],"answer":1,"explanation":"The scope is the most important element of an NDA because it determines exactly what information is protected. If confidential information is not clearly defined, the agreement provides little meaningful legal protection — even if the duration, penalties, and parties are perfectly drafted. Everything else flows from a clear, precise scope."},{"id":"d7_q_021","domain":"D7","difficulty":"medium","question":"Which of the following is the MOST effective control to prevent fraud within an organisation?","options":["Employee background checks conducted at time of hire","Access controls such as password protection and user permissions","Separation of Duties — ensuring no single individual controls all parts of a process","Physical security measures such as surveillance cameras and locked doors"],"answer":2,"explanation":"Separation of Duties provides continuous checks and balances — no single employee can complete an entire sensitive transaction alone, making undetected fraud far harder. Background checks are a one-time snapshot and do not protect against fraud that develops during employment. Access controls prevent unauthorised access but an employee with the correct access can still commit fraud. Physical security only protects against physical theft, not financial misstatement or data manipulation."},{"id":"d7_q_022","domain":"D7","difficulty":"medium","question":"What is the MAIN difference between the principles of Least Privilege and Need to Know?","options":["Least Privilege is a preventative measure; Need to Know is a reactive measure","Least Privilege focuses on minimising risk; Need to Know focuses on maximising access","Least Privilege limits access to the minimum required for job duties; Need to Know requires a legitimate business reason to access specific data even when access is already granted","Least Privilege is a principle; Need to Know is a policy"],"answer":2,"explanation":"Least Privilege is the access control layer — accounts are provisioned with only the minimum permissions required for the role. Need to Know is the behavioural layer — even if you have the access, you should not access specific data unless you have a genuine current need. Both are proactive principles, both reduce exposure, and both must be satisfied for appropriate data access. Neither is a policy, and neither is reactive."},{"id":"d7_q_023","domain":"D7","difficulty":"easy","question":"From which sources is forensic data NORMALLY obtained during a digital forensics investigation?","options":["Directly from RAM during a live system analysis","From binary images of secondary storage and portable devices — hard drives, flash drives, CDs, DVDs, and cell phones","Exclusively from network packet captures and firewall logs","From operating system event logs and application audit trails only"],"answer":1,"explanation":"Digital forensic data is normally obtained from binary images of secondary storage and portable storage devices such as hard drives, flash drives, CDs, DVDs, and cell phones. These provide persistent, non-volatile storage that retains data even after power loss — making them the primary forensic evidence sources."},{"id":"d7_q_024","domain":"D7","difficulty":"medium","question":"Why do forensic examiners use a bit-stream (binary) image rather than a standard file copy of a storage device?","options":["A bit-stream image is significantly faster to create than a standard file copy","A bit-stream image captures an exact copy of every bit on the device — including unallocated space and deleted data — not just active files","A bit-stream image automatically decrypts encrypted files during the copy process","A bit-stream image compresses the data so it takes less storage space"],"answer":1,"explanation":"A bit-stream (binary) image is a sector-by-sector, bit-for-bit copy of the entire device. Unlike a standard file copy (which only copies active files), it captures deleted data, unallocated space, and slack space — areas that may hold critical forensic evidence. This ensures nothing is missed and the image is forensically complete."},{"id":"d7_q_025","domain":"D7","difficulty":"medium","question":"In the context of IT security and digital forensics, what does 'Real Evidence' refer to?","options":["The actual data files and documents extracted from the seized device","Witness testimony from employees who observed the incident firsthand","Tangible, physical objects — in IT security: the hard disk or USB drive itself, not the data stored on them","Digital logs and audit trails produced by the compromised system"],"answer":2,"explanation":"Real Evidence means tangible, physical objects that can be presented in court. In IT security forensics, this means the physical storage device itself — the hard disk, USB drive, or CD — not the data that lives on it. The data is digital evidence; the physical media is real evidence."},{"id":"d7_q_026","domain":"D7","difficulty":"medium","question":"How is evidence integrity maintained and verified during a digital forensics investigation?","options":["By storing the original device in a tamper-evident bag immediately after seizure","By performing forensic analysis directly on the original device to avoid errors from copying","By photographing the device screen and physical exterior before examination","By generating hash values of both the original and the working copy, verified before and after forensic analysis"],"answer":3,"explanation":"Evidence integrity is maintained by hashing — computing a cryptographic hash (e.g., MD5 or SHA) of both the original and the forensic copy. These hashes are verified before and after analysis. If the hashes match throughout, it proves the data was not altered. All forensic work is performed on the copy, never the original."},{"id":"d7_q_027","domain":"D7","difficulty":"easy","question":"Why must digital forensics ALWAYS be performed on a copy of the evidence, and never on the original?","options":["Working on a copy is faster and more convenient for analysts","Preserving the original ensures its integrity is unquestionable — any changes to the original could destroy evidence and make it legally inadmissible","Originals must be returned to the device owner immediately after seizure","Copies are easier to encrypt and transfer between investigators"],"answer":1,"explanation":"The original must never be altered. If forensic tools or the examination process modify the original in any way, the integrity of the evidence can be challenged in court — potentially making it inadmissible. Working on a verified forensic copy preserves the original in its exact seized state while allowing full analysis."},{"id":"d7_q_028","domain":"D7","difficulty":"easy","question":"What is the purpose of the Chain of Custody in a digital forensics investigation?","options":["To record the technical specifications and file system details of the seized device","To establish the timeline and method of the cyber attack","To prove the integrity of the evidence by documenting who handled it, when, what was done, and where — demonstrating no tampering occurred","To assign legal ownership of the seized device to the investigating authority"],"answer":2,"explanation":"The Chain of Custody is a formal, documented record that tracks evidence from seizure through court. It answers four questions for every person who handled the evidence: Who handled it? When did they handle it? What did they do with it? Where did they handle it? This continuous documentation proves the evidence was not tampered with — which is essential for admissibility."},{"id":"d7_q_029","domain":"D7","difficulty":"medium","question":"After a cyberattack, your team performs digital forensics on a compromised drive. Which of the following BEST describes the PRIMARY purpose of digital forensics?","options":["Determining the root cause and mechanism of the attack","Collecting, analysing, and preserving electronic evidence in a legally admissible manner to identify the attacker and support legal proceedings","Repairing the compromised system and restoring it to full operation","Recommending security improvements to prevent future attacks"],"answer":1,"explanation":"The primary purpose of digital forensics is to collect, analyse, and preserve electronic evidence in a way that is legally admissible — so it can be used to identify the attacker and support prosecution. Determining attack cause is primarily incident response; system repair is recovery; future security recommendations come from security analysts using forensic findings."},{"id":"d7_q_030","domain":"D7","difficulty":"medium","question":"Which forensic imaging method is considered the LEAST effective and should be avoided when possible?","options":["Hardware-based imaging using write-blocker devices","Software-based imaging using specialised forensic tools","Bit-by-bit imaging that captures all data including unallocated space","Live imaging — creating a forensic image while the drive is still actively in use"],"answer":3,"explanation":"Live imaging (imaging a running, active drive) is the least effective method because data on the drive is changing while the image is being created — resulting in an incomplete or corrupted capture. Write operations during imaging can also alter evidence. Hardware and software imaging, and bit-by-bit imaging of a powered-down drive, are all far more reliable."},{"id":"d7_q_031","domain":"D7","difficulty":"hard","question":"After a cyberattack, an analyst suggests remotely accessing the attacker's system to gather evidence. Why is this action illegal in the United States, even though the company is the victim?","options":["The company does not have the technical capability to access external systems","Accessing the attacker's system without authorisation violates the Fourth Amendment and constitutes the same crime the attacker committed","Evidence gathered from external systems is never admissible in court regardless of how it is obtained","The attacker's system is protected by encryption that cannot legally be broken"],"answer":1,"explanation":"The Fourth Amendment protects against unreasonable searches and seizures — victim status does not grant permission to access another party's systems. Connecting to the attacker's system without legal authority is itself unauthorised access, the same crime the attacker committed. The correct approach is to notify law enforcement. The Fourth Amendment can only be legally bypassed through: a subpoena, a search warrant, voluntary surrender, or exigent circumstances (danger to life or imminent evidence destruction)."},{"id":"d7_q_032","domain":"D7","difficulty":"easy","question":"What is the PRIMARY purpose of Incident Management?","options":["To prevent all security incidents from occurring through proactive controls","To have a well-understood and predictable response to security events and computer intrusions","To identify and prosecute attackers who breach the organisation","To minimise the cost of hardware replacement following an incident"],"answer":1,"explanation":"The primary purpose of Incident Management is to ensure a well-understood and predictable response when events or intrusions occur. It defines clear processes and trains teams in advance so that when the stressful reality of an incident hits, everyone knows exactly what to do — removing guesswork under pressure."},{"id":"d7_q_033","domain":"D7","difficulty":"easy","question":"Why is ongoing training especially critical for staff who are part of an incident response team?","options":["To ensure they can build and deploy new security tools during an active incident","To satisfy annual regulatory compliance requirements for the organisation","Because incidents are highly stressful situations — staff must know exactly what to do without hesitation the moment an event occurs","To reduce the organisation's cyber insurance premium by demonstrating readiness"],"answer":2,"explanation":"Incidents are highly stressful. Under that pressure, people revert to what they have trained for — if the training is insufficient, critical steps get skipped or done out of order. Ongoing training and clear, rehearsed procedures ensure staff respond correctly even when under stress."},{"id":"d7_q_034","domain":"D7","difficulty":"medium","question":"A regional power grid failure causes an organisation's data centre to go offline. Which class of incident does this represent?","options":["Natural — the power failure was caused by environmental conditions outside","Human — power companies are operated by humans who failed to maintain the grid","Environmental — power grid failures are part of the operational environment, not a natural disaster","Technical — a subcategory reserved for infrastructure failures"],"answer":2,"explanation":"A power grid failure is an Environmental incident. Environmental incidents involve the operational environment organisations work in — power grids, internet connections, hardware failures, and software flaws. They are NOT the same as Natural incidents (which are caused by nature: hurricanes, floods, earthquakes). The distinction matters on the exam."},{"id":"d7_q_035","domain":"D7","difficulty":"easy","question":"Which class of security incident is considered BY FAR the MOST COMMON?","options":["Natural incidents such as hurricanes, floods, and earthquakes","Environmental incidents such as power failures and hardware faults","Human incidents — whether intentional (attacks, fraud) or unintentional (errors, misconfigurations)","Hybrid incidents combining natural and environmental factors"],"answer":2,"explanation":"Human incidents are by far the most common class. This includes both intentional actions (cyberattacks, insider threats, fraud) and unintentional actions (accidental misconfigurations, human error, policy violations). Most real-world security incidents trace back to human behaviour in some form."},{"id":"d7_q_036","domain":"D7","difficulty":"medium","question":"A disgruntled employee intentionally deletes a critical database. A junior admin separately and accidentally misconfigures a firewall rule. Which incident class applies to BOTH scenarios?","options":["Environmental for both — both involve failures within the organisation's systems","Natural for the accident; Human for the intentional act","Human for both — human incidents encompass both intentional and unintentional actions by people","Technical for both — both involve changes to IT systems"],"answer":2,"explanation":"Both scenarios are Human incidents. The Human class covers both intentional acts (malicious insiders, attackers) and unintentional acts (accidents, errors, negligence). The intent does not change the classification — if a person caused it, it is a Human incident."},{"id":"d7_q_037","domain":"D7","difficulty":"medium","question":"What is the key distinction between a Natural incident and an Environmental incident?","options":["Natural incidents are caused by nature (hurricanes, floods, earthquakes); Environmental incidents involve the operational environment — power grids, internet connections, hardware failures, and software flaws — not natural events","Natural incidents are always more severe and longer-lasting than Environmental incidents","Natural incidents affect only physical locations; Environmental incidents affect only digital systems","Environmental incidents are a subcategory of Natural incidents involving outdoor weather conditions"],"answer":0,"explanation":"Natural incidents are caused by acts of nature: hurricanes, floods, earthquakes, blizzards. Environmental incidents involve the working environment we operate in: power grid outages, internet connectivity failures, hardware failures, software flaws. Environmental is NOT nature — it is the man-made and technical infrastructure around us. This distinction is tested on the CISSP exam."},{"id":"d7_q_038","domain":"D7","difficulty":"easy","question":"Which statement BEST describes an Event in incident management?","options":["A security breach requiring immediate escalation and response","An observable change in state — neither positive nor negative — something has simply changed","A warning generated when a monitored threshold is exceeded","Multiple adverse conditions occurring simultaneously on a network"],"answer":1,"explanation":"An Event is an observable change in state that is neutral — it is neither inherently good nor bad, just something that happened. Examples include a system powering on, traffic moving from one network segment to another, or an application starting. Events only become significant when they trigger alerts or combine into incidents."},{"id":"d7_q_039","domain":"D7","difficulty":"easy","question":"Which of the following is an example of an Event (not an Alert or Incident)?","options":["Memory usage staying at 92% for more than 3 minutes","Multiple simultaneous login failures indicating a brute-force attack","A system powering on or an application starting up","Traffic utilisation climbing above 75% triggering a monitoring warning"],"answer":2,"explanation":"A system powering on or an application starting up are observable changes in state with no inherent negative or positive meaning — they are Events. Memory at 92% for 3 minutes crosses a threshold and triggers an Alert. Multiple login failures pattern into an Incident."},{"id":"d7_q_040","domain":"D7","difficulty":"medium","question":"A monitoring system triggers a warning because network traffic utilisation has exceeded 75%. What type of incident management category does this represent?","options":["An Event — traffic changes are observable, neutral state changes","An Alert — a warning triggered automatically when a specific threshold condition is met","An Incident — network utilisation over 75% is always classified as an incident","A Problem — the root cause of the high traffic is not yet known"],"answer":1,"explanation":"An Alert is a warning that is triggered automatically when a monitored event meets or exceeds a defined threshold — such as traffic above 75% or memory usage at 90% or more for over 2 minutes. The underlying change is an Event; the threshold breach converts it into an Alert that draws human attention."},{"id":"d7_q_041","domain":"D7","difficulty":"medium","question":"What makes an Incident different from a single Event or Alert?","options":["An Incident is always caused by an external attacker, while Events are caused internally","An Incident requires senior management sign-off before response can begin","An Incident involves MULTIPLE adverse events occurring on systems or a network, and is often caused by people","An Incident is any single event that results in data loss or financial damage"],"answer":2,"explanation":"An Incident is defined as multiple adverse events occurring together on systems or a network — not a single isolated event or alert. Incidents are often caused by people (whether malicious insiders, attackers, or accidental user behaviour). The multiplicity and adverse nature distinguish it from a routine Event or a single Alert."},{"id":"d7_q_042","domain":"D7","difficulty":"medium","question":"What distinguishes a Problem from an Incident in incident management terminology?","options":["A Problem is always caused by external attackers; an Incident is caused internally","A Problem is an incident whose root cause is unknown — it requires additional root-cause analysis to prevent recurrence","A Problem takes more than 48 hours to resolve; an Incident is resolved within 24 hours","A Problem only affects physical infrastructure; an Incident only affects digital systems"],"answer":1,"explanation":"A Problem is an incident where the underlying cause is unknown. The response follows similar steps to incident response, but significantly more effort goes into root-cause analysis — understanding exactly what happened so it can be prevented from recurring. Examples include a total internet outage or a server crash where the trigger is unclear."},{"id":"d7_q_043","domain":"D7","difficulty":"medium","question":"A company experiences a complete internet outage. Responders follow incident response procedures but cannot determine the cause. They spend considerable extra time on analysis to understand what happened and prevent recurrence. How is this classified?","options":["An Incident — multiple adverse events are clearly affecting the network","An Alert — the outage triggered multiple monitoring thresholds","A Problem — an incident with an unknown cause requiring root-cause analysis to prevent it from happening again","A Critical Event — a special category for organisation-wide outages"],"answer":2,"explanation":"This is a Problem. A Problem is an incident where the cause is unknown. The team follows incident response steps but must invest significantly more effort in root-cause analysis. Total internet outages and server crashes that have no clear trigger are classic examples of Problems. Identifying the root cause is essential to stop it from recurring."},{"id":"d7_q_044","domain":"D7","difficulty":"easy","question":"An organisation's main data centre becomes completely unusable for 31 hours due to a flooding event. Which incident severity category does this represent?","options":["Inconvenience — the organisation can recover quickly with redundant systems","Emergency — the flooding created a potential risk to life and property","Disaster — the entire facility is unusable for 24 hours or longer","Catastrophe — large-scale flooding always qualifies as a catastrophe"],"answer":2,"explanation":"A Disaster is defined as the entire facility being unusable for 24 hours or longer. At 31 hours, this scenario meets that threshold. Note that geographic diversity and redundant systems can significantly mitigate disaster impact — if workloads can be shifted to another site, the organisation may avoid the full consequences."},{"id":"d7_q_045","domain":"D7","difficulty":"easy","question":"A single server in a three-node cluster fails. The remaining two nodes continue to handle all workloads without any service interruption. Which incident severity category is this?","options":["Inconvenience — a non-disruptive failure; operations continue normally","Emergency — hardware failure has the potential to escalate to loss of service","Disaster — a server failure in a production cluster is always a disaster","Problem — the root cause of the failure is unknown"],"answer":0,"explanation":"An Inconvenience (also called a Non-disaster) is a non-disruptive failure — systems continue to function and no significant harm is caused. A single server failing in a redundant cluster while operations continue normally is the textbook example. Compare: a hard disk failure in a RAID array, or one node down in a cluster, are inconveniences, not disasters."},{"id":"d7_q_046","domain":"D7","difficulty":"easy","question":"Which incident severity category is specifically characterised by the POTENTIAL for loss of life or property?","options":["Inconvenience — the lowest category involving physical risk","Emergency (Crisis) — an urgent situation with potential for loss of life or property","Disaster — a disaster always involves risk to life when the facility is unusable","Catastrophe — only total facility destruction creates life-safety risk"],"answer":1,"explanation":"An Emergency (or Crisis) is an urgent situation specifically defined by the potential for loss of life or property. This distinguishes it from an Inconvenience (non-disruptive, no life safety risk) and a Disaster (facility unusable 24+ hours, which may or may not involve life-safety risk). Emergency demands urgent, immediate action."},{"id":"d7_q_047","domain":"D7","difficulty":"medium","question":"What is the KEY difference between a Disaster and a Catastrophe in incident management?","options":["A Disaster lasts less than 24 hours; a Catastrophe lasts longer than 24 hours","A Disaster affects only digital systems; a Catastrophe affects physical infrastructure","A Disaster means the facility is unusable for 24+ hours; a Catastrophe means the facility is completely destroyed","A Disaster can be recovered from on-site; a Catastrophe requires an alternate recovery site"],"answer":2,"explanation":"The distinction is severity of facility impact: a Disaster means the entire facility is unusable for 24 hours or longer (but it still exists and can be returned to). A Catastrophe means the facility itself is destroyed — there is nothing to return to. Catastrophe requires complete reliance on alternate or redundant sites."},{"id":"d7_q_048","domain":"D7","difficulty":"medium","question":"Which strategy MOST effectively reduces the impact of a Disaster on an organisation?","options":["Increasing the number of security guards at the primary facility","Having a well-documented incident response plan stored at the facility","Geographic diversity and redundancy — distributing systems across multiple locations","Performing daily backups of all critical systems on-site"],"answer":2,"explanation":"Geographic diversity and redundancy are the most effective mitigations against a Disaster. If systems, data, and operations are distributed across multiple geographic locations, the loss of one facility for 24+ hours does not cripple the entire organisation — other sites can absorb the workload. On-site backups and guards do not help when the facility itself is inaccessible."},{"id":"d7_q_049","domain":"D7","difficulty":"medium","question":"A severe snowstorm forces a company's headquarters to close for three days, making all on-site systems inaccessible. How should this be classified?","options":["Inconvenience — weather events are non-disruptive by definition","Emergency — snow creates a potential risk to employee safety","Disaster — the facility is unusable for more than 24 hours","Natural — weather events are classified by their cause, not their impact"],"answer":2,"explanation":"A snowstorm that renders the facility unusable for 3 days (72 hours) is a Disaster — the classification is based on impact (facility unusable for 24+ hours), not the cause. Natural events like snowstorms absolutely can be Disasters. This is a common exam scenario: do not confuse the incident class (Natural) with the severity level (Disaster)."},{"id":"d7_q_050","domain":"D7","difficulty":"easy","question":"Which phase of the incident response lifecycle is most often overlooked or skipped by organisations?","options":["Detection and Identification — teams move straight to containment","Reporting — organisations avoid documenting incidents to limit liability","Lessons Learned — organisations move on once the problem is resolved","Recovery — teams resume operations before fully restoring systems"],"answer":2,"explanation":"Lessons Learned is the most commonly skipped phase of incident response. Once the problem is removed and controls are implemented, organisations feel the incident is over and move on — but skipping this phase means missing critical insight into what worked, what failed, and how to prevent the next incident."},{"id":"d7_q_051","domain":"D7","difficulty":"easy","question":"At the conclusion of the Lessons Learned phase, who receives the final report produced by the security team?","options":["The affected users and department heads who were impacted","Senior management — with the team's findings and recommendations","External auditors and regulatory bodies for compliance purposes","The incident response team for internal reference only"],"answer":1,"explanation":"The Lessons Learned phase concludes with a formal report to senior management. The security team presents findings and can make recommendations, but it is important to understand they can only suggest — senior management is ultimately in charge and holds final decision-making authority and liability for the organisation's security posture."},{"id":"d7_q_052","domain":"D7","difficulty":"medium","question":"In the Lessons Learned process, the IT Security team produces findings and makes recommendations. Who is ultimately responsible and liable for security decisions in the organisation?","options":["The CISO — as the designated head of information security","The incident response team lead — they directed the response","Senior management — they are ultimately in charge of and liable for the organisation","External auditors — they validate security controls and bear compliance responsibility"],"answer":2,"explanation":"IT Security can only make suggestions — it is senior management who is ultimately in charge and legally liable. This is why Lessons Learned reports go upward: security professionals inform and advise, but management owns the decision and the accountability. This also explains why management buy-in is critical for effective security programs."},{"id":"d7_q_053","domain":"D7","difficulty":"medium","question":"Where do the outcomes and changes identified during the Lessons Learned phase feed into the incident response lifecycle?","options":["Directly into Detection — so monitoring and alerting are improved immediately","The Preparation phase — improving readiness, training, and controls before the next incident","The Reporting phase — to update compliance records and audit trails","The Recovery phase — to make system restoration faster after future incidents"],"answer":1,"explanation":"Lessons Learned outputs feed back into the Preparation phase — the very beginning of the incident response lifecycle. Improved controls, updated playbooks, better training, and revised safeguards all flow into making the organisation more prepared before the next incident occurs. This creates a continuous improvement cycle."},{"id":"d7_q_054","domain":"D7","difficulty":"medium","question":"After a major security incident, what organisational shift often occurs regarding the role of IT Security?","options":["Organisations typically reduce the IT Security budget after bearing the incident costs","Organisations shift to a top-down approach and senior management becomes more willing to listen to IT Security","Organisations outsource IT Security entirely to reduce future liability","The incident response team gains full autonomous authority over all future security investments"],"answer":1,"explanation":"Major incidents create a significant shift in organisational culture: management has experienced real-world consequences and becomes more receptive to IT Security recommendations. This top-down support — where leadership actively backs security initiatives — is one of the few positive outcomes of a serious incident. This is why Lessons Learned is so important: it captures the moment when management is most likely to act."},{"id":"d7_q_055","domain":"D7","difficulty":"medium","question":"Beyond analysing the specific security incident itself, what else does the Lessons Learned phase evaluate?","options":["The financial cost of each tool and resource used during the response","How well the organisation handled the incident — what worked, what did not, and how to grow for next time","Whether the attacker should face criminal prosecution","The total number of unpatched vulnerabilities remaining in the environment"],"answer":1,"explanation":"Lessons Learned evaluates both the incident and the response: Was the process followed? Did the team communicate effectively? What controls worked and which failed? Fixing one vulnerability may still leave hundreds of unknown vulnerabilities — the broader goal is organisational growth and continuous improvement so the team handles the next incident better."},{"id":"d7_q_056","domain":"D7","difficulty":"medium","question":"In the 8-step incident management lifecycle, what are the LAST THREE phases in the correct order?","options":["Remediation, Recovery, Lessons Learned","Recovery, Remediation, Lessons Learned","Reporting, Recovery, Lessons Learned","Reporting, Remediation, Lessons Learned"],"answer":1,"explanation":"The last three phases are: Recovery (restore and validate system functionality so business operations resume) → Remediation (fix the underlying vulnerabilities that were exploited, to prevent recurrence) → Lessons Learned (retrospective review of what happened and how to improve). Recovery must come before Remediation — you restore service first, then fix the root cause."},{"id":"d7_q_057","domain":"D7","difficulty":"hard","question":"Which of the following incident management steps is LEAST critical to the immediate resolution of an active incident?","options":["Identifying the incident","Containing the incident","Communicating with stakeholders","Evaluating the effectiveness of the response (post-incident review)"],"answer":3,"explanation":"Evaluating the effectiveness of the response — the Lessons Learned or post-incident analysis phase — occurs after the incident is fully resolved. While it is valuable for long-term improvement, it does not contribute directly to identifying, containing, or recovering from the active incident. Identification and containment are essential to resolving the incident; stakeholder communication is also critical during the event for coordination and transparency."},{"id":"d7_q_058","domain":"D7","difficulty":"easy","question":"In which phase of the incident management lifecycle do we actively ANALYSE events to determine whether an incident has occurred?","options":["Preparation — this is where monitoring tools are configured","Detection (Identification) — events are analysed to identify and confirm incidents","Response (Containment) — actions are taken based on earlier analysis","Recovery — systems are analysed to confirm the threat has been eliminated"],"answer":1,"explanation":"The Detection (Identification) phase is where events are actively analysed to determine whether an incident has occurred. This includes examining network traffic for suspicious behaviour, reviewing system logs for unusual activity, and analysing alerts from IDS/IPS and SIEM tools. The goal is to identify incidents quickly so containment and recovery can begin."},{"id":"d7_q_059","domain":"D7","difficulty":"easy","question":"What is the KEY functional difference between an IDS and an IPS?","options":["An IDS is hardware-based; an IPS is software-based","An IDS can only monitor internal traffic; an IPS monitors external traffic only","An IDS detects and alerts on suspicious traffic; an IPS detects AND actively blocks it","An IDS works at the network layer; an IPS works at the application layer"],"answer":2,"explanation":"An IDS (Intrusion Detection System) is passive — it monitors traffic, identifies suspicious activity, and raises an alert, but takes no action to stop it. An IPS (Intrusion Prevention System) is active — it does everything an IDS does but also automatically blocks or rejects the malicious traffic in real time."},{"id":"d7_q_060","domain":"D7","difficulty":"medium","question":"A Network-Based IDS (NIDS) is placed on a switch port configured in promiscuous mode. What does this placement allow the NIDS to do?","options":["Encrypt all traffic passing through the switch for inspection","Block malicious traffic before it reaches its destination","Capture and inspect all traffic on that network segment, not just traffic addressed to it","Monitor only traffic originating from a specific host on the segment"],"answer":2,"explanation":"Promiscuous mode allows a network interface to capture all packets on the segment — not just those addressed to it. This is essential for a NIDS, which must passively observe all traffic flowing across the network segment without disrupting normal operations. Without promiscuous mode, it would only see broadcast traffic and traffic addressed to its own MAC."},{"id":"d7_q_061","domain":"D7","difficulty":"easy","question":"Where is a Host-Based IDS (HIDS) installed, and what does it monitor?","options":["On a dedicated network appliance that monitors an entire subnet","On a switch port in promiscuous mode to capture segment-wide traffic","On an individual client device — normally a server or workstation — monitoring that specific host","On a firewall to inspect traffic entering and leaving the organisation"],"answer":2,"explanation":"A Host-Based IDS (HIDS) is installed directly on an individual client — typically a server or workstation. It monitors activity on that specific host: file changes, system calls, login events, and local traffic. Unlike a NIDS, which watches an entire network segment, a HIDS provides deep visibility into a single endpoint."},{"id":"d7_q_062","domain":"D7","difficulty":"easy","question":"Which IDS/IPS detection approach works similarly to antivirus software — matching traffic against a long list of known malicious patterns?","options":["Heuristic-Based (Behavioral) detection","Anomaly-Based detection","Statistical detection","Signature (Pattern) Matching"],"answer":3,"explanation":"Signature (Pattern) Matching compares network traffic or activity against a database of known malicious signatures — exactly like antivirus software. It is fast and produces few false positives for known threats, but it cannot detect new or unknown attacks (0-days) and requires regular signature updates to remain effective."},{"id":"d7_q_063","domain":"D7","difficulty":"medium","question":"Which IDS/IPS detection approach establishes a baseline of normal traffic and then flags deviations from that baseline as potentially malicious?","options":["Signature (Pattern) Matching — it matches known bad patterns","Heuristic-Based (Behavioral) detection — it monitors for abnormal behaviour relative to a normal baseline","Blacklist filtering — it blocks known bad IP addresses and domains","Deep packet inspection — it reads packet payloads to find malicious content"],"answer":1,"explanation":"Heuristic-Based (Behavioral) detection builds a model of normal traffic patterns and flags statistical deviations as suspicious. Unlike signature matching, it can detect novel and 0-day attacks because it does not rely on known signatures. The trade-off is a higher false-positive rate, since legitimate but unusual behaviour may trigger alerts."},{"id":"d7_q_064","domain":"D7","difficulty":"medium","question":"Firewalls, routers, servers, IDS sensors, and switches each see only a portion of network activity. What technology provides a FULL PICTURE by centralising and correlating data from all of these sources?","options":["A Host-Based IPS installed on each server","A Network-Based IDS placed on the core switch","A SIEM (Security Information and Event Management) system","A web application firewall (WAF) at the network perimeter"],"answer":2,"explanation":"Individual devices each see only their slice of activity. A SIEM (Security Information and Event Management) system collects logs and events from all sources — firewalls, routers, servers, IDS/IPS, switches — and correlates them centrally. This provides the full-picture view required for accurate threat detection and investigation. A SOAR system goes further still, adding automated response."},{"id":"d7_q_065","domain":"D7","difficulty":"easy","question":"An attacker launches a brute-force attack against a login portal. The IDS detects the pattern and immediately blocks the traffic. What type of IDS alert is this?","options":["True Positive — an attack is happening and the system correctly detects and acts on it","False Positive — the IDS mistakenly blocked legitimate login attempts","True Negative — no attack occurred and the system correctly took no action","False Negative — the attack was detected but not blocked"],"answer":0,"explanation":"A True Positive is the ideal outcome: an attack is genuinely occurring AND the system correctly detects and acts on it. The rule matched and there was a real attack. This is what IDS/IPS systems are designed to achieve — though we rarely discuss true states because they mean everything is working as intended."},{"id":"d7_q_066","domain":"D7","difficulty":"easy","question":"A legitimate employee downloads a large report file during business hours. The IDS generates no alert and takes no action. The file was completely clean. What type of IDS result is this?","options":["True Positive — the IDS correctly detected normal traffic","False Positive — large downloads should always trigger an alert","False Negative — the IDS should have flagged the file for review","True Negative — normal traffic was correctly assessed and no action was taken"],"answer":3,"explanation":"A True Negative means normal, legitimate traffic passed through and the system correctly did nothing — no rule matched and there was no attack. Like True Positives, True Negatives mean the system is working as expected. We rarely discuss them because they require no intervention."},{"id":"d7_q_067","domain":"D7","difficulty":"medium","question":"An IDS generates 200 alerts in one hour. Investigation reveals all 200 are from legitimate employee activity. What type of IDS result is this, and why is it a problem?","options":["True Positive — the IDS is correctly flagging all unusual activity for review","False Positive — legitimate traffic is incorrectly triggering security rules, wasting analyst time and eroding trust in the system","False Negative — the IDS is missing real attacks because it is focused on legitimate traffic","True Negative — the high alert volume confirms no real attacks are occurring"],"answer":1,"explanation":"This is a False Positive — the system treated normal traffic as an attack. False Positives (false alarms) are a significant operational problem: they consume analyst time, create alert fatigue, cause legitimate users to be blocked, and erode confidence in the IDS. A system with too many false positives may eventually be ignored — which creates a False Negative risk."},{"id":"d7_q_068","domain":"D7","difficulty":"medium","question":"Why do security teams focus primarily on FALSE states (False Positives and False Negatives) rather than TRUE states when evaluating IDS/IPS performance?","options":["Because true states indicate the IDS has been misconfigured","Because true states — True Positives and True Negatives — mean the system is working as intended; false states indicate failures that require investigation and improvement","Because true states are always caused by external attackers, making them less relevant for internal security teams","Because regulatory frameworks only require reporting on false states"],"answer":1,"explanation":"True Positive (attack detected, acted on) and True Negative (clean traffic, no action) both represent the system working correctly. They require no remediation. False states represent failures: False Positives (false alarms blocking legitimate traffic) and False Negatives (missed attacks) both require investigation. We optimise IDS/IPS to minimise false states, not celebrate true ones."},{"id":"d7_q_069","domain":"D7","difficulty":"medium","question":"Between a False Positive and a False Negative, which IDS/IPS failure is generally considered MORE dangerous from a security perspective?","options":["False Positive — blocking legitimate users disrupts business operations and causes more harm","Both are equally dangerous — any IDS failure carries the same security risk","False Negative — an attack is actively happening but the system fails to detect or stop it, leaving the organisation exposed","Neither — true states are the only states that matter for security"],"answer":2,"explanation":"A False Negative is more dangerous: an attack is occurring and the system completely misses it, leaving the organisation exposed with no alert and no defensive action. A False Positive is disruptive and operationally costly (alert fatigue, blocking legitimate users), but the organisation is not actually under attack. An undetected attack can cause real, lasting damage — a false alarm just creates noise."},{"id":"d7_q_070","domain":"D7","difficulty":"medium","question":"A sophisticated attacker successfully exfiltrates data through an encrypted channel. The IDS analyses the traffic, finds no rule match, and takes no action — but the organisation was genuinely being attacked. What is this?","options":["True Negative — the IDS correctly identified the traffic as clean","False Positive — the encrypted traffic triggered an incorrect alert","True Positive — the IDS correctly identified the encrypted exfiltration","False Negative — an attack occurred but the system failed to detect it"],"answer":3,"explanation":"This is a False Negative: a real attack was happening but the system failed to detect it and took no action. This is the most dangerous IDS outcome — the organisation has no awareness that it is under attack. False Negatives often occur when attackers use novel techniques, encryption, or low-and-slow methods that evade signature-based detection. Heuristic/behavioral detection helps reduce False Negatives."},{"id":"d7_q_071","domain":"D7","difficulty":"medium","question":"Which type of IPS response results in authorised traffic being prevented or blocked?","options":["True Positive — the IPS correctly identified and blocked malicious traffic","True Negative — the IPS correctly allowed legitimate traffic through","False Positive — the IPS incorrectly identifies legitimate traffic as malicious and blocks it","False Negative — the IPS fails to detect and block actual malicious traffic"],"answer":2,"explanation":"A False Positive is when the IPS mistakenly treats legitimate, authorised traffic as a threat and blocks it. While this is disruptive to business operations, it is generally considered preferable to a False Negative — which would allow a real attack to pass through undetected. Tuning IPS rules reduces false positives without opening the door to false negatives."},{"id":"d7_q_072","domain":"D7","difficulty":"medium","question":"Which of the following is the MOST effective DETECTIVE control for identifying security breaches on a network?","options":["Firewall — monitors and filters incoming and outgoing network traffic","Access Control List (ACL) — enforces who can access which network resources","Intrusion Detection System (IDS) — monitors traffic and alerts administrators to suspicious activity in real time","Virus scanner — detects and removes malware from endpoints"],"answer":2,"explanation":"An IDS is a detective control — its primary purpose is to monitor network traffic and alert security teams to suspicious activity or potential breaches in real time. A firewall and ACL are preventive controls (they restrict access). A virus scanner is primarily preventive (removes known malware). Detective controls identify what has already happened or is happening; preventive controls stop it before it starts."},{"id":"d7_q_073","domain":"D7","difficulty":"easy","question":"What is the PRIMARY function of an Intrusion Detection System (IDS)?","options":["To prevent unauthorised access to a network by enforcing traffic rules","To monitor network activity and alert administrators of potential security breaches","To encrypt data transmission to protect it from interception","To provide secure authentication for users accessing the network"],"answer":1,"explanation":"The primary function of an IDS is to monitor network traffic for suspicious activity and alert administrators when potential threats are detected. It does NOT take action to stop the attack — that is the role of an IPS. Preventing access is a firewall's job; encryption is handled by SSL/TLS or VPN; authentication is handled by IAM systems."},{"id":"d7_q_074","domain":"D7","difficulty":"easy","question":"A SIEM (Security Information and Event Management) system provides a holistic view of an organisation's events. What does SIEM primarily centralise?","options":["Endpoint antivirus signatures and patch levels across all workstations","User authentication events from Active Directory only","Storage and interpretation of logs and traffic from ALL systems for near-real-time analysis","Physical access records from badge readers and surveillance cameras"],"answer":2,"explanation":"A SIEM centralises the storage and interpretation of logs and traffic from every system in the environment — firewalls, servers, endpoints, network devices, applications — providing a holistic view of the organisation's security events. This central aggregation enables correlation across sources that would be impossible to analyse individually. SIEMs are often pronounced 'SEM' or 'SIM'."},{"id":"d7_q_075","domain":"D7","difficulty":"medium","question":"Which of the following is an INPUT capability that feeds data INTO a SIEM system?","options":["Real-time alerting","Dashboards","Event correlation","Log retention"],"answer":2,"explanation":"Event correlation is an input function — the SIEM ingests events from multiple sources and correlates them to identify patterns indicative of an attack. Other SIEM inputs include: log collection, log analysis, log forensics, IT compliance data, application log monitoring, and object access monitoring. Real-time alerting, dashboards, and log retention are SIEM outputs — what the SIEM produces after processing its inputs."},{"id":"d7_q_076","domain":"D7","difficulty":"medium","question":"Which of the following is an OUTPUT capability produced BY a SIEM system?","options":["Object access monitoring","Application log monitoring","IT compliance data collection","File integrity monitoring"],"answer":3,"explanation":"File integrity monitoring is a SIEM output — the SIEM reports on changes to critical files and system configurations. Other SIEM outputs include: real-time alerting, user activity monitoring, dashboards, reporting, system and device log monitoring, and log retention. Object access monitoring, application log monitoring, and IT compliance collection are SIEM inputs — data that flows into the SIEM."},{"id":"d7_q_077","domain":"D7","difficulty":"easy","question":"What is the KEY capability that SOAR adds over a traditional SIEM?","options":["SOAR retains logs for longer periods than SIEM systems","SOAR provides richer dashboards and visualisations than SIEM","SOAR uses AI to automatically RESPOND to security events, not just detect and alert","SOAR is hardware-based while SIEM is a software solution"],"answer":2,"explanation":"Both SIEM and SOAR collect and alert on security events. The key difference is that SOAR (Security Orchestration, Automation, and Response) uses AI to automatically react and respond to some incidents — executing playbooks, isolating hosts, creating tickets — without requiring a human analyst. This addresses the core problem that SIEMs often generate more alerts than a SOC team can manually handle."},{"id":"d7_q_078","domain":"D7","difficulty":"medium","question":"SOAR is described as a comprehensive platform that integrates with other security solutions. Which set of tools does SOAR typically integrate with?","options":["Patch management systems, physical badge access, and endpoint antivirus only","HR systems, payroll software, and customer relationship management (CRM) platforms","Vulnerability Management (VM), IT Service Management (ITSM), and Threat Intelligence platforms","DNS, DHCP, and Active Directory exclusively"],"answer":2,"explanation":"SOAR integrates with a wide ecosystem including Vulnerability Management (to prioritise and remediate vulnerabilities), IT Service Management/ITSM (for ticketing and workflow), and Threat Intelligence platforms (to enrich alerts with context). This integration, combined with case management, standardisation, and analytics, allows SOAR to orchestrate a comprehensive, automated security response across the entire environment."},{"id":"d7_q_079","domain":"D7","difficulty":"easy","question":"By combining SIEM, SOAR, and integrations with Vulnerability Management, ITSM, and Threat Intelligence, an organisation can implement which overarching security strategy?","options":["Zero Trust Architecture — where no user or device is trusted by default","Perimeter security — concentrating all controls at the network boundary","Defense-in-depth — layered, comprehensive security controls across the entire environment","Single sign-on — centralising user authentication across all systems"],"answer":2,"explanation":"Defense-in-depth is a strategy of layering multiple, complementary security controls so that no single point of failure can compromise the organisation. SOAR — integrating with SIEM, VM, ITSM, and Threat Intelligence — provides the orchestration layer that ties these controls together, enabling a detailed, comprehensive defense-in-depth solution."},{"id":"d7_q_080","domain":"D7","difficulty":"hard","question":"Which of the following is NOT a reliable distinguishing difference between SIEM and SOAR?","options":["SIEM focuses on security incident management; SOAR focuses on security orchestration and automation","SIEM is primarily reactive (responds to events after detection); SOAR is more proactive (helps prevent incidents)","SIEM is always more expensive to deploy than SOAR in every scenario","SIEM is primarily used for log analysis; SOAR can perform threat hunting and vulnerability management"],"answer":2,"explanation":"While SIEM is often more expensive than SOAR, this is NOT always the case — cost depends on scale, features, and deployment context. The reliable differences are: SIEM handles security incident management (reactive, log-focused), SOAR handles orchestration and automation (more proactive, broader scope). Cost is not a consistent distinguishing factor and should not be used as a defining difference."},{"id":"d7_q_081","domain":"D7","difficulty":"medium","question":"Which of the following is NOT a core component of a SOAR system?","options":["Playbooks — structured response guides for different types of security incidents","Case management — organising and tracking incidents from detection to resolution","Encryption — encoding data to prevent unauthorised access","Threat intelligence — collecting and applying information about cybersecurity threats"],"answer":2,"explanation":"Encryption is not a SOAR component. SOAR is focused on orchestrating, automating, and responding to security incidents — not on protecting data confidentiality. Core SOAR components include: playbooks (structured response procedures), case management (incident tracking and documentation), and threat intelligence integration (contextualising alerts with threat data). Encryption is a separate security control, not part of SOAR's orchestration and automation function."},{"id":"d7_q_082","domain":"D7","difficulty":"medium","question":"What is the PRIMARY benefit of implementing a SOAR system in a security operations centre?","options":["Enhanced data analytics capabilities for business intelligence reporting","Improved response times to cyber threats by automating repetitive, low-level security tasks","Streamlined incident management processes through better documentation","Increased security awareness among employees through automated training reminders"],"answer":1,"explanation":"The primary benefit of SOAR is dramatically improved response times to cyber threats. By automating repetitive, low-level tasks (triage, correlation, ticket creation, containment actions) that would otherwise require manual analyst effort, SOAR reduces both the time to respond and the risk of human error. Streamlining incident management and data analytics are secondary benefits — they arise from faster response but are not the primary goal."},{"id":"d7_q_083","domain":"D7","difficulty":"medium","question":"Which of the following represents the HIGHEST level of honeypot deployment?","options":["A production honeypot — deployed in a live environment to detect real attackers","A low-interaction honeypot — mimics a limited set of services to attract attackers","A high-interaction honeypot — provides a full range of services for realistic attacker engagement","A honeynet — a network of multiple honeypots providing the broadest monitoring scope"],"answer":3,"explanation":"A honeynet is the highest level of honeypot deployment. It consists of an entire network of interconnected honeypots, giving attackers a more realistic environment to interact with while providing the security team the broadest possible scope for monitoring, data collection, and analysis of attacker behaviour, tools, and techniques."},{"id":"d7_q_084","domain":"D7","difficulty":"medium","question":"What is the MOST effective way to use honeypots and honeynets?","options":["As a standalone security measure to replace firewalls and IDS","Purely as decoys to distract and tie up attackers during an active incident","To gather intelligence on attackers — their tactics, techniques, and procedures (TTPs)","To actively block and mitigate attacks before they reach production systems"],"answer":2,"explanation":"Honeypots and honeynets are most effective when used to gather intelligence on attackers — specifically their tactics, techniques, and procedures (TTPs). This information improves the organisation's overall security posture by informing defensive strategies. They should complement other controls, not replace them. Honeypots do not actively block attacks — they are passive observation tools."},{"id":"d7_q_085","domain":"D7","difficulty":"easy","question":"What is an application NEGATIVE list (also known as a blacklist)?","options":["A list of applications that are authorised and approved for use on the network","A list of applications that are prohibited from use on the network due to security or compliance risk","A list of applications that have been found to contain malware during a recent scan","A list of applications that the IT department has tested and certified as safe"],"answer":1,"explanation":"An application negative list (blacklist) is a list of applications explicitly prohibited from installation or execution on the network because they pose security, compliance, or business risk. The opposite — a positive list (whitelist) — contains only applications that have been vetted and are approved for use. Blacklisting blocks known-bad applications; whitelisting allows only known-good ones."},{"id":"d7_q_086","domain":"D7","difficulty":"easy","question":"What is Change Management in the context of IT security operations?","options":["A process for managing employee role changes and access provisioning","A formalized process for handling changes to environments, with full documentation, understanding, and communication to appropriate parties","A version control system used by developers to track code changes","A financial process for managing IT budget reallocations"],"answer":1,"explanation":"Change Management is the formalized process an organisation uses to handle changes to its environments. When done correctly, it ensures full documentation, a clear understanding of the change's impact, and appropriate communication to all relevant parties before the change is implemented."},{"id":"d7_q_087","domain":"D7","difficulty":"medium","question":"Who should comprise the Change Review Board?","options":["IT staff only — since changes primarily affect technical systems","Both IT AND other operational units from across the organisation","Senior leadership only — since they hold final approval authority","External auditors and vendors who are familiar with the affected systems"],"answer":1,"explanation":"The Change Review Board should include both IT and other operational units from the organisation. While changes may directly impact IT, they also affect other departments and business operations. Non-IT units need to understand how a proposed change will impact them and must have the opportunity to raise concerns before the change is approved."},{"id":"d7_q_088","domain":"D7","difficulty":"medium","question":"Why is it important to include non-IT operational units on the Change Review Board?","options":["To satisfy regulatory requirements for board diversity and representation","Because they provide the funding for IT infrastructure change projects","Because changes may impact their operations — they need to understand the effects and have an opportunity to raise concerns","Because they hold veto power over all IT-related decisions"],"answer":2,"explanation":"The Change Review Board exists to serve the organisation — not just IT. Non-IT units may be impacted by technical changes in ways that IT staff do not anticipate. Including them ensures that business impacts are identified, communicated, and addressed before implementation. They are there to understand the change and raise any operational concerns."},{"id":"d7_q_089","domain":"D7","difficulty":"medium","question":"When submitting a proposed change to the Change Review Board, what information must the submitter provide?","options":["A cost estimate and projected implementation timeline only","The reasons for the change, pros and cons of BOTH implementing AND not implementing, related system or process changes, and all available supporting information","Only the technical specifications and configuration details of the change","A list of all employees whose daily work will be directly affected"],"answer":1,"explanation":"A thorough change submission must include: the reasons for the change, the pros and cons of implementing it AND the pros and cons of NOT implementing it, any related changes to other systems or processes, and as much supporting information as the board needs to understand the full impact. This gives the board what it needs to make an informed decision."},{"id":"d7_q_090","domain":"D7","difficulty":"medium","question":"How does the Change Review Board's approval authority typically work regarding senior leadership?","options":["The board can approve all changes without any escalation requirement","The board can only make recommendations — senior leadership must approve every change","The board has a predefined range of changes it can approve; changes exceeding that threshold require senior leadership approval","Senior leadership is only involved when the change fails after implementation"],"answer":2,"explanation":"The Change Review Board typically has authority to approve changes within a predefined scope or threshold. For routine or low-impact changes, the board approves independently. When a proposed change exceeds that threshold — in scale, risk, or cost — the board makes a recommendation but the change requires senior leadership approval before proceeding."},{"id":"d7_q_091","domain":"D7","difficulty":"hard","question":"A Change Review Board receives a proposal to migrate the organisation's entire email system to a new cloud platform. The change falls above the board's predefined approval threshold. What is the correct course of action?","options":["The board rejects the change — it is outside their authority so it cannot proceed","The board approves it immediately since email is an IT matter within their expertise","The board researches the full impact, then makes a recommendation to senior leadership who hold final approval authority","The change is automatically approved if no objections are raised within the review period"],"answer":2,"explanation":"When a change exceeds the board's approval threshold, the board still performs its function — researching the full impact and involving stakeholders — but it escalates to senior leadership with a recommendation rather than making the final decision. Senior leadership must formally approve changes above the threshold. The board advises; leadership decides."},{"id":"d7_q_092","domain":"D7","difficulty":"easy","question":"In the Change Management process, what does CAB stand for?","options":["Change Approval Board — the team that authorises all system changes","Compliance Audit Bureau — the regulatory body overseeing changes","Change Advisory Board — the group that analyses and approves proposed changes","Cyber Assessment Board — the team that evaluates security risk of changes"],"answer":2,"explanation":"CAB stands for Change Advisory Board. It is the formal body within the Change Management process (in the Plan phase) that reviews, analyses, and approves or rejects proposed changes. The CAB typically includes both IT and non-IT stakeholders to ensure changes are evaluated from all perspectives."},{"id":"d7_q_093","domain":"D7","difficulty":"medium","question":"What are the THREE steps in the PLAN phase of the Change Management process, in the correct order?","options":["Request → Analyse → Approve (CAB)","Request → Implement → Approve","Analyse → Communicate → Accept","Plan implementation → Communicate → Test"],"answer":0,"explanation":"The Plan phase consists of three steps: (1) Request — the change is formally submitted; (2) Analyse — the change is researched to understand its full impact on systems and the organisation; (3) Approve (CAB) — the Change Advisory Board reviews the analysis and grants or denies approval. Only after CAB approval does the process move to the Do phase."},{"id":"d7_q_094","domain":"D7","difficulty":"medium","question":"What are the THREE steps in the DO phase of the Change Management process?","options":["Request, Analyse, Approve — planning the change submission","Success, Communicate, Rollback — evaluating the outcome","Plan implementation, Communicate, Implement and test","Acceptance, Lessons Learned, Document"],"answer":2,"explanation":"The Do phase covers execution: (1) Plan implementation — prepare exactly how the change will be carried out; (2) Communicate — notify all relevant stakeholders before the change happens so they can prepare; (3) Implement and test — execute the change and verify it works as expected. The outcome of testing determines the path taken in the Check phase."},{"id":"d7_q_095","domain":"D7","difficulty":"medium","question":"During the CHECK phase of the Change Management process, the implementation fails and the system is not working as expected. What is the correct immediate action?","options":["Proceed directly to Act phase and document the failure in Lessons Learned","Rollback — immediately revert the change to restore the previous working state","Communicate the failure to stakeholders and continue trying to make the change work","Return to the Plan phase and begin a completely new change request"],"answer":1,"explanation":"When a change fails in the Check phase, the correct action is Rollback — reverting to the previous known-good state. This minimises downtime and impact on the organisation. Only after the rollback is complete should the team communicate the failure and analyse what went wrong. Proceeding with a failed change or skipping rollback risks extended outages."},{"id":"d7_q_096","domain":"D7","difficulty":"easy","question":"What two activities make up the ACT phase of the Change Management process?","options":["Implement and test — verifying the change works correctly","Communicate and approve — notifying stakeholders and gaining sign-off","Acceptance and Lessons Learned","Rollback and re-plan — preparing a revised change request"],"answer":2,"explanation":"The Act phase closes the change cycle with two steps: (1) Acceptance — formally acknowledging the change has been successfully implemented and is now the new standard; (2) Lessons Learned — reviewing what worked, what didn't, and how the process can be improved for future changes. Lessons Learned then feeds back into the Plan phase of future changes."},{"id":"d7_q_097","domain":"D7","difficulty":"easy","question":"The Change Management process follows which well-known quality improvement cycle?","options":["RACI — Responsible, Accountable, Consulted, Informed","PDCA — Plan, Do, Check, Act","CIA — Confidentiality, Integrity, Availability","SDLC — Software Development Life Cycle"],"answer":1,"explanation":"The Change Management process follows the PDCA cycle — Plan, Do, Check, Act. This is a well-established iterative quality and improvement framework: Plan (request, analyse, approve), Do (plan implementation, communicate, implement and test), Check (success/communicate or failure/rollback), Act (acceptance, lessons learned). The cycle then repeats for continuous improvement."},{"id":"d7_q_098","domain":"D7","difficulty":"medium","question":"What constitutes a '0-day vulnerability'?","options":["A vulnerability that is known and has already been patched by the software vendor","A vulnerability that has been discovered but is not yet widely known or exploited (sometimes called a 1-day or n-day vulnerability)","A vulnerability that is unknown to the public and has not yet been discovered or patched — the vendor has had zero days to address it","A vulnerability that is widely known but has not yet been actively exploited by attackers"],"answer":2,"explanation":"A 0-day vulnerability is one that is unknown to the software vendor and the security community — no patch exists because the vendor has had 'zero days' to address it. This is what makes 0-day vulnerabilities especially dangerous: attackers can exploit them before defenders have any chance to respond. Once a patch is released, the vulnerability is no longer a 0-day. A vulnerability that has been discovered but not widely known is a 1-day or n-day vulnerability — the opportunity exists for it to be fixed before exploitation."},{"id":"d7_q_099","domain":"D7","difficulty":"easy","question":"Which process is used when approving alterations to an organisation's IT environment?","options":["Patch management — acquiring, testing, and installing patches to fix specific software issues","Change management — controlling and managing all alterations to the IT infrastructure to minimise the impact of change-related incidents on service quality","Incident management — handling and resolving incidents to restore standard operations as quickly as possible","Risk management — identifying, assessing, and prioritising risks to minimise their impact on operations"],"answer":1,"explanation":"The Change Management process is used when approving alterations to the environment. Any planned change — whether minor updates or significant alterations — must be logged, evaluated, approved, tested, implemented, and reviewed through this process. Patch management is a subset of change management (dealing only with software patches). Incident management handles disruptions, not approvals. Risk management influences what changes may be needed but does not govern the approval process itself."},{"id":"d7_q_100","domain":"D7","difficulty":"medium","question":"What is the process of ensuring that changes to an organisation's IT systems and networks are implemented efficiently and securely?","options":["Network security management — administering security policies to prevent unauthorised access to the network","Incident response — managing the response to security breaches and cyberattacks","Risk management — identifying, assessing, and managing risks that could impact organisational operations","Configuration management — a structured process of proposal, approval, test, implementation, documentation, and audit for each change to IT systems"],"answer":3,"explanation":"Configuration management is the process of ensuring that changes to an organisation's IT systems and networks are implemented efficiently and securely. It includes identifying and documenting the current system state, evaluating the impact of proposed changes, and implementing and testing changes before production deployment. Each change follows a structured lifecycle: proposal, approval, test, implementation, documentation, and audit. Network security management, incident response, and risk management are related disciplines but do not specifically govern the systematic implementation of IT changes."},{"id":"d7_q_101","domain":"D7","difficulty":"easy","question":"What does a full backup include?","options":["Only files that have been modified since the last backup of any type","Only files modified since the last full backup was performed","Everything covered by the backup policy — the entire database or system","Only critical system files and the active database"],"answer":2,"explanation":"A fu
