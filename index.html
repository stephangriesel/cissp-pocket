 recovery because only incremental changes need to be applied on top of the last baseline\n\nKey distinctions:\n• NOT just a local backup — must be offsite\n• NOT defined by encryption or cloud — those may be implementation details\n• NOT a local snapshot — offsite transfer is the defining characteristic\n\nRelated: similar concept to offsite tape rotation, but automated and typically more frequent"},{"id":"d7_fc_065","domain":"D7","front":"BCP — definition, scope, sub-plans, key statistics, and lifecycle phases?","back":"BCP = Business Continuity Plan\nDefinition: long-term strategic plans, policies, and procedures for CONTINUED OPERATION after a disruptive event\nScope: ENTIRE organisation — not just IT; everything that could be impacted\n\nWhy it matters:\n• 43% of companies with major data loss NEVER reopen\n• 29% close within TWO YEARS\n• >70% eventually go out of business after a major data loss\n\nBCP sub-plans (commonly included):\n• COOP — Continuity of Operations Plan\n• Crisis Communications Plan\n• Critical Infrastructure Protection Plan\n• Cyber Incident Response Plan\n• DRP — Disaster Recovery Plan\n• ISCP — Information System Contingency Plan\n• Occupant Emergency Plan\n\nBCP Lifecycle (continuous cycle):\nAnalysis → Solution Design → Implementation → Test & Acceptance → Maintenance → (back to Analysis)"},{"id":"d7_fc_066","domain":"D7","front":"DRP lifecycle — 4 phases, definitions, and pre/post-disaster classification?","back":"DRP Lifecycle: 4 phases in order\n\nPRE-DISASTER phases:\n1. Mitigation\n   • Reduce the IMPACT and LIKELIHOOD of a disaster\n   • Examples: redundant systems, security controls, risk assessments\n\n2. Preparation\n   • Build PROGRAMS, PROCEDURES, and TOOLS for response\n   • Examples: writing the DRP, staff training, drills, communication plans\n\nPOST-DISASTER phases:\n3. Response\n   • React DURING a disaster — follow the established procedures\n   • Activates when disaster occurs; contains/controls the situation\n\n4. Recovery\n   • REESTABLISH basic functionality → return to FULL PRODUCTION\n   • Restore systems, data, and services after the disaster is controlled\n\nSupporting elements:\n• Education, Plans, Processes & Training feed into Preparation/Mitigation\n• DR/BCP/EOP (Emergency Operations Plan) govern Response/Recovery\n• Mitigation = pre-disaster | Recovery = post-disaster (common exam trap)"},{"id":"d7_fc_067","domain":"D7","front":"BCP sub-teams — Rescue, Recovery, and Salvage: roles, triggers, and system priority order?","back":"3 BCP Sub-teams:\n\n1. Rescue Team (Activation/Notification) — DURING the disaster\n   • Evacuate employees\n   • Notify personnel via call trees\n   • Pull network from infected server OR shut down systems\n   • Initial damage assessment\n   • First responders — control the immediate situation\n\n2. Recovery Team (Failover) — AFTER immediate response\n   • Get alternate site operational OR rebuild systems\n   • Restore MOST CRITICAL systems FIRST\n   • Goal: minimum viable operations as fast as possible\n\n3. Salvage Team (Failback) — RETURNING to primary site\n   • Return FULL infrastructure, staff, and operations to primary site\n   (or a new facility if primary was destroyed)\n   • Restore LEAST CRITICAL systems FIRST\n   • Why: verify site stability before moving critical systems\n\nEXAM TRAP:\n• Recovery (failover) = MOST critical first\n• Salvage (failback) = LEAST critical first"},{"id":"d7_fc_068","domain":"D7","front":"BIA and RPO — what they are, how criticality is determined, and what RPO drives?","back":"BIA = Business Impact Analysis\nPurpose: identifies critical AND non-critical systems, functions, and activities\n\nWhat makes something CRITICAL:\n• Disruption is UNACCEPTABLE to the organisation\n• Acceptability also based on COST OF RECOVERY\n• OR: required/mandated by LAW\n\nFor each critical system → 2 values assigned:\n1. RPO — Recovery Point Objective\n2. RTO — Recovery Time Objective (see d7_fc_069)\n\nRPO = Recovery Point Objective:\n• The acceptable amount of data that CANNOT be recovered\n• = Maximum tolerable DATA LOSS for that system\n• Must NOT be exceeded\n• Drives backup frequency:\n  - Weekly backup → RPO up to 1 week of data loss accepted\n  - Hourly backup → RPO up to 1 hour of data loss accepted\n  - Legal mandate for real-time logs → RPO near-zero (continuous replication)\n\nKey link: tighter RPO = more frequent backups required"},{"id":"d7_fc_069","domain":"D7","front":"MTD, RTO, and WRT — definitions, the governing formula, and CISSP exam aliases?","back":"MTD = Maximum Tolerable Downtime\n• Total time a system can be INOPERABLE before severe organisational impact\n• The absolute ceiling — no recovery plan can exceed it\n• Exam aliases (same concept, different framework names):\n  MAD (Maximum Allowable Downtime)\n  MTO (Maximum Tolerable Outage)\n  MAO (Maximum Acceptable Outage)\n  MTPoD (Maximum Tolerable Period of Disruption)\n→ CISSP exam: always use MTD\n\nRTO = Recovery Time Objective\n• Time to restore HARDWARE after a disaster\n• Must not exceed the MTD\n\nWRT = Work Recovery Time\n• Time to CONFIGURE SOFTWARE after hardware is restored\n• Reinstall apps, restore data, test before production\n\nGoverning formula:\nMTD ≥ RTO + WRT\n• Combined restore + configure time must fit within MTD\n• Example: MTD = 8h, RTO = 5h, WRT = 4h → 9h > 8h → FAILS\n• Fix: speed up RTO or WRT until their sum ≤ MTD\n\nRelated: RPO (data loss) + RTO (hardware) + WRT (software) = complete recovery picture"},{"id":"d7_fc_070","domain":"D7","front":"MTBF, MTTR, and MOR in BIA context — what each measures and why it matters?","back":"MTBF = Mean Time Between Failures\n• How long a system/component functions on average BEFORE failing\n• BIA use: plan spare parts inventory; predict hardware replacement frequency\n• Shorter MTBF → stock more spares; schedule more frequent maintenance\n\nMTTR = Mean Time To Repair\n• How long it takes to RECOVER (repair) a failed system\n• BIA use: informs RTO — if MTTR > RTO, faster recovery resources are needed (hot spares, SLA vendor response)\n\nMOR = Minimum Operating Requirements\n• Minimum ENVIRONMENTAL and CONNECTIVITY requirements for critical systems to function\n• Also defines minimum requirements for DR sites\n• Key insight: a fully spec'd system is NOT required to resume business functionality — MOR is the floor, not the ceiling\n• Allows cheaper DR infrastructure while still meeting essential business needs\n\nRelationship: MTBF predicts failures → MTTR tells you recovery time → MOR tells you minimum environment needed for recovery"},{"id":"d7_fc_071","domain":"D7","front":"BIA recovery timeline — full sequence and what each metric spans?","back":"Timeline sequence (left to right):\n\nNormal Business (Backup)\n  ↓ [RPO gap = data loss window going backward from disaster]\nDISASTER\n  ↓ [RTO begins — hardware restore]\nSystem recovery starts\n  ↓\nSystems recovered [RTO ends]\n  ↓ [WRT begins — software/data restore]\nRestore backups\n  ↓\nSystems testing [WRT ends]\n  ↓\nResume Production\n\nWhat each metric spans:\n• RPO: backward from Disaster to last Backup (data loss window)\n• RTO: Disaster → Systems recovered (hardware restore time)\n• WRT: Systems recovered → Resume Production (restore backups + testing)\n• MTD: Disaster → Resume Production (total = RTO + WRT)\n\nFormula check: MTD ≥ RTO + WRT\nIf RTO + WRT exceeds MTD → recovery plan must be improved"},{"id":"d7_fc_072","domain":"D7","front":"Recovery strategy scope beyond IT — what else must be addressed, supply chain risk, and power redundancy options?","back":"Recovery strategy must go BEYOND IT systems:\n• Supply chain continuity — backup vendors if primary suppliers fail\n• Fuel availability — generators need fuel; plan how to obtain it during a disaster\n• Internet connectivity alternatives — if regional infrastructure fails\n• Utility dependencies — power, water, sewage; their loss makes a facility unusable even with working IT\n\nKey insight: IT system restoration alone is incomplete — the whole business ecosystem must be considered.\n\nSupply chain risk mitigation:\n• Most effective: REGULAR SUPPLY CHAIN AUDITS\n  → identify supplier reliability, compliance issues, single-source risks proactively\n• Less effective alone: encryption (protects data, not supply chain), strict contracts (can't prevent natural disasters), employee training (internal only)\n\nPower redundancy options (best to worst):\n1. Dual feed power supply — 2 INDEPENDENT sources; if one fails, other keeps full operations → MOST EFFECTIVE\n2. Backup generator — single point of failure; brief switchover delay; fuel dependency\n3. UPS — short-term bridging only; cannot sustain data centre through extended outage\n4. Fuel cell system — single point of failure; fuel/compatibility challenges"},{"id":"d8_fc_001","domain":"D8","front":"Why design security in rather than bolt it on?","back":"Software with security built in is much more secure than software where it's added later. Programmers make 15-50 mistakes per 1,000 lines of code; a maturity framework can lower that to ~1 per 1,000."},{"id":"d8_fc_002","domain":"D8","front":"What are the five programming language generations?","back":"1st: Machine Code. 2nd: Assembler. 3rd: C, C++, Java, Python, PHP, COBOL. 4th: SQL, ABAP, R, Unix Shell. 5th: Prolog, Mercury, OPS5 (AI/logic)."},{"id":"d8_fc_003","domain":"D8","front":"Compiled vs. Interpreted vs. Bytecode","back":"Compiled: translated to machine code once, run many times (executables). Interpreted: translated each time it runs. Bytecode: intermediary form, still needs conversion to machine code before running on the CPU."},{"id":"d8_fc_004","domain":"D8","front":"What is OOP and its key concepts (object, attribute, method, class)?","back":"Object-Oriented Programming — programs built from objects that interact. Object: contains data (attributes/fields) and code (methods). Class: the template defining the data and methods an object contains."},{"id":"d8_fc_005","domain":"D8","front":"Waterfall vs. Sashimi vs. Agile","back":"Waterfall: linear, can't go back. Sashimi: waterfall with overlapping phases, can go back ONE phase. Agile: iterative, adaptive planning, evolutionary development, embraces changing requirements."},{"id":"d8_fc_006","domain":"D8","front":"What are the four Agile Manifesto values?","back":"Individuals & interactions over processes/tools; Working software over comprehensive documentation; Customer collaboration over contract negotiation; Responding to change over following a plan."},{"id":"d8_fc_007","domain":"D8","front":"Scrum — the three core roles.","back":"Product Owner: voice of the customer, ensures the team delivers business value. Development Team (3-9 people): does the actual work, cross-functional. Scrum Master: removes impediments, ensures the framework is followed (not a traditional PM)."},{"id":"d8_fc_008","domain":"D8","front":"What is the Spiral model?","back":"A risk-driven model with four phases: Planning, Risk Analysis, Engineering, Evaluation. The project repeatedly passes through these in iterations ('spirals'), each building on the baseline spiral."},{"id":"d8_fc_009","domain":"D8","front":"What is the SDLC and the exam tip about it?","back":"Software Development Life Cycle — phases: investigation, analysis, design, build, test, implement, maintain/support, disposal. Exam tip: if an SDLC answer doesn't mention 'secure' or 'security', it's wrong — eliminate it."},{"id":"d8_fc_010","domain":"D8","front":"DevOps vs. DevSecOps","back":"DevOps: cooperation between Development, Operations, and QA; rapid deployment (CI/CD). DevSecOps: evolved from DevOps to integrate security THROUGHOUT the process — designed in, not added later."},{"id":"d8_fc_011","domain":"D8","front":"What is Source Code Escrow?","back":"Depositing source code with a third-party escrow agent. Released to the licensee if the licensor goes bankrupt or fails to maintain the software — protects against abandonment/orphaning."},{"id":"d8_fc_012","domain":"D8","front":"Database integrity types: Referential, Semantic, Entity.","back":"Referential: every foreign key matches a primary key in the parent table. Semantic: each attribute value is consistent with its data type. Entity: each row (tuple) has a unique, non-null primary key."},{"id":"d8_fc_013","domain":"D8","front":"What are the three Normal Forms in database normalization?","back":"1NF: divide data into tables, assign primary keys. 2NF: move partially-dependent-on-primary-key data to another table. 3NF: remove data not dependent on the primary key. Reduces redundancy, improves integrity."},{"id":"d8_fc_014","domain":"D8","front":"DDL vs. DML (database query language)","back":"DDL (Data Definition Language): defines structures — CREATE, ALTER, DROP. DML (Data Manipulation Language): works with data — SELECT, INSERT, UPDATE, DELETE."},{"id":"d8_fc_015","domain":"D8","front":"Coupling vs. Cohesion","back":"Coupling: degree of interdependence between modules (LOW is good). Cohesion: degree to which elements inside a module belong together (HIGH is good). Low coupling + high cohesion = well-structured, maintainable design."},{"id":"d8_fc_016","domain":"D8","front":"What is a primary key vs. a foreign key?","back":"Primary key: uniquely identifies each row in a table (non-null). Foreign key: a field that matches the primary key of another (parent) table, creating the relationship. A foreign key is always a primary key in its local table."},{"id":"d1_fc_041","domain":"D1","front":"What was the purpose of the US ECPA (Electronic Communications Privacy Act) 1986?","back":"To protect electronic communications against warrantless wiretapping. Extended existing telephone wiretap restrictions to cover electronic data transmissions, stored communications, and computer data. Requires government to obtain a warrant or court order to access electronic communications."},{"id":"d1_fc_042","domain":"D1","front":"What is ISO27799 and what does it cover?","back":"ISO27799 is an information security management standard specifically for healthcare organizations. It provides guidance on protecting Personal Health Information (PHI) based on ISO/IEC 27002, tailored to address healthcare-specific security needs."},{"id":"d1_fc_043","domain":"D1","front":"How are security breach notification laws handled in the United States?","back":"At the state level — each state has its own breach notification laws. All 50 states, DC, Guam, Puerto Rico, and the Virgin Islands have enacted legislation. There is no single overarching federal law for all data types. Organizations must comply with the laws of each state where affected individuals reside."},{"id":"d1_fc_044","domain":"D1","front":"What are the three main HIPAA rules?","back":"1. Privacy Rule — governs use and disclosure of Protected Health Information (PHI). 2. Security Rule — administrative, physical, and technical safeguards for electronic PHI (ePHI). 3. Breach Notification Rule — notification requirements after a breach of unsecured PHI. (No standalone Encryption or Disclosure Rule exists.)"},{"id":"d1_fc_045","domain":"D1","front":"Who determines an organization's risk appetite, and what is risk appetite?","back":"Senior management determines risk appetite — the level of risk the organization is willing to accept in pursuit of its objectives. They set the risk culture and tone. IT leadership and middle management operate within the appetite defined by senior management."},{"id":"d4_fc_046","domain":"D4","front":"Which OSI layer covers physical security?","back":"Layer 1 — Physical Layer. It manages raw bit transmission, topology, electrical signals, and physical connections. Locking server rooms and security cameras are Layer 1 security measures."},{"id":"d4_fc_047","domain":"D4","front":"Which protocol operates at OSI Layer 6 (Presentation Layer)?","back":"SSL (Secure Sockets Layer). It encrypts and formats data at L6 before passing it to the Application layer. TCP is L4; HTTP and FTP are L7."},{"id":"d4_fc_048","domain":"D4","front":"What are the PDUs for the Link/Physical layer in the TCP/IP model?","back":"Frames and bits. Internetwork layer = packets. Transport layer = segments. Application layer = data."},{"id":"d4_fc_049","domain":"D4","front":"What ports do SSH and Telnet use, and what is the key difference?","back":"SSH: port 22 (TCP/UDP) — encrypted. Telnet: port 23 (TCP) — unencrypted cleartext. SSH replaced Telnet as the secure alternative for remote access."},{"id":"d4_fc_050","domain":"D4","front":"What ports does FTP use and what is each for?","back":"Port 20 TCP — data transfer. Port 21 TCP — control/commands. Both are TCP only. FTP transmits credentials in cleartext — use SFTP or FTPS for secure transfer."},{"id":"d4_fc_051","domain":"D4","front":"What ports do the three email protocols use?","back":"SMTP: 25 TCP (also 2525) — sending mail. POP3: 110 TCP — retrieving mail (downloads and deletes from server). IMAP: 143 TCP — retrieving mail (keeps mail on server, syncs across devices)."},{"id":"d4_fc_052","domain":"D4","front":"What are the default ports for HTTP, HTTPS, and RDP?","back":"HTTP: 80 TCP/UDP (also 8008, 8080). HTTPS: 443 TCP — HTTP over TLS/SSL. RDP (Microsoft Terminal Server): 3389 TCP/UDP."},{"id":"d4_fc_053","domain":"D4","front":"What is the difference between TCP and UDP?","back":"TCP: reliable, connection-oriented, 3-way handshake (SYN/SYN-ACK/ACK), guaranteed ordered delivery, more overhead. UDP: connectionless, unreliable, no handshake, faster — used for VoIP, live video, gaming where timing beats delivery."},{"id":"d4_fc_054","domain":"D4","front":"What is a SYN flood attack and what protocol does it exploit?","back":"A DoS attack against TCP. The attacker sends thousands of SYN requests but never sends the final ACK, filling the server with half-open connections that exhaust memory and prevent legitimate connections."},{"id":"d4_fc_055","domain":"D4","front":"What is a Fraggle attack and how does it differ from a Smurf attack?","back":"Both flood a target using spoofed source addresses and broadcast amplification. Smurf uses ICMP; Fraggle uses UDP. Fraggle can be more effective because UDP is less commonly blocked than ICMP."},{"id":"d4_fc_056","domain":"D4","front":"How do the 4 TCP/IP layers map to the 7 OSI layers?","back":"Application (TCP/IP) = OSI 5+6+7 (Session, Presentation, Application). Transport = OSI 4. Internetwork = OSI 3 (Network). Link/Physical = OSI 1+2 (Physical, Data Link)."},{"id":"d4_fc_057","domain":"D4","front":"What is IANA and how does it relate to ICANN?","back":"IANA (Internet Assigned Numbers Authority) governs global IP address allocation. It is a department of ICANN (Internet Corporation for Assigned Names and Numbers), the overarching body that coordinates internet naming and addressing."},{"id":"d4_fc_058","domain":"D4","front":"What are the 5 Regional Internet Registries (RIRs) and their regions?","back":"AFRINIC — Africa. ARIN — US, Canada, Caribbean, Antarctica. APNIC — Asia, Australia, New Zealand. LACNIC — Latin America and Caribbean. RIPE NCC — Europe, Russia, Middle East, Central Asia."},{"id":"d4_fc_059","domain":"D4","front":"What is the hierarchy for global IP address management?","back":"ICANN → IANA → 5 RIRs (regional) → ISPs/organisations (national/local) → end users. IANA allocates large blocks to RIRs; RIRs delegate to organisations in their region."},{"id":"d4_fc_060","domain":"D4","front":"What are the key fields in an IPv4 header?","back":"Version · IHL (header length) · QoS · Identification / Flags / Fragment Offset (fragmentation) · TTL (prevent routing loops) · Protocol (TCP/UDP number) · Checksum · Source IP · Destination IP · Options/Padding."},{"id":"d4_fc_061","domain":"D4","front":"What is TTL in an IPv4 header and why does it matter for security?","back":"TTL (Time To Live) — decremented by 1 at each hop. Packet is discarded when TTL hits 0. Prevents infinite routing loops. Also used in traceroute; attackers may manipulate TTL in evasion techniques."},{"id":"d4_fc_062","domain":"D4","front":"What is MTU and what is the Ethernet default?","back":"MTU (Maximum Transmission Unit) — the largest packet a network segment can carry without fragmentation. Ethernet default = 1500 bytes. Packets exceeding MTU are fragmented by routers using the Identification, Flags, and Fragment Offset header fields."},{"id":"d4_fc_063","domain":"D4","front":"What are the ports for HTTP and HTTPS, including alternates?","back":"HTTP: port 80 TCP (alternates: 8008, 8080) — unencrypted. HTTPS: port 443 TCP (alternate: 8443) — encrypted via TLS/SSL. Traffic on alternate ports can bypass naive firewall rules."},{"id":"d4_fc_064","domain":"D4","front":"What is the difference between HTML and HTTP/HTTPS?","back":"HTML (Hypertext Markup Language) — the language used to write and structure webpages. HTTP/HTTPS — the transport protocols that carry HTML data between server and browser. Do not confuse the content language with the transport protocol."},{"id":"d4_fc_065","domain":"D4","front":"What is BOOTP and how does it differ from DHCP?","back":"BOOTP (Bootstrap Protocol) — for diskless workstations; determines OS (via TFTP) and IP address. Static mapping only. DHCP evolved from BOOTP and adds dynamic address allocation, lease times, and automatic address reclamation."},{"id":"d4_fc_066","domain":"D4","front":"What is the DHCP DORA process?","back":"Discovery — client broadcasts to locate a DHCP server. Offer — server proposes an IP. Request — client requests that IP. Acknowledge — server confirms assignment. Acronym: DORA. Uses UDP 67 (server) and UDP 68 (client)."},{"id":"d4_fc_067","domain":"D4","front":"Why does DHCP use UDP instead of TCP?","back":"When a client sends the initial DHCP Discovery, it has no IP address yet — it cannot form a TCP connection without a source IP. UDP broadcast (to 255.255.255.255) allows the client to reach any DHCP server on the segment without a pre-existing address."},{"id":"d4_fc_068","domain":"D4","front":"What are the four email agent types and their roles?","back":"MUA (Mail User Agent) — email client; composes and retrieves mail. MSA (Mail Submission Agent) — accepts from MUA, resolves destination via DNS MX record. MTA (Message Transfer Agent) — routes between mail servers via SMTP. MDA (Mail Delivery Agent) — delivers to recipient mailbox."},{"id":"d4_fc_069","domain":"D4","front":"What is the end-to-end email delivery flow?","back":"MUA formats email → SMTP to MSA → MSA queries DNS MX record → SMTP to destination MTA → MTA may relay through further MTAs → MDA delivers to mailbox → recipient MUA retrieves via POP3 (port 110) or IMAP (port 143)."},{"id":"d4_fc_070","domain":"D4","front":"What is a DNS MX record and why does email delivery depend on it?","back":"MX (Mail eXchange) record — a DNS record identifying the mail server (MTA) responsible for accepting email for a domain. Without MX records, the sending MSA cannot determine where to deliver outbound mail for a given domain."},{"id":"d4_fc_071","domain":"D4","front":"How many bits are in an IPv4 address vs an IPv6 address?","back":"IPv4 = 32 bits (4 octets, e.g. 192.168.1.1) — ~4.3 billion addresses. IPv6 = 128 bits (8 groups of hex, e.g. 2001:0db8::1) — 340 undecillion addresses. Note: 48 bits = MAC address (common exam trap)."},{"id":"d4_fc_072","domain":"D4","front":"What are the key benefits of IPv6 over IPv4?","back":"1. Larger address space (128-bit vs 32-bit). 2. Built-in IPsec security (optional in IPv4). 3. Improved routing efficiency — simplified headers, no NAT required. NOT a benefit: IPv6 does not reduce network congestion."},{"id":"d4_fc_073","domain":"D4","front":"What are the 4 MAC security modes and how do they differ?","back":"Dedicated: ALL users — clearance + need-to-know for ALL data. System High: clearance for ALL, need-to-know for SOME. Compartmented: clearance for all + need-to-know + approval + information labels for SOME. Multi-level: clearance, need-to-know, and approval all vary per user per data item."},{"id":"d4_fc_074","domain":"D4","front":"What are the 4 main firewall types, their OSI layers, and key characteristics?","back":"Packet-filtering (L3/4): source/dest IP and port rules — fast, no state. Stateful inspection (L7): tracks connection state and context. Circuit-level proxy (L5): checks headers only; tunnels all traffic once circuit established. Application proxy (L7): inspects content, auth/encryption — most secure but slowest."},{"id":"d4_fc_075","domain":"D4","front":"What do the key IEEE 802 standards define?","back":"802.3 = Ethernet. 802.11 = Wi-Fi (wireless LAN). 802.15 = Bluetooth. 802.16 = WiMAX. 802.20 = LTE. 802.11i = WPA2 (AES/CCMP). 802.11ac = up to 1 Gbps on 5 GHz."},{"id":"d4_fc_076","domain":"D4","front":"What are the main 802.11 Wi-Fi amendments and their key specs?","back":"802.11a: 54 Mbps, 5 GHz. 802.11b: 11 Mbps, 2.4 GHz. 802.11g: 54 Mbps, 2.4 GHz. 802.11n: 200+ Mbps, 2.4 or 5 GHz. 802.11ac: 1 Gbps, 5 GHz. 802.11i: WPA2 security standard (AES + CCMP)."},{"id":"d4_fc_077","domain":"D4","front":"How does a circuit-level proxy firewall differ from an application proxy firewall?","back":"Circuit-level proxy (L5): inspects packet headers only — once a circuit is approved, all traffic is tunneled without further inspection. Fast and supports many protocols. Application proxy (L7): inspects full packet content including application data. More secure but significantly slower."},{"id":"d4_fc_078","domain":"D4","front":"What are the TCP/IP address class ranges and default subnet masks?","back":"Class A: 1–127, mask 255.0.0.0 (/8). Class B: 128–191, mask 255.255.0.0 (/16). Class C: 192–223, mask 255.255.255.0 (/24). Class D: 224–239 (multicast). Class E: 240–255 (experimental)."},{"id":"d4_fc_079","domain":"D4","front":"What OSI layer does each LAN device operate at?","back":"L1 Physical: Repeaters, Hubs (multi-port repeater). L2 Data Link: Bridges, Switches, WAPs. L3 Network: Routers. L7 Application: Gateways (translate between protocols). LAN extenders = multi-layer switch."},{"id":"d4_fc_080","domain":"D4","front":"What are the key differences between WEP, WPA, and WPA2?","back":"WEP: RC4, crackable in seconds, uses common key + limited IVs — do not use. WPA: TKIP (RC4-based), improvement but still weak. WPA2: AES + CCMP, based on 802.11i, most secure. WPA2 Enterprise adds RADIUS auth; Personal uses PSK."},{"id":"d4_fc_081","domain":"D4","front":"What are the key email security protocols and what does each provide?","back":"S/MIME: signing + encryption, SSO-compatible. DKIM: domain validation for email authenticity. PEM: auth, confidentiality, integrity, nonrepudiation. MOSS: same as PEM. LDAP (389, unencrypted) vs LDAP-S (636, SSL/TLS encrypted)."},{"id":"d4_fc_082","domain":"D4","front":"What are the WAN and cabling speeds to know for CISSP?","back":"T-1: 1.544 Mbps. T-3: 44.736 Mbps. ATM: 155 Mbps. ISDN: 64 or 128 Kbps. CAT 3: 10 Mbps. CAT 5: 100 Mbps. CAT 5e/6: 1000 Mbps (1 Gbps). Fiber: immune to EMI."},{"id":"d4_fc_083","domain":"D4","front":"What are the three wireless network modes?","back":"Ad hoc: direct device-to-device, no access point. Infrastructure: devices connect to central access point (AP) — most common. Stand-alone: isolated system not connected to other networks."},{"id":"d7_fc_073","domain":"D7","front":"What are the key differences between hot, warm, and cold recovery sites?","back":"Hot: real-time data mirror, minutes to fail over, most expensive. Warm: full data centre (UPS/HVAC/ISPs), data restored from backups, manual failover 4–24+ hrs, mid-cost. Cold: full infrastructure but NO hardware or data — must acquire/configure everything, weeks to recover, cheapest."},{"id":"d7_fc_074","domain":"D7","front":"What is a reciprocal agreement site and what are its risks?","back":"A contract between two organisations to provide mutual data centre space during a disaster. Space may be promised floor area or dedicated segmented racks. Risk: the partner's facility may also be affected by the same disaster, or their network segmentation may be inadequate."},{"id":"d7_fc_075","domain":"D7","front":"What does a warm site contain, and what must still be done to restore operations?","back":"Contains: full data centre with redundant UPS, HVAC, ISPs, and generators. Hardware is present and configured. What remains: manually fail traffic over and restore data from backups. Recovery time: 4–24+ hours. Data is NOT mirrored in real time."},{"id":"d7_fc_076","domain":"D7","front":"What is a redundant site and how does it differ from a hot site?","back":"Redundant site: complete identical production mirror, real-time data, AUTOMATIC failover, staffed, geographically distant — end users never notice. Most expensive. Hot site: critical systems only, lower-spec hardware, NEAR real-time data, manual or auto failover in under 1 hour. Less expensive than redundant."},{"id":"d7_fc_077","domain":"D7","front":"Rank all 4 recovery site types from fastest to slowest recovery, and cheapest to most expensive.","back":"Fastest → Slowest: Redundant (automatic, seconds) → Hot (manual, <1 hr) → Warm (backup restore, 4–24+ hrs) → Cold (build from scratch, weeks+). Cheapest → Most Expensive: Cold → Warm → Hot → Redundant."},{"id":"d7_fc_078","domain":"D7","front":"What is a mobile recovery site and what makes it unique?","back":"A data centre in a container or trailer — HVAC, fire suppression, physical security included. Can be transported anywhere (Not Fixed location). Some are self-contained (generator + satellite internet); others need local hookups. Cost: High. Setup time: Dependent on deployment."},{"id":"d7_fc_079","domain":"D7","front":"What is a subscription/cloud recovery site?","back":"A third-party provider maintains a replica of your environment (minimal or full). They hold pre-built systems with your apps and receive regular backups. On disaster: you contact them, they spin up systems and restore latest backup. Speed/cost determined by SLA tier."},{"id":"d7_fc_080","domain":"D7","front":"Complete recovery site comparison: cost, hardware, telecom, setup time, location.","back":"Cold: Low / None / None / Long / Fixed. Warm: Medium / Partial / Partial-Full / Medium / Fixed. Hot: Med-High / Full / Full / Short / Fixed. Mobile: High / Dependent / Dependent / Dependent / NOT Fixed. Mirrored: High / Full / Full / NONE / Fixed."},{"id":"d7_fc_081","domain":"D7","front":"What is COOP and how long does it cover?","back":"COOP (Continuity of Operations Plan) — how the organisation keeps functioning during a disaster, even at reduced capacity. Covers staff relocation to alternate sites and essential operations for up to 30 days. Sub-plan within the BCP."},{"id":"d7_fc_082","domain":"D7","front":"What is an OEP and what does it cover?","back":"OEP (Occupant Emergency Plan) — protects facilities, staff, and the environment during physical emergencies (fires, floods, hurricanes, terrorism). Covers evacuation procedures, drill frequency, and staff training. Focuses on safety, not IT recovery."},{"id":"d7_fc_083","domain":"D7","front":"What plans sit under the BCP as an overarching framework?","back":"BCP (overarching) contains: DRP (IT/system recovery), COOP (operational continuity for up to 30 days), OEP (occupant safety and evacuation), Cyber Incident Response Plan (DDoS, worms, viruses — may be part of DRP or standalone)."},{"id":"d7_fc_084","domain":"D7","front":"What are the three simulated DRP test types and what does each involve?","back":"DRP Review: DRP team scans plan for obvious gaps and omissions — quickest, least thorough. Read-Through (Checklist): managers check all recovery components against a list. Walk/Talk-through (Tabletop): managers and key staff talk through the full recovery process — best at exposing gaps and technical inaccuracies."},{"id":"d7_fc_085","domain":"D7","front":"What is a Tabletop (Walk/Talk-through) test and why is it valuable?","back":"A group exercise where managers and critical personnel verbally walk through a disaster recovery scenario step by step. No systems are actually touched. Valuable because group discussion often surfaces gaps, omissions, and technical inaccuracies that written reviews miss."},{"id":"d7_fc_086","domain":"D7","front":"What are the three physical DRP test types and how do they differ?","back":"Parallel Processing: secondary site brought up with backups while primary stays live — systems compared after last backup. Partial Interruption: single application failed over to secondary, off hours. Full Interruption: ALL applications failed over to secondary, always off hours — most disruptive, mostly used by fully redundant orgs."},{"id":"d7_fc_087","domain":"D7","front":"What is the full DRP test progression from least to most disruptive?","back":"1. DRP Review (quick gap scan). 2. Read-Through / Checklist. 3. Tabletop / Walk-through (discussion). 4. Simulation / Walkthrough Drill (scenario response, no live systems touched). 5. Parallel Processing (secondary runs alongside primary). 6. Partial Interruption (one app, off hours). 7. Full Interruption (all apps, always off hours)."},{"id":"d7_fc_088","domain":"D7","front":"How often must BCP/DRP plans be reviewed, and what triggers an out-of-cycle update?","back":"Minimum: every 12 months. Out-of-cycle triggers: company acquisition or split, major system changes (new backup, new IP scheme), real disaster revealing gaps, significant senior leadership change. Plans are living documents — always iterative."},{"id":"d7_fc_089","domain":"D7","front":"What happens to old plan copies when a BCP or DRP is updated?","back":"Old copies are retrieved and destroyed. Only the current version is distributed. Allowing stale copies to remain in circulation risks staff following outdated procedures during an actual disaster."},{"id":"d7_fc_090","domain":"D7","front":"What is an MOU in the context of disaster recovery, and is it legally binding?","back":"MOU (Memorandum of Understanding) — a formal agreement where parties (or staff) acknowledge their understood responsibilities during a disaster. Staff sign it to confirm they understand their DR role. Generally NOT legally binding — this is a key distinction from a contract."},{"id":"d7_fc_091","domain":"D7","front":"What is the key missing component in a warm site compared to a hot site?","back":"Data migration. A hot site already has current or near-current data replicated. A warm site has hardware and connectivity ready but data must still be restored from backups — adding 4 hours to 2–3 days of recovery time before critical applications are operational."},{"id":"d7_fc_092","domain":"D7","front":"What are the three disaster categories in DRP and what distinguishes them?","back":"Natural: caused by natural forces (earthquakes, floods, hurricanes). Man-made: result of human actions (cyberattacks, sabotage, terrorism). Environmental: failures in the operational environment (ISP outages, power grid failures, hardware failures) — not caused by nature or direct human intent."},{"id":"d7_fc_093","domain":"D7","front":"What is an EOC and when is it deployed?","back":"EOC (Emergency Operations Center) — a centralised command and control facility activated when the primary site is unavailable. Manages strategic decision-making, coordinates response teams, and directs recovery operations. Deployed during major disasters, power outages, or events that make the main facility unusable."},{"id":"d7_fc_094","domain":"D7","front":"What is the digital forensics process in order?","back":"IAAR: Identify (locate evidence sources) → Acquire (collect using write blocker to preserve integrity) → Analyze (examine data for relevant findings) → Report (compile findings for legal/incident use). Acquisition MUST precede analysis; evidence must not be altered at any stage."},{"id":"d7_fc_095","domain":"D7","front":"What are the 7 phases of incident management in order?","back":"1. Preparation. 2. Detection (Identification). 3. Response (Containment) — shut down access. 4. Mitigation (Eradication). 5. Reporting. 6. Recovery — restore systems. 7. Remediation — fix root cause. 8. Lessons Learned. Last three: Recovery → Remediation → Lessons Learned."},{"id":"d7_fc_096","domain":"D7","front":"How does a copy backup differ from a full backup in terms of the archive bit?","back":"Full backup: backs up everything AND clears (resets) the archive bit — signals files have been backed up. Copy backup: backs up everything but does NOT clear the archive bit — leaves the backup cycle unaffected. Use copy backups for out-of-band snapshots without disrupting your regular schedule."},{"id":"d7_fc_097","domain":"D7","front":"What is catch-as-you-can in network forensics?","back":"A network forensics methodology that captures ALL packets passing through a traffic point and stores them for later analysis. Provides comprehensive evidence of all network activity. Requires significant storage. Used when you need a complete record of what occurred on the network during or after an incident."},{"id":"d8_fc_017","domain":"D8","front":"What is the difference between freeware and shareware?","back":"Freeware: free to use indefinitely, no time or feature restrictions, but NOT open source — users cannot modify or redistribute without permission.\nShareware: free to try for a limited period; payment required to continue beyond the trial or access full features. Key difference = duration of free use."},{"id":"d8_fc_018","domain":"D8","front":"Why is assembly language the most difficult language to reverse-engineer?","back":"Assembly is low-level and architecture-specific, providing almost no high-level semantic context. Reversing it does not reveal the original programmer's intent. By contrast: Java and Python bytecode retain high-level structure and are easily decompiled; C++ machine code can be disassembled and often retains symbol information, offering more clues than raw assembly."},{"id":"d8_fc_019","domain":"D8","front":"In the SDLC, when should security controls first be reviewed and approved?","back":"Design phase — security professionals review and approve controls during system architecture planning, ensuring security is embedded from the start (security-by-design). Controls added later (implementation or testing) are harder to integrate and less effective. Maintenance phase monitors controls continuously but is not the first review point."},{"id":"d8_fc_020","domain":"D8","front":"How frequently does DevOps deploy code, and why?","back":"DevOps deploys multiple times per day or continuously. It uses CI/CD (Continuous Integration / Continuous Delivery) pipelines and automated deployment tools to shorten development cycles and deliver high-quality software rapidly. Contrast with traditional models: weekly, monthly, or milestone-based releases."},{"id":"d8_fc_021","domain":"D8","front":"What distinguishes the Sashimi SDLC model from Waterfall?","back":"Sashimi = linear + overlapping phases. Adjacent phases can run concurrently — the next phase begins before the current one closes, improving transition momentum. Developers can also return to a prior phase if needed. Waterfall = strictly sequential, no overlap. Think of sashimi slices stacked with slight offsets."},{"id":"d8_fc_022","domain":"D8","front":"Which SDLC methodology fits a project with fixed, well-defined requirements that will not change?","back":"Waterfall — linear, sequential, and phase-gated. Best when: requirements are fully known upfront, scope/schedule/cost can be estimated accurately, technology is proven, and no major changes are expected. Poor fit when requirements evolve. Agile/Scrum/Kanban are designed for changing requirements."},{"id":"d8_fc_023","domain":"D8","front":"What are the best practices for data normalisation?","back":"1. Consistent format — all data stored uniformly to reduce errors.\n2. Remove duplicates — each data point represented once; improves accuracy.\n3. Separate tables by purpose — relational design reduces redundancy and improves integrity.\nNOT a best practice: allowing multiple formats — this introduces inconsistency and contradicts the goals of normalisation."},{"id":"d8_fc_024","domain":"D8","front":"What are the four types of database integrity?","back":"Semantic: data must make logical sense for its field (e.g., title field must hold a job title, not '120 hours').\nEntity: primary key must be unique and non-null.\nReferential: foreign keys in a child table must match a primary key in the parent table.\nUser-defined: custom business rules that trigger specific actions or constraints."},{"id":"d8_fc_025","domain":"D8","front":"What are SQL DDL statements and what does each do?","back":"DDL = Data Definition Language — defines the structure of a database.\nCREATE: creates a new table or database.\nALTER: modifies an existing database object (e.g., adds a column).\nDROP: deletes a table or database entirely.\nSQL also includes DML (SELECT, INSERT, UPDATE, DELETE) for manipulating data."},{"id":"d8_fc_026","domain":"D8","front":"What is the most common cause of authentication failures, and what forms does it take?","back":"User error — the most common cause. Forms include: forgetting passwords, mistyping credentials, entering them into the wrong system, not following MFA procedures. Technical failures and hacking occur but are far less frequent. Many accounts + poor password manager adoption = high user-error rate."},{"id":"d8_fc_027","domain":"D8","front":"How do XSS attacks work, and what is the most effective defence?","back":"XSS (Cross-Site Scripting): attacker injects malicious script through input fields that lack validation, executing in other users' browsers to steal data or hijack sessions.\nBest defence: input validation and sanitisation — filter/escape all user-generated data before processing. WAFs help but cannot catch all variants. Updates and passwords do not address the root cause."},{"id":"d8_fc_028","domain":"D8","front":"What is broken access control and what is its primary indicator?","back":"Broken access control: authorisation rules are not correctly enforced, allowing users to act beyond their intended permissions.\nPrimary indicator: unauthorised access to sensitive data — the concrete evidence that controls have failed.\nDistinct from: authentication (who you are) vs. authorisation (what you can do). Even strong authentication cannot compensate for broken access control."},{"id":"d8_fc_029","domain":"D8","front":"What is the first and most effective step to prevent privilege escalation?","back":"Principle of Least Privilege (PoLP) — grant users only the minimum permissions needed for their role. If a user account is compromised, the attacker can only escalate within that limited scope. Strong passwords, patching, and audits all help but do not directly limit what an attacker can do with an already-compromised account."},{"id":"d8_fc_030","domain":"D8","front":"When are backdoors and maintenance hooks acceptable, and when are they dangerous?","back":"Acceptable: during development — enables quick debugging and troubleshooting without disrupting user experience.\nDangerous: in production — attackers can exploit them for unauthorised access. Must be removed before release. They are not for end users or permanent admin use. Leaving them in production code is a critical vulnerability."},{"id":"d8_fc_031","domain":"D8","front":"What is a buffer overflow and what are its consequences?","back":"A buffer overflow occurs when a program writes more data to a temporary buffer than it can hold, overwriting adjacent memory. Consequences: erratic behaviour, memory access errors, crashes, or code injection by attackers. Can result from programming errors or deliberate exploitation. Defences include: bounds checking, safe language constructs, address space layout randomisation (ASLR), and stack canaries."},{"id":"d8_fc_032","domain":"D8","front":"What are the 5 levels of the Software Capability Maturity Model (CMM)?","back":"1. Initial — ad hoc, chaotic, success depends on individuals.\n2. Repeatable — processes documented and standardised; consistent results possible.\n3. Defined — processes well-defined in standards, procedures, and tools.\n4. Managed — processes monitored and controlled with quantitative data.\n5. Optimising — continuous improvement driven by feedback and innovation."},{"id":"d8_fc_033","domain":"D8","front":"What is BSIMM and what does it measure?","back":"BSIMM (Building Security-In Maturity Model) — measures and compares an organisation's software security initiative against real-world data from hundreds of companies. Covers 12 practices in 4 domains: Governance, Intelligence, SSDL Touchpoints, Deployment. Used as a benchmark, not a prescriptive framework. Different from CMM (process maturity) or COBIT (IT governance)."},{"id":"d8_fc_034","domain":"D8","front":"CMM vs CMMC vs BSIMM — what does each assess?","back":"CMM (Capability Maturity Model): software development process maturity — 5 levels from Initial to Optimising.\nCMMC (Cybersecurity Maturity Model Certification): cybersecurity practices for protecting sensitive defence data.\nBSIMM (Building Security-In Maturity Model): software security initiative maturity benchmarked against real-world peers.\nKey distinction: CMM = HOW you build software; BSIMM = HOW securely you build software; CMMC = HOW securely you protect data."},{"id":"d8_fc_035","domain":"D8","front":"What are the 4 types of cloud computing?","back":"Private: org builds/runs own infrastructure (or pays provider exclusively for them) — no shared tenancy.\nPublic: shared tenancy; provider rents massive infrastructure to anyone (AWS, Azure, Google, IBM).\nHybrid: mix of private + public — sensitive data on private, non-sensitive on public.\nCommunity: shared among organisations with common mission, policy, security, or compliance requirements."},{"id":"d8_fc_036","domain":"D8","front":"What distinguishes community cloud from public and private cloud?","back":"Community cloud sits between public and private: it is shared — but only among a specific group of organisations with common concerns (shared mission, policy, security requirements, or compliance obligations, e.g. government agencies or regulated industries). Public cloud = open to anyone. Private cloud = single organisation only."},{"id":"d8_fc_037","domain":"D8","front":"What security rights must you secure when outsourcing to a cloud provider?","back":"1. Right to audit the provider.\n2. Right to penetration test under clearly agreed criteria.\n3. Right to conduct vulnerability assessments.\n4. Confirm vendor is compliant with your industry standards and regulatory requirements.\nTreat cloud outsourcing the same as any third-party outsourcing — verify security posture before and during the contract."}],"questions":[{"id":"d5_q_001","domain":"D5","difficulty":"medium","question":"A user logs in with a fingerprint scanner and a PIN. Which statement is correct?","options":["This is single-factor authentication because biometrics and PINs are both physical","This is multi-factor authentication because it combines Type 3 and Type 1 factors","This is multi-factor authentication because it uses two devices","This is single-factor authentication because the PIN replaces the password"],"answer":1,"explanation":"MFA requires factors from two or more DIFFERENT categories. Fingerprint = Type 3 (something you are), PIN = Type 1 (something you know). Two different categories = MFA."},{"id":"d5_q_002","domain":"D5","difficulty":"hard","question":"An organization needs to choose an access control model where Confidentiality is the highest priority. Which model should they implement?","options":["RBAC — because it separates duties most effectively","DAC — because owners can control access to confidential data","MAC — because access is determined by labels and clearances, not user discretion","ABAC — because environmental conditions add an extra layer of protection"],"answer":2,"explanation":"MAC (Mandatory Access Control) is used when Confidentiality is most important. Access is determined by labels (on objects) and clearances (on subjects), not owner discretion. Commonly used in military environments."},{"id":"d5_q_003","domain":"D5","difficulty":"medium","question":"What is the PRIMARY purpose of salting a password before hashing it?","options":["To make the hash longer and harder to crack","To defend against dictionary attacks and pre-compiled rainbow table attacks","To encrypt the password so it cannot be read by administrators","To add a second authentication factor to the login process"],"answer":1,"explanation":"A salt is random data added to a password before hashing. Its primary function is to defend against dictionary attacks and pre-compiled rainbow table attacks by making each hash unique even if passwords are identical."},{"id":"d5_q_004","domain":"D5","difficulty":"hard","question":"An employee transfers from Payroll to HR. Under RBAC, what is the CORRECT action?","options":["Add the HR role to the employee's existing Payroll role","Remove Payroll access and assign HR access only","Keep Payroll access temporarily until the transition is complete","Ask the employee which permissions they need from each role"],"answer":1,"explanation":"Under RBAC, when employees transfer, they are MOVED from one role to another — old access is removed, new access is assigned. Adding roles without removing old ones leads to privilege creep."},{"id":"d5_q_005","domain":"D5","difficulty":"medium","question":"Which of the following BEST describes a Rainbow Table attack?","options":["A brute force attack using every possible character combination","An attack using a pre-made list of plaintext passwords and their matching hashes","An attack that installs a keylogger to capture passwords in real time","An attack that guesses passwords using dictionary words with numbers appended"],"answer":1,"explanation":"A Rainbow Table is a pre-compiled list of plaintexts and their matching ciphertext/hashes — often millions of password/hash pairs. Salting defeats this attack by making each hash unique."},{"id":"d5_q_006","domain":"D5","difficulty":"hard","question":"A company's biometric system has a very high sensitivity setting. What is the MOST likely result?","options":["Higher FAR — unauthorized users are more likely to be accepted","Higher FRR — authorized users are more likely to be rejected","Lower CER — the system reaches optimal balance faster","Lower FAR — the system becomes easier to bypass"],"answer":1,"explanation":"High sensitivity = high FRR (False Rejection Rate, Type 1 error). Authorized users are rejected more often. The CER (Crossover Error Rate) is where FRR and FAR meet — the optimal balance point."},{"id":"d5_q_007","domain":"D5","difficulty":"medium","question":"What is the MAIN advantage of Kerberos over basic username/password authentication?","options":["It stores passwords in plaintext for easy recovery","It provides mutual authentication — both user and server verify each other","It uses asymmetric encryption making it immune to key theft","It eliminates the need for a centralized authentication server"],"answer":1,"explanation":"Kerberos provides mutual authentication using tickets — both the user and server verify each other's identity. It uses symmetric keys and requires a trusted third party (KDC). UDP port 88."},{"id":"d5_q_008","domain":"D5","difficulty":"hard","question":"What is the key difference between RADIUS and TACACS+?","options":["RADIUS uses TCP; TACACS+ uses UDP","RADIUS encrypts the entire data package; TACACS+ only encrypts the password","TACACS+ encrypts the entire data package; RADIUS only encrypts the password","TACACS+ is used for wireless; RADIUS is used for VPN only"],"answer":2,"explanation":"TACACS+ encrypts the ENTIRE data package. RADIUS only encrypts the password. Both provide AAA management. TACACS+ uses TCP port 49; RADIUS uses UDP 1812/1813."},{"id":"d5_q_009","domain":"D5","difficulty":"medium","question":"Which of the following is the BEST example of multi-factor authentication?","options":["Username and password","Password and security question","Smart card and PIN","Two different passwords"],"answer":2,"explanation":"Smart card = Type 2 (something you have). PIN = Type 1 (something you know). Two different factor types = MFA. Username/password, password/security question, and two passwords all use only Type 1 factors."},{"id":"d5_q_010","domain":"D5","difficulty":"hard","question":"An organization uses a centralized access control system. Which is the MOST significant disadvantage compared to a decentralized approach?","options":["All locations may have inconsistent security postures","Local admins can edit logs from their own facility","Single point of failure — if connectivity to head office is lost, authentication may fail","It is harder to enforce separation of duties centrally"],"answer":2,"explanation":"The main con of centralized access control is the dependency on connectivity to the central system. If the head office connection fails, doors/systems may be unable to authenticate. The other options are actually advantages of centralized systems."},{"id":"d5_q_011","domain":"D5","difficulty":"medium","question":"What is the PRIMARY security concern with Single Sign-On (SSO)?","options":["Users forget their single password more often","If one password is compromised, the attacker gains access to all systems the user can access","SSO requires more complex infrastructure than individual logins","SSO cannot work across different operating systems"],"answer":1,"explanation":"SSO's biggest risk: one compromised password = access to everything. This is why SSO passwords must meet strong requirements. The convenience benefit comes with significant concentration of risk."},{"id":"d5_q_012","domain":"D5","difficulty":"hard","question":"An organization needs to grant a contractor temporary access to a third-party collaboration tool without pre-creating accounts. Which technology BEST supports this?","options":["TACACS+ with dynamic provisioning","JIT (Just-In-Time) Provisioning using SAML","HOTP tokens assigned to the contractor","DAC where the contractor creates their own account"],"answer":1,"explanation":"JIT Provisioning allows users to log in to a third-party site on their first visit, where the JIT system automatically verifies the user and creates their account — most commonly using SAML. No pre-created accounts needed."},{"id":"d5_q_013","domain":"D5","difficulty":"medium","question":"Which of these is NOT a downside to enforcing software tokens on phones for multifactor authentication?","options":["Phones can be lost","SIM cloning attacks are possible","Being user-friendly","Phones have to be charged"],"answer":2,"explanation":"Being user-friendly is not a downside — it is an advantage. It encourages user adherence to security policies and reduces mistakes that can introduce vulnerabilities. The real downsides: a lost phone removes the authentication factor and could give an attacker access; a dead battery locks out the legitimate user at critical moments; and SIM cloning lets an attacker duplicate a SIM to intercept SMS-based OTPs, potentially gaining unauthorised access."},{"id":"d5_q_014","domain":"D5","difficulty":"medium","question":"Which of the following is the MOST secure method of authentication?","options":["Username and password","Biometric authentication","Token-based authentication","Shared secrets"],"answer":1,"explanation":"Biometric authentication (fingerprints, facial recognition, iris scans) is generally the most secure because biometric traits are unique to each individual and cannot be easily replicated, stolen, or shared. Usernames and passwords are highly vulnerable to guessing, phishing, and credential stuffing. Tokens can be lost or stolen. Shared secrets (security questions, shared passwords) are vulnerable to social engineering and, because they are shared, carry inherent exposure risk."},{"id":"d5_q_015","domain":"D5","difficulty":"easy","question":"When authenticating against an access control system, you present only your ID card. Which type of authentication are you using?","options":["Multi-factor authentication","Two-factor authentication","Single-factor authentication","Three-factor authentication"],"answer":2,"explanation":"Single-factor authentication (SFA) requires exactly one verification factor. Presenting an ID card is 'something you have' — one factor, so it qualifies as SFA. Two-factor authentication (2FA) requires two factors (e.g. a card + a PIN). Three-factor authentication adds a third (e.g. biometrics). Multi-factor authentication (MFA) is the umbrella term for any combination requiring more than one factor. Since only the ID card is presented here, none of the multi-factor options apply."},{"id":"d5_q_016","domain":"D5","difficulty":"easy","question":"In biometric authentication, which type of error is considered MORE serious and why?","options":["FRR (Type 1), because it locks out legitimate users and hurts productivity","FAR (Type 2), because it grants unauthorized users access to the system","CER, because it represents the worst-case error rate","Both errors are equally serious"],"answer":1,"explanation":"FAR (False Acceptance Rate) is the Type 2 error and is considered more serious because it grants unauthorized users access — a direct security breach. FRR (Type 1) is disruptive (legitimate users are rejected) but does not compromise security. A well-tuned system aims for the CER (Crossover Error Rate), where FAR and FRR balance each other."},{"id":"d5_q_017","domain":"D5","difficulty":"medium","question":"On a biometric sensitivity graph, what does the CER (Crossover Error Rate) represent?","options":["The error rate at maximum sensitivity settings","The point where FRR and FAR values are equal — the optimal balance point","The minimum acceptable FAR for a system to be considered secure","The percentage of scans that fail due to hardware malfunction"],"answer":1,"explanation":"The CER is the sensitivity setting where the False Rejection Rate (FRR) and the False Acceptance Rate (FAR) are exactly equal. It represents the ideal operating point — the best trade-off between rejecting legitimate users and accepting unauthorised ones. A lower CER generally indicates a more accurate biometric system."},{"id":"d5_q_018","domain":"D5","difficulty":"easy","question":"What is the PRIMARY purpose of a nonce in authentication protocols?","options":["To encrypt the password before it is transmitted","To prevent replay attacks by ensuring old communications cannot be reused","To increase the minimum required password length","To replace salts in password hashing functions"],"answer":1,"explanation":"A nonce (Number used ONCE) is a random or pseudo-random number issued in an authentication exchange. Its primary purpose is to prevent replay attacks — an attacker who captures an authenticated message cannot reuse it because the nonce value changes each time. Nonces are also used as initialisation vectors in cryptographic functions. They are similar to salts but serve a different purpose: salts protect stored passwords; nonces protect live authentication sessions."},{"id":"d5_q_019","domain":"D5","difficulty":"medium","question":"What is the PRIMARY purpose of clipping levels on a login system?","options":["To encrypt all failed login attempts in the audit log","To allow users unlimited login attempts before triggering an alert","To reduce administrative overhead while preventing brute-force guessing","To notify the user's manager after a single failed login attempt"],"answer":2,"explanation":"Clipping levels set a threshold for failed login attempts before locking the account (e.g. 3–5 attempts before a timed lockout or admin unlock). They serve two goals simultaneously: allowing legitimate users who mistyped their password to try again (reducing unnecessary help desk calls) while preventing automated brute-force password guessing. The account lockout then stops the attack and alerts administrators without overwhelming them with single-failure notifications."},{"id":"d5_q_020","domain":"D5","difficulty":"hard","question":"An attacker gains access to a system's file of cryptographic password hashes. Why does this allow them to bypass clipping levels?","options":["Clipping levels only apply to encrypted passwords, not hashes","The attacker can test candidate passwords offline against the stolen hashes without triggering the login system","Hash files are stored outside the operating system and are not protected by clipping levels","Clipping levels are automatically disabled when the hash file is accessed"],"answer":1,"explanation":"Clipping levels enforce lockout on the live authentication system — they count failed logins on the system itself. Once an attacker has the hash file, they can perform offline cracking: rapidly testing millions of candidate passwords against the hash values using their own hardware, completely bypassing the live login system and its clipping levels. This is why strong, salted hashing is critical — the hash file must be treated as sensitive data."},{"id":"d5_q_021","domain":"D5","difficulty":"easy","question":"In Discretionary Access Control (DAC), who determines who can access an object?","options":["A central security administrator using mandatory labels","The system based on the user's assigned role","A security policy enforced by the operating system kernel","The owner of the object, at their own discretion"],"answer":3,"explanation":"In DAC, the owner of the resource (object) decides who can access it and what permissions they have — access is granted at the owner's discretion. The owner can add or remove rights freely. DAC uses Discretionary ACLs (DACLs) based on user identity and is the default model in most operating systems. It prioritises flexibility and Availability, making it the least restrictive access control model."},{"id":"d5_q_022","domain":"D5","difficulty":"medium","question":"In a MAC (Mandatory Access Control) environment, what determines whether a subject can access an object?","options":["The subject's manager approving the access request","The object owner granting permission directly to the subject","The subject's department role as defined in an RBAC policy","The subject's clearance level must dominate (be equal to or higher than) the object's sensitivity label"],"answer":3,"explanation":"In MAC, every object has a sensitivity label (e.g. Confidential, Secret, Top Secret — Nuclear) and every subject has a clearance level. The subject's clearance must dominate (match or exceed) the object's label for access to be granted — the owner cannot override this. MAC is used in military and high-confidentiality environments because access decisions are policy-driven, not owner-driven. Higher clearance levels require more thorough background checks."},{"id":"d5_q_023","domain":"D5","difficulty":"medium","question":"An employee moves from Payroll to HR. Under RBAC, what is the CORRECT way to handle their access permissions?","options":["Add the HR role permissions on top of their existing Payroll permissions","Keep both role memberships active for 30 days then remove Payroll","Move the employee to the HR role group and remove them from the Payroll role group","Give the employee a temporary super-user account until their new permissions are confirmed"],"answer":2,"explanation":"Under RBAC, when an employee changes roles they must be moved to the new role group and removed from the old one. Adding the new role on top of the old one causes privilege/authorisation creep — the employee retains permissions they no longer need, violating least privilege. RBAC's strength is preventing creep by treating role membership as a transfer, not an accumulation. Properly implemented RBAC also enforces separation of duties."},{"id":"d5_q_024","domain":"D5","difficulty":"medium","question":"ABAC (Attribute-Based Access Control) considers three categories of attributes when making an access decision. Which of the following correctly identifies all three?","options":["User identity, application version, and network zone","Subject attributes, object attributes, and environmental conditions","Clearance level, role assignment, and job title","Location, time of day, and threat intelligence feed"],"answer":1,"explanation":"ABAC grants or denies access by evaluating: Subject attributes (e.g. user name, role, ID, clearance), Object attributes (e.g. resource name, owner, date of creation), and Environmental conditions (e.g. location, time of access, current threat level). This fine-grained approach makes ABAC very flexible. It is also called PBAC (Policy-Based AC) or CBAC (Claims-Based AC) and is expected to grow to 70% adoption in large enterprises."},{"id":"d5_q_025","domain":"D5","difficulty":"easy","question":"A user logs into a system with a username and password. Does this qualify as Multi-Factor Authentication (MFA)?","options":["Yes — it uses two separate inputs, which qualifies as two-factor","Yes — combining a username and password is always considered MFA","No — both a username and a password are 'something you know' (Type 1), so only one factor category is used","No — MFA requires at least four separate inputs"],"answer":2,"explanation":"MFA requires authentication from two or more DIFFERENT factor categories: something you know (Type 1), something you have (Type 2), or something you are (Type 3). A username is an identifier, and a password is something you know — both belong to the Type 1 category. Using two items from the same category does not constitute multi-factor authentication. A card + PIN or fingerprint + password qualifies because different categories are combined."},{"id":"d5_q_026","domain":"D5","difficulty":"medium","question":"Which of the following would NOT be part of a good identity and access provisioning lifecycle?","options":["Automated provisioning","Regular access reviews","Manual provisioning","Access certification"],"answer":2,"explanation":"Manual provisioning is not part of a good provisioning lifecycle. It is inefficient, error-prone, and does not scale in large organisations. It also lacks automatic audit trails, creating compliance risks. The other three are all essential components: automated provisioning increases efficiency and reduces human error; regular access reviews (recertification) ensure users still have appropriate rights and catch orphaned accounts; access certification validates that each user's rights are necessary and compliant."},{"id":"d5_q_027","domain":"D5","difficulty":"easy","question":"In identity and access provisioning, what do identities correspond to?","options":["Rights — the permissions granted to a user","Entities — a person, system, or anything uniquely distinguishable in a security context","Attributes — descriptors like username, email, or role","Objects — resources such as files, directories, or devices"],"answer":1,"explanation":"In identity and access provisioning, an identity is a representation of an entity in the system. An entity can be a person, a service account, a device, or any uniquely identifiable subject in a security context. Rights are what identities are granted. Attributes (name, email, role) describe an identity. Objects are the resources to which access is controlled."},{"id":"d5_q_028","domain":"D5","difficulty":"medium","question":"Which security principle states that a user must have a unique identifier and be authenticated before accessing a system or network?","options":["Principle of least privilege","Separation of duties","Single Sign-On (SSO)","Identity and Access Management (IAM)"],"answer":3,"explanation":"IAM (Identity and Access Management) is the principle and framework that ensures every user has a unique identifier and must be authenticated to access a system. IAM manages roles, access privileges, and the conditions under which access is granted or denied — essential for preventing unauthorised access to sensitive information. Least privilege restricts what access users have. Separation of duties divides tasks between users. SSO centralises authentication across systems but does not itself require a unique identifier per system."},{"id":"d5_q_029","domain":"D5","difficulty":"medium","question":"The Kerberos KDC (Key Distribution Center) is made up of which two components?","options":["KAS (Key Authentication Server) and SSO (Single Sign-On) Server","TGS (Ticket Granting Server) and PAS (Privilege Attribute Server)","AS (Authentication Server) and TGS (Ticket Granting Server)","AS (Authentication Server) and PKI (Public Key Infrastructure) Server"],"answer":2,"explanation":"The KDC (Key Distribution Center) is the heart of Kerberos and contains two logical components: the AS (Authentication Server), which verifies the user's identity and issues a TGT; and the TGS (Ticket Granting Server), which issues service-specific tickets when the client presents a valid TGT. Both reside inside the KDC. If the KDC is compromised, it is a single point of failure for all Kerberos-authenticated services."},{"id":"d5_q_030","domain":"D5","difficulty":"medium","question":"In step 1 of the Kerberos authentication flow, what does the client send to the Authentication Server (AS)?","options":["Username and an encrypted password hash","A TGT encrypted with the TGS secret key","Only the plaintext user ID","A session key encrypted with the user's secret key"],"answer":2,"explanation":"In step 1, the client sends only the plaintext user ID — no password is transmitted. The AS uses this to look up the user's secret key. The password never travels over the network, which is one of Kerberos' key security advantages. The response (step 2) is what the user's password is actually used for — to decrypt the session key that the AS sends back."},{"id":"d5_q_031","domain":"D5","difficulty":"hard","question":"In step 2 of the Kerberos flow, what does the Authentication Server return to the client?","options":["A plaintext service ticket for the requested server","A session key encrypted with the user's secret key, AND a TGT encrypted with the TGS secret key","A client/server session key and a timestamp","A direct encrypted channel to the target application server"],"answer":1,"explanation":"The AS returns two things: (1) a client/TGS session key encrypted with the user's secret key (the client decrypts this using their password-derived key), and (2) a TGT (Ticket Granting Ticket) encrypted with the TGS's own secret key (the client cannot read this). The client uses the session key to communicate with the TGS and presents the TGT as proof of identity — without needing to re-enter their password for every service."},{"id":"d5_q_032","domain":"D5","difficulty":"medium","question":"What is the purpose of the TGT (Ticket Granting Ticket) in Kerberos?","options":["To authenticate the client's plaintext identity to the Authentication Server","To encrypt the user's password before it is sent over the network","To allow the client to request service tickets from the TGS without re-entering their password","To establish a direct encrypted session between the client and the target server"],"answer":2,"explanation":"The TGT is issued by the AS after successful authentication and acts as a time-limited proof that the user has already authenticated. The client presents the TGT to the TGS whenever it needs access to a service, receiving service-specific tickets without the user having to re-enter their password. The TGT itself is encrypted with the TGS's secret key, so the client cannot read or forge it — it simply passes it through."},{"id":"d5_q_033","domain":"D5","difficulty":"hard","question":"In the final step (step 6) of Kerberos, the server sends a timestamp authenticated with the Client/Server Session Key. What is the PRIMARY purpose of this?","options":["To tell the client the server's current time zone for clock synchronisation","To prove the server successfully decrypted the session key, completing mutual authentication","To set the expiry time on the client's TGT","To provide the client with a new TGT for future sessions"],"answer":1,"explanation":"In step 6, the server encrypts a timestamp with the shared Client/Server Session Key and sends it back to the client. Because only a server that successfully decrypted the client's ticket (step 5) would know the session key, this proves the server's identity — completing mutual authentication. Both sides have now verified each other. Kerberos uses timestamps throughout to prevent replay attacks (which is also why clock synchronisation across all Kerberos participants is critical)."},{"id":"d5_q_034","domain":"D5","difficulty":"medium","question":"Which of the following is the PRIMARY function of the Ticket Granting Server (TGS) in Kerberos?","options":["To encrypt all data transmitted over the network","To authenticate users to the network by verifying their credentials","To manage the database of users and their associated secret keys","To issue service tickets that authorise access to specific network resources"],"answer":3,"explanation":"The TGS issues service tickets. Once a user has been authenticated by the AS and holds a TGT, they present that TGT to the TGS to request a ticket for a specific service or resource. The TGS validates the TGT and issues the appropriate service ticket, acting as an electronic pass for that resource. Authentication is the AS's job; key database management belongs to the KDC/AS; data encryption is handled by the network services themselves."},{"id":"d5_q_035","domain":"D5","difficulty":"easy","question":"Which of the following BEST describes the PRIMARY function of RADIUS?","options":["To provide centralised Authentication, Authorisation, and Accounting (AAA) management for remote users","To encrypt all network traffic between a client and a server","To monitor and report on overall network usage and performance","To store and manage user credentials in a central directory"],"answer":0,"explanation":"RADIUS (Remote Authentication Dial-In User Service) is a networking protocol that provides centralised AAA management: it authenticates remote users, authorises what they can access, and accounts for their session activity. While RADIUS does encrypt passwords in transit, full traffic encryption is the role of protocols like TLS or IPSec. Comprehensive network monitoring belongs to NPMD tools. The actual storage of credentials typically lives in a separate directory or database — RADIUS authenticates against it rather than managing it."},{"id":"d5_q_036","domain":"D5","difficulty":"medium","question":"Which of the following is the FIRST step in the Kerberos authentication process?","options":["The client encrypts the request with the server's secret key","The client sends a request to the KDC asking for a Ticket Granting Ticket (TGT)","The KDC decrypts the client's request and generates a session key","The client decrypts the KDC's response to obtain the TGT"],"answer":1,"explanation":"The first step is always the client sending a TGT request to the KDC (specifically to the AS component) using only the plaintext user ID. Nothing is encrypted with the server's key at this stage. The KDC cannot generate a session key until it receives the request. And the client cannot decrypt a response until the AS has first processed the request and sent one. All subsequent steps — session key delivery, TGT use, and service ticket exchange — follow from this initial request."},{"id":"d5_q_037","domain":"D5","difficulty":"medium","question":"Jane is manually reviewing logs, but the organisation has grown so much that there are too many logs to review manually in a timely fashion. Which tool would BEST help her?","options":["IPS (Intrusion Prevention System)","IDS (Intrusion Detection System)","SIEM (Security Information and Event Management)","FIDI"],"answer":2,"explanation":"A SIEM aggregates, correlates, and analyses log data from across the IT infrastructure in real time, automating much of the manual review process and generating prioritised security alerts. An IPS blocks threats in real time but does not help with log review. An IDS detects and logs events but does not offer the aggregation and correlation that a SIEM provides. FIDI is not a recognised cybersecurity acronym."},{"id":"d5_q_038","domain":"D5","difficulty":"medium","question":"Your bank sent a one-time number by email when you first logged in. After completing that step, you have not been asked for it again on the same device. Why?","options":["A cookie was placed on your computer — that cookie combined with your username and password constitutes multi-factor authentication","The bank now recognises you and single-factor authentication is sufficient","The process is too cumbersome, so the bank waived MFA for convenience","It is salting — a one-time operation applied to your stored password"],"answer":0,"explanation":"After the initial verification, the bank places a cookie on your device. That cookie represents 'something you have' (your trusted device), and your password is 'something you know'. Together they form MFA. Recognising a returning user does not lower the security requirement. User convenience alone is never a reason to drop MFA in banking. Salting is a password-storage technique unrelated to session authentication."},{"id":"d5_q_039","domain":"D5","difficulty":"medium","question":"An attacker is brute-forcing a user's password. Your organisation has not yet implemented clipping levels. Which countermeasure would BEST slow down the attack?","options":["Deploying rainbow tables to analyse the attacker's dictionary","Enforcing a minimum password age policy","Requiring password changes every 30 days","Implementing key stretching"],"answer":3,"explanation":"Key stretching applies a hash function repeatedly to a password (e.g. bcrypt, PBKDF2), making each password guess computationally expensive. This directly slows brute-force attacks. Rainbow tables are an attacker tool, not a defence. Minimum password age and forced rotation policies address password reuse — they do not prevent a brute-force attack in progress."},{"id":"d5_q_040","domain":"D5","difficulty":"hard","question":"Which of the following countermeasures is LEAST effective specifically against brute-force attacks?","options":["Key stretching","Salting","Limiting the number of incorrect login attempts","Requiring strong, complex passwords"],"answer":1,"explanation":"Salting adds random data to passwords before hashing, which defeats pre-computed rainbow table attacks — but it does not slow down brute force, because an attacker testing live guesses simply hashes each guess with the known salt. Key stretching makes each guess computationally expensive. Login attempt limits stop online brute force directly. Strong passwords enlarge the search space, making brute force take far longer."},{"id":"d5_q_041","domain":"D5","difficulty":"easy","question":"PINs, passwords, and passphrases are all classified as which type of authentication?","options":["Type 3 — something you are","Type 2 — something you have","Type 5 — a non-standard advanced factor","Type 1 — something you know"],"answer":3,"explanation":"Type 1 authentication is 'something you know' — knowledge-based credentials the user must remember. PINs, passwords, and passphrases all fall into this category. Type 2 is 'something you have' (token, smart card). Type 3 is 'something you are' (biometrics). There is no standard Type 5 in the authentication factor model."},{"id":"d5_q_042","domain":"D5","difficulty":"medium","question":"We want to protect against rainbow table attacks by implementing salting. What are rainbow tables ma
