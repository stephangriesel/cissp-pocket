ence (EMI) and suffer less attenuation than copper cables."},{"id":"d4_q_054","domain":"D4","question":"Another term for DMZ (Demilitarized Zone) in network security is:","options":["Screened subnet","Perimeter router","Bastion host","Air-gapped network"],"answer":0,"explanation":"A DMZ is also called a screened subnet. It sits between the trusted internal network and the untrusted internet, typically containing public-facing servers (web, email, DNS). Traffic is filtered by firewalls on both sides."},{"id":"d4_q_055","domain":"D4","question":"Which wireless security protocol is based on 802.11i, uses AES encryption with CCMP, and is the most secure?","options":["WPA2","WPA","WEP","TKIP"],"answer":0,"explanation":"WPA2 is based on 802.11i and uses AES with CCMP — the most secure Wi-Fi encryption standard. WPA uses TKIP (RC4-based). WEP is broken and crackable in seconds. TKIP is a protocol used by WPA, not a standalone standard."},{"id":"d4_q_056","domain":"D4","question":"WPA2 Enterprise mode uses which additional authentication mechanism?","options":["RADIUS (Remote Authentication Dial-In User Service)","LDAP over SSL (LDAP-S)","Pre-shared keys (PSK)","Kerberos ticket-based authentication"],"answer":0,"explanation":"WPA2 Enterprise uses RADIUS for centralised authentication — each user authenticates individually. WPA2 Personal uses a pre-shared key (PSK). RADIUS also includes account lockout if a password-cracker is detected."},{"id":"d4_q_057","domain":"D4","question":"Which port does secure LDAP (LDAP-S) use, and how does it differ from standard LDAP?","options":["TCP 636 — LDAP-S encrypts traffic over SSL/TLS; standard LDAP uses TCP 389 and is unencrypted","TCP 389 — LDAP-S uses the same port but adds a password; LDAP is anonymous","TCP 445 — LDAP-S is the secure version used only by Active Directory","UDP 636 — LDAP-S uses UDP for faster directory queries"],"answer":0,"explanation":"Standard LDAP uses TCP 389 and transmits data unencrypted. LDAP-S (LDAP Secure) runs over SSL/TLS on TCP 636, encrypting the directory queries and results. OpenLDAP stores passwords in cleartext — another reason to use LDAP-S."},{"id":"d4_q_058","domain":"D4","question":"Which email security protocol provides signing AND encryption of email messages and can also be used as part of an SSO solution?","options":["S/MIME (Secure/Multipurpose Internet Mail Extensions)","DKIM (DomainKeys Identified Mail)","PEM (Privacy Enhanced Mail)","MOSS (MIME Object Security Services)"],"answer":0,"explanation":"S/MIME provides signed and encrypted emails and can integrate with SSO. DKIM is a domain validation tool for email authenticity (not full encryption). PEM and MOSS both provide authentication, confidentiality, integrity, and nonrepudiation but are older standards."},{"id":"d4_q_059","domain":"D4","question":"Which LAN device operates at the Physical layer (L1) and simply amplifies signals to extend network reach?","options":["Repeater","Bridge","Switch","Router"],"answer":0,"explanation":"Repeaters (and hubs, which are multi-port repeaters) operate at Layer 1. They amplify the signal but have no intelligence — they repeat everything. Bridges and switches operate at L2; routers at L3. Hubs = multi-port repeaters = physical layer."},{"id":"d4_q_060","domain":"D4","question":"What is the data transmission speed of a T-1 line?","options":["1.544 Mbps","44.736 Mbps","155 Mbps","64 Kbps"],"answer":0,"explanation":"T-1 = 1.544 Mbps. T-3 = 44.736 Mbps (approximately 45 Mbps). ATM = 155 Mbps. ISDN = 64 or 128 Kbps. These are commonly tested WAN speed values on the CISSP exam."},{"id":"d4_q_061","domain":"D4","question":"Data backups address which of the following security properties?","options":["Availability, integrity, and recovery — but NOT confidentiality","Confidentiality, integrity, and availability equally","Confidentiality and availability only","Integrity and nonrepudiation only"],"answer":0,"explanation":"Backups protect availability (data can be restored), integrity (clean copy preserved), and support recovery. They do NOT address confidentiality — an unencrypted backup can expose data. Encrypting backups is a separate control needed to protect confidentiality."},{"id":"d4_q_062","domain":"D4","question":"Which network device forwards data to ALL other network segments if the destination is not on the local segment, and operates at Layer 2 without IP addressing?","options":["Bridge","Router","Switch","Gateway"],"answer":0,"explanation":"Bridges operate at L2 (Data Link) using MAC addresses. They forward frames to all other segments when the destination is not local — they do not use IP addressing. Switches (also L2) are smarter and send only to the specific destination port. Routers (L3) use IP addresses."},{"id":"d7_q_173","domain":"D7","question":"Which recovery site is similar to a hot site but uses backup-restored data instead of real-time replication, with a failover time of 4–24+ hours?","options":["Warm site","Hot site","Cold site","Reciprocal agreement site"],"answer":0,"explanation":"A warm site has a full data center (UPS, HVAC, ISPs, generators) but data is restored from backups rather than real-time. Manual failover takes 4–24+ hours. Hot sites mirror data in real/near-real time and can fail over in minutes. Cold sites have no hardware or data at all."},{"id":"d7_q_174","domain":"D7","question":"Which disaster recovery site type has full data center infrastructure but NO hardware or backups pre-installed, requiring systems to be acquired and configured from scratch?","options":["Cold site","Warm site","Hot site","Reciprocal agreement site"],"answer":0,"explanation":"A cold site is the cheapest recovery option — it has redundant power, HVAC, and ISP connections, but no hardware or backups. Systems must be acquired, configured, and loaded before operations can resume. Recovery can take weeks, making it the longest option."},{"id":"d7_q_175","domain":"D7","question":"An organisation signs a contract with a partner company to provide mutual data centre space during a disaster. What type of recovery site is this?","options":["Reciprocal agreement site","Cold site","Warm site","Mobile recovery site"],"answer":0,"explanation":"A reciprocal agreement site is a contractual arrangement between two organisations to provide space in each other's data centres during a disaster. Space can be promised floor space or dedicated racks, but those racks must be fully segmented from the host organisation's network."},{"id":"d7_q_176","domain":"D7","question":"Which of the following correctly ranks disaster recovery site types from CHEAPEST to MOST EXPENSIVE?","options":["Cold site → Warm site → Hot site","Hot site → Warm site → Cold site","Warm site → Cold site → Hot site","Reciprocal agreement → Cold site → Hot site"],"answer":0,"explanation":"Cost scales with readiness: Cold (cheapest — no hardware/data, weeks to recover) → Warm (mid-range — hardware ready, backups restored, 4–24+ hrs) → Hot (most expensive — real-time data mirror, minutes to fail over). Higher cost = faster recovery."},{"id":"d7_q_177","domain":"D7","question":"A warm site recovery involves which of the following actions to restore operations?","options":["Manually failing traffic over and restoring data from backups — taking 4 to 24+ hours","Automatic failover with real-time data synchronisation in under 1 hour","Acquiring and configuring all hardware from scratch before any data can be loaded","Activating a contractual space-sharing arrangement with a partner organisation"],"answer":0,"explanation":"Warm sites require manual failover — traffic must be redirected and data must be restored from backups. This process typically takes 4–24+ hours. Hot sites automate failover with real-time data. Cold sites require full hardware acquisition before recovery can begin."},{"id":"d7_q_178","domain":"D7","question":"Which recovery site is a complete identical copy of the production environment, receives real-time data, fails over automatically, and end users never notice the outage?","options":["Redundant site","Hot site","Warm site","Cold site"],"answer":0,"explanation":"A redundant site is a complete mirror of production — identical hardware, real-time data replication, automatic failover, and staffed. End users experience no disruption. It is the most expensive option. It must be geographically distant to survive regional disasters."},{"id":"d7_q_179","domain":"D7","question":"Why must a redundant recovery site be geographically distant from the primary site?","options":["To ensure it is not affected by the same regional disaster (flood, earthquake, power outage) as the primary site","To reduce latency for real-time data replication","To comply with data sovereignty laws that require cross-border data storage","To lower the cost of the redundant infrastructure"],"answer":0,"explanation":"Geographic separation protects against regional disasters such as floods, earthquakes, or widespread power outages that could take out both sites simultaneously. The redundant site must also be staffed to operate independently if the primary site is completely unavailable."},{"id":"d7_q_180","domain":"D7","question":"How does a hot site differ from a redundant site?","options":["A hot site only hosts critical applications on lower-spec systems and may require manual failover (under 1 hour); a redundant site is a full identical mirror with automatic failover","A hot site has no pre-installed hardware; a redundant site has identical hardware to production","A hot site uses backup-restored data; a redundant site uses real-time replication","A hot site is cheaper than a warm site; a redundant site is cheaper than a hot site"],"answer":0,"explanation":"A redundant site is a full identical copy with automatic failover — end users never notice. A hot site hosts only critical systems (often on lower-spec hardware), has near/real-time data copies, but may need manual failover — though it can switch over within an hour."},{"id":"d7_q_181","domain":"D7","question":"Which recovery site type is the MOST expensive and provides automatic failover that end users will never notice?","options":["Redundant site","Hot site","Warm site","Reciprocal agreement site"],"answer":0,"explanation":"A redundant site is by far the most expensive option — it requires a complete duplicate of all production infrastructure, real-time data replication, staffing, and full power/HVAC/connectivity. The investment is justified by zero noticeable downtime during failover."},{"id":"d7_q_182","domain":"D7","question":"Which statement best describes a hot site's data replication and failover characteristics?","options":["Near or real-time data copies; manual failover possible but full switch takes an hour or less","Real-time data mirror with fully automatic failover in seconds","Backup-restored data; manual failover taking 4–24+ hours","No data pre-loaded; all systems must be configured before failover begins"],"answer":0,"explanation":"Hot sites maintain near or real-time copies of data and can complete a full failover in an hour or less, sometimes with manual steps. This distinguishes them from redundant sites (fully automatic, zero-notice failover) and warm sites (backup restoration, 4–24+ hours)."},{"id":"d7_q_183","domain":"D7","question":"Which recovery site type is essentially a data centre on wheels — a container or trailer that can be transported to any location?","options":["Mobile site","Cold site","Subscription/cloud site","Warm site"],"answer":0,"explanation":"A mobile site is a fully equipped data centre in a container or trailer — including HVAC, fire suppression, and physical security. Some are self-contained with generators and satellite internet; others require local power and internet hookups. It is the only recovery site type that is NOT at a fixed location."},{"id":"d7_q_184","domain":"D7","question":"Which recovery site type is the ONLY one with a 'Not Fixed' location according to the standard comparison matrix?","options":["Mobile site","Cold site","Warm site","Mirrored site"],"answer":0,"explanation":"The mobile site is the only recovery option that is not geographically fixed — it can be driven or shipped to wherever it is needed. All other site types (cold, warm, hot, mirrored) are fixed locations."},{"id":"d7_q_185","domain":"D7","question":"How does a subscription/cloud recovery site work?","options":["An organisation pays a provider to maintain a minimal or full replica of their environment; the provider spins it up and applies latest backups when contacted during a disaster","The organisation builds and maintains its own off-site data centre funded through a subscription model","Two organisations share costs of a single data centre and take turns using it during disasters","A cloud provider automatically fails over production traffic with no human intervention required"],"answer":0,"explanation":"With a subscription/cloud site, a third-party provider holds fully built systems with the organisation's applications and receives regular backups. When disaster strikes, the organisation contacts the provider, who spins up the systems and restores the latest backup. Speed and capacity depend on the SLA tier purchased."},{"id":"d7_q_186","domain":"D7","question":"According to the recovery site comparison matrix, which site type has ZERO setup time and full hardware and telecommunications?","options":["Mirrored site","Hot site","Redundant site","Subscription/cloud site"],"answer":0,"explanation":"A mirrored site has full hardware, full telecommunications, zero setup time, high cost, and a fixed location. It is essentially identical to a redundant site — always running in parallel — which is why setup time is zero. Hot sites have short (not zero) setup time."},{"id":"d7_q_187","domain":"D7","question":"A cold site has which hardware/equipment and telecommunications characteristics in the recovery site comparison matrix?","options":["None for both hardware and telecommunications","Partial hardware, partial/full telecommunications","Full hardware, full telecommunications","Dependent hardware, dependent telecommunications"],"answer":0,"explanation":"A cold site has NO pre-installed hardware and NO telecommunications — it is just a physical space with power and HVAC. Everything must be acquired and configured from scratch. This gives it the lowest cost but the longest setup time (weeks or more)."},{"id":"d7_q_188","domain":"D7","question":"What is the purpose of a COOP (Continuity of Operations Plan) and what is its typical operational timeframe?","options":["To keep the organisation functioning — even at reduced capacity — during a disaster, covering staff relocation to alternate sites for up to 30 days","To restore all IT systems to full capacity within 72 hours of a declared disaster","To document the evacuation procedures and safety drills for staff during physical emergencies","To outline how the organisation responds specifically to cyber incidents such as DDoS or ransomware"],"answer":0,"explanation":"COOP addresses how the organisation continues operations during a disaster — getting staff to alternate sites, maintaining essential functions at reduced capacity, and sustaining operations for up to 30 days. It is broader than DRP (which focuses on IT recovery) and sits within the overall BCP."},{"id":"d7_q_189","domain":"D7","question":"Which plan focuses specifically on protecting facilities, staff, and the environment during physical disasters such as fires, hurricanes, and terrorism?","options":["OEP (Occupant Emergency Plan)","COOP (Continuity of Operations Plan)","DRP (Disaster Recovery Plan)","Cyber Incident Response Plan"],"answer":0,"explanation":"The OEP covers physical safety and evacuation — how staff evacuate, frequency of drills, and training requirements. It addresses events like fires, hurricanes, floods, criminal attacks, and terrorism. COOP addresses operational continuity; DRP addresses IT recovery; Cyber IRP addresses cyber events."},{"id":"d7_q_190","domain":"D7","question":"What is the relationship between the BCP and plans such as COOP, the Cyber Incident Response Plan, and the OEP?","options":["The BCP is the overarching plan that contains and encompasses all other plans including COOP, OEP, and the Cyber Incident Response Plan","The BCP and COOP are the same plan — the other plans are independent documents","The DRP is the overarching plan; the BCP, COOP, and OEP are sub-components of the DRP","Each plan is fully independent with no hierarchical relationship between them"],"answer":0,"explanation":"The BCP is the overarching framework — it contains and coordinates all sub-plans including COOP (operational continuity), DRP (IT/system recovery), OEP (occupant safety), and the Cyber Incident Response Plan. Think of BCP as the parent document."},{"id":"d7_q_191","domain":"D7","question":"Which plan addresses how an organisation responds to cyber events such as DDoS attacks, worms, and viruses — and may be part of the DRP or standalone?","options":["Cyber Incident Response Plan","OEP (Occupant Emergency Plan)","COOP (Continuity of Operations Plan)","BIA (Business Impact Analysis)"],"answer":0,"explanation":"The Cyber Incident Response Plan defines how the organisation detects, responds to, and recovers from cyber events like DDoS attacks, malware outbreaks, and data breaches. It can be incorporated into the DRP or maintained as a standalone document, depending on the organisation's structure."},{"id":"d7_q_192","domain":"D7","question":"Which DRP test type involves team members quickly reviewing the plan to identify glaring omissions, gaps, or missing sections?","options":["DRP Review","Read-Through (Checklist)","Walk/Talk-through (Tabletop)","Full Interruption Test"],"answer":0,"explanation":"A DRP Review is a quick internal scan by DRP team members looking for obvious gaps or missing sections. It is the least thorough simulated test. A Read-Through uses a checklist; a Tabletop involves discussion among managers; a Full Interruption test actually shuts down production systems."},{"id":"d7_q_193","domain":"D7","question":"Which DRP test type has managers and functional area representatives work through a checklist of components needed for the recovery process?","options":["Read-Through (Checklist)","DRP Review","Walk/Talk-through (Tabletop)","Parallel Test"],"answer":0,"explanation":"A Read-Through (Checklist) test has managers and functional area leads systematically check that all required components for recovery are accounted for in the plan. It is more structured than a DRP Review but less interactive than a Tabletop exercise."},{"id":"d7_q_194","domain":"D7","question":"Which DRP test type involves a group of managers and critical personnel sitting down together to talk through the recovery process, and can expose gaps or technical inaccuracies?","options":["Walk/Talk-through (Tabletop or Structured Walkthrough)","DRP Review","Read-Through (Checklist)","Simulation Test"],"answer":0,"explanation":"A Tabletop (Walk/Talk-through or Structured Walkthrough) brings together managers and key personnel to verbally walk through the recovery scenario. The group discussion often surfaces gaps, omissions, and technical inaccuracies that a solo review or checklist would miss."},{"id":"d7_q_195","domain":"D7","question":"Why are BCP and DRP plans referred to as 'living documents'?","options":["Because they must be continually reviewed, tested, and improved to remain accurate and complete as the organisation evolves","Because they are stored in a shared document system accessible to all staff at any time","Because they are only valid for 12 months before a completely new plan must be written","Because they describe real-time operations rather than hypothetical disaster scenarios"],"answer":0,"explanation":"BCP and DRP plans are called living documents because organisations, systems, and threats change over time. Regular testing (reviews, checklists, tabletops, simulations) identifies gaps and inaccuracies that must be corrected to keep the plan effective. A plan that is never tested may fail when it is actually needed."},{"id":"d7_q_196","domain":"D7","question":"What distinguishes a Simulation Test (Walkthrough Drill) from a Walk/Talk-through (Tabletop) test?","options":["In a Simulation Test the team actively simulates a disaster scenario and each team responds with their actual DRP role; a Tabletop is a discussion only","A Simulation Test only reviews the written plan for gaps; a Tabletop involves physically failing over systems","They are the same test — 'Simulation' and 'Tabletop' are interchangeable terms","A Tabletop uses live systems; a Simulation Test uses only documentation"],"answer":0,"explanation":"These are often confused but are distinct. A Tabletop (Walk/Talk-through) is a discussion where participants talk through the recovery process. A Simulation Test goes further — a disaster scenario is actively simulated and each team responds by executing their assigned DRP tasks, without interrupting live systems."},{"id":"d7_q_197","domain":"D7","question":"Which DRP physical test brings critical systems up at a secondary site using backups WHILE the primary site remains fully operational, then compares the two?","options":["Parallel Processing test","Partial Interruption test","Full Interruption test","Simulation Test (Walkthrough Drill)"],"answer":0,"explanation":"Parallel Processing runs recovery systems at the secondary site alongside the still-running primary site. After loading the last daily backup, both environments are compared. It is safe because production is never interrupted, but it requires duplicate resources and does not test actual failover."},{"id":"d7_q_198","domain":"D7","question":"Which DRP physical test interrupts a SINGLE application and fails it over to the secondary facility — typically performed off hours?","options":["Partial Interruption test","Full Interruption test","Parallel Processing test","DRP Review"],"answer":0,"explanation":"A Partial Interruption test fails over one application at a time to secondary facilities, typically off hours to minimise business impact. It is a more targeted and lower-risk live test than Full Interruption, which fails over all applications simultaneously."},{"id":"d7_q_199","domain":"D7","question":"Which DRP test type interrupts ALL applications and fails them over to secondary facilities, and is always performed off hours?","options":["Full Interruption test","Partial Interruption test","Parallel Processing test","Simulation Test (Walkthrough Drill)"],"answer":0,"explanation":"A Full Interruption test is the most thorough and most disruptive physical test — all applications are failed over to secondary facilities. It is always done off hours and is mostly performed by fully redundant organisations that can absorb the risk of a complete production failover."},{"id":"d7_q_200","domain":"D7","question":"What is the correct order of DRP tests from LEAST to MOST disruptive?","options":["DRP Review → Read-Through → Tabletop → Simulation → Parallel Processing → Partial Interruption → Full Interruption","Full Interruption → Partial Interruption → Parallel Processing → Simulation → Tabletop → Read-Through → DRP Review","Tabletop → DRP Review → Simulation → Read-Through → Parallel Processing → Full Interruption → Partial Interruption","Read-Through → Parallel Processing → Tabletop → Simulation → DRP Review → Partial Interruption → Full Interruption"],"answer":0,"explanation":"Tests escalate in disruption: DRP Review (quick scan) → Read-Through/Checklist → Tabletop/Walk-through (discussion) → Simulation (scenario response, no live systems) → Parallel Processing (secondary site runs alongside primary) → Partial Interruption (one app failed over, off hours) → Full Interruption (all apps failed over, always off hours)."},{"id":"d7_q_201","domain":"D7","question":"How often should BCP and DRP plans be formally reviewed and updated at a minimum?","options":["At least every 12 months","At least every 6 months","At least every 24 months","Only after a disaster has occurred"],"answer":0,"explanation":"Plans must be reviewed and updated at least every 12 months as a minimum baseline. They should also be updated immediately after any major organisational change — such as an acquisition, major system change, leadership change, or a disaster that revealed gaps."},{"id":"d7_q_202","domain":"D7","question":"Which of the following would trigger an out-of-cycle update to a BCP or DRP — outside the regular annual review?","options":["A significant change in senior leadership","The annual review date arriving","A minor software patch applied to a non-critical system","A scheduled penetration test with no findings"],"answer":0,"explanation":"Major organisational changes require immediate plan updates: acquiring or splitting a company, major system changes (new backup solution, new IP scheme), discovering gaps after a real disaster, or significant senior leadership turnover. Routine patches or clean pen tests do not trigger a plan revision."},{"id":"d7_q_203","domain":"D7","question":"What must happen to old copies of a BCP or DRP when an updated version is distributed?","options":["Older copies must be retrieved and destroyed; only current versions are distributed","Older copies are archived securely for historical reference","Older copies remain in circulation alongside the updated version","Older copies are returned to the plan owner and stored offsite"],"answer":0,"explanation":"When a plan is updated, ALL older copies must be retrieved and destroyed. Stale copies create serious risk — staff could follow outdated procedures during a real disaster. Only the current, approved version should be in circulation."},{"id":"d7_q_204","domain":"D7","question":"Why is a real disaster considered a trigger for updating a BCP or DRP?","options":["Because an actual disaster exposes real gaps, inaccuracies, and untested assumptions that simulated tests may have missed","Because regulations require a new plan to be written after every declared disaster","Because the old plan is automatically invalidated once it has been used","Because insurance providers require a revised plan before processing a claim"],"answer":0,"explanation":"A real disaster is the ultimate test of a plan. Gaps, missing steps, wrong contact details, or untested assumptions that survived all simulated tests often surface during an actual event. The post-disaster lessons learned should be immediately incorporated into the updated plan."},{"id":"d7_q_205","domain":"D7","question":"Your organisation needs a DR site that allows critical applications to be restored within 4 hours to 2–3 days. Which site type fits this requirement?","options":["Warm site","Hot site","Cold site","Offsite backup"],"answer":0,"explanation":"A warm site has hardware and connectivity pre-established but requires time to restore backups and bring systems online — typically 4 hours to 2–3 days. The key missing component vs a hot site is data migration, which must still be completed. Hot sites recover in minutes to an hour; cold sites take days to weeks."},{"id":"d7_q_206","domain":"D7","question":"Which document would staff sign to formally acknowledge they understand and agree with their responsibilities during a disaster — and is generally NOT legally binding?","options":["MOU (Memorandum of Understanding)","Contract","Waiver","Declaration"],"answer":0,"explanation":"An MOU is a formal agreement documenting mutual understanding of responsibilities. In a DR context, staff sign it to acknowledge their assigned roles during a disaster. Importantly, an MOU is generally NOT legally binding — this distinguishes it from a contract. A waiver releases liability; a declaration is a unilateral statement."},{"id":"d7_q_207","domain":"D7","question":"Which of the following represents the HIGHEST level of protection for a disaster recovery site?","options":["Hot site — fully equipped and operational, enabling immediate continuation of business","Warm site — partial infrastructure in place but not immediately operational","Cold site — physical space only, no operational equipment","Mobile site — portable and deployable but requires setup time"],"answer":0,"explanation":"A hot site provides the highest level of DR protection — it is a fully operational mirror of the production environment with near-real-time data, allowing business operations to continue almost immediately after a failover. It is also the most expensive option after a fully redundant/mirrored site."},{"id":"d7_q_208","domain":"D7","question":"A DRP includes technology and countermeasures for ISP outages. Which category of disaster is being addressed?","options":["Environmental","Natural","Man-made","All of the above"],"answer":0,"explanation":"Environmental disasters relate to the operational environment — power grids, internet connectivity, hardware, software infrastructure. ISP outages result from failures in this environment rather than natural forces or deliberate human actions, making 'environmental' the correct category."},{"id":"d7_q_209","domain":"D7","question":"During digital forensics on a compromised hard drive, which method is used to verify that data has not been altered since it was seized?","options":["Hashing","Symmetric encryption","Asymmetric encryption","PKI"],"answer":0,"explanation":"A hash value is calculated on the original data and recalculated during analysis. If both match, the data has not been changed. This ensures forensic integrity. Encryption secures data; PKI manages certificates — neither verifies data integrity in forensic analysis."},{"id":"d7_q_210","domain":"D7","question":"When implementing RAID 5, which type of disk pool is being used?","options":["Striping with parity","Mirroring","Striping only","Mirroring with parity"],"answer":0,"explanation":"RAID 5 distributes data AND parity information across all drives. If one drive fails, the parity allows reconstruction of the lost data. RAID 0 = striping only (no fault tolerance). RAID 1 = mirroring. There is no standard 'mirroring with parity' — RAID 10 combines mirroring and striping but not parity."},{"id":"d7_q_211","domain":"D7","question":"You run full monthly backups and incremental daily backups at midnight. A system is lost at 20:00 (8PM). How much data is lost?","options":["20 hours","40 hours","18 hours","Depends on when the backup finished"],"answer":0,"explanation":"The last incremental backup ran at midnight — 20 hours before the 20:00 failure. All data created or changed in those 20 hours is lost. The monthly full backup is irrelevant because the daily incremental is more recent."},{"id":"d7_q_212","domain":"D7","question":"What is the minimum number of disks required to implement disk mirroring (RAID 1)?","options":["2","1","3","4"],"answer":0,"explanation":"RAID 1 (mirroring) requires at least 2 disks — data is written identically to both simultaneously. If one fails, the other continues operating with an exact copy. Three or four disks allow more complex configurations (RAID 10) but are not the minimum for basic mirroring."},{"id":"d7_q_213","domain":"D7","question":"What is the MAIN purpose of server clustering?","options":["Fault tolerance","Load balancing","Traffic distribution","Easier configuration"],"answer":0,"explanation":"Server clustering primarily provides fault tolerance — if one server in the cluster fails, another takes over seamlessly. Load balancing and traffic distribution are secondary benefits but not the primary goal. Clustering actually increases configuration complexity."},{"id":"d7_q_214","domain":"D7","question":"In incident management, which type of event can a redundant geographically distant site MOST effectively mitigate?","options":["Disasters","Incidents","Emergencies","Events"],"answer":0,"explanation":"A geographically distant redundant site is designed to survive disasters — regional events like floods, earthquakes, or major infrastructure failures that destroy or render the primary site unusable. Incidents, emergencies, and events are narrower in scope and typically handled at the primary site."},{"id":"d7_q_215","domain":"D7","question":"Which two backup types should NOT be used together in the same backup strategy?","options":["Differential and incremental","Full and incremental","Incremental and copy","Differential and copy"],"answer":0,"explanation":"Differential and incremental serve overlapping purposes and combining them creates confusion during restoration — inconsistent archive bit handling leads to uncertainty about what was actually backed up. Full+incremental and differential+copy are compatible combinations."},{"id":"d7_q_216","domain":"D7","question":"During digital forensics on a compromised hard drive, which tool prevents any changes from being written to the evidence drive?","options":["Write blocker","RAID array","Access control list","BCP documentation"],"answer":0,"explanation":"A write blocker (hardware or software) enforces read-only access to the evidence drive, ensuring forensic analysis cannot alter the original data. Maintaining data integrity is critical for evidence to be admissible in court. RAID is a storage technology; ACLs control network access."},{"id":"d7_q_217","domain":"D7","question":"In IT security, what does the term 'event' mean?","options":["Any observable change in a system — neither inherently positive nor negative","A triggered warning when a predefined threshold is exceeded","A system crash or service failure","An active cyberattack in progress"],"answer":0,"explanation":"An event is simply any observable occurrence in a system or network — a user login, a file access, a configuration change. Events are neutral; they may or may not require further action. Not all events are alerts, crashes, or attacks — those are specific types of events."},{"id":"d7_q_218","domain":"D7","question":"What is the PRIMARY advantage of incremental backups over differential backups?","options":["Faster backup time — only changes since the last backup of ANY type are saved","Faster restore time — fewer backup sets are needed to restore","The ability to exclude specific directories","Including all directories regardless of change"],"answer":0,"explanation":"Incremental backups only save changes since the last backup (full or incremental), resulting in smaller and faster backups. However, restore is SLOWER — you need the last full backup plus every incremental since. Differential restores are faster (only full + last diff) but backups grow larger over time."},{"id":"d7_q_219","domain":"D7","question":"Which BCP sub-plan covers evacuating staff and protecting facilities during a physical emergency such as a fire or flood?","options":["OEP (Occupant Emergency Plan)","COOP (Continuity of Operations Plan)","CCP (Crisis Communications Plan)","CIRP (Cyber Incident Response Plan)"],"answer":0,"explanation":"The OEP focuses on physical safety — evacuation procedures, accounting for personnel, drill frequency, and staff training for physical emergencies. COOP maintains operations; CCP manages communications; CIRP handles cyber incidents. Only OEP directly addresses staff evacuation."},{"id":"d7_q_220","domain":"D7","question":"What are the LAST three phases of incident management in the correct order?","options":["Recovery → Remediation → Lessons Learned","Remediation → Recovery → Lessons Learned","Reporting → Recovery → Lessons Learned","Reporting → Remediation → Lessons Learned"],"answer":0,"explanation":"The full 7-step incident lifecycle: Preparation → Detection → Response (Containment) → Mitigation (Eradication) → Reporting → Recovery → Remediation → Lessons Learned. The last three are Recovery (restore systems), Remediation (fix root cause), and Lessons Learned (improve future response)."},{"id":"d7_q_221","domain":"D7","question":"In a DRP, the minimum hardware specifications required for a system to function are documented under which term?","options":["MOR (Minimum Operating Requirements)","MTBF (Mean Time Between Failures)","MTTR (Mean Time To Repair)","MTD (Maximum Tolerable Downtime)"],"answer":0,"explanation":"MOR (Minimum Operating Requirements) lists the minimum CPU, memory, storage, and other hardware needed for a system to function in a DR scenario. MTBF predicts time between failures; MTTR measures repair time; MTD defines how long a business function can be down — none describe hardware specs."},{"id":"d7_q_222","domain":"D7","question":"When restoring functionality at a DR site after a disaster, which applications are restored LAST?","options":["Least critical applications","Most critical applications","Most resource-intensive applications","Least resource-intensive applications"],"answer":0,"explanation":"Recovery priority follows criticality — the most critical business functions are restored first to minimise operational impact. Least critical applications wait until core operations are stable. Resource intensity is a secondary consideration; criticality to business continuity drives the order."},{"id":"d7_q_223","domain":"D7","question":"Which intrusion system ONLY generates alerts when malicious traffic is detected, and does NOT take action to block it?","options":["IDS (Intrusion Detection System)","IPS (Intrusion Prevention System)","Heuristic analysis engine","Pattern/signature detection"],"answer":0,"explanation":"An IDS passively monitors traffic and sends alerts when suspicious patterns are detected — it does not block traffic. An IPS actively detects AND prevents threats by blocking or dropping malicious traffic. Heuristic and pattern detection are techniques used within IDS/IPS, not standalone systems."},{"id":"d7_q_224","domain":"D7","question":"Which backup type backs up ALL selected files but does NOT clear (reset) the archive bit?","options":["Copy backup","Full backup","Incremental backup","Differential backup"],"answer":0,"explanation":"A copy backup captures everything like a full backup but does NOT reset the archive bit, so subsequent incremental or differential backups are unaffected. Full backups clear the archive bit. Incremental backs up changes since last backup and clears the bit. Differential backs up changes since last full but does NOT clear the bit."},{"id":"d7_q_225","domain":"D7","question":"When planning to use digital forensics evidence in court, what must the evidence NOT be?","options":["Altered","Accurate","Authentic","Admissible"],"answer":0,"explanation":"Evidence must NOT be altered — any modification after seizure can render it inadmissible and destroy its credibility. Evidence must be accurate (truthful), authentic (verified as genuine), and admissible (meets legal criteria). Alteration — even accidental — is the key threat to forensic evidence integrity."},{"id":"d7_q_226","domain":"D7","question":"Which of the following is NOT protected by the US 4th Amendment?","options":["Anything covered by a valid search warrant","Personal emails","Internet browsing history","Online activities with a reasonable expectation of privacy"],"answer":0,"explanation":"The 4th Amendment protects against unreasonable searches. A valid, judicially sanctioned search warrant legally authorises access — items specified in that warrant are not protected from search during its scope. Emails (especially under 180 days), browsing history, and online activities generally carry 4th Amendment protection without a warrant."},{"id":"d7_q_227","domain":"D7","question":"After a complete power outage at the main facility, a temporary command and control centre is deployed. What is this called?","options":["EOC (Emergency Operations Center)","DRP (Disaster Recovery Plan)","EOO","COOP (Continuity of Operations Plan)"],"answer":0,"explanation":"An EOC (Emergency Operations Center) is a centralised facility for command and control during a disaster. It manages strategic decision-making when the primary facility is unavailable. A DRP is a plan document, not a facility. COOP maintains operations but is not a physical command centre."},{"id":"d7_q_228","domain":"D7","question":"Which network forensics methodology captures ALL packets passing through a traffic point for later analysis?","options":["Catch-as-you-can","Catch-and-release","Stop, act and prevent","Stop and release"],"answer":0,"explanation":"Catch-as-you-can captures all network traffic at a given point for storage and later analysis. It requires significant storage but provides the most comprehensive evidence of network activity. The other options are not recognised network forensics methodologies."},{"id":"d7_q_229","domain":"D7","question":"What can a US government agency access without a warrant or court order?","options":["Information voluntarily turned over by the company or individual","Personal emails stored with a service provider","Internet browsing history","All online activity"],"answer":0,"explanation":"Government agencies can access data that is voluntarily provided — no warrant needed when consent is given. Accessing private emails, browsing history, or online activities without consent generally requires a court order, subpoena, or warrant under the 4th Amendment."},{"id":"d7_q_230","domain":"D7","question":"What is the correct order of steps in a digital forensics investigation?","options":["Identify → Acquire → Analyze → Report","Analyze → Identify → Acquire → Report","Report → Identify → Analyze → Report","Identify → Analyze → Acquire → Report"],"answer":0,"explanation":"Digital forensics follows IAAR: (1) Identify — locate evidence sources. (2) Acquire — collect data using a write blocker to preserve integrity. (3) Analyze — examine the acquired data for relevant information. (4) Report — compile findings for legal proceedings or incident response. Acquisition must precede analysis."},{"id":"d7_q_231","domain":"D7","question":"During incident management, in which phase would system access be shut down as part of containment?","options":["Response (Containment)","Preparation","Detection","Recovery"],"answer":0,"explanation":"The Response/Containment phase involves immediate action — disconnecting affected systems, shutting down services, and isolating compromised areas to stop the incident from spreading. Preparation plans for future incidents; Detection identifies them; Recovery restores systems after containment."},{"id":"d7_q_232","domain":"D7","question":"You pay a provider to keep copies of your servers and data. The servers stay powered down except for patches and database syncs, and are only activated during a disaster. What is this called?","options":["Subscription/cloud site","Reciprocal agreement","Redundant site","Mobile site"],"answer":0,"explanation":"A subscription site is a third-party DR service — the provider holds your systems and data, keeping them inactive (except maintenance) until a disaster triggers activation. This differs from a reciprocal agreement (mutual between two orgs), a redundant site (always running), or a mobile site (portable deployment)."},{"id":"d7_q_233","domain":"D7","question":"In a server environment, which component is commonly NOT made redundant?","options":["Motherboard","Hard disk","Power supply","Network card"],"answer":0,"explanation":"Motherboards are typically single points of failure in a server — true motherboard redundancy would require a fully duplicate server. Hard disks use RAID for redundancy; power supplies are commonly dual-redundant; network cards can be teamed. Motherboards are the exception."},{"id":"d7_q_234","domain":"D7","question":"Your secondary DR site is 100 miles away. Which site types would MOST LIKELY have critical applications running within 3 hours?","options":["Hot site and redundant site","Warm site and hot site","Cold site and warm site","Mobile site and cold site"],"answer":0,"explanation":"Hot sites (near real-time data, failover under 1 hour) and redundant sites (real-time mirror, automatic failover in minutes) can restore critical applications within 3 hours. Warm sites take 4–24+ hours. Cold sites take days to weeks — both fall outside the 3-hour window."},{"id":"d7_q_235","domain":"D7","question":"Which BCP sub-plan focuses specifically on maintaining and rapidly resuming day-to-day business operations during a disruption?","options":["COOP (Continuity of Operations Plan)","CCP (Crisis Communications Plan)","OEP (Occupant Emergency Plan)","CIRP (Cyber Incident Response Plan)"],"answer":0,"explanation":"COOP (Continuity of Operations Plan) ensures essential business functions continue during and after a disruption. CCP manages crisis communications; OEP handles staff evacuation and physical safety; CIRP addresses cyber incidents. Only COOP directly targets operational continuity."},{"id":"d8_q_006","domain":"D8","question":"What is the key difference between freeware and shareware?","options":["Freeware is free to use indefinitely; shareware is free only for a limited trial period","Freeware must be paid for after download; shareware is always free","Freeware is only for personal use; shareware can be used commercially","Freeware is a trial version with limited features; shareware is fully functional and free"],"answer":0,"explanation":"Freeware is software available at no charge for unlimited use — the developer imposes no time or feature restrictions. It is NOT necessarily open source and users cannot modify or redistribute it without permission. Shareware is software distributed freely as a trial; payment is required to continue past the trial period or unlock full features."},{"id":"d8_q_007","domain":"D8","question":"Which of the following is the MOST difficult to reverse-engineer?","options":["Assembly language","Java bytecode","C++ compiled binary","Python bytecode"],"answer":0,"explanation":"Assembly language is low-level and architecture-specific, offering very little semantic context — reversing it yields code far removed from the original programmer's intent. Java and Python compile to higher-level bytecode that decompilers can reconstruct fairly cleanly back to readable source. C++ machine code can be disassembled and often retains symbol information, providing more context than raw assembly."},{"id":"d8_q_008","domain":"D8","question":"In which phase of the SDLC does a security professional FIRST review and approve security controls?","options":["Design","Implementation","Testing","Maintenance"],"answer":0,"explanation":"The Design phase is where system architecture is established — this is the earliest and most effective point for security professionals to review and approve controls. Security built into the design is far more robust than controls bolted on later. Implementation puts approved controls in place; Testing verifies they work; Maintenance monitors and adjusts ongoing controls."},{"id":"d8_q_009","domain":"D8","question":"Your organisation uses DevOps for software development. How frequently would you expect new code to be deployed?","options":["Multiple times per day, or even continuously","Weekly","Monthly","Only when a major version is ready"],"answer":0,"explanation":"DevOps is built on continuous integration and continuous delivery (CI/CD) — the goal is to shorten development cycles and ship high-quality software rapidly using automated deployment pipelines. Teams commonly deploy many times a day or on a near-continuous basis. Weekly or monthly cycles are associated with traditional, slower delivery models, not DevOps."},{"id":"d8_q_010","domain":"D8","question":"Which SDLC methodology uses a linear approach where two phases overlap, and when one phase closes the next begins immediately?","options":["Sashimi","Waterfall","Spiral","Agile"],"answer":0,"explanation":"Sashimi extends Waterfall by allowing adjacent phases to overlap — you can begin the next phase before the current one fully closes, maintaining momentum and improving transitions. Developers can also return to a previous phase if needed. Pure Waterfall has no phase overlap; Spiral is iterative and risk-driven; Agile uses short incremental sprints."},{"id":"d8_q_011","domain":"D8","question":"A year-long software project has clearly defined requirements that are NOT expected to change. Which methodology is BEST suited?","options":["Waterfall","Agile","Scrum","Kanban"],"answer":0,"explanation":"Waterfall is linear and sequential — each phase completes before the next begins, with no built-in mechanism for changing requirements mid-project. This makes it ideal for stable, well-understood projects with fixed scope and deliverables. Agile, Scrum, and Kanban all embrace changing requirements and iterative delivery, making them poor fits for fixed-scope, fixed-requirement projects."},{"id":"d8_q_012","domain":"D8","question":"After a merger, you are tasked with normalising data migrated between two systems. Which of the following is NOT a best practice for data normalisation?","options":["Allowing data to be stored in multiple formats","Ensuring data is stored in a consistent format","Removing duplicate data","Storing data in separate tables based on purpose or function"],"answer":0,"explanation":"Allowing multiple formats undermines normalisation — the entire goal is to eliminate redundancies and enforce a single, unified format. Normalisation best practices include: consistent formatting (reduces errors), removing duplicates (improves accuracy and saves storage), and separating data into purpose-based tables (reduces redundancy and improves integrity in relational databases)."},{"id":"d8_q_013","domain":"D8","question":"During a database audit, an employee's title field contains the value '120 hours' instead of a job title like 'CFO' or 'Manager'. Which type of database integrity has been violated?","options":["Semantic integrity","Referential integrity","Entity integrity","User-defined integrity"],"answer":0,"explanation":"Semantic integrity is violated when data is logically wrong for its field — '120 hours' has no semantic meaning as a job title. Referential integrity involves foreign/primary key mismatches between tables. Entity integrity requires primary keys to be unique and non-null. User-defined integrity covers custom business rules. Only semantic integrity addresses wrong data type/meaning in a field."},{"id":"d8_q_014","domain":"D8","question":"Which database language uses the DDL statements CREATE, ALTER, and DROP?","options":["SQL","HTML","CSS","JavaScript"],"answer":0,"explanation":"SQL (Structured Query Language) manages relational databases and includes DDL (Data Definition Language) commands: CREATE (new table/database), ALTER (modify existing object), DROP (delete table/database). HTML and CSS are markup/style languages with no database capabilities. JavaScript can interact with databases via Node.js but does not natively use these DDL statements."},{"id":"d8_q_015","domain":"D8","question":"What is the MOST common cause of identification and authentication failures?","options":["User error, such as forgetting or mistyping passwords","Inadequate password complexity requirements","Technical issues with authentication systems","Malicious attacks by hackers"],"answer":0,"explanation":"User error is the most frequent cause — people manage many accounts across platforms and often forget, mistype, or enter credentials into the wrong system. Inadequate complexity may enable unauthorised access but is not the most common cause of failures. Technical issues and hacking occur but far less often than everyday user mistakes."},{"id":"d8_q_016","domain":"D8","question":"What is the MOST effective way to protect against XSS (Cross-Site Scripting) attacks?","options":["Input validation and sanitisation","Implementing a web application firewall (WAF)","Regular software and application updates","Strong password policies"],"answer":0,"explanation":"XSS attacks inject malicious scripts through input fields that fail to validate or sanitise user-supplied data. Input validation/sanitisation directly addresses this root cause by ensuring all user-generated data is filtered before processing. A WAF blocks known patterns but cannot catch all XSS variants. Updates and strong passwords do not address the underlying unsanitised-input vulnerability."},{"id":"d8_q_017","domain":"D8","question":"Which of the following is the PRIMARY indicator of broken access control in an organisation?","options":["Unauthorised access to sensitive data","Inadequate authentication processes","Lack of monitoring for access control violations","Ineffective access control policies"],"answer":0,"explanation":"Broken access control means authorisation rules are not enforced — the clearest proof is when unauthorised individuals can actually reach data they should not. Inadequate authentication verifies identity but is separate from access control. Lack of monitoring makes detection harder but does not itself break access control. Ineffective policies only become broken access control when they result in actual unauthorised access."},{"id":"d8_q_018","domain":"D8","question":"What is the FIRST step in preventing privilege escalation attacks?","options":["Ensuring all users have only the minimum necessary privileges (least privilege)","Implementing strong password policies","Regularly updating software and security patches","Conducting regular security audits and risk assessments"],"answer":0,"explanation":"The principle of least privilege (PoLP) is the first and most effective defence — if users only hold the permissions needed for their role, a compromised account cannot escalate beyond that scope. Strong passwords, patching, and audits are all valuable but reactive or partial; none address the root issue of over-privileged accounts as directly as PoLP."},{"id":"d8_q_019","domain":"D8","question":"When is it appropriate to install and use backdoors and maintenance hooks in software?","options":["During development, for debugging and troubleshooting","Never — they should always be avoided","To improve the end-user experience","To make administration easier in production"],"answer":0,"explanation":"Backdoors and maintenance hooks are legitimate during development — they let developers identify and fix bugs quickly without disrupting users. However, they must be removed before production release, as they become exploitable entry points for attackers. They are not intended for end users or for persistent production use; leaving them in production is a critical security risk."},{"id":"d8_q_020","domain":"D8","question":"What happens when a buffer overflow occurs?","options":["A program writes more data to a buffer than it can hold, potentially overwriting adjacent memory and enabling code injection","The operating system allocates additional memory to handle the excess data","The computer becomes overloaded with too much data from all sources","The system is automatically being hacked by a malicious actor"],"answer":0,"explanation":"A buffer overflow occurs when a program attempts to store more data in a temporary buffer than it was designed to hold. The excess data spills into adjacent memory, causing erratic behaviour, crashes, or memory access errors. Attackers exploit this to inject and execute malicious code. It can result from programming errors — not all overflows are active attacks, though attackers deliberately trigger them."},{"id":"d8_q_021","domain":"D8","question":"In the Software Capability Maturity Model (CMM), at which level are processes 'possibly repeatable with consistent results'?","options":["Level 2 — Repeatable","Level 1 — Initial","Level 3 — Defined","Level 4 — Managed"],"answer":0,"explanation":"CMM Level 2 (Repeatable) is where processes are documented, standardised, and can be repeated with consistent results. Level 1 (Initial) is ad hoc and chaotic. Level 3 (Defined) goes further — processes are well-defined and described in standards and procedures. Level 4 (Managed) adds quantitative monitoring and control. Level 5 (Optimising) focuses on continuous improvement."},{"id":"d8_q_022","domain":"D8","question":"What is the Building Security-In Maturity Model (BSIMM) used for?","options":["Evaluating and comparing an organisation's software security initiative against real-world data","Measuring the efficiency of a company's overall cyber defence strategy","Assessing the health of an organisation's IT infrastructure","Evaluating the effectiveness of security awareness training programmes"],"answer":0,"explanation":"BSIMM is built on real-world data from hundreds of software security initiatives and covers 12 practices across four domains: governance, intelligence, SSDL touchpoints, and deployment. It gives organisations a benchmark to compare their software security practices with peers. It is not a general IT health or cyber defence tool — those are better served by ITIL or COBIT."},{"id":"d8_q_023","domain":"D8","question":"Which framework is used to assess and improve an organisation's software development process across five maturity levels?","options":["CMM (Capability Maturity Model)","CMMC (Cybersecurity Maturity Model Certification)","ISMM (Information Security Maturity Model)","VMM (Vulnerability Management Model)"],"answer":0,"explanation":"The CMM (Capability Maturity Model), developed by SEI at Carnegie Mellon, provides a five-level framework for improving software development processes: Initial → Repeatable → Defined → Managed → Optimising. CMMC focuses on protecting sensitive defence data. ISMM addresses overall information security practices. VMM manages vulnerabilities — none specifically target software development process maturity."},{"id":"d8_q_024","domain":"D8","question":"Which cloud computing model uses shared tenancy, where a provider builds massive infrastructure and rents it to anyone who wants it?","options":["Public cloud","Private cloud","Hybrid cloud","Community cloud"],"answer":0,"explanation":"Public cloud (e.g. AWS, Microsoft Azure, Google Cloud, IBM) is built and operated by a provider and shared across multiple tenants. Private cloud is owned/operated by a single organisation. Hybrid combines both. Community cloud is shared only among organisations with common concerns such as shared security requirements or compliance obligations."},{"id":"d8_q_025","domain":"D8","question":"An organisation wants to store sensitive data on infrastructure it controls, while using shared cloud for non-sensitive workloads. Which cloud model does this describe?","options":["Hybrid cloud","Public cloud","Community cloud","Private cloud"],"answer":0,"explanation":"Hybrid cloud combines private and public cloud — sensitive data stays on the private cloud (controlled environment) while non-sensitive workloads run on public cloud (cost-effective shared tenancy). This gives organisations flexibility to optimise cost and security by workload type."},{"id":"d8_q_026","domain":"D8","question":"Which cloud model is restricted to a specific group of organisations that share common mission, policy, security requirements, or compliance considerations?","options":["Community cloud","Public cloud","Private cloud","Hybrid cloud"],"answer":0,"explanation":"Community cloud is shared among a defined set of organisations with shared concerns — for example, government agencies sharing a compliance framework, or hospitals governed by the same regulations. It is more restricted than public cloud but shared across multiple organisations, unlike private cloud which serves a single organisation."},{"id":"d8_q_027","domain":"D8","question":"Which cloud model has an organisation building and running its own cloud infrastructure, or paying a third party to do so exclusively for them?","options":["Private cloud","Public cloud","Community cloud","Hybrid cloud"],"answer":0,"explanation":"Private cloud is dedicated to a single organisation — they either build and operate it themselves, or contract a provider to run it exclusively for them. There is no shared tenancy with other organisations. Public cloud uses shared tenancy; community cloud shares among a specific group; hybrid combines private and public."},{"id":"d8_q_028","domain":"D8","question":"When outsourcing to a cloud provider, which of the following is MOST important to verify before signing the contract?","options":["Right to audit, pen test, conduct vulnerability assessments, and confirm vendor compliance with your standards","That the vendor uses the latest hardware","That the vendor has the lowest cost per gigabyte","That the vendor stores data in the same country as your headquarters"],"answer":0,"explanation":"Cloud outsourcing introduces the same risks as any outsourcing — you must contractually secure the right to audit the provider, conduct penetration tests under clearly agreed criteria, perform vulnerability assessments, and verify that the vendor complies with your industry standards and regulatory requirements. Hardware, cost, and geography may matter but are secondary to security oversight rights."}]};
let mode='flash',domain='all',deck=[],idx=0,flipped=false,qAnswered=false;

const SUPABASE_URL='https://qdcfdppcaoffbkjnfvzd.supabase.co';
const SUPABASE_KEY='sb_publishable_zsx00SmyeTkShlzs-_9jjA_GUiXwBcA';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let progressCache=null;
let syncStatus='loading'; // 'loading' | 'synced' | 'offline'

function getLocalP(){try{return JSON.parse(localStorage.getItem('cp')||'{}')}catch(e){return{}}}
function saveLocalP(p){try{localStorage.setItem('cp',JSON.stringify(p))}catch(e){}}
function getPendingIds(){try{return JSON.parse(localStorage.getItem('cp_pending')||'[]')}catch(e){return[]}}
function savePendingIds(ids){try{localStorage.setItem('cp_pending',JSON.stringify(ids))}catch(e){}}
function addPending(id){const ids=getPendingIds();if(!ids.includes(id)){ids.push(id);savePendingIds(ids);}}
function clearPending(id){savePendingIds(getPendingIds().filter(x=>x!==id));}

async function loadProgress(){
  const local=getLocalP();
  const localActions=getLocalActions();
  const pending=getPendingIds();
  try{
    const {data,error}=await sb.from('progress').select('card_id,score,last_action');
    if(error)throw error;
    const remote={};
    const remoteActions={};
    data.forEach(row=>{remote[row.card_id]=row.score;if(row.last_action)remoteActions[row.card_id]=row.last_action;});
    // Merge: remote is authoritative EXCEPT for cards with a pending (unconfirmed) local write
    const merged={...remote};
    const mergedActions={...remoteActions};
    pending.forEach(id=>{
      if(local[id]!==undefined) merged[id]=local[id];
      if(localActions[id]!==undefined) mergedActions[id]=localActions[id];
    });
    progressCache=merged;
    syncStatus=pending.length?'offline':'synced';
    saveLocalP(merged);
    saveLocalActions(mergedActions);
  }catch(e){
    progressCache=local;
    syncStatus='offline';
  }
  updSyncBadge();
  await loadStudyTime();
  // stats are computed live from last_action, no separate load needed
  startTimer();
  reset();
  retryPendingSyncs();
}

function getP(){return progressCache||getLocalP();}

function saveP(p){
  progressCache=p;
  saveLocalP(p); // always mirror locally, instant + offline-safe
}

function getLocalActions(){try{return JSON.parse(localStorage.getItem('cp_actions')||'{}')}catch(e){return{}}}
function saveLocalActions(a){try{localStorage.setItem('cp_actions',JSON.stringify(a))}catch(e){}}
function setLastAction(cardId,action){
  const a=getLocalActions();a[cardId]=action;saveLocalActions(a);
}

async function syncCard(cardId,score,lastAction){
  addPending(cardId);
  setLastAction(cardId,lastAction);
  try{
    const {error}=await sb.from('progress').upsert({card_id:cardId,score:score,last_action:lastAction,updated_at:new Date().toISOString()});
    if(error)throw error;
    clearPending(cardId);
    syncStatus=getPendingIds().length?'offline':'synced';
  }catch(e){
    syncStatus='offline';
  }
  updSyncBadge();
}

async function retryPendingSyncs(){
  const ids=getPendingIds();
  if(!ids.length)return;
  const p=getP();
  const actions=getLocalActions();
  for(const id of ids){
    if(p[id]!==undefined) await syncCard(id,p[id],actions[id]);
  }
}

function updSyncBadge(){
  const el=document.getElementById('syncBadge');
  if(!el)return;
  if(syncStatus==='synced'){el.textContent='● synced';el.style.color='var(--correct)';}
  else if(syncStatus==='offline'){el.textContent='● offline (saved locally)';el.style.color='var(--wrong)';}
  else{el.textContent='● syncing…';el.style.color='var(--muted)';}
}

// ---- Persistent Got/Again counters ----
function computeStats(){
  const actions=getLocalActions();
  let got=0,again=0;
  Object.values(actions).forEach(a=>{ if(a==='got')got++; else if(a==='again')again++; });
  return {got,again};
}

// ---- Study time tracking ----
let totalSeconds=0;       // last known synced/local total, NOT including current running tick
let pendingSeconds=0;     // seconds accumulated this active stretch, not yet flushed
let timerInterval=null;
const FLUSH_EVERY_SEC=30; // push to Supabase this often

function getLocalTime(){try{return parseInt(localStorage.getItem('studySeconds')||'0',10)}catch(e){return 0}}
function saveLocalTime(s){try{localStorage.setItem('studySeconds',String(s))}catch(e){}}

async function loadStudyTime(){
  try{
    const {data,error}=await sb.from('study_time').select('total_seconds').eq('id','total').single();
    if(error)throw error;
    totalSeconds=data.total_seconds;
    saveLocalTime(totalSeconds);
  }catch(e){
    totalSeconds=getLocalTime();
  }
  renderTime();
}

function renderTime(){
  const el=document.getElementById('totalTimeLabel');
  if(!el)return;
  const grand=totalSeconds+pendingSeconds;
  const h=Math.floor(grand/3600);
  const m=Math.floor((grand%3600)/60);
  el.textContent=h+'h '+m+'m';
}

function startTimer(){
  if(timerInterval)return;
  timerInterval=setInterval(()=>{
    if(document.visibilityState!=='visible')return; // only count active foreground time
    pendingSeconds++;
    renderTime();
    if(pendingSeconds>=FLUSH_EVERY_SEC)flushTime();
  },1000);
}

async function flushTime(){
  if(pendingSeconds<=0)return;
  const toFlush=pendingSeconds;
  pendingSeconds=0;
  const newTotal=totalSeconds+toFlush;
  totalSeconds=newTotal;
  saveLocalTime(newTotal);
  renderTime();
  try{
    const {error}=await sb.from('study_time').upsert({id:'total',total_seconds:newTotal,updated_at:new Date().toISOString()});
    if(error)throw error;
  }catch(e){
    // offline: local total already updated above, will retry next flush/visit
  }
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')flushTime();
});
window.addEventListener('beforeunload',()=>{
  saveLocalTime(totalSeconds+pendingSeconds); // best-effort local save; network flush may not complete in time
});

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function buildDeck(){
  const src=mode==='flash'?DATA.flashcards:DATA.questions;
  const filtered=domain==='all'?src:src.filter(c=>c.domain===domain);
  const prog=getP();
  const weighted=filtered.map(c=>{
    const score=prog[c.id]||0;
    const dr={'D1':3,'D2':1,'D3':2,'D4':3,'D5':2,'D6':3,'D7':1,'D8':1}[c.domain]||1;
    const br=score<0?2:score===0?1:0;
    return{c,w:dr+br};
  });
  shuffle(weighted);
  weighted.sort((a,b)=>b.w-a.w);
  return weighted.map(x=>x.c);
}

function switchMode(m){
  mode=m;
  reviewMode=false;
  jumpedFromReview=false;
  document.getElementById('tabFlash').className='tab'+(m==='flash'?' active':'');
  document.getElementById('tabQuiz').className='tab'+(m==='quiz'?' active':'');
  reset();
}

function setDomain(d){
  domain=d;
  reviewMode=false;
  jumpedFromReview=false;
  ['filterAll','filterD1','filterD2','filterD3','filterD4','filterD5','filterD6','filterD7','filterD8'].forEach(id=>document.getElementById(id).className='filter-btn');
  const b=document.getElementById('navBadge');
  if(d==='all'){document.getElementById('filterAll').className='filter-btn active-all';b.className='nav-badge badge-all';b.textContent='All Domains';}
  else{document.getElementById('filter'+d).className='filter-btn active-'+d.toLowerCase();b.className='nav-badge badge-'+d.toLowerCase();b.textContent=d;}
  reset();
}

function reset(){deck=buildDeck();idx=0;flipped=false;qAnswered=false;upd();render();}

function clearAllActions(){
  saveLocalActions({});
}

async function newSession(){
  clearAllActions();
  upd();
  if(reviewMode)showReviewList();
  try{
    await sb.from('progress').update({last_action:null}).not('last_action','is',null);
  }catch(e){/* local clear already happened; remote will be stale until reconnect */}
}

  }

let jumpedFromReview=false;

  reviewMode=true;

  const reviewCards=allCards.filter(c=>actions[c.id]==='again');

function jumpToReviewCard(cardId,isFlash){
  reviewMode=false;
  jumpedFromReview=true;
  mode=isFlash?'flash':'quiz';
  const src=isFlash?DATA.flashcards:DATA.questions;
  const card=src.find(c=>c.id===cardId);
  deck=[card];
  idx=0;flipped=false;qAnswered=false;
  document.getElementById('tabFlash').className='tab'+(mode==='flash'?' active':'');
  document.getElementById('tabQuiz').className='tab'+(mode==='quiz'?' active':'');

function exitReviewList(){
  reviewMode=false;

}

function upd(){
  document.getElementById('statTotal').textContent=deck.length;
  const stats=computeStats();
  document.getElementById('statGot').textContent=stats.got;
  document.getElementById('statAgain').textContent=stats.again;
  const pct=deck.length>0?Math.round((idx/deck.length)*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=idx+' / '+deck.length;
}

function dc(d){return d.toLowerCase();}

function render(){
  const a=document.getElementById('cardArea');
  if(idx>=deck.length){
    if(jumpedFromReview){jumpedFromReview=false;showReviewList();return;}
    renderEnd(a);return;
  }

function renderFlash(a){
  const c=deck[idx];
  const expHtml=c.explanation?'<div class="q-explanation" id="flashExp" style="display:none">'+c.explanation+'</div>':'<div id="flashExp" style="display:none"></div>';
  a.innerHTML='<div class="flashcard" id="fc" onclick="flip()"><div class="card-front"><div class="card-domain '+dc(c.domain)+'">'+c.domain+'</div><div class="card-label">Tap to reveal</div><div class="card-text">'+c.front+'</div></div><div class="card-back"><div class="card-domain '+dc(c.domain)+'">'+c.domain+'</div><div class="card-label">Tap card to flip back</div><div class="card-text">'+c.back+'</div></div></div><div class="flip-hint" id="fh">Tap card to reveal answer</div>'+expHtml+'<div class="rating-btns" id="rb" style="display:none"><button class="rating-btn btn-again" onclick="rate(-1)">Need to review</button><button class="rating-btn btn-got-it" onclick="rate(1)">Got it ✓</button></div>';

function flip(){
  flipped=!flipped;
  document.getElementById('fc').classList.toggle('flipped',flipped);
  document.getElementById('fh').style.display=flipped?'none':'';

function rate(s){
  const c=deck[idx];const p=getP();p[c.id]=(p[c.id]||0)+s;saveP(p);
  const action=s>0?'got':'again';
  syncCard(c.id,p[c.id],action);
  idx++;flipped=false;render();
}

function renderQuiz(a){
  const c=deck[idx];
  const correctText=c.options[c.answer];
  const shuffled=shuffle([...c.options]);
  const newCorrect=shuffled.indexOf(correctText);
  const opts=shuffled.map((o,i)=>'<button class="q-option" id="o'+i+'" onclick="ans('+i+','+newCorrect+',\''+c.id+'\')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('');
  a.innerHTML='<div class="q-card"><div class="q-domain '+dc(c.domain)+'">'+c.domain+'</div><div class="q-text">'+c.question+'</div><div class="q-options">'+opts+'</div><div id="qe" style="display:none" class="q-explanation"></div></div><button class="q-next" id="qn" style="display:none" onclick="nextQ()">Next question →</button>';
  qAnswered=false;
}

function ans(chosen,correct,cid){
  if(qAnswered)return;qAnswered=true;
  const c=deck[idx];const p=getP();const ok=chosen===correct;
  p[cid]=(p[cid]||0)+(ok?1:-1);saveP(p);
  const action=ok?'got':'again';
  syncCard(cid,p[cid],action);
  c.options.forEach((_,i)=>{
    const el=document.getElementById('o'+i);
    if(i===correct)el.className='q-option correct';
    else if(i===chosen&&!ok)el.className='q-option wrong';
    el.disabled=true;
  });
  document.getElementById('qe').textContent=c.explanation;
  document.getElementById('qe').style.display='block';
  document.getElementById('qn').style.display='block';
  upd();
}

function nextQ(){idx++;qAnswered=false;render();}

function renderEnd(a){
  const stats=computeStats();
  const total=stats.got+stats.again;
  const pct=total>0?Math.round((stats.got/total)*100):0;
  a.innerHTML='<div class="session-end"><div class="end-icon">'+(pct>=70?'🎯':'📚')+'</div><div class="end-title">'+(pct>=70?'Deck complete!':'Deck complete \u2014 keep grinding.')+'</div><div class="end-sub">'+stats.got+' of '+total+' correct overall ('+pct+'%).<br>Weak cards surface more next round.</div><button class="restart-btn" onclick="reset()">Go again</button></div>';
  upd();
}

const EDGE_FN='https://qdcfdppcaoffbkjnfvzd.supabase.co/functions/v1/verify-password';

function setAuthCookie(token){
  const expires=new Date(Date.now()+30*864e5).toUTCString();
  document.cookie='cissp_token='+encodeURIComponent(token)+';expires='+expires+';path=/;SameSite=Strict';
}
function getAuthCookie(){
  const m=document.cookie.match(/(?:^|;\s*)cissp_token=([^;]+)/);
  return m?decodeURIComponent(m[1]):null;
}

async function checkAuth(){
  const token=getAuthCookie();
  if(token){
    try{
      const r=await fetch(EDGE_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
      const d=await r.json();
      if(d.valid){unlockApp();return;}
    }catch(e){unlockApp();return;}
  }
  const overlay=document.getElementById('authOverlay');
  overlay.style.display='flex';
  setTimeout(()=>document.getElementById('authInput').focus(),100);
}

async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function submitPassword(){
  const pw=document.getElementById('authInput').value;
  const err=document.getElementById('authError');
  err.textContent='';
  if(!pw)return;
  const btn=document.querySelector('.auth-btn');
  btn.disabled=true;btn.textContent='Checking…';
  try{
    const r=await fetch(EDGE_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json();
    if(d.valid&&d.token){
      hashPw(pw).then(h=>localStorage.setItem('cissp_pw_hash',h));
      setAuthCookie(d.token);
      unlockApp();
    }else{
      err.textContent='Incorrect password.';
      btn.disabled=false;btn.textContent='Unlock';
    }
  }catch(e){
    const stored=localStorage.getItem('cissp_pw_hash');
    if(stored){
      const h=await hashPw(pw);
      if(h===stored){unlockApp();return;}
    }
    err.textContent='No connection. Try again when online.';
    btn.disabled=false;btn.textContent='Unlock';
  }
}

function unlockApp(){
  document.getElementById('authOverlay').style.display='none';
  loadProgress();
}

checkAuth();
