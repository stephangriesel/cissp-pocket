,"Defer entirely to senior management without providing any input","Conduct a risk analysis and present senior management with costs for the flood-prone site vs an alternative location"],"answer":3,"explanation":"Due diligence and due care require the security team to perform a thorough risk analysis — quantifying flood damage costs, downtime, and mitigation expenses — and compare them against an alternative site. This gives senior management data-driven input to make an informed decision and creates a paper trail of proactive risk management."},{"id":"d3_q_063","domain":"D3","difficulty":"medium","question":"A data center has four UPSs, two on each side of the room, but all servers are connected to one side. One overloaded UPS fails, causing a cascading power outage. What would have BEST prevented this?","options":["Install additional UPSs on the overloaded side","Monitor and reactively adjust load distribution","Accept the risk and rely on the four-UPS redundancy","Distribute server connections evenly across UPSs on both sides of the room"],"answer":3,"explanation":"Balanced load distribution is the correct preventative design. By spreading connections across both sides, no single UPS is overloaded, each server has access to two power sources, and a single UPS failure cannot cascade into a widespread outage. Reactive monitoring and adding UPSs to one side don't fix the underlying design flaw."},{"id":"d3_q_064","domain":"D3","difficulty":"easy","question":"What is the MOST effective way to store backups to prevent data loss in case of a disaster?","options":["On the same server as the original data","On a cloud-based server","On a tape-based system in the same building","In a separate physical location (offsite)"],"answer":3,"explanation":"Offsite backups ensure a disaster at the primary location (fire, flood, earthquake) cannot destroy both the original data and the backup simultaneously. Cloud is useful but can be impacted by cyber attacks and may be slower to restore. Tape in the same building shares the same disaster risk as the original. Storing backups on the same server means a single hardware failure wipes everything."},{"id":"d3_q_065","domain":"D3","difficulty":"medium","question":"Which of the following is NOT part of server hardening?","options":["Installing the latest patches and updates","Changing default administrative passwords","Disabling unused services and protocols","Using FTP for file transfers"],"answer":3,"explanation":"FTP sends data including credentials in clear text and would WEAKEN server security, not harden it. Server hardening replaces insecure protocols like FTP with secure alternatives (SFTP, FTPS). Hardening includes patching, changing default passwords, and disabling unnecessary services to reduce the attack surface."},{"id":"d3_q_066","domain":"D3","difficulty":"medium","question":"Which of the following would NOT typically be part of server hardening before promoting a server to production?","options":["Installing the latest security patches","Changing the default administrator password","Disabling unnecessary services and protocols","Enabling automatic updates for all software"],"answer":3,"explanation":"Automatic updates are risky in production environments — they can introduce incompatible changes, cause service instability, or deploy untested code without warning. Production updates should be staged and tested before deployment. Patching, changing default passwords, and disabling unneeded services are all standard hardening steps."},{"id":"d3_q_067","domain":"D3","difficulty":"easy","question":"When we experience a power surge, what is happening?","options":["Electrical current is being temporarily cut off","Electrical current is flowing in the opposite direction","Electrical current is flowing at a lower rate than usual","Electrical current is flowing at a higher voltage than usual, increasing current through the circuit"],"answer":3,"explanation":"A power surge is an unexpected increase in voltage, which proportionally increases current (Ohm's law: V = IR). The excess energy causes overheating and can damage electronic components. Surges can carry tens of thousands of volts and last fractions of a second. A cut-off is a blackout; low voltage is a brownout or sag; reversed current indicates a fault."},{"id":"d3_q_068","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST important indicator of the efficiency of a UPS (Uninterruptible Power Supply)?","options":["The cost of the UPS","The physical size of the UPS","The maximum power output (watts) of the UPS","The amount of time the UPS can provide power without interruption"],"answer":3,"explanation":"The primary measure of a UPS's efficiency is its runtime — how long it can sustain power during an outage. This determines whether staff can safely save work and shut down systems, or whether critical infrastructure can keep running. Cost, size, and wattage are important specs but do not directly indicate efficiency or runtime."},{"id":"d3_q_069","domain":"D3","difficulty":"medium","question":"Which leg of the CIA triad do power fluctuations MOST directly compromise?","options":["Confidentiality","Integrity","All three equally","Availability"],"answer":3,"explanation":"Power fluctuations (surges, outages, brownouts) primarily compromise Availability by causing system crashes, slowdowns, or outages that prevent users from accessing data and services. Integrity can be affected if a crash corrupts data mid-write, but modern journaling file systems mitigate this. Confidentiality is not directly impacted — power loss does not grant unauthorised access."},{"id":"d3_q_070","domain":"D3","difficulty":"easy","question":"Which of the following is the MOST effective fire security control that provides BOTH detection and suppression?","options":["Smoke alarms","Fire drills","A no-smoking policy","A sprinkler system"],"answer":3,"explanation":"A sprinkler system automatically detects heat and suppresses the fire before it can spread, combining both functions. Smoke alarms only detect and alert — they do not suppress. Fire drills and no-smoking policies are preventative administrative controls with no suppression capability."},{"id":"d3_q_071","domain":"D3","difficulty":"medium","question":"Photoelectric detectors are installed in your data center. What do they detect?","options":["Fire (flames directly)","Water or moisture","Carbon dioxide","Smoke"],"answer":3,"explanation":"Photoelectric detectors use a light source and sensor inside a chamber. When smoke particles enter, they scatter the light beam, triggering the sensor and alarm. They are especially effective at detecting slow, smouldering fires that produce large amounts of smoke. Heat detectors sense temperature change; flame detectors sense infrared/UV radiation; CO2 and water have separate dedicated sensors."},{"id":"d3_q_072","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST important indicator of a well-functioning HVAC system?","options":["High energy efficiency","Lower maintenance costs","Long system lifespan","Proper airflow — adequate ventilation and thermal comfort"],"answer":3,"explanation":"The primary function of an HVAC system is to maintain proper airflow, ensuring adequate ventilation and a stable temperature. A system can be efficient, cheap to maintain, or long-lasting, but if it is not delivering proper airflow, it is not fulfilling its core purpose — which in a data center context also means protecting equipment from overheating."},{"id":"d3_q_073","domain":"D3","difficulty":"easy","question":"What is the MOST important thing to secure FIRST in an emergency?","options":["Evacuation of the premises","Security protocols","Confidential information","Human life and safety"],"answer":3,"explanation":"Human life is always the first priority in any emergency. Medical assistance must be provided to those in danger before attention turns to evacuation, security protocols, or protecting data. No asset, information, or procedure is more important than preserving human life."},{"id":"d3_q_074","domain":"D3","difficulty":"easy","question":"In the event of a natural disaster, what is the FIRST step an organisation should take to protect its assets?","options":["Activate the disaster recovery plan","Execute data backup and storage procedures","Assess damage and prioritise recovery efforts","Ensure the safety of all employees"],"answer":3,"explanation":"Human safety always comes first — employees must be notified and evacuated before any technical response begins. Disaster recovery plans, backups, and damage assessments are all secondary to getting people to safety. Backups and DR plans should already be in place before any disaster strikes."},{"id":"d3_q_075","domain":"D3","difficulty":"medium","question":"During a fire alarm, elevators shut down. A wheelchair user on the fourth floor cannot use the stairs. What does this highlight about evacuation planning?","options":["Disabled employees should only work on the ground floor","Elevators should never shut down during emergencies","Employees who cannot use stairs should be excused from drills","Organisations must have specific evacuation plans for employees with disabilities or special needs"],"answer":3,"explanation":"Evacuation plans must account for every employee, including those with disabilities. Alternatives such as designated assistance teams, evacuation chairs, or refuge areas on each floor must exist and be practised in drills — not invented during a real emergency. Restricting where disabled employees work is discriminatory, and elevators correctly shut down during fires for safety reasons."},{"id":"d3_q_076","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST effective countermeasure against rainbow table attacks?","options":["Key stretching","Limiting login attempts","Keeping password hashes in plaintext","Salting"],"answer":3,"explanation":"A salt is a unique random value added to each password before hashing. Even if two users share the same password, their hashes differ because of unique salts, making pre-computed rainbow tables useless — the attacker would need a new table per unique salt. Key stretching slows brute force; login limits block online attacks; plaintext hashes offer zero protection."},{"id":"d3_q_077","domain":"D3","difficulty":"easy","question":"Which type of antivirus software MUST be constantly updated to remain effective?","options":["Heuristic","Embedded","Formal","Signature-based"],"answer":3,"explanation":"Signature-based antivirus relies on a database of known malware fingerprints and can only detect threats it already has signatures for. It must be constantly updated as new malware is discovered. Heuristic antivirus analyses behaviour patterns and can detect unknown variants without requiring constant signature updates."},{"id":"d3_q_078","domain":"D3","difficulty":"medium","question":"In telecommunications, what does the term 'Demarc' (Point of Demarcation) refer to?","options":["Where all the organisation's routers and switches are located","Where servers are placed to ensure faster speeds","Ensuring all tenants have access to the network equipment","The point where the ISP's line terminates and the customer's network begins"],"answer":3,"explanation":"The Demarc (Point of Demarcation) is the physical boundary where the telecommunications provider's responsibility ends and the customer's network responsibility begins. Everything beyond the Demarc is the customer's to manage, secure, and maintain."},{"id":"d3_q_079","domain":"D3","difficulty":"medium","question":"When a computer uses more than one processor simultaneously to handle a task, it is called what?","options":["Multithreading","Multitasking","Multiprogramming","Multiprocessing"],"answer":3,"explanation":"Multiprocessing uses multiple CPUs simultaneously on one or more tasks, improving performance and reliability. Multithreading divides a single process into concurrent threads on one or more CPUs. Multitasking runs multiple applications on a single CPU via time-slicing. Multiprogramming keeps the CPU busy by switching between multiple loaded programs."},{"id":"d3_q_080","domain":"D3","difficulty":"medium","question":"After a security assessment of an acquired facility, you find four issues: an opening in the fence, a broken turnstile, a broken camera, and poor lighting. To prevent unauthorised people from getting inside the perimeter, which should you fix FIRST?","options":["The opening in the fence","The broken turnstile","The broken camera","The poor lighting"],"answer":0,"explanation":"The opening in the fence is a direct breach of the physical perimeter — it allows anyone to walk in unchallenged. A broken turnstile affects a controlled entry point but not the full perimeter. Cameras and lighting are detective controls; they don't physically stop entry. Securing the perimeter barrier is always the first priority."},{"id":"d3_q_081","domain":"D3","difficulty":"medium","question":"Your organisation is considering new symmetric encryption. Which of the following is no longer considered secure and should NOT be used?","options":["RC4","3DES","AES","Twofish"],"answer":0,"explanation":"RC4 is a stream cipher with well-documented vulnerabilities exploitable in practical attacks. It has been removed from TLS and is no longer recommended. 3DES is deprecated but still more secure than RC4. AES is the current gold standard. Twofish is also considered secure, though less widely adopted than AES."},{"id":"d3_q_082","domain":"D3","difficulty":"medium","question":"A logic bomb is triggered by which of the following?","options":["When a certain event occurs or a specific time is reached","As soon as it is introduced to the system","When it has infected the entire network","When the system gains internet access"],"answer":0,"explanation":"Logic bombs lie dormant until a pre-set condition is met — either a specific time/date or a triggering event (e.g., a user logging in, a file being opened, or an employee being removed from payroll). They do not activate immediately, do not spread like worms, and are not triggered by internet connectivity."},{"id":"d3_q_083","domain":"D3","difficulty":"medium","question":"A senior VP asks what technologies PKI (Public Key Infrastructure) uses. What is the correct answer?","options":["A combination of asymmetric encryption, symmetric encryption, and hashes","Asymmetric encryption only","Symmetric encryption only","Hashes only"],"answer":0,"explanation":"PKI uses all three: asymmetric encryption for secure key exchange and digital signatures during the handshake; symmetric encryption for fast bulk data transfer once the session is established; and hash functions to ensure data integrity and enable digital signatures (private-key-encrypted hash = signature)."},{"id":"d3_q_084","domain":"D3","difficulty":"medium","question":"Your organisation uses cloud computing with IaaS. Who is responsible for managing the databases?","options":["The vendor","The customer","The security team","The network team"],"answer":1,"explanation":"In IaaS (Infrastructure as a Service), the vendor provides and maintains the underlying infrastructure (compute, storage, networking). Everything from the OS upward — including databases, applications, and security configurations — is the customer's responsibility to install, configure, and maintain."},{"id":"d3_q_085","domain":"D3","difficulty":"medium","question":"Jane is explaining digital signatures to a friend. Which of the following is one of the MAIN reasons organisations use digital signatures?","options":["Confidentiality","Availability","Integrity","Authentication"],"answer":2,"explanation":"Digital signatures primarily ensure integrity — verifying that data has not been altered in transit. They also provide non-repudiation (the signer cannot deny signing) and authentication (confirming identity). They do not provide confidentiality (encryption does that) and do not affect availability."},{"id":"d3_q_086","domain":"D3","difficulty":"medium","question":"When installing motion sensors, which types of security controls are you implementing?","options":["Administrative and detective","Deterrence and preventative","Preventative and detective","Detective and deterrence"],"answer":3,"explanation":"Motion sensors detect movement (detective control) and, when visible, deter potential intruders (deterrence control). They do not physically block access, so they are not preventative. Administrative controls are policies and procedures — not physical devices."},{"id":"d3_q_087","domain":"D3","difficulty":"medium","question":"Your data center uses passive infrared (PIR) motion detectors for monitoring. What do they use to detect movement?","options":["Heat (infrared radiation)","Pulses of ultrasonic energy","Changes in ambient light","High-frequency sound waves"],"answer":0,"explanation":"Passive infrared (PIR) detectors sense heat — they detect the change in infrared radiation pattern when a warm object (like a human) moves through the sensor's field. They emit no energy themselves (passive). Ultrasonic sensors use pulses; photodetectors use light; ultrasonic sensors use sound."},{"id":"d3_q_088","domain":"D3","difficulty":"medium","question":"When using frequency analysis in cryptanalysis, what are you specifically examining?","options":["How often certain letters appear in the ciphertext","How often pairs of letters appear together","How many messages have been sent","How frequently messages are transmitted"],"answer":0,"explanation":"Frequency analysis examines how often individual letters appear in a ciphertext and compares that distribution to known letter frequencies in the target language (e.g., E, T, A in English). This works because monoalphabetic substitution ciphers preserve letter frequency. Bigram/digraph analysis looks at pairs; traffic analysis looks at message volume/timing."},{"id":"d3_q_089","domain":"D3","difficulty":"easy","question":"When we talk about WORM media, which of the following is an example?","options":["RAM","EEPROM","Recordable DVDs (R DVDs)","Traditional hard disks"],"answer":2,"explanation":"WORM (Write Once, Read Many) media allows data to be written exactly once and read many times — it cannot be erased or overwritten. Recordable DVDs (DVD-R) are a classic example. RAM is volatile and rewritable. EEPROM can be electrically erased and reprogrammed. Traditional hard disks are fully rewritable."},{"id":"d3_q_090","domain":"D3","difficulty":"easy","question":"Which physical access control prevents cars and vans from entering a perimeter while still allowing pedestrians through?","options":["Lights","Bollards","Cameras","Motion sensors"],"answer":1,"explanation":"Bollards are short vertical posts designed to stop vehicle access while allowing foot traffic. They can be fixed, retractable, or crash-rated. Lights, cameras, and motion sensors are detective/deterrence controls — they observe and deter but do not physically block vehicles."},{"id":"d3_q_091","domain":"D3","difficulty":"hard","question":"Which of the following hashing algorithms is still considered secure and highly collision-resistant?","options":["MD5","RIPEMD-160","SHA-1","MD6"],"answer":1,"explanation":"RIPEMD-160 produces a 160-bit hash and remains collision-resistant. MD5 (128-bit) is broken and vulnerable to collisions. SHA-1 (160-bit) has been demonstrated vulnerable to practical collision attacks. MD6 was withdrawn before the NIST competition concluded and is not widely used or validated."},{"id":"d3_q_092","domain":"D3","difficulty":"medium","question":"Which ASTM standard gate class is designed for residential use at a private home?","options":["Class III","Class IV","Class I","Class XI"],"answer":2,"explanation":"ASTM Class I gates are for residential applications — low-frequency use by a family unit. Class III is for industrial or restricted multi-tenant use. Class IV is for high-volume commercial locations like bus depots. Class XI does not exist in ASTM gate standards (Classes I–IV only)."},{"id":"d3_q_093","domain":"D3","difficulty":"easy","question":"In which part of the computer are all arithmetic and logical calculations performed?","options":["CPU (Central Processing Unit)","CU (Control Unit)","ALU (Arithmetic Logic Unit)","ROM (Read-Only Memory)"],"answer":2,"explanation":"The ALU (Arithmetic Logic Unit) is the component that executes all arithmetic and logical operations. The CPU is the broader processor that contains the ALU. The CU (Control Unit) directs CPU operations but does not perform calculations. ROM is non-volatile storage — not involved in computation."},{"id":"d3_q_094","domain":"D3","difficulty":"hard","question":"The NSA proposed embedding the Clipper chip in all telecommunications devices. Which encryption algorithm did it use?","options":["DSA","Skipjack","3DES","RSA"],"answer":1,"explanation":"The Clipper chip (proposed in the 1990s) used the Skipjack symmetric encryption algorithm. The chip was controversial because it included key escrow — government agencies could access keys under certain conditions. DSA is a digital signature algorithm, not encryption. 3DES and RSA were not used in the Clipper chip."},{"id":"d3_q_095","domain":"D3","difficulty":"medium","question":"What is the complete order of steps in the CPU instruction cycle, including writing results back to memory?","options":["Fetch, execute, decode, store","Fetch, decode, execute, store","Execute, fetch, decode, store","Fetch, decode, store, execute"],"answer":1,"explanation":"The full CPU instruction cycle is: Fetch (retrieve instruction from memory) → Decode (interpret the instruction) → Execute (perform the operation) → Store/Write-back (write the result back to memory or a register). You cannot execute before decoding, and results must be stored after execution."},{"id":"d3_q_096","domain":"D3","difficulty":"medium","question":"When your private and public keys are held in key escrow, what does that mean?","options":["The server where your public and private keys are stored","The private key you hold on your own system","The public key available to everyone","A trusted third party holds copies of your keys, often accessible by law enforcement under legal process"],"answer":3,"explanation":"Key escrow means a neutral third party (escrow agent or government authority) holds copies of your cryptographic keys. The keys can be released under specific conditions — typically a court order. This is distinct from simply storing keys on a server, holding your own private key, or distributing your public key."},{"id":"d3_q_097","domain":"D3","difficulty":"hard","question":"Which of the following is TRUE about IDEA (International Data Encryption Algorithm)?","options":["64-bit block cipher with a 56-bit key (like DES)","64-bit block cipher with a 112-bit key (like two-key 3DES)","128-bit block cipher with 128, 192, or 256-bit keys (like AES)","64-bit block cipher with a 128-bit key"],"answer":3,"explanation":"IDEA is a symmetric 64-bit block cipher using a 128-bit key, designed as a replacement for DES. It is known for its security and efficient software implementation. DES uses a 56-bit key; two-key 3DES uses an effective 112-bit key; AES uses 128-bit blocks with 128/192/256-bit keys."},{"id":"d3_q_098","domain":"D3","difficulty":"medium","question":"What are Distributed Control Systems (DCSs) primarily used for?","options":["Monitoring servers, workstations, and network devices","High-level supervisory management of multiple sites","Controlling manufacturing assembly lines only","Computerized control of a continuous industrial process or plant"],"answer":3,"explanation":"DCSs are used to manage complex, continuous industrial processes (chemical plants, power generation, oil refining, water treatment). Unlike SCADA (which provides high-level supervisory management across multiple sites), DCSs focus on distributed, real-time control within a single plant or process."},{"id":"d3_q_099","domain":"D3","difficulty":"medium","question":"Jane and Bob are discussing hashing and use the abbreviation MAC. In this context, what does MAC stand for?","options":["Mandatory Access Control","Media Access Control","Message Access Code","Message Authentication Code"],"answer":3,"explanation":"In a hashing/cryptography context, MAC stands for Message Authentication Code — a short value generated by combining a secret key with message data (often using HMAC) to verify both the integrity and authenticity of a message. Mandatory Access Control is a security model. Media Access Control is a network hardware address. Message Access Code is not a real standard term."},{"id":"d3_q_100","domain":"D3","difficulty":"medium","question":"In which IP protocol version is IPSec built in natively rather than added on as an extension?","options":["IPv4","PGP","HMAC","IPv6"],"answer":3,"explanation":"IPSec is a mandatory, integrated component of IPv6 — it was designed in from the start. In IPv4, IPSec was retrofitted as an add-on because IPv4 was originally built for trusted research/military networks and had no inherent security. PGP and HMAC are not IP protocols."},{"id":"d3_q_101","domain":"D3","difficulty":"medium","question":"What component in the computer kernel handles all access decisions between subjects (users/processes) and objects (files/resources)?","options":["User mode","Supervisor mode","Superuser mode","The reference monitor"],"answer":3,"explanation":"The reference monitor is a security concept implemented in the OS kernel that mediates every access request from a subject to an object and enforces the security policy. User mode is where applications run with limited privileges. Supervisor/kernel mode is where the OS runs — the reference monitor is the specific kernel component enforcing access control. 'Superuser mode' is not a standard term."},{"id":"d4_q_001","domain":"D4","difficulty":"medium","question":"On the exam you see an unfamiliar protocol starting with 'I' and must guess its OSI layer. What's the safest answer (and the exception)?","options":["Layer 7, except for IPSEC","Layer 3, except for IMAP which is Layer 7","Layer 2, except for ICMP","Layer 4, except for IP"],"answer":1,"explanation":"Protocols starting with 'I' (IP, IGMP, IGRP, IPSEC, IKE, ISAKMP) are generally Layer 3. The exception is IMAP, which is Layer 7 (Application)."},{"id":"d4_q_002","domain":"D4","difficulty":"hard","question":"A real-time VOIP application prioritizes timing over guaranteed delivery. Which transport protocol does it use, and what attack exploits it?","options":["TCP, exploited by SYN floods","UDP, exploited by Fraggle attacks","TCP, exploited by Fraggle attacks","UDP, exploited by SYN floods"],"answer":1,"explanation":"VOIP uses UDP (connectionless, timing over delivery). A Fraggle attack works like Smurf but uses UDP instead of ICMP. SYN floods exploit TCP's 3-way handshake."},{"id":"d4_q_003","domain":"D4","difficulty":"medium","question":"DNSSEC adds which protections to DNS, and which does it NOT provide?","options":["Confidentiality and Integrity, but not Authentication","Authentication and Integrity, but NOT Confidentiality","Confidentiality only","Availability and Confidentiality"],"answer":1,"explanation":"DNSSEC provides Authentication and Integrity using PKI — like a digital signature for DNS — but does NOT provide Confidentiality. It defends against DNS poisoning."},{"id":"d4_q_004","domain":"D4","difficulty":"hard","question":"An attacker sets up an access point with the SAME SSID as the corporate network but with no security, and devices auto-connect to it. What is this attack?","options":["Rogue Access Point","Evil Twin","Jamming","War Driving"],"answer":1,"explanation":"An Evil Twin mimics the legitimate SSID (with no security) so devices connect automatically, compromising confidentiality and integrity. A rogue AP is simply an unauthorized AP added to the network."},{"id":"d4_q_005","domain":"D4","difficulty":"medium","question":"Which wireless security standard replaces the pre-shared key (PSK) with Simultaneous Authentication of Equals (SAE)?","options":["WEP","WPA","WPA2","WPA3"],"answer":3,"explanation":"WPA3 (2020) replaces the PSK exchange with SAE and uses AES-256 in GCM mode with SHA-384. WPA2 commonly uses WPA2-PSK with AES."},{"id":"d4_q_006","domain":"D4","difficulty":"hard","question":"You need a firewall that can detect malware hidden in an HTTP payload on an allowed port. Which firewall type is required?","options":["Packet filtering firewall (Layer 3)","Stateful firewall (Layer 4)","Application layer firewall / NGFW with deep packet inspection (Layer 7)","A dual-homed host"],"answer":2,"explanation":"Only an application-layer firewall or NGFW with deep packet inspection can examine the actual payload (Layer 7) to detect malicious content or protocols misusing an allowed port. Lower-layer firewalls only see headers."},{"id":"d4_q_007","domain":"D4","difficulty":"medium","question":"Which routing protocol is used to route between Autonomous Systems on the Internet and is path-vector based?","options":["RIP","OSPF","BGP","EIGRP"],"answer":2,"explanation":"BGP (Border Gateway Protocol) is the routing protocol of the Internet, routing between Autonomous Systems based on paths/policies. It's a path-vector protocol that typically never fully converges."},{"id":"d4_q_008","domain":"D4","difficulty":"hard","question":"802.1X authentication involves three parties. What is the role of the 'authenticator'?","options":["The client device requesting access","The network device (switch or wireless AP) that controls access","The RADIUS server validating credentials","The certificate authority issuing keys"],"answer":1,"explanation":"In 802.1X: the supplicant is the client device, the authenticator is the network device (switch or wireless AP), and the AS (authentication server, usually RADIUS) validates credentials."},{"id":"d4_q_009","domain":"D4","difficulty":"medium","question":"What is the key security difference between Telnet and SSH?","options":["Telnet uses TCP; SSH uses UDP","Telnet sends all data including credentials in plaintext; SSH encrypts the connection","SSH is older and less secure than Telnet","Telnet encrypts only the password"],"answer":1,"explanation":"Telnet (TCP 23) sends ALL data including usernames and passwords in plaintext and should not be used. SSH provides a secure (encrypted) connection over an unsecured network."},{"id":"d7_q_001","domain":"D7","difficulty":"medium","question":"An employee's accounts are locked and audited while they are forced to take time off, to detect any fraud they may be concealing. Which control is this?","options":["Separation of Duties","Job Rotation","Mandatory Vacations","Least Privilege"],"answer":2,"explanation":"Mandatory Vacations ensure one person isn't always performing the same task; their accounts are locked and audited while away. If they were committing and covering up fraud, the audit reveals it. Don't give too much advance notice."},{"id":"d7_q_002","domain":"D7","difficulty":"hard","question":"You must restore a system to Thursday using a Sunday full backup plus daily DIFFERENTIAL backups. How many tapes do you need?","options":["1 tape","2 tapes","4 tapes","7 tapes"],"answer":1,"explanation":"Differential backs up everything since the last FULL. So you need just 2 tapes: the Sunday full + Wednesday's differential. (Incremental would need many more — full + each day's incremental.)"},{"id":"d7_q_003","domain":"D7","difficulty":"medium","question":"Which backup type clears the archive bit and backs up only what changed since the last backup?","options":["Full backup","Differential backup","Incremental backup","Copy backup"],"answer":2,"explanation":"Incremental backs up everything changed since the last backup (full or incremental) and CLEARS the archive bit. Differential does NOT clear it. Copy is a full that doesn't clear the bit."},{"id":"d7_q_004","domain":"D7","difficulty":"hard","question":"An attack is occurring but the IDS does not detect it and takes no action. What category is this, and why is it the most dangerous?","options":["False Positive — it wastes analyst time","True Negative — normal operation","False Negative — a real attack goes completely undetected","True Positive — the system acts correctly"],"answer":2,"explanation":"A False Negative is when an attack happens but the system misses it entirely. It's the most dangerous because the threat proceeds with no alert or response."},{"id":"d7_q_005","domain":"D7","difficulty":"medium","question":"Your team is overwhelmed by SIEM alerts and wants automated response to certain incidents. Which solution adds AI-driven automatic reaction?","options":["A second SIEM","SOAR (Security Orchestration, Automation, and Response)","A network IDS","A host-based firewall"],"answer":1,"explanation":"SOAR uses AI to automatically REACT to some events, reducing the alert overload a SIEM generates. SIEM centralizes and correlates but only alerts; SOAR adds orchestrated response."},{"id":"d7_q_006","domain":"D7","difficulty":"hard","question":"After a disaster, which recovery team brings systems back at the alternate site, and in what order?","options":["Salvage team — most critical systems first","Recovery team — most critical systems first","Rescue team — least critical systems first","Recovery team — least critical systems first"],"answer":1,"explanation":"The Recovery team (failover) gets the alternate site running, bringing the MOST critical systems up first. The Salvage team (failback) returns to the primary site, bringing LEAST critical systems up first."},{"id":"d7_q_007","domain":"D7","difficulty":"medium","question":"An organization wants a recovery site with near-real-time data and the ability to switch over in under an hour, housing only critical systems. Which site type?","options":["Cold site","Warm site","Hot site","Reciprocal agreement site"],"answer":2,"explanation":"A Hot site houses critical applications with near-real-time data and allows a manual switch in about an hour or less. Warm sites restore from backups (4-24hr); cold sites have no hardware (weeks)."},{"id":"d7_q_008","domain":"D7","difficulty":"hard","question":"After eradicating an incident, you fix the same vulnerability across ALL systems org-wide, not just the compromised one. What process drives this?","options":["Lessons Learned","Root-Cause Analysis","Containment","Detection"],"answer":1,"explanation":"Root-Cause Analysis identifies the underlying weakness so you can remediate it everywhere it exists. Without it, the same problem recurs. Fixing only the one system leaves the root cause in place."},{"id":"d7_q_009","domain":"D7","difficulty":"easy","question":"Administrative security controls are PRIMARILY concerned with controlling what?","options":["Technology and system configuration settings","People's operational access to data","Physical access to buildings and data centres","Network perimeter defences and firewall rules"],"answer":1,"explanation":"Administrative security controls provide the means to control people's operational access to data. They are policy-based and process-based controls that govern how people interact with data, systems, and each other — examples include least privilege, need to know, and separation of duties."},{"id":"d7_q_010","domain":"D7","difficulty":"easy","question":"Which principle states that employees should receive ONLY the minimum access necessary to perform their job duties — no more, no less?","options":["Need to Know","Separation of Duties","Least Privilege","Mandatory Vacations"],"answer":2,"explanation":"Least Privilege means granting users the minimum level of access rights required to perform their specific job functions — nothing beyond that. This limits the potential damage from accidents, errors, or malicious actions by ensuring no one has more access than they actually need."},{"id":"d7_q_011","domain":"D7","difficulty":"medium","question":"A hospital employee has database access to all patient records as part of their system role, but is currently treating only patients in Ward A. Under which principle should they NOT access Ward B patient records?","options":["Least Privilege — their access should have been restricted at setup","Need to Know — even with access, you should not access data you have no legitimate reason to view","Separation of Duties — multiple approvals are needed to access different wards","Job Rotation — they need to rotate roles before accessing different areas"],"answer":1,"explanation":"Need to Know means that even if you have been granted system access, you should only access the specific data that you actually need for your current work. Having permission does not equal having a legitimate reason. In the exam, Need to Know and Least Privilege often appear together — Least Privilege controls what access you are granted; Need to Know controls what access you actually use."},{"id":"d7_q_012","domain":"D7","difficulty":"easy","question":"What is the PRIMARY purpose of Separation of Duties as an administrative security control?","options":["To ensure employees are cross-trained across multiple roles","To evenly distribute workload across the team","To prevent fraud and error by requiring more than one person to complete sensitive tasks","To rotate access rights between employees on a regular schedule"],"answer":2,"explanation":"Separation of Duties is an internal control that prevents any single individual from having full control over a sensitive or high-risk task. By requiring multiple people to complete a process, it prevents both intentional fraud and accidental errors — neither collusion nor a single mistake can go undetected."},{"id":"d7_q_013","domain":"D7","difficulty":"medium","question":"Which classic example BEST illustrates why Separation of Duties is required?","options":["Allowing the same administrator to install software and approve change requests","Letting the same person enter a purchase order AND issue the payment cheque","Granting a developer both read and write access to the production database","Allowing the same manager to approve and deny access requests"],"answer":1,"explanation":"The purchase order + payment cheque scenario is the textbook Separation of Duties example. If the same person can create a purchase order AND issue the payment, they could create fraudulent orders and pay themselves. Separating these two steps means collusion would be required to commit fraud, making it far less likely."},{"id":"d7_q_014","domain":"D7","difficulty":"medium","question":"A small startup does not have enough staff to fully implement Separation of Duties. For the CISSP exam, what is the CORRECT approach for this organisation?","options":["The principle does not apply and can be ignored for small organisations","Hire additional staff immediately to enable full Separation of Duties","Use compensating controls to mitigate the residual risk","Apply Least Privilege more strictly to compensate for the missing control"],"answer":2,"explanation":"For the CISSP exam, assume large organisations can implement full Separation of Duties. When that is not practical (small organisations), compensating controls should be in place to mitigate the risk — for example, enhanced logging, supervisory review, periodic audits, or dual approval for critical transactions."},{"id":"d7_q_015","domain":"D7","difficulty":"easy","question":"What is the PRIMARY security benefit of Job Rotation?","options":["It ensures employees are always working in their area of specialisation","It detects errors and fraud, and reduces the chance of collusion between individuals","It reduces the number of privileged accounts needed across the organisation","It satisfies separation of duties when an organisation is too small to use it fully"],"answer":1,"explanation":"Job Rotation detects errors and fraud because a different employee taking over a role will spot irregularities that the previous person may have been hiding. It also makes collusion harder — two people are less likely to maintain a long-term scheme if their roles change regularly."},{"id":"d7_q_016","domain":"D7","difficulty":"easy","question":"Beyond its security benefits, what additional organisational benefit does Job Rotation provide?","options":["It eliminates the need for formal background checks","It allows the organisation to reduce headcount over time","It helps employees understand the entire business and reduces burnout","It removes the requirement for privileged access management"],"answer":2,"explanation":"Job Rotation has non-security benefits too: employees who rotate across roles develop a broader understanding of how the business works, making them more effective collaborators. It also reduces burnout by providing variety in daily work. On the exam, remember that both the security AND operational benefits support its use."},{"id":"d7_q_017","domain":"D7","difficulty":"medium","question":"A security manager is evaluating whether to implement Job Rotation. What is the KEY limitation to consider before adopting it?","options":["Job Rotation conflicts with the principle of least privilege","It can be cost prohibitive — the cost of implementation must justify the benefit","It increases the risk of data breaches during the transition period","Regulators typically prohibit job rotation in financial institutions"],"answer":1,"explanation":"Job Rotation can be cost prohibitive. Training employees for new roles, reduced productivity during transitions, and operational disruption all carry real costs. For the CISSP exam: always verify that the cost of a control justifies its benefit — Job Rotation is a prime example of a valuable control that may not be feasible in every context."},{"id":"d7_q_018","domain":"D7","difficulty":"medium","question":"When implementing Mandatory Vacations, why is it important NOT to give employees too much advance notice of their scheduled leave?","options":["Advance notice creates scheduling conflicts that are difficult to manage","Employees may transfer sensitive files to personal devices before leaving","An employee conducting fraud could use the advance notice to cover their tracks before accounts are locked and audited","Long advance notice periods reduce the effectiveness of the account lock procedure"],"answer":2,"explanation":"The power of Mandatory Vacations as a fraud-detection control lies in its surprise element. If an employee knows weeks in advance that their accounts will be locked and audited, they have time to falsify records, delete evidence, or otherwise clean up any ongoing fraud. Shorter notice windows reduce this window of opportunity."},{"id":"d7_q_019","domain":"D7","difficulty":"medium","question":"An organisation implements Least Privilege, Need to Know, Separation of Duties, Job Rotation, and Mandatory Vacations together. What is the PRIMARY threat that this combination of controls is designed to minimise?","options":["External phishing and social engineering attacks","Insider threats — fraud, errors, and abuse of access by employees","Advanced Persistent Threats (APTs) targeting sensitive data","Data breaches caused by misconfigured cloud storage"],"answer":1,"explanation":"These five administrative personnel security controls work together specifically to minimise insider threats. Each targets a different angle: Least Privilege and Need to Know limit access, Separation of Duties prevents single-person fraud, Job Rotation detects collusion, and Mandatory Vacations audits accounts when the employee cannot interfere. Together they form a layered defence against trusted insiders."},{"id":"d7_q_020","domain":"D7","difficulty":"medium","question":"Which of the following is the MOST important factor to consider when drafting an NDA (Non-Disclosure Agreement)?","options":["The duration — how long the agreement will remain in force","The scope — clearly defining what information is considered confidential","The penalties — the consequences for breaching the agreement","The number of parties — how many signatories are involved"],"answer":1,"explanation":"The scope is the most important element of an NDA because it determines exactly what information is protected. If confidential information is not clearly defined, the agreement provides little meaningful legal protection — even if the duration, penalties, and parties are perfectly drafted. Everything else flows from a clear, precise scope."},{"id":"d7_q_021","domain":"D7","difficulty":"medium","question":"Which of the following is the MOST effective control to prevent fraud within an organisation?","options":["Employee background checks conducted at time of hire","Access controls such as password protection and user permissions","Separation of Duties — ensuring no single individual controls all parts of a process","Physical security measures such as surveillance cameras and locked doors"],"answer":2,"explanation":"Separation of Duties provides continuous checks and balances — no single employee can complete an entire sensitive transaction alone, making undetected fraud far harder. Background checks are a one-time snapshot and do not protect against fraud that develops during employment. Access controls prevent unauthorised access but an employee with the correct access can still commit fraud. Physical security only protects against physical theft, not financial misstatement or data manipulation."},{"id":"d7_q_022","domain":"D7","difficulty":"medium","question":"What is the MAIN difference between the principles of Least Privilege and Need to Know?","options":["Least Privilege is a preventative measure; Need to Know is a reactive measure","Least Privilege focuses on minimising risk; Need to Know focuses on maximising access","Least Privilege limits access to the minimum required for job duties; Need to Know requires a legitimate business reason to access specific data even when access is already granted","Least Privilege is a principle; Need to Know is a policy"],"answer":2,"explanation":"Least Privilege is the access control layer — accounts are provisioned with only the minimum permissions required for the role. Need to Know is the behavioural layer — even if you have the access, you should not access specific data unless you have a genuine current need. Both are proactive principles, both reduce exposure, and both must be satisfied for appropriate data access. Neither is a policy, and neither is reactive."},{"id":"d7_q_023","domain":"D7","difficulty":"easy","question":"From which sources is forensic data NORMALLY obtained during a digital forensics investigation?","options":["Directly from RAM during a live system analysis","From binary images of secondary storage and portable devices — hard drives, flash drives, CDs, DVDs, and cell phones","Exclusively from network packet captures and firewall logs","From operating system event logs and application audit trails only"],"answer":1,"explanation":"Digital forensic data is normally obtained from binary images of secondary storage and portable storage devices such as hard drives, flash drives, CDs, DVDs, and cell phones. These provide persistent, non-volatile storage that retains data even after power loss — making them the primary forensic evidence sources."},{"id":"d7_q_024","domain":"D7","difficulty":"medium","question":"Why do forensic examiners use a bit-stream (binary) image rather than a standard file copy of a storage device?","options":["A bit-stream image is significantly faster to create than a standard file copy","A bit-stream image captures an exact copy of every bit on the device — including unallocated space and deleted data — not just active files","A bit-stream image automatically decrypts encrypted files during the copy process","A bit-stream image compresses the data so it takes less storage space"],"answer":1,"explanation":"A bit-stream (binary) image is a sector-by-sector, bit-for-bit copy of the entire device. Unlike a standard file copy (which only copies active files), it captures deleted data, unallocated space, and slack space — areas that may hold critical forensic evidence. This ensures nothing is missed and the image is forensically complete."},{"id":"d7_q_025","domain":"D7","difficulty":"medium","question":"In the context of IT security and digital forensics, what does 'Real Evidence' refer to?","options":["The actual data files and documents extracted from the seized device","Witness testimony from employees who observed the incident firsthand","Tangible, physical objects — in IT security: the hard disk or USB drive itself, not the data stored on them","Digital logs and audit trails produced by the compromised system"],"answer":2,"explanation":"Real Evidence means tangible, physical objects that can be presented in court. In IT security forensics, this means the physical storage device itself — the hard disk, USB drive, or CD — not the data that lives on it. The data is digital evidence; the physical media is real evidence."},{"id":"d7_q_026","domain":"D7","difficulty":"medium","question":"How is evidence integrity maintained and verified during a digital forensics investigation?","options":["By storing the original device in a tamper-evident bag immediately after seizure","By performing forensic analysis directly on the original device to avoid errors from copying","By photographing the device screen and physical exterior before examination","By generating hash values of both the original and the working copy, verified before and after forensic analysis"],"answer":3,"explanation":"Evidence integrity is maintained by hashing — computing a cryptographic hash (e.g., MD5 or SHA) of both the original and the forensic copy. These hashes are verified before and after analysis. If the hashes match throughout, it proves the data was not altered. All forensic work is performed on the copy, never the original."},{"id":"d7_q_027","domain":"D7","difficulty":"easy","question":"Why must digital forensics ALWAYS be performed on a copy of the evidence, and never on the original?","options":["Working on a copy is faster and more convenient for analysts","Preserving the original ensures its integrity is unquestionable — any changes to the original could destroy evidence and make it legally inadmissible","Originals must be returned to the device owner immediately after seizure","Copies are easier to encrypt and transfer between investigators"],"answer":1,"explanation":"The original must never be altered. If forensic tools or the examination process modify the original in any way, the integrity of the evidence can be challenged in court — potentially making it inadmissible. Working on a verified forensic copy preserves the original in its exact seized state while allowing full analysis."},{"id":"d7_q_028","domain":"D7","difficulty":"easy","question":"What is the purpose of the Chain of Custody in a digital forensics investigation?","options":["To record the technical specifications and file system details of the seized device","To establish the timeline and method of the cyber attack","To prove the integrity of the evidence by documenting who handled it, when, what was done, and where — demonstrating no tampering occurred","To assign legal ownership of the seized device to the investigating authority"],"answer":2,"explanation":"The Chain of Custody is a formal, documented record that tracks evidence from seizure through court. It answers four questions for every person who handled the evidence: Who handled it? When did they handle it? What did they do with it? Where did they handle it? This continuous documentation proves the evidence was not tampered with — which is essential for admissibility."},{"id":"d7_q_029","domain":"D7","difficulty":"medium","question":"After a cyberattack, your team performs digital forensics on a compromised drive. Which of the following BEST describes the PRIMARY purpose of digital forensics?","options":["Determining the root cause and mechanism of the attack","Collecting, analysing, and preserving electronic evidence in a legally admissible manner to identify the attacker and support legal proceedings","Repairing the compromised system and restoring it to full operation","Recommending security improvements to prevent future attacks"],"answer":1,"explanation":"The primary purpose of digital forensics is to collect, analyse, and preserve electronic evidence in a way that is legally admissible — so it can be used to identify the attacker and support prosecution. Determining attack cause is primarily incident response; system repair is recovery; future security recommendations come from security analysts using forensic findings."},{"id":"d7_q_030","domain":"D7","difficulty":"medium","question":"Which forensic imaging method is considered the LEAST effective and should be avoided when possible?","options":["Hardware-based imaging using write-blocker devices","Software-based imaging using specialised forensic tools","Bit-by-bit imaging that captures all data including unallocated space","Live imaging — creating a forensic image while the drive is still actively in use"],"answer":3,"explanation":"Live imaging (imaging a running, active drive) is the least effective method because data on the drive is changing while the image is being created — resulting in an incomplete or corrupted capture. Write operations during imaging can also alter evidence. Hardware and software imaging, and bit-by-bit imaging of a powered-down drive, are all far more reliable."},{"id":"d7_q_031","domain":"D7","difficulty":"hard","question":"After a cyberattack, an analyst suggests remotely accessing the attacker's system to gather evidence. Why is this action illegal in the United States, even though the company is the victim?","options":["The company does not have the technical capability to access external systems","Accessing the attacker's system without authorisation violates the Fourth Amendment and constitutes the same crime the attacker committed","Evidence gathered from external systems is never admissible in court regardless of how it is obtained","The attacker's system is protected by encryption that cannot legally be broken"],"answer":1,"explanation":"The Fourth Amendment protects against unreasonable searches and seizures — victim status does not grant permission to access another party's systems. Connecting to the attacker's system without legal authority is itself unauthorised access, the same crime the attacker committed. The correct approach is to notify law enforcement. The Fourth Amendment can only be legally bypassed through: a subpoena, a search warrant, voluntary surrender, or exigent circumstances (danger to life or imminent evidence destruction)."},{"id":"d7_q_032","domain":"D7","difficulty":"easy","question":"What is the PRIMARY purpose of Incident Management?","options":["To prevent all security incidents from occurring through proactive controls","To have a well-understood and predictable response to security events and computer intrusions","To identify and prosecute attackers who breach the organisation","To minimise the cost of hardware replacement following an incident"],"answer":1,"explanation":"The primary purpose of Incident Management is to ensure a well-understood and predictable response when events or intrusions occur. It defines clear processes and trains teams in advance so that when the stressful reality of an incident hits, everyone knows exactly what to do — removing guesswork under pressure."},{"id":"d7_q_033","domain":"D7","difficulty":"easy","question":"Why is ongoing training especially critical for staff who are part of an incident response team?","options":["To ensure they can build and deploy new security tools during an active incident","To satisfy annual regulatory compliance requirements for the organisation","Because incidents are highly stressful situations — staff must know exactly what to do without hesitation the moment an event occurs","To reduce the organisation's cyber insurance premium by demonstrating readiness"],"answer":2,"explanation":"Incidents are highly stressful. Under that pressure, people revert to what they have trained for — if the training is insufficient, critical steps get skipped or done out of order. Ongoing training and clear, rehearsed procedures ensure staff respond correctly even when under stress."},{"id":"d7_q_034","domain":"D7","difficulty":"medium","question":"A regional power grid failure causes an organisation's data centre to go offline. Which class of incident does this represent?","options":["Natural — the power failure was caused by environmental conditions outside","Human — power companies are operated by humans who failed to maintain the grid","Environmental — power grid failures are part of the operational environment, not a natural disaster","Technical — a subcategory reserved for infrastructure failures"],"answer":2,"explanation":"A power grid failure is an Environmental incident. Environmental incidents involve the operational environment organisations work in — power grids, internet connections, hardware failures, and software flaws. They are NOT the same as Natural incidents (which are caused by nature: hurricanes, floods, earthquakes). The distinction matters on the exam."},{"id":"d7_q_035","domain":"D7","difficulty":"easy","question":"Which class of security incident is considered BY FAR the MOST COMMON?","options":["Natural incidents such as hurricanes, floods, and earthquakes","Environmental incidents such as power failures and hardware faults","Human incidents — whether intentional (attacks, fraud) or unintentional (errors, misconfigurations)","Hybrid incidents combining natural and environmental factors"],"answer":2,"explanation":"Human incidents are by far the most common class. This includes both intentional actions (cyberattacks, insider threats, fraud) and unintentional actions (accidental misconfigurations, human error, policy violations). Most real-world security incidents trace back to human behaviour in some form."},{"id":"d7_q_036","domain":"D7","difficulty":"medium","question":"A disgruntled employee intentionally deletes a critical database. A junior admin separately and accidentally misconfigures a firewall rule. Which incident class applies to BOTH scenarios?","options":["Environmental for both — both involve failures within the organisation's systems","Natural for the accident; Human for the intentional act","Human for both — human incidents encompass both intentional and unintentional actions by people","Technical for both — both involve changes to IT systems"],"answer":2,"explanation":"Both scenarios are Human incidents. The Human class covers both intentional acts (malicious insiders, attackers) and unintentional acts (accidents, errors, negligence). The intent does not change the classification — if a person caused it, it is a Human incident."},{"id":"d7_q_037","domain":"D7","difficulty":"medium","question":"What is the key distinction between a Natural incident and an Environmental incident?","options":["Natural incidents are caused by nature (hurricanes, floods, earthquakes); Environmental incidents involve the operational environment — power grids, internet connections, hardware failures, and software flaws — not natural events","Natural incidents are always more severe and longer-lasting than Environmental incidents","Natural incidents affect only physical locations; Environmental incidents affect only digital systems","Environmental incidents are a subcategory of Natural incidents involving outdoor weather conditions"],"answer":0,"explanation":"Natural incidents are caused by acts of nature: hurricanes, floods, earthquakes, blizzards. Environmental incidents involve the working environment we operate in: power grid outages, internet connectivity failures, hardware failures, software flaws. Environmental is NOT nature — it is the man-made and technical infrastructure around us. This distinction is tested on the CISSP exam."},{"id":"d7_q_038","domain":"D7","difficulty":"easy","question":"Which statement BEST describes an Event in incident management?","options":["A security breach requiring immediate escalation and response","An observable change in state — neither positive nor negative — something has simply changed","A warning generated when a monitored threshold is exceeded","Multiple adverse conditions occurring simultaneously on a network"],"answer":1,"explanation":"An Event is an observable change in state that is neutral — it is neither inherently good nor bad, just something that happened. Examples include a system powering on, traffic moving from one network segment to another, or an application starting. Events only become significant when they trigger alerts or combine into incidents."},{"id":"d7_q_039","domain":"D7","difficulty":"easy","question":"Which of the following is an example of an Event (not an Alert or Incident)?","options":["Memory usage staying at 92% for more than 3 minutes","Multiple simultaneous login failures indicating a brute-force attack","A system powering on or an application starting up","Traffic utilisation climbing above 75% triggering a monitoring warning"],"answer":2,"explanation":"A system powering on or an application starting up are observable changes in state with no inherent negative or positive meaning — they are Events. Memory at 92% for 3 minutes crosses a threshold and triggers an Alert. Multiple login failures pattern into an Incident."},{"id":"d7_q_040","domain":"D7","difficulty":"medium","question":"A monitoring system triggers a warning because network traffic utilisation has exceeded 75%. What type of incident management category does this represent?","options":["An Event — traffic changes are observable, neutral state changes","An Alert — a warning triggered automatically when a specific threshold condition is met","An Incident — network utilisation over 75% is always classified as an incident","A Problem — the root cause of the high traffic is not yet known"],"answer":1,"explanation":"An Alert is a warning that is triggered automatically when a monitored event meets or exceeds a defined threshold — such as traffic above 75% or memory usage at 90% or more for over 2 minutes. The underlying change is an Event; the threshold breach converts it into an Alert that draws human attention."},{"id":"d7_q_041","domain":"D7","difficulty":"medium","question":"What makes an Incident different from a single Event or Alert?","options":["An Incident is always caused by an external attacker, while Events are caused internally","An Incident requires senior management sign-off before response can begin","An Incident involves MULTIPLE adverse events occurring on systems or a network, and is often caused by people","An Incident is any single event that results in data loss or financial damage"],"answer":2,"explanation":"An Incident is defined as multiple adverse events occurring together on systems or a network — not a single isolated event or alert. Incidents are often caused by people (whether malicious insiders, attackers, or accidental user behaviour). The multiplicity and adverse nature distinguish it from a routine Event or a single Alert."},{"id":"d7_q_042","domain":"D7","difficulty":"medium","question":"What distinguishes a Problem from an Incident in incident management terminology?","options":["A Problem is always caused by external attackers; an Incident is caused internally","A Problem is an incident whose root cause is unknown — it requires additional root-cause analysis to prevent recurrence","A Problem takes more than 48 hours to resolve; an Incident is resolved within 24 hours","A Problem only affects physical infrastructure; an Incident only affects digital systems"],"answer":1,"explanation":"A Problem is an incident where the underlying cause is unknown. The response follows similar steps to incident response, but significantly more effort goes into root-cause analysis — understanding exactly what happened so it can be prevented from recurring. Examples include a total internet outage or a server crash where the trigger is unclear."},{"id":"d7_q_043","domain":"D7","difficulty":"medium","question":"A company experiences a complete internet outage. Responders follow incident response procedures but cannot determine the cause. They spend considerable extra time on analysis to understand what happened and prevent recurrence. How is this classified?","options":["An Incident — multiple adverse events are clearly affecting the network","An Alert — the outage triggered multiple monitoring thresholds","A Problem — an incident with an unknown cause requiring root-cause analysis to prevent it from happening again","A Critical Event — a special category for organisation-wide outages"],"answer":2,"explanation":"This is a Problem. A Problem is an incident where the cause is unknown. The team follows incident response steps but must invest significantly more effort in root-cause analysis. Total internet outages and server crashes that have no clear trigger are classic examples of Problems. Identifying the root cause is essential to stop it from recurring."},{"id":"d7_q_044","domain":"D7","difficulty":"easy","question":"An organisation's main data centre becomes completely unusable for 31 hours due to a flooding event. Which incident severity category does this represent?","options":["Inconvenience — the organisation can recover quickly with redundant systems","Emergency — the flooding created a potential risk to life and property","Disaster — the entire facility is unusable for 24 hours or longer","Catastrophe — large-scale flooding always qualifies as a catastrophe"],"answer":2,"explanation":"A Disaster is defined as the entire facility being unusable for 24 hours or longer. At 31 hours, this scenario meets that threshold. Note that geographic diversity and redundant systems can significantly mitigate disaster impact — if workloads can be shifted to another site, the organisation may avoid the full consequences."},{"id":"d7_q_045","domain":"D7","difficulty":"easy","question":"A single server in a three-node cluster fails. The remaining two nodes continue to handle all workloads without any service interruption. Which incident severity category is this?","options":["Inconvenience — a non-disruptive failure; operations continue normally","Emergency — hardware failure has the potential to escalate to loss of service","Disaster — a server failure in a production cluster is always a disaster","Problem — the root cause of the failure is unknown"],"answer":0,"explanation":"An Inconvenience (also called a Non-disaster) is a non-disruptive failure — systems continue to function and no significant harm is caused. A single server failing in a redundant cluster while operations continue normally is the textbook example. Compare: a hard disk failure in a RAID array, or one node down in a cluster, are inconveniences, not disasters."},{"id":"d7_q_046","domain":"D7","difficulty":"easy","question":"Which incident severity category is specifically characterised by the POTENTIAL for loss of life or property?","options":["Inconvenience — the lowest category involving physical risk","Emergency (Crisis) — an urgent situation with potential for loss of life or property","Disaster — a disaster always involves risk to life when the facility is unusable","Catastrophe — only total facility destruction creates life-safety risk"],"answer":1,"explanation":"An Emergency (or Crisis) is an urgent situation specifically defined by the potential for loss of life or property. This distinguishes it from an Inconvenience (non-disruptive, no life safety risk) and a Disaster (facility unusable 24+ hours, which may or may not involve life-safety risk). Emergency demands urgent, immediate action."},{"id":"d7_q_047","domain":"D7","difficulty":"medium","question":"What is the KEY difference between a Disaster and a Catastrophe in incident management?","options":["A Disaster lasts less than 24 hours; a Catastrophe lasts longer than 24 hours","A Disaster affects only digital systems; a Catastrophe affects physical infrastructure","A Disaster means the facility is unusable for 24+ hours; a Catastrophe means the facility is completely destroyed","A Disaster can be recovered from on-site; a Catastrophe requires an alternate recovery site"],"answer":2,"explanation":"The distinction is severity of facility impact: a Disaster means the entire facility is unusable for 24 hours or longer (but it still exists and can be returned to). A Catastrophe means the facility itself is destroyed — there is nothing to return to. Catastrophe requires complete reliance on alternate or redundant sites."},{"id":"d7_q_048","domain":"D7","difficulty":"medium","question":"Which strategy MOST effectively reduces the impact of a Disaster on an organisation?","options":["Increasing the number of security guards at the primary facility","Having a well-documented incident response plan stored at the facility","Geographic diversity and redundancy — distributing systems across multiple locations","Performing daily backups of all critical systems on-site"],"answer":2,"explanation":"Geographic diversity and redundancy are the most effective mitigations against a Disaster. If systems, data, and operations are distributed across multiple geographic locations, the loss of one facility for 24+ hours does not cripple the entire organisation — other sites can absorb the workload. On-site backups and guards do not help when the facility itself is inaccessible."},{"id":"d7_q_049","domain":"D7","difficulty":"medium","question":"A severe snowstorm forces a company's headquarters to close for three days, making all on-site systems inaccessible. How should this be classified?","options":["Inconvenience — weather events are non-disruptive by definition","Emergency — snow creates a potential risk to employee safety","Disaster — the facility is unusable for more than 24 hours","Natural — weather events are classified by their cause, not their impact"],"answer":2,"explanation":"A snowstorm that renders the facility unusable for 3 days (72 hours) is a Disaster — the classification is based on impact (facility unusable for 24+ hours), not the cause. Natural events like snowstorms absolutely can be Disasters. This is a common exam scenario: do not confuse the incident class (Natural) with the severity level (Disaster)."},{"id":"d7_q_050","domain":"D7","difficulty":"easy","question":"Which phase of the incident response lifecycle is most often overlooked or skipped by organisations?","options":["Detection and Identification — teams move straight to containment","Reporting — organisations avoid documenting incidents to limit liability","Lessons Learned — organisations move on once the problem is resolved","Recovery — teams resume operations before fully restoring systems"],"answer":2,"explanation":"Lessons Learned is the most commonly skipped phase of incident response. Once the problem is removed and controls are implemented, organisations feel the incident is over and move on — but skipping this phase means missing critical insight into what worked, what failed, and how to prevent the next incident."},{"id":"d7_q_051","domain":"D7","difficulty":"easy","question":"At the conclusion of the Lessons Learned phase, who receives the final report produced by the security team?","options":["The affected users and department heads who were impacted","Senior management — with the team's findings and recommendations","External auditors and regulatory bodies for compliance purposes","The incident response team for internal reference only"],"answer":1,"explanation":"The Lessons Learned phase concludes with a formal report to senior management. The security team presents findings and can make recommendations, but it is important to understand they can only suggest — senior management is ultimately in charge and holds final decision-making authority and liability for the organisation's security posture."},{"id":"d7_q_052","domain":"D7","difficulty":"medium","question":"In the Lessons Learned process, the IT Security team produces findings and makes recommendations. Who is ultimately responsible and liable for security decisions in the organisation?","options":["The CISO — as the designated head of information security","The incident response team lead — they directed the response","Senior management — they are ultimately in charge of and liable for the organisation","External auditors — they validate security controls and bear compliance responsibility"],"answer":2,"explanation":"IT Security can only make suggestions — it is senior management who is ultimately in charge and legally liable. This is why Lessons Learned reports go upward: security professionals inform and advise, but management owns the decision and the accountability. This also explains why management buy-in is critical for effective security programs."},{"id":"d7_q_053","domain":"D7","difficulty":"medium","question":"Where do the outcomes and changes identified during the Lessons Learned phase feed into the incident response lifecycle?","options":["Directly into Detection — so monitoring and alerting are improved immediately","The Preparation phase — improving readiness, training, and controls before the next incident","The Reporting phase — to update compliance records and audit trails","The Recovery phase — to make system restoration faster after future incidents"],"answer":1,"explanation":"Lessons Learned outputs feed back into the Preparation phase — the very beginning of the incident response lifecycle. Improved controls, updated playbooks, better training, and revised safeguards all flow into making the organisation more prepared before the next incident occurs. This creates a continuous improvement cycle."},{"id":"d7_q_054","domain":"D7","difficulty":"medium","question":"After a major security incident, what organisational shift often occurs regarding the role of IT Security?","options":["Organisations typically reduce the IT Security budget after bearing the incident costs","Organisations shift to a top-down approach and senior management becomes more willing to listen to IT Security","Organisations outsource IT Security entirely to reduce future liability","The incident response team gains full autonomous authority over all future security investments"],"answer":1,"explanation":"Major incidents create a significant shift in organisational culture: management has experienced real-world consequences and becomes more receptive to IT Security recommendations. This top-down support — where leadership actively backs security initiatives — is one of the few positive outcomes of a serious incident. This is why Lessons Learned is so important: it captures the moment when management is most likely to act."},{"id":"d7_q_055","domain":"D7","difficulty":"medium","question":"Beyond analysing the specific security incident itself, what else does the Lessons Learned phase evaluate?","options":["The financial cost of each tool and resource used during the response","How well the organisation handled the incident — what worked, what did not, and how to grow for next time","Whether the attacker should face criminal prosecution","The total number of unpatched vulnerabilities remaining in the environment"],"answer":1,"explanation":"Lessons Learned evaluates both the incident and the response: Was the process followed? Did the team communicate effectively? What controls worked and which failed? Fixing one vulnerability may still leave hundreds of unknown vulnerabilities — the broader goal is organisational growth and continuous improvement so the team handles the next incident better."},{"id":"d8_q_001","domain":"D8","difficulty":"medium","question":"On a CISSP question about the SDLC, an answer option describes the phases but never mentions 'secure' or 'security'. What should you do?","options":["Select it — security is implied","Eliminate it — for the exam, the SDLC always includes security in each phase","Select it only if it mentions testing","It depends on the methodology"],"answer":1,"explanation":"For the exam, the SDLC always has security built into each phase. If an SDLC answer omits 'secure' or 'security', it's wrong and can be eliminated."},{"id":"d8_q_002","domain":"D8","difficulty":"hard","question":"In Scrum, who is responsible for removing impediments to the team and ensuring the framework is followed, acting as a buffer rather than a traditional manager?","options":["Product Owner","Development Team","Scrum Master","Project Sponsor"],"answer":2,"explanation":"The Scrum Master facilitates, removes impediments, and ensures the Scrum framework is followed — acting as a buffer, NOT a traditional team lead or project manager. The Product Owner is the voice of the customer."},{"id":"d8_q_003","domain":"D8","difficulty":"medium","question":"A well-structured software system should have which combination of coupling and cohesion?","options":["High coupling and high cohesion","Low coupling and low cohesion","Low coupling and high cohesion","High coupling and low cohesion"],"answer":2,"explanation":"Low coupling (modules are independent) plus high cohesion (elements inside a module belong together) indicates a well-structured, readable, maintainable design."},{"id":"d8_q_004","domain":"D8","difficulty":"hard","question":"A foreign key in a child table does not match any primary key in the parent table. Which database integrity is broken?","options":["Semantic integrity","Entity integrity","Referential integrity","User-defined integrity"],"answer":2,"explanation":"Referential integrity requires every foreign key to match a primary key in the parent table. It's broken when a foreign key has no matching primary key. Entity integrity = unique non-null primary key; semantic = value matches data type."},{"id":"d8_q_005","domain":"D8","difficulty":"medium","question":"Which set of SQL statements belongs to the Data Definition Language (DDL)?","options":["SELECT, INSERT, UPDATE, DELETE","CREATE, ALTER, DROP","GRANT, REVOKE, COMMIT","BEGIN, ROLLBACK, SAVEPOINT"],"answer":1,"explanation":"DDL defines database structures: CREATE, ALTER, DROP. DML (Data Manipulation Language) works with the data itself: SELECT, INSERT, UPDATE, DELETE."},{"id":"d1_q_009","domain":"D1","difficulty":"easy","question":"During an attack, some of your data was deleted. Which leg of the CIA triad would be MOST affected?","options":["Availability — the data can no longer be accessed by authorized users","Confidentiality — unauthorized individuals may have seen the data before deletion","Integrity — the data is no longer accurate or complete","Authenticity — the origin of the data can no longer be verified"],"answer":0,"explanation":"Availability means authorized users can access data when needed. Deletion directly removes that access, making availability the primary impact. Integrity is also affected (data is incomplete), but the principal issue is that the data is simply gone and unavailable."},{"id":"d1_q_010","domain":"D1","difficulty":"medium","question":"You are the IT security manager at a large pharmaceutical company with sensitive research data and proprietary manufacturing processes. Which aspect of the CIA triad is MOST important to prioritize?","options":["Confidentiality — to prevent unauthorized access to sensitive research and proprietary processes","Integrity — to ensure research data is not altered or tampered with","Availability — to ensure authorized staff can always access the data they need","All three are equally important and must be addressed together"],"answer":0,"explanation":"In a pharmaceutical co
