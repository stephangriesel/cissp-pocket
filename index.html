ared key, n(n-1)/2 keys. Asymmetric: no pre-shared key (2n keys), but slower and weaker per bit. Hybrid uses asymmetric to exchange a symmetric session key."},{"id":"d3_fc_027","domain":"D3","front":"How many keys for symmetric vs. asymmetric with n users?","back":"Symmetric: n(n-1)/2 keys (becomes unmanageable). Asymmetric: 2n keys (2 per user — a public/private key pair each)."},{"id":"d3_fc_028","domain":"D3","front":"Name common symmetric algorithms (DES, 3DES, AES, etc.).","back":"DES (insecure, 56-bit, 64-bit block, Feistel), 3DES (K1=112-bit, secure to 2030), AES/Rijndael (secure, transposition+substitution), IDEA, Blowfish (insecure), Twofish (secure), RC4 (insecure, stream), RC5/RC6 (secure)."},{"id":"d3_fc_029","domain":"D3","front":"AES — how many cycles for each key length?","back":"AES (Rijndael), symmetric, 4×4 byte matrix. 128-bit key = 10 cycles, 192-bit = 12 cycles, 256-bit = 14 cycles. Uses both transposition and substitution; considered secure, open source."},{"id":"d3_fc_030","domain":"D3","front":"Name common asymmetric algorithms.","back":"Diffie-Hellman (key exchange, 1976), RSA (prime factorization, 1977), ECC (elliptic curve, strong per bit, low-power devices — 256-bit ECC ≈ 3072-bit RSA), ElGamal, DSA (signing), Knapsack (insecure)."},{"id":"d3_fc_031","domain":"D3","front":"Which math problems underpin RSA, Diffie-Hellman, and ECC?","back":"RSA: prime number factorization (easy to multiply, hard to factor). Diffie-Hellman: discrete logarithms. ECC: discrete logarithms applied to elliptic curves (much stronger per bit)."},{"id":"d3_fc_032","domain":"D3","front":"Hash functions — what do they provide and what's a collision?","back":"Integrity. Variable-length input → fixed-length output (message digest). A collision is when two different inputs produce the same hash (possible but unlikely). Changing even 1 bit completely changes the hash."},{"id":"d3_fc_033","domain":"D3","front":"MD5 vs. SHA1 vs. SHA2 vs. SHA3 — security & size.","back":"MD5: 128-bit, collisions found, still widely used. SHA1: 160-bit, weak collision avoidance. SHA2: collision resistant. SHA3: finalized Aug 2015. Remember: variable-length input, fixed-length output."},{"id":"d3_fc_034","domain":"D3","front":"What does a Digital Signature provide, and how is it made?","back":"Provides Integrity and Non-Repudiation. You hash your message, then encrypt the hash with YOUR PRIVATE KEY. Recipient decrypts with your public key and compares hashes — if they match, the message is unaltered and authentic."},{"id":"d3_fc_035","domain":"D3","front":"What is a digital certificate, and who issues/revokes it?","back":"A public key signed with a digital signature. The CA (Certification Authority) issues and revokes certificates (internal or public like Verisign). CRL lists revoked certs (server-side); OCSP is the faster client/server hybrid replacement."},{"id":"d3_fc_036","domain":"D3","front":"IPSec — what do AH and ESP provide?","back":"AH (Authentication Header): authentication and integrity, NOT confidentiality, protects against replay. ESP (Encapsulation Security Payload): confidentiality, and can also provide authentication and integrity."},{"id":"d3_fc_037","domain":"D3","front":"IPSec Tunnel mode vs. Transport mode","back":"Tunnel mode: encrypts and authenticates the ENTIRE package including headers. Transport mode: only encrypts/authenticates the payload (used for systems that speak IPSec). IKE negotiates the algorithm selection."},{"id":"d3_fc_038","domain":"D3","front":"What is the One-Time Pad and why is it special?","back":"Plaintext combined with a truly random key. It is the ONLY mathematically unbreakable encryption — but impractical: one use per pad (never reuse), characters must be truly random, pads kept secure. (KGB reused pads → Project VENONA decoded them.)"},{"id":"d3_fc_039","domain":"D3","front":"Pass the Hash vs. Golden Ticket vs. Silver Ticket (Kerberos)","back":"Pass the Hash: use a stolen password hash + user ID to access. Silver Ticket: forged TGS ticket from a service account's NTLM hash (service privileges). Golden Ticket: forged from the krbtgt account hash — create ANY ticket in the domain."},{"id":"d3_fc_040","domain":"D3","front":"Known Plaintext vs. Chosen Plaintext vs. Adaptive Chosen Plaintext","back":"Known Plaintext: you know plaintext + ciphertext, try to find the key. Chosen Plaintext: attacker CHOOSES the plaintext. Adaptive Chosen Plaintext: attacker adapts each round based on the previous round's results."},{"id":"d3_fc_041","domain":"D3","front":"What is a Side Channel Attack?","back":"Using PHYSICAL data to break a crypto system — CPU cycles, power consumption, timing, temperature, electromagnetic emanations — rather than attacking the algorithm itself."},{"id":"d3_fc_042","domain":"D3","front":"What is Key Escrow vs. a Key Repository?","back":"Key Escrow: keys held by a 3rd party (often law enforcement). Key Repository: a central, secure store of key pairs; best practice requires TWO security admins to retrieve a key pair to reduce compromise risk."},{"id":"d3_fc_043","domain":"D3","front":"Perimeter physical controls — fences, bollards, lights, CCTV (what category each).","back":"Fences (deterrent/preventative — 8ft+ prevents). Bollards (preventative — stop vehicles, allow foot traffic). Lights (detective/deterrent — measured in lux/lumens). CCTV (detective/deterrent)."},{"id":"d3_fc_044","domain":"D3","front":"What is a Mantrap?","back":"A room with two doors — Door 1 must fully close before Door 2 opens. Each door uses a different authentication method. Can use weight sensors to detect tailgating. Must allow safe evacuation in emergencies (people > stuff)."},{"id":"d3_fc_045","domain":"D3","front":"Why should data center walls be 'slab to slab'?","back":"Walls should run from the REAL floor to the REAL ceiling so attackers can't bypass via crawl spaces above sub-ceilings or below sub-floors. Defense in depth fails if there's an unsecured path in."},{"id":"d3_fc_046","domain":"D3","front":"Power fluctuation terms: Blackout, Brownout, Fault, Sag, Surge, Spike.","back":"Blackout = long power loss. Fault = short power loss. Brownout = long low voltage. Sag = short low voltage. Surge = long high voltage. Spike = short high voltage."},{"id":"d3_fc_047","domain":"D3","front":"What humidity range should a data center maintain, and why?","back":"40%–60% relative humidity. Low humidity causes static electricity; high humidity corrodes metals (electronics). Temperature: 68–77°F (20–25°C) typical."},{"id":"d3_fc_048","domain":"D3","front":"What three things does a fire need, and how do suppression methods work?","back":"Oxygen, Heat, Fuel. Remove any one to extinguish. Remove oxygen (Halon, FM200, Argon, CO2). Remove heat (water, chemicals). Removing fuel is rare (the fuel is your equipment)."},{"id":"d3_fc_049","domain":"D3","front":"Wet pipe vs. Dry pipe vs. Deluge vs. Pre-action sprinklers","back":"Wet pipe: pipes always full of water. Dry pipe: pipes hold compressed air (for frost-prone areas). Deluge: heads are OPEN, deluge valve holds water back. Pre-action: water enters only after fire alarm AND head opens (double interlock)."},{"id":"d3_fc_050","domain":"D3","front":"What is the PASS method for fire extinguishers?","back":"Pull the pin, Aim at the base of the fire, Squeeze the lever slowly, Sweep side to side. Never use an extinguisher on a fire class it wasn't designed for."},{"id":"d3_fc_051","domain":"D3","front":"Why is Halon no longer installed, and what replaced it?","back":"Halon depletes atmospheric ozone (banned by the Montreal Accord/Protocol for new production since 1994). Replacements: Argon, FE-13, FM-200 (HFC-227ea), Inergen. Gas systems need a visible/audible countdown for staff to exit."},{"id":"d3_fc_052","domain":"D3","front":"CO2 fire suppression — what's the danger?","back":"CO2 should only be used in UNMANNED areas — it's colorless and odorless, displaces oxygen, and causes people to pass out and die. Staff in CO2 areas need proper safety training."},{"id":"d3_fc_053","domain":"D3","front":"Confusion vs. Diffusion vs. Substitution vs. Permutation","back":"Confusion: relationship between plaintext and ciphertext (as random as possible). Diffusion: dispersing the order of plaintext in ciphertext. Substitution: replace one character with another (confusion). Permutation/transposition: rearranging characters (also confusion)."},{"id":"d3_fc_054","domain":"D3","front":"What is the difference between SCADA, DCS, and PLC?","back":"ICS = umbrella term. SCADA: supervisory control with GUI for high-level process management. DCS: distributed autonomous controllers with central supervisory control. PLC: ruggedized industrial digital computer controlling manufacturing processes."},{"id":"d3_fc_055","domain":"D3","front":"Java applets vs. ActiveX","back":"Java applets: run in a SANDBOX (segmented from OS), OS-agnostic. ActiveX: runs with certificates (NOT sandboxed), interacts more with the OS, Windows only."},{"id":"d3_fc_056","domain":"D3","front":"Cloud deployment models — Private, Public, Hybrid, Community","back":"Private: org builds/runs its own cloud infrastructure.\nPublic: shared tenancy — provider rents to anyone (AWS, Azure, Google).\nHybrid: mix of private + public; sensitive data stays private.\nCommunity: restricted to a group sharing mission, policy, or compliance needs."},{"id":"d3_fc_057","domain":"D3","front":"Malware types — Virus, Worm, Trojan, Logic Bomb, Ransomware, Rootkit, Spyware","back":"Virus: attaches to files, needs user action to spread.\nWorm: self-replicates across networks, no user action needed.\nTrojan: disguised as legitimate software, no self-replication.\nLogic Bomb: dormant code that triggers on a date/event.\nRansomware: encrypts data, demands payment for the key.\nRootkit: hides itself and other malware at OS/firmware level.\nSpyware: covertly monitors user activity."},{"id":"d3_fc_058","domain":"D3","front":"Logic Bomb vs. Backdoor vs. Trapdoor","back":"Logic Bomb: malicious code that executes when a condition is met (date, login, event). Planted by insiders; delayed detonation aids evasion.\nBackdoor/Trapdoor: a hidden entry point bypassing normal authentication. Backdoors are intentionally placed; trapdoors are often left by developers.\nKey difference: logic bombs explode once; backdoors provide persistent covert access."},{"id":"d3_fc_059","domain":"D3","front":"CPU instruction cycle — Fetch, Decode, Execute","back":"Fetch: CPU retrieves the next instruction from memory.\nDecode: CPU interprets what operation the instruction requires.\nExecute: CPU carries out the operation.\nInterrupt: a hardware or software signal that pauses the current task so the CPU can handle a higher-priority event, then resumes. Runs at Ring 0 (kernel)."},{"id":"d3_fc_060","domain":"D3","front":"ICS/SCADA common security vulnerabilities","back":"1. Unpatched software — costly/risky upgrades leave known flaws unmitigated (most critical).\n2. Inadequate network segmentation — ICS connected to corporate or internet networks.\n3. Weak authentication — default or shared credentials.\n4. Legacy OS — systems too old to patch.\n5. Lack of encryption — plaintext industrial protocols (Modbus, DNP3).\nKey rule: never connect ICS directly to the internet; air-gap where possible."},{"id":"d3_fc_061","domain":"D3","front":"IoT security vulnerabilities","back":"Common weaknesses:\n· Lack of strong authentication (default/hardcoded credentials)\n· Inability to patch/update firmware\n· Inadequate data encryption in transit\n· Large attack surface (many always-on devices)\n· No physical security on deployed devices\nNOT a vulnerability: robust security measures (that would be a strength)."},{"id":"d3_fc_062","domain":"D3","front":"VM intra-host traffic — security implication","back":"Traffic between VMs on the same physical host never touches the physical network — it stays inside the hypervisor's virtual switch.\nImplication: traditional network-based security tools (IDS, firewalls, packet captures) are BLIND to this traffic.\nMitigation: deploy virtual network appliances or agent-based monitoring inside the hypervisor."},{"id":"d3_fc_063","domain":"D3","front":"Salt vs. Nonce in cryptography","back":"Salt: random data added to a password BEFORE hashing. Stored alongside the hash. Defeats rainbow tables and dictionary attacks by making identical passwords produce different hashes.\nNonce (number used once): random value used once per session/operation. Prevents replay attacks in authentication protocols. Also used as initialization vectors (IVs) in block cipher modes (e.g. CBC)."},{"id":"d3_fc_064","domain":"D3","front":"MitM (Man-in-the-Middle) attack — types and mitigations","back":"MitM = attacker secretly intercepts and can alter communication between two parties (session hijacking).\nVariants:\n· ARP Poisoning: links attacker MAC to victim IP on LAN\n· SSL Stripping: downgrades HTTPS to HTTP\n· DNS Spoofing: redirects domain to attacker IP\nMitigations: mutual TLS, certificate pinning, HSTS, encrypted DNS (DoH/DoT)."},{"id":"d3_fc_065","domain":"D3","front":"Cryptanalysis techniques","back":"Frequency Analysis: exploits letter frequency patterns in monoalphabetic ciphers (most effective against substitution ciphers).\nTransposition: ciphertext = plaintext characters REARRANGED.\nSubstitution: ciphertext = plaintext characters REPLACED.\nBrute Force: try every possible key.\nKnown Plaintext: attacker has plaintext + ciphertext pairs to deduce the key.\nChosen Plaintext: attacker can encrypt arbitrary plaintexts to analyse patterns."},{"id":"d3_fc_066","domain":"D3","front":"Mobile device security — key controls","back":"Most effective against malware: keep the OS updated (patches known exploits).\nPhysical security: screen lock, remote wipe.\nApp hygiene: install from official stores only, review permissions.\nNetwork: avoid untrusted Wi-Fi, use VPN.\nMDM (Mobile Device Management): enforces policy, enables remote wipe, controls app installs.\nNote: firewalls on mobile help but are not the primary malware defence."},{"id":"d3_fc_067","domain":"D3","front":"IPSec — VPN use, IPv4 bolt-on security & AH + ESP together","back":"IPSec adds a cryptographic layer to IP traffic (IPv4 and IPv6).\nIPv4 was designed for secure military/research networks — it has no built-in security for today's open internet (hence 'bolt-on' security via IPSec).\nVPN: IPSec tunnels traffic over the internet while preserving local-network feel and security.\nAH + ESP: can be used together (auth + integrity from AH, confidentiality from ESP) or separately.\nCommon VPN choice: ESP alone (confidentiality + optional auth/integrity) to avoid double overhead."},{"id":"d3_fc_068","domain":"D3","front":"SSL vs TLS — versions, differences & what they share","back":"SSL (Secure Sockets Layer): Netscape, mid-1990s. Versions 1.0, 2.0, 3.0 — ALL deprecated due to vulnerabilities.\nTLS (Transport Layer Security): IETF successor to SSL 3.0. Versions 1.0 → 1.1 → 1.2 → 1.3 (current, 2018).\nPrimary difference: TLS is newer and more secure; SSL is obsolete.\nWhat both share: asymmetric crypto for key exchange (handshake) + symmetric crypto for bulk data transfer.\nHTTPS = HTTP over TLS (still called 'SSL' colloquially but TLS is the actual protocol)."},{"id":"d3_fc_069","domain":"D3","front":"TCP 3-way handshake — steps and purpose","back":"Purpose: establishes a reliable, connection-oriented session before data transfer.\n1. SYN — client sends synchronize packet with its sequence number.\n2. SYN-ACK — server acknowledges client SYN and sends its own sequence number.\n3. ACK — client acknowledges server's SYN-ACK. Connection established.\nMemory: 'I want to connect' → 'OK, and I want to connect' → 'OK'\nSecurity note: SYN flood attack exploits the handshake by sending many SYN packets without completing the ACK, exhausting server resources."},{"id":"d3_fc_070","domain":"D3","front":"Physical security — preventative barriers vs detective controls","back":"Preventative (physically stop intrusion):\n· Fences & gates — primary perimeter barrier; first line of defence\n· Bollards — stop vehicles\n· Mantraps — two-door airlock; stops tailgating\n· Locked doors — deny entry to unauthorised individuals\n\nDetective/Deterrent (detect or discourage, but don't stop):\n· CCTV — records incidents; deters if visible\n· Motion sensors — alert once someone is already inside\n· Guard dogs — can detect quickly but can be bypassed\n· Lights — illuminate; act as deterrent\n\nKey exam point: cameras and sensors do NOT physically prevent access."},{"id":"d3_fc_071","domain":"D3","front":"Data center physical structure — secure box requirements","back":"Core concept: treat the data center as a fully enclosed secure 'box'.\n· Slab-to-slab walls: run floor-to-ceiling (no sub-ceiling gaps attackers can crawl through)\n· Materials: reinforced concrete or cinder block — NOT sheetrock/drywall (easily breached)\n· Fire rating: walls AND doors must carry the appropriate fire rating\n· Ceiling & floor: part of the secure perimeter — equally reinforced\n\nVulnerabilities to avoid:\n· Sub-ceilings / sub-floors create hidden bypass routes\n· Glass walls expose assets and are easy to breach\n· Lightweight partitions undermine all other controls"},{"id":"d3_fc_072","domain":"D3","front":"Site & facility security design — starting with threats","back":"Most important first step: identify potential threats to the site.\nCategories:\n· Natural: floods, earthquakes, fire, lightning, extreme weather\n· Human: theft, vandalism, sabotage, unauthorised access\n· Environmental: power failure, HVAC failure, chemical spill\n\nProcess: Threats → Risk Analysis → Control Selection → Budget/Personnel\nKey point: location, budget, and staffing are secondary inputs — controls must be tailored to the specific threat profile, not generic assumptions."},{"id":"d3_fc_073","domain":"D3","front":"UPS load balancing & power redundancy in data centers","back":"UPS (Uninterruptible Power Supply): provides short-term battery power during outages and conditions power.\nRedundancy best practice:\n· Distribute server connections EVENLY across all UPSs\n· Connect servers to UPSs on OPPOSITE sides of the room so each server has two power paths\n· Balanced load prevents any single UPS from being overloaded\n· Uneven load = overload risk → cascading failure → widespread outage\n\nRelated: generators provide long-term backup; PDUs distribute power within racks."},{"id":"d3_fc_074","domain":"D3","front":"Backup strategies — offsite, 3-2-1 rule & media types","back":"Core principle: backups must survive the same disaster that destroys the original.\n\n3-2-1 Rule:\n· 3 copies of data\n· 2 different media types\n· 1 copy offsite\n\nWhy offsite beats same-site:\nFire/flood/earthquake can destroy both original + same-site backup simultaneously.\n\nMedia comparison:\n· Tape: high capacity, low cost, slow restore, degrades over time, needs special hardware\n· Disk/NAS: fast, but same-site risk if not replicated\n· Cloud: flexible, off-site by nature, but vulnerable to cyber attack; restore speed varies\n\nBest practice: combine media types and test restores regularly."},{"id":"d3_fc_075","domain":"D3","front":"Server hardening checklist","back":"Goal: reduce attack surface before a server goes to production.\n\nDO (hardening steps):\n· Install latest security patches\n· Change ALL default passwords (admin, service accounts)\n· Disable unnecessary services, ports, and protocols\n· Remove unused software and accounts\n· Enable host-based firewall and logging\n· Replace insecure protocols: FTP → SFTP/FTPS, Telnet → SSH\n\nDO NOT:\n· Enable automatic updates in production (risk of untested changes breaking services)\n· Leave FTP enabled (clear-text credentials)\n· Keep default configs (widely known, easily exploited)"},{"id":"d3_fc_076","domain":"D3","front":"UPS efficiency & power fluctuation impact on CIA triad","back":"UPS efficiency = runtime (how long it provides power during an outage).\nNot: cost, physical size, or wattage output — those are capacity specs, not efficiency.\n\nCIA impact of power fluctuations:\n· Availability — PRIMARY impact. Outages/slowdowns prevent users from accessing systems.\n· Integrity — SECONDARY. Power loss mid-write can corrupt data, but journaling file systems and transactional databases reduce this risk.\n· Confidentiality — INDIRECT. Power loss alone does not expose data to unauthorised users.\n\nSurge vs Spike (from d3_fc_046): Surge = sustained high voltage. Spike = brief high voltage. Both damage hardware."},{"id":"d3_fc_077","domain":"D3","front":"Fire detector types — smoke, heat, flame & photoelectric vs ionisation","back":"Smoke detectors (two types):\n· Photoelectric: light source + sensor; smoke scatters light onto sensor → alarm. Best for slow, smouldering fires.\n· Ionisation: uses radioactive material; smoke disrupts ion flow → alarm. Best for fast, flaming fires.\n\nHeat detectors: trigger when temperature exceeds a threshold or rises rapidly. Lower false-alarm rate; slower detection.\n\nFlame detectors: sense infrared or UV radiation from active flames. Used in industrial/open environments.\n\nSeparate sensors: CO2 detectors, water/flood sensors — different devices for different hazards."},{"id":"d3_fc_078","domain":"D3","front":"HVAC in data centers — function, indicators & humidity","back":"Primary function: maintain proper airflow (ventilation + thermal comfort).\nMost important indicator: proper airflow — if airflow fails, equipment overheats regardless of efficiency or cost.\n\nData center specifics:\n· Temperature: typically 64–80°F (18–27°C)\n· Humidity: 40–60% relative humidity (see d3_fc_047 for detail)\n· Hot aisle / cold aisle layout optimises airflow between server racks\n\nHVAC failure impact: overheating → hardware failure → Availability compromised.\nEnergy efficiency, maintenance cost, and lifespan are secondary to actual airflow performance."},{"id":"d3_fc_079","domain":"D3","front":"Emergency response priorities & evacuation planning","back":"Priority order in any emergency:\n1. Human life & safety — always first (injured get help before anything else)\n2. Evacuation — once immediate medical needs are addressed\n3. Security protocols — manage the situation, prevent further harm\n4. Protect assets / confidential data — last priority\n\nEvacuation planning must include:\n· All employees — including those with disabilities or special needs\n· Alternatives when elevators shut down (evacuation chairs, refuge areas, assistance teams)\n· Regular drills that include special-needs procedures — never leave them untested\n· Mantraps must allow safe evacuation (people > security)\n\nNatural disaster first step: ensure employee safety THEN activate DR plan."},{"id":"d3_fc_080","domain":"D3","front":"Antivirus types — signature-based vs heuristic","back":"Signature-based:\n· Uses a database of known malware fingerprints (signatures)\n· MUST be constantly updated — can only detect known threats\n· Fast and accurate for known malware; blind to new/zero-day threats\n\nHeuristic:\n· Analyses program behaviour and code patterns\n· Can detect unknown or variant malware without signature updates\n· Higher false-positive rate than signature-based\n\n'Formal' and 'embedded' are not standard AV types."},{"id":"d3_fc_081","domain":"D3","front":"Demarc — Point of Demarcation in telecommunications","back":"Demarc (POD — Point of Demarcation): the physical boundary where the ISP's responsibility ends and the customer's begins.\n· ISP side: ISP owns, maintains, and is liable for\n· Customer side: customer owns, configures, and secures\n\nTypically a box or panel in the building (e.g. NID — Network Interface Device for DSL/POTS).\nSignificance: defines who to call when there is a problem and who is responsible for security on each side."},{"id":"d3_fc_082","domain":"D3","front":"Multiprocessing vs multitasking vs multithreading vs multiprogramming","back":"Multiprocessing: multiple CPUs work simultaneously on tasks → hardware-level parallelism.\n\nMultithreading: one process split into multiple threads running concurrently (on one or more CPUs).\n\nMultitasking: OS runs multiple applications on a single CPU using time-slicing (rapid context switching).\n\nMultiprogramming: multiple programs loaded in memory; CPU switches to keep itself busy (earlier concept behind multitasking).\n\nExam tip: 'more than one processor at a time' = multiprocessing."},{"id":"d3_fc_083","domain":"D3","front":"Symmetric ciphers — deprecated vs secure","back":"No longer secure (avoid):\n· RC4 — stream cipher with practical collision/bias vulnerabilities; removed from TLS\n· DES — 56-bit key; brute-forceable in hours\n· 2-key 3DES — effective 112 bits; deprecated by NIST 2023\n\nStill acceptable:\n· 3-key 3DES — effective 168 bits; legacy use only; deprecated\n\nCurrently secure / recommended:\n· AES — 128/192/256-bit keys; current gold standard\n· Twofish — AES finalist; secure but less adopted\n· IDEA — 64-bit block, 128-bit key; secure but niche"},{"id":"d3_fc_084","domain":"D3","front":"PKI — what technologies does it combine?","back":"PKI (Public Key Infrastructure) uses all three:\n\n1. Asymmetric encryption — for secure key exchange (handshake) and digital signatures. Slow but enables secure key distribution without a shared secret.\n\n2. Symmetric encryption — for bulk data transfer once the session key is established. Fast and efficient.\n\n3. Hash functions — for data integrity and digital signatures. Private-key-encrypted hash = digital signature.\n\nFlow: asymmetric handshake → shared session key → symmetric encryption of data → hash verifies integrity."},{"id":"d3_fc_085","domain":"D3","front":"IaaS / PaaS / SaaS — who manages what?","back":"IaaS (Infrastructure as a Service):\n· Vendor: data center, networking, servers, storage, virtualisation\n· Customer: OS, databases, security, applications\n\nPaaS (Platform as a Service):\n· Vendor: everything up to and including the OS\n· Customer: databases, security, applications\n\nSaaS (Software as a Service):\n· Vendor: everything including the application\n· Customer: data input and usage only\n\nKey exam point: in IaaS, the CUSTOMER is responsible for databases."},{"id":"d3_fc_086","domain":"D3","front":"WORM media — Write Once, Read Many","back":"WORM (Write Once, Read Many): data written exactly once; cannot be erased or overwritten.\nUse cases: compliance archives, audit logs, legal records — wherever immutability is required.\n\nExamples of WORM media:\n· DVD-R / BD-R (recordable optical discs)\n· WORM tape cartridges\n· Object storage with WORM locks (cloud)\n\nNOT WORM:\n· RAM — volatile, rewritable\n· EEPROM — electrically erasable and reprogrammable\n· Standard HDD/SSD — fully rewritable"},{"id":"d3_fc_087","domain":"D3","front":"ASTM standard gate classes (I–IV)","back":"Class I — Residential: private home, low traffic, family use.\nClass II — Commercial/general access: parking facilities, public access areas.\nClass III — Industrial/restricted access: factories, apartment complex service entrances.\nClass IV — Restricted commercial: high-volume vehicular traffic (bus depots, industrial complexes).\n\nNo Class XI — ASTM only defines Classes I–IV.\nHigher class = higher duty cycle, heavier use, stronger safety requirements."},{"id":"d3_fc_088","domain":"D3","front":"CPU internals — ALU, CU, and the 4-step instruction cycle","back":"ALU (Arithmetic Logic Unit): performs all arithmetic and logical calculations.\nCU (Control Unit): directs the operation of the processor; does NOT calculate.\nRegisters: tiny fast storage for operands and results.\n\n4-step instruction cycle:\n1. Fetch — retrieve instruction from memory\n2. Decode — interpret what the instruction requires\n3. Execute — ALU performs the operation\n4. Store/Write-back — result is written back to memory or register\n\nNote: the simpler 3-step model (fetch-decode-execute) omits the explicit store step."},{"id":"d3_fc_089","domain":"D3","front":"Clipper chip & Skipjack encryption","back":"Clipper chip: proposed by the NSA in the 1990s to be embedded in all telecommunications devices.\n· Used Skipjack — a classified symmetric block cipher (64-bit block, 80-bit key)\n· Included key escrow: government agencies could access decryption keys under court order\n· Highly controversial; opposed by privacy advocates and industry\n· Never widely adopted; abandoned by the late 1990s\n\nDistinction: DSA = digital signatures; RSA = asymmetric encryption; 3DES = block cipher — none used by Clipper."},{"id":"d3_fc_090","domain":"D3","front":"IDEA — International Data Encryption Algorithm","back":"IDEA: symmetric block cipher designed as a replacement for DES.\n· Block size: 64 bits\n· Key size: 128 bits\n· Designed for both hardware and software efficiency\n· Used in early PGP versions\n\nComparison:\n· DES: 64-bit block, 56-bit key → broken\n· 3DES (2-key): 64-bit block, 112-bit effective key → deprecated\n· AES: 128-bit block, 128/192/256-bit key → current standard\n· IDEA: 64-bit block, 128-bit key → secure but largely replaced by AES"},{"id":"d3_fc_091","domain":"D3","front":"MAC — Message Authentication Code (vs other MAC meanings)","back":"In a cryptography/hashing context, MAC = Message Authentication Code.\n· Generated by combining a secret key + message data using a hash function\n· Provides integrity (message not altered) + authenticity (came from key holder)\n· Common construction: HMAC (Hash-based MAC, e.g. HMAC-SHA256)\n\nOther MAC meanings (context matters):\n· MAC address — Media Access Control address (unique network hardware ID, Layer 2)\n· MAC model — Mandatory Access Control (security access model)\n\nExam tip: if Jane and Bob are discussing hashing → Message Authentication Code."},{"id":"d3_fc_092","domain":"D3","front":"IPv6 vs IPv4 — IPSec integration","back":"IPv6: IPSec is a BUILT-IN, mandatory component. Designed in from the start.\nIPv4: IPSec is an ADD-ON. IPv4 was designed for trusted research/military networks and had no native security. IPSec was retrofitted later.\n\nThis is why IPv6 is considered more secure by design — authentication and encryption are native, not optional bolt-ons.\n\nPGP and HMAC are not IP protocols and do not have IPSec built in.\nRemember: 'bolt-on security' = IPv4. 'Built-in security' = IPv6."},{"id":"d4_fc_001","domain":"D4","front":"Name the 7 OSI layers (1-7) and a mnemonic.","back":"1 Physical, 2 Data Link, 3 Network, 4 Transport, 5 Session, 6 Presentation, 7 Application. 1→7: 'Please Do Not Throw Sausage Pizza Away'. 7→1: 'All People Seem To Need Data Processing'."},{"id":"d4_fc_002","domain":"D4","front":"What are the PDUs at each OSI layer?","back":"Data (Application/Presentation/Session, L5-7), Segments (Transport, L4), Packets (Network, L3), Frames (Data Link, L2), Bits (Physical, L1)."},{"id":"d4_fc_003","domain":"D4","front":"What lives at OSI Layer 2 (Data Link)?","back":"MAC addresses, LLC (Logical Link Control, error detection), ARP (L2/3), switches/bridges, CSMA/CD (Ethernet), CSMA/CA (wireless). Threats: MAC spoofing, MAC flooding."},{"id":"d4_fc_004","domain":"D4","front":"Exam tip: a protocol starting with 'I' is usually which OSI layer?","back":"Layer 3 (Network) — IP, IGMP, IGRP, IPSEC, IKE, ISAKMP are all L3. The exception is IMAP, which is Layer 7 (Application)."},{"id":"d4_fc_005","domain":"D4","front":"TCP vs. UDP","back":"TCP: reliable, connection-oriented, guaranteed delivery, 3-way handshake, slower/more overhead, reassembled. UDP: connectionless, unreliable, fast (VOIP, live video, gaming) — timing matters more than delivery confirmation."},{"id":"d4_fc_006","domain":"D4","front":"What are the 4 layers of the TCP/IP model and how do they map to OSI?","back":"Link/Physical (OSI L1-2), Internet (OSI L3), Transport (OSI L4), Application (OSI L5-6-7). Higher = slower and smarter."},{"id":"d4_fc_007","domain":"D4","front":"What is a MAC address structure (EUI-48)?","back":"48-bit hexadecimal. First 24 bits = manufacturer (OUI), last 24 bits = unique host identifier. EUI-64 uses 24 for manufacturer, 40 for unique ID. Easily spoofed."},{"id":"d4_fc_008","domain":"D4","front":"Name the port ranges (well-known, registered, dynamic).","back":"Well-known: 0-1023 (protocols). Registered: 1024-49151 (vendor apps). Dynamic/Private/Ephemeral: 49152-65535 (anyone, anything)."},{"id":"d4_fc_009","domain":"D4","front":"Common ports: FTP, SSH, Telnet, SMTP, HTTP, HTTPS, DNS, RDP.","back":"FTP: 20 (data)/21 (control) TCP. SSH: 22. Telnet: 23. SMTP: 25. HTTP: 80. POP3: 110. IMAP: 143. HTTPS: 443. DNS: 53 (TCP+UDP). RDP: 3389."},{"id":"d4_fc_010","domain":"D4","front":"What ports does DNS use, and what is DNSSEC?","back":"DNS uses TCP and UDP port 53; natively no authentication (mostly UDP). DNSSEC adds Authentication and Integrity via PKI — but NOT confidentiality (like a digital signature for DNS). Defends against DNS poisoning."},{"id":"d4_fc_011","domain":"D4","front":"What are the RFC 1918 private address ranges?","back":"10.0.0.0–10.255.255.255 (/8), 172.16.0.0–172.31.255.255 (/12), 192.168.0.0–192.168.255.255 (/16). Not routable on the internet. 127.0.0.0/8 = loopback. 169.254.0.0/16 = link-local."},{"id":"d4_fc_012","domain":"D4","front":"NAT vs. PAT","back":"NAT (Network Address Translation): translates IPs — static NAT is 1-to-1 (impractical). PAT (Port Address Translation): uses IP AND port to map one public IP to many private IPs (one-to-many / NAT overload)."},{"id":"d4_fc_013","domain":"D4","front":"Unicast vs. Multicast vs. Broadcast","back":"Unicast: one-to-one. Multicast: one-to-many (predefined list). Broadcast: one-to-all on a LAN. Limited L3 broadcast (255.255.255.255) and L2 broadcast (FF:FF:FF:FF:FF:FF) are dropped by routers."},{"id":"d4_fc_014","domain":"D4","front":"What is ARP and what is ARP poisoning?","back":"Address Resolution Protocol — translates IP addresses to MAC addresses. It's simple and trusting; anyone can respond. ARP poisoning = attacker sends fake ARP responses (often for the default gateway). Countermeasure: hardcode ARP entries."},{"id":"d4_fc_015","domain":"D4","front":"What is ICMP used for, and what does no Echo reply mean?","back":"Used for Ping (echo request/reply) and TTL exceeds in Traceroute; troubleshooting. An Echo reply means the host is up — but NO reply doesn't mean it's down (firewalls/routers can block ICMP)."},{"id":"d4_fc_016","domain":"D4","front":"Telnet vs. SSH","back":"Telnet: TCP 23, all data PLAINTEXT including credentials — should not be used. SSH: secure replacement for Telnet/FTP/HTTP, provides a secure connection over an unsecured network."},{"id":"d4_fc_017","domain":"D4","front":"FTP vs. SFTP vs. FTPS vs. TFTP","back":"FTP: no confidentiality/integrity, TCP 20/21. SFTP: FTP secured with SSH. FTPS: FTP secured with TLS/SSL. TFTP: trivial FTP, UDP 69, no auth, used for bootstrapping diskless workstations."},{"id":"d4_fc_018","domain":"D4","front":"SNMP versions — which are insecure?","back":"SNMPv1 and SNMPv2 send data in CLEARTEXT (default community strings 'public'/'private'). SNMPv3 uses encryption providing CIA — should be the standard."},{"id":"d4_fc_019","domain":"D4","front":"What ports do BOOTP and DHCP use?","back":"Both use UDP port 67 for the server and UDP port 68 for the client. BOOTP determines OS (downloaded via TFTP) and IP for diskless workstations; DHCP dynamically assigns IPs."},{"id":"d4_fc_020","domain":"D4","front":"UTP vs. STP vs. Fiber cables (EMI susceptibility, security).","back":"UTP (Unshielded Twisted Pair): cheap, susceptible to EMI/eavesdropping. STP (Shielded): metal mesh, less EMI, thicker/pricier. Fiber: no EMI, can't be easily sniffed, fast, long distance — most secure but pricier."},{"id":"d4_fc_021","domain":"D4","front":"EMI vs. Crosstalk vs. Attenuation","back":"EMI: magnetism disrupting availability/integrity. Crosstalk: signal crossing from one cable to another (confidentiality issue). Attenuation: signal weakening over distance. Keep power cables away from copper data cables; use STP or fiber."},{"id":"d4_fc_022","domain":"D4","front":"LAN topologies: Bus, Ring, Star, Mesh — fault tolerance.","back":"Bus: single break breaks all nodes past it. Ring: nodes in a loop. Star: all to a central device (Ethernet/switch) — best fault tolerance, a break affects only one node. Mesh: partial or full (full = max redundancy, lots of cables)."},{"id":"d4_fc_023","domain":"D4","front":"WEP vs. WPA vs. WPA2 vs. WPA3","back":"WEP (1997): broken in minutes, don't use. WPA (2003): RC4+TKIP, interim, insecure now. WPA2 (2004/RSN): AES + CCMP, most common. WPA3 (2020): 192-bit, SAE replaces PSK, AES-256 GCM with SHA-384."},{"id":"d4_fc_024","domain":"D4","front":"What is an Evil Twin attack?","back":"An attacker creates a rogue access point with the SAME SSID as yours but with no security — user devices automatically connect to it. Compromises confidentiality and integrity."},{"id":"d4_fc_025","domain":"D4","front":"802.11 frequency bands — 2.4 GHz vs. 5/6 GHz","back":"2.4 GHz: crowded (Bluetooth, microwaves, cordless phones, baby monitors), longer waves penetrate walls better. 5/6 GHz: less crowded, shorter waves, poorer wall penetration. 6 GHz is newest and least crowded."},{"id":"d4_fc_026","domain":"D4","front":"Bluetooth attacks: Bluejacking, Bluesnarfing, Bluebugging.","back":"Bluejacking: sending unsolicited messages (harmless/annoying). Bluesnarfing: unauthorized ACCESS to info on a device. Bluebugging: attacker gains TOTAL control of the device (older phones in discoverable state)."},{"id":"d4_fc_027","domain":"D4","front":"Layer 1, 2, 3 network devices.","back":"L1: repeaters (extend signal), hubs (multi-port repeaters, all traffic out all ports, insecure). L2: bridges (2-port), switches (multi-port, MAC-based, each port = collision domain). L3: routers (forward by IP)."},{"id":"d4_fc_028","domain":"D4","front":"What is a VLAN and how does it work?","back":"Virtual LAN — a broadcast domain partitioned and isolated at Layer 2. Specific switch ports are assigned to a VLAN; VLANs use tags within packets. Allows logically separate networks on shared physical devices. VLAN trunks span VLANs across switches."},{"id":"d4_fc_029","domain":"D4","front":"Switch security best practices.","back":"Shut unused ports down, assign ports to specific VLANs, use MAC sticky (only allow that MAC on the port, warn or shut if another appears), use VLAN pruning for trunk ports."},{"id":"d4_fc_030","domain":"D4","front":"Distance-vector vs. Link-state routing protocols","back":"Distance-vector (RIP): only counts hops, ignores bandwidth, uses shortest path — older. Link-state (OSPF): each node runs an algorithm using link cost (incl. bandwidth), faster convergence, syncs on topology changes."},{"id":"d4_fc_031","domain":"D4","front":"RIP, OSPF, BGP — what are they?","back":"RIP: distance-vector, max 15 hops, UDP 520, updates every 30s. OSPF: link-state, IGP, encapsulated directly in IP (protocol 89), fast convergence. BGP: path-vector, the routing protocol of the INTERNET, routes between Autonomous Systems."},{"id":"d4_fc_032","domain":"D4","front":"What is MPLS and what layer does it operate at?","back":"Multiprotocol Label Switching — directs data by short path LABELS, not IP addresses. Operates between L2 and L3 ('layer 2.5'). Often used for MPLS VPN connections between distant org locations."},{"id":"d4_fc_033","domain":"D4","front":"Firewall types by OSI layer: packet filter, stateful, application.","back":"Packet filtering: L1-3, inspects packets against rules (checked in order). Stateful: L1-4, tracks connection state. Application (proxy): L7, understands applications/protocols, sees the full decrypted payload."},{"id":"d4_fc_034","domain":"D4","front":"What is a Next-Generation Firewall (NGFW)?","back":"Combines traditional firewall + Deep Packet Inspection (DPI) + network security (IDS/IPS, malware/antivirus). DPI looks at the actual data the packet carries, not just the protocol header. Spans more OSI layers."},{"id":"d4_fc_035","domain":"D4","front":"Bastion Host vs. Dual-Homed Host vs. Screened Subnet","back":"Bastion Host: hardened single-purpose host, faces untrusted networks/DMZ. Dual-Homed Host: 2 NICs (trusted + untrusted), doesn't route. Screened Subnet: uses 2 firewalls (defense in depth) to establish a DMZ."},{"id":"d4_fc_036","domain":"D4","front":"What is a DMZ, and how do firewalls fail?","back":"DMZ: a subnetwork exposing external-facing services to an untrusted network while the internal LAN stays firewalled. Firewalls fail CLOSED — if they crash or are flooded, they block all traffic."},{"id":"d4_fc_037","domain":"D4","front":"What is 802.1X — the three parties?","back":"Encapsulates EAP (Extensible Authentication Protocol). Three parties: Supplicant (client device), Authenticator (switch or wireless AP), AS (Authentication Server, typically RADIUS+EAP)."},{"id":"d4_fc_038","domain":"D4","front":"PAP vs. CHAP","back":"PAP: sends credentials in PLAINTEXT at connection start — one of the oldest, insecure. CHAP: three-way handshake, shared secret never sent over the network, protects against replay attacks; used by PPP servers."},{"id":"d4_fc_039","domain":"D4","front":"PPTP vs. L2TP vs. IPSec for VPNs","back":"PPTP: obsolete, many known issues, TCP control + GRE tunnel. L2TP: no built-in encryption, relies on a passed-in encryption protocol. IPSec: operates at the Internet layer, secures ALL IP application traffic."},{"id":"d4_fc_040","domain":"D4","front":"North-South vs. East-West traffic","back":"North-South: between a client/server and the outside world, traverses multiple segments, subject to firewalls/IPS. East-West: between servers/devices within the same segment (often VMs/containers on the same host), may have less scrutiny."},{"id":"d4_fc_041","domain":"D4","front":"Throughput vs. Latency vs. Jitter vs. Packet Loss","back":"Throughput: actual rate of successful data transfer. Latency: time for a packet source→destination (ms). Jitter: variation in latency over time (matters for VOIP/video). Packet Loss: % of packets dropped."},{"id":"d4_fc_042","domain":"D4","front":"What is SDN (Software-Defined Networking)?","back":"Lets admins control network behavior dynamically via software by separating the router's CONTROL plane (routing decisions) from the DATA plane (forwarding). Makes you hardware-vendor agnostic."},{"id":"d4_fc_043","domain":"D4","front":"What is VXLAN and why use it?","back":"Virtual eXtensible LAN — an encapsulation protocol letting VLANs span subnets and distant locations. Supports up to 16 million virtual networks (vs. VLAN's 4,096). Enables micro-segmentation without local-only restrictions."},{"id":"d4_fc_044","domain":"D4","front":"RDP vs. VNC","back":"RDP (Remote Desktop Protocol): Microsoft proprietary, GUI, listens on TCP and UDP 3389. VNC (Virtual Network Computing): non-Microsoft, runs on most OSs via screen scraping."},{"id":"d4_fc_045","domain":"D4","front":"Circuit Switching vs. Packet Switching","back":"Circuit switching: dedicated channel, guarantees full bandwidth, expensive, used less today. Packet switching: data sent in packets via multiple paths, cheap, no capacity guarantee, widely used. QoS prioritizes real-time traffic (VOIP)."},{"id":"d7_fc_001","domain":"D7","front":"Separation of Duties, Job Rotation, Mandatory Vacations — purpose?","back":"All mitigate insider threats/fraud. Separation of Duties: no single person controls a whole task. Job Rotation: detect fraud, reduce collusion. Mandatory Vacations: lock the account and audit while they're away to detect/prevent fraud."},{"id":"d7_fc_002","domain":"D7","front":"What is PAM (Privileged Access Management)?","back":"Identify and closely monitor anyone with more access than a normal user. The higher the privilege, the closer the monitoring. Use full monitoring, limit privileges, MFA, immutable logs, anomaly detection, no group accounts."},{"id":"d7_fc_003","domain":"D7","front":"What is the forensic process order?","back":"Identification → Preservation → Collection → Examination → Analysis → Presentation (in court) → Decision. Evidence must be accurate, complete, authentic, convincing, and admissible."},{"id":"d7_fc_004","domain":"D7","front":"In what order do you collect forensic evidence (volatility)?","back":"Most volatile to least volatile — start with RAM (memory) and end with hard disks. Handle evidence as little as possible; work on bit-level copies, confirming the hash matches before and after."},{"id":"d7_fc_005","domain":"D7","front":"Allocated vs. Unallocated vs. Slack space (forensics)","back":"Allocated: actively contains data. Unallocated: no active data (incl. deleted files marked free — still recoverable). Slack space: leftover space in a cluster after a file, may hide old data or attacker-hidden data."},{"id":"d7_fc_006","domain":"D7","front":"Event vs. Alert vs. Incident vs. Problem","back":"Event: observable change in state (neutral). Alert: a warning triggered by an event. Incident: multiple adverse events, often caused by people. Problem: an incident with an unknown cause (needs root-cause analysis)."},{"id":"d7_fc_007","domain":"D7","front":"Inconvenience vs. Emergency vs. Disaster vs. Catastrophe","back":"Inconvenience: non-disruptive failure (one disk, one server in a cluster). Emergency/Crisis: potential loss of life or property. Disaster: facility unusable 24+ hours. Catastrophe: facility destroyed."},{"id":"d7_fc_008","domain":"D7","front":"What is the 8-step incident response lifecycle?","back":"1) Preparation, 2) Detection (Identification), 3) Response (Containment), 4) Mitigation (Eradication), 5) Reporting, 6) Recovery, 7) Remediation, 8) Lessons Learned."},{"id":"d7_fc_009","domain":"D7","front":"IDS vs. IPS","back":"IDS (Intrusion Detection System): passive — monitors and ALERTS only, takes no action. IPS (Intrusion Prevention System): also takes ACTION (drop/redirect traffic). Both are essentially packet sniffers with analysis engines."},{"id":"d7_fc_010","domain":"D7","front":"Network-based vs. Host-based IDS/IPS","back":"NIDS/NIPS: on a network segment (switch port in promiscuous mode, span port), sees traffic but CAN'T inspect encrypted packets. HIDS/HIPS: on a single host, CAN see decrypted data but slows the host; attacks can disable it."},{"id":"d7_fc_011","domain":"D7","front":"Signature-based vs. Heuristic (behavioral) IDS/IPS","back":"Signature-based: matches known malware patterns, fast, but vulnerable to 0-days and needs constant updates. Heuristic/behavioral: baselines normal traffic and flags anomalies — can catch 0-days but produces more false positives and needs tuning."},{"id":"d7_fc_012","domain":"D7","front":"True/False Positive/Negative in IDS alerts.","back":"True Positive: attack happens, system detects/acts. True Negative: normal traffic, system does nothing. False Positive: normal traffic, system acts (alerts). False Negative: attack happens, system MISSES it (the worst)."},{"id":"d7_fc_013","domain":"D7","front":"SIEM vs. SOAR","back":"SIEM (Security Information and Event Management): centralizes/correlates logs across all systems for near-real-time analysis — but only alerts. SOAR (Security Orchestration, Automation, Response): uses AI to also REACT to events automatically, reducing alert overload."},{"id":"d7_fc_014","domain":"D7","front":"Honeypot vs. Honeynet","back":"Honeypot: a system that looks real but exists solely to attract attackers and learn about vulnerabilities. Honeynet: a network of honeypots. Best practice segments them via DMZ/firewall. Always consult legal first (entrapment vs. enticement)."},{"id":"d7_fc_015","domain":"D7","front":"Full vs. Incremental vs. Differential backups — restore & archive bit.","back":"Full: everything, clears archive bit, 1 tape to restore. Incremental: changes since last backup, clears archive bit, MANY tapes to restore. Differential: changes since last FULL, does NOT clear archive bit, only 2 tapes to restore."},{"id":"d7_fc_016","domain":"D7","front":"What is a Copy backup?","back":"A full backup that does NOT clear the archive bit. Often used before system updates/patches so you can revert to a good copy without disrupting the normal backup cycle."},{"id":"d7_fc_017","domain":"D7","front":"RAID 0 vs. RAID 1 vs. RAID 5","back":"RAID 0: striping, no redundancy, faster only, min 2 disks. RAID 1: mirroring, identical data on 2 disks. RAID 5: block-level striping with distributed parity, min 3 disks, speed + redundancy."},{"id":"d7_fc_018","domain":"D7","front":"Database Shadowing vs. Electronic Vaulting vs. Remote Journaling","back":"Shadowing: real-time exact copy of the database to another location. E-vaulting: remote backups sent off-site at intervals or on change. Remote Journaling: sends transaction LOG files (not the files), rebuilt from logs if originals lost."},{"id":"d7_fc_019","domain":"D7","front":"Recovery sites: Redundant, Hot, Warm, Cold — speed and cost.","back":"Redundant: identical real-time copy, instant failover, most expensive. Hot: critical systems, near-real-time data, <1hr switch. Warm: full DC but restore from backups, 4-24hr. Cold: empty DC (power/HVAC only), weeks to recover, cheapest."},{"id":"d7_fc_020","domain":"D7","front":"What is a Reciprocal Agreement site?","back":"A contract with another organization to share their data center space in a disaster (and vice versa). Can be promised space or segmented racks with hardware."},{"id":"d7_fc_021","domain":"D7","front":"BCP/DRP teams: Rescue, Recovery, Salvage.","back":"Rescue (Activation): deals with the disaster as it happens — evacuate, notify (call trees), initial damage assessment. Recovery (Failover): get alternate site running, MOST critical systems first. Salvage (Failback): return to primary site, LEAST critical systems first."},{"id":"d7_fc_022","domain":"D7","front":"BCP/DRP test types, least to most disruptive.","back":"DRP Review → Read-Through (Checklist) → Walk/Talk-through (Tabletop) → Simulation Test → Parallel Processing → Partial Interruption → Full Interruption (always off-hours, most disruptive)."},{"id":"d7_fc_023","domain":"D7","front":"What is a Call Tree and how does it operate?","back":"Each person calls a small number of others. Starts bottom-up (discoverer → manager → senior level/CEO) then top-down. Use 2-way confirmation. Printed and kept at home (assume no network). Automated call trees are preferred."},{"id":"d7_fc_024","domain":"D7","front":"What is Patch Tuesday and typical patch timing?","back":"Microsoft releases monthly patches on the 2nd Tuesday. Critical patches push outside it. Orgs usually review for a few weeks first. Pushes are done after hours (Fri/Sat, ~01:00-04:00), avoiding midnight (backup jobs run then)."},{"id":"d7_fc_025","domain":"D7","front":"0-day Vulnerability vs. Exploit vs. Attack","back":"0-day Vulnerability: not yet widely discovered/published. 0-day Exploit: code using the vulnerability. 0-day Attack: the actual attack using the code. Only real defense: defense in depth + immediate patching when available."},{"id":"d7_fc_026","domain":"D7","front":"What is Root-Cause Analysis and why does it matter?","back":"Determining the underlying weakness that allowed an incident. Without it, you'll face the same problem again. Fix the vulnerability on ALL affected systems org-wide, not just the one that was compromised."},{"id":"d7_fc_027","domain":"D7","front":"Active/Active vs. Active/Passive clustering","back":"Active/Active: both servers process traffic = load balancing. Active/Passive: primary is active, secondary is passive and sends keep-alive/heartbeat; if the active misses ~3 keepalives, the passive assumes the primary role."},{"id":"d7_fc_028","domain":"D7","front":"What is an MOU/MOA and when is it the answer?","back":"Memorandum of Understanding/Agreement — staff sign a legal document acknowledging responsibility for an activity. If a critical staff member didn't show up when required, the MOU/MOA could have fixed it. Used interchangeably on the exam."},{"id":"d7_fc_029","domain":"D7","front":"Least Privilege — definition and exam tip","back":"Least Privilege: grant users the MINIMUM access required to perform their job — no more, no less.\n\nKey points:\n• Applied at account setup and reviewed regularly\n• Reduces blast radius of compromised accounts or accidental errors\n• Admins should use a standard account for normal work, privileged account only when needed\n\nExam tip: Least Privilege defines what access is GRANTED. Need to Know defines what access is actually USED. Both must be satisfied for appropriate data access."},{"id":"d7_fc_030","domain":"D7","front":"Need to Know vs Least Privilege — what is the difference?","back":"Least Privilege: the ACCESS CONTROL layer — your account is provisioned with only the permissions required for your role.\n\nNeed to Know: the BEHAVIOURAL layer — even if you have access, you should only look at data you actually need right now for your work.\n\nExample: A nurse has system access to all patient records (Least Privilege = correct provisioning), but should only view patients under their care (Need to Know = appropriate use).\n\nSeparation of Duties works alongside both — it prevents one person from holding conflicting permissions that could enable fraud."},{"id":"d7_fc_031","domain":"D7","front":"Job Rotation — all benefits and the key exam limitation?","back":"Security benefits:\n• Detects errors and fraud — a new person covering the role will notice irregularities\n• Reduces collusion — harder to sustain a conspiracy when roles change\n\nNon-security benefits:\n• Reduces employee burnout\n• Builds cross-functional business understanding\n\nKey exam limitation:\n• Can be COST PROHIBITIVE — training, productivity loss, and transition costs are real. Always assess whether the cost justifies the benefit before implementing."},{"id":"d7_fc_032","domain":"D7","front":"Mandatory Vacations — what happens to the account, and why the no-advance-notice rule?","back":"During mandatory vacation:\n• Employee accounts are LOCKED — no remote or on-site access\n• An AUDIT is performed on those accounts\n• If the employee was conducting fraud and covering it up, the audit will discover it\n\nKey exam nuance:\n• Do NOT give too much advance notice — an employee who knows in advance can cover their tracks, falsify records, or delete evidence before accounts are locked\n\nAll 5 controls together (Least Privilege + Need to Know + Separation of Duties + Job Rotation + Mandatory Vacations) = minimise INSIDER THREATS."},{"id":"d7_fc_033","domain":"D7","front":"NDA (Non-Disclosure Agreement) — most important element and other key components?","back":"Most important — SCOPE: must clearly define what information is considered confidential. Without a precise scope, the agreement has no teeth — vague definitions make enforcement nearly impossible.\n\nOther key components:\n• Duration: length of the agreement matched to the sensitivity of the information\n• Penalties: consequences for breach — must be appropriate and enforceable\n• Parties: who is bound — more parties increase complexity\n\nExam tip: Scope first. If you cannot define what is confidential, nothing else in the NDA matters."},{"id":"d7_fc_034","domain":"D7","front":"Why is Separation of Duties MORE effective than background checks, access controls, or physical security for preventing internal fraud?","back":"Background checks: one-time measure — do not protect against fraud that begins after hiring; not all fraudsters have a detectable history.\n\nAccess controls: restrict who can access data, but an authorised employee can still commit fraud within their permitted scope.\n\nPhysical security: protects against physical theft but not financial misstatement, data manipulation, or internal process abuse.\n\nSeparation of Duties: provides CONTINUOUS checks and balances — no single person controls an entire transaction. Fraud requires collusion, making it far harder to commit and easier to detect.\n\nExample: separate the person who creates purchase orders from the person who issues payment."},{"id":"d7_fc_035","domain":"D7","front":"Bit-stream (binary) imaging — what is it and why is it used instead of a standard file copy?","back":"A bit-stream image is a sector-by-sector, bit-for-bit copy of an entire storage device.\n\nWhy not a standard file copy?\n• File copy: only copies currently active, visible files\n• Bit-stream image: captures EVERYTHING — active files, deleted files, unallocated space, slack space, file system metadata\n\nResult: the forensic image is an exact duplicate of the device. Nothing is missed. Forensic analysis is performed on this copy — never the original.\n\nSame as: the copy of certain sectors ≠ the copy of the whole device."},{"id":"d7_fc_036","domain":"D7","front":"Real Evidence in digital forensics — what is it? What is NOT real evidence?","back":"Real Evidence = tangible, physical objects that can be touched and presented in court.\n\nIn IT security:\n✓ Real Evidence: the hard disk, USB drive, CD, DVD, mobile phone — the physical device itself\n✗ NOT Real Evidence: the data on the device (files, logs, emails) — that is digital/documentary evidence\n\nWhy it matters: physical custody and chain of custody apply to real evidence — the device must be handled and transported with documented care to remain admissible."},{"id":"d7_fc_037","domain":"D7","front":"Evidence Integrity in forensics — how is it maintained and verified?","back":"Evidence integrity = proving that data was not altered from the moment of seizure.\n\nHow:\n1. Hash the ORIGINAL device immediately upon seizure (MD5, SHA-256)\n2. Create a bit-stream forensic COPY\n3. Hash the COPY — it must match the original hash\n4. Perform all forensic analysis on the copy, never the original\n5. Hash again AFTER analysis — both original and copy must still match\n\nIf hashes match throughout: evidence integrity is unquestionable.\nIf hashes differ: evidence may have been tampered with — inadmissible."},{"id":"d7_fc_038","domain":"D7","front":"Chain of Custody — purpose and the 4 questions it must answer?","back":"Purpose: prove that evidence has not been tampered with from seizure to court. Establishes integrity and admissibility.\n\nFor every person who handled the evidence, the Chain of Custody form must document:\n• WHO handled it?\n• WHEN did they handle it?\n• WHAT did they do with it?\n• WHERE did they handle it?\n\nBreaking the chain (gaps in documentation, unlogged transfers) can make evidence legally inadmissible — even if the evidence itself is genuine."},{"id":"d7_fc_039","domain":"D7","front":"What is the PRIMARY purpose of digital forensics — and what is it NOT?","back":"PRIMARY purpose: collect, analyse, and PRESERVE electronic evidence in a legally admissible manner.\nGoals: identify the attacker, understand methods used, gather evidence for legal proceedings.\n\nNOT the primary purpose:\n• Determining root cause/attack mechanism → Incident Response team\n• Repairing the compromised system → Recovery team\n• Preventing future attacks → Security analysts and strategists\n\nForensic findings inform all of those — but forensics itself is about evidence preservation and legal admissibility."},{"id":"d7_fc_040","domain":"D7","front":"Forensic imaging methods — which is LEAST effective and why?","back":"Most effective:\n• Bit-by-bit imaging: captures everything — active files, deleted files, unallocated space, slack space\n\nAlso effective:\n• Hardware-based imaging: uses write blockers — no risk of writing to the original during capture\n• Software-based imaging: forensic tools (e.g. FTK Imager, dd) — reliable bit-for-bit copy without specialised hardware\n\nLEAST effective:\n• Live imaging: imaging a drive while it is still actively in use → data is changing during capture → incomplete or corrupted image → potential evidence alteration\n\nAlways prefer powered-down imaging when possible."},{"id":"d7_fc_041","domain":"D7","front":"Fourth Amendment in digital forensics — what does it protect and how can investigators bypass it legally?","back":"Fourth Amendment: protects against unreasonable searches and seizures.\n\nIn forensics:\n• Victim companies CANNOT access an attacker's systems without legal authority\n• Doing so = same unauthorised access crime the attacker committed\n• Being the victim does NOT grant permission to 'hack back'\n\n4 legal ways to bypass the Fourth Amendment:\n1. Subpoena — compel someone to produce evidence\n2. Search warrant — court-authorised search of a location or device\n3. Voluntary surrender — the owner hands over the evidence willingly\n4. Exigent circumstances — imminent danger to life OR evidence is about to be destroyed"},{"id":"d7_fc_042","domain":"D7","front":"Incident Management — definition and primary purpose?","back":"Definition: the administrative function of monitoring, detecting, and responding to security events affecting computer assets, networks, and information systems.\n\nPrimary purpose: ensure a WELL-UNDERSTOOD and PREDICTABLE response to events and computer intrusions.\n\nKey requirements:\n• Clear, documented processes for every type of event\n• Teams trained in advance — incidents are stressful; staff must know exactly what to do without hesitation\n• Ongoing training — not just one-time; procedures must be rehearsed regularly\n\nWithout it: ad hoc, unpredictable responses lead to missed steps, evidence loss, and extended downtime."},{"id":"d7_fc_043","domain":"D7","front":"3 classes of incidents/events — Natural, Human, Environmental: examples and exam distinctions?","back":"Natural: caused by NATURE\n• Hurricanes, floods, earthquakes, blizzards\n\nHuman: caused by PEOPLE — intentional OR unintentional\n• Intentional: cyberattacks, insider sabotage, fraud\n• Unintentional: misconfigurations, accidents, errors\n• Most common class by far\n\nEnvironmental: the OPERATIONAL ENVIRONMENT — NOT nature\n• Power grid failures, internet outages, hardware failures, software flaws\n\nExam trap: a power outage is Environmental, NOT Natural.\nExam trap: an accident and an attack are BOTH Human incidents — intent does not change the class."},{"id":"d7_fc_044","domain":"D7","front":"Event vs Alert vs Incident vs Problem — exam-level detail with thresholds and examples?","back":"Event: observable change in state — NEUTRAL (neither good nor bad)\n• Examples: system powers on, traffic moves between segments, app starts\n\nAlert: warning triggered when an event hits a defined THRESHOLD\n• Example thresholds: traffic > 75%, memory ≥ 90% for > 2 minutes\n\nIncident: MULTIPLE adverse events on systems/network — often caused by PEOPLE\n• Can be intentional (attack) or unintentional (error)\n\nProblem: incident with an UNKNOWN CAUSE\n• Follow incident response steps + heavy focus on root-cause analysis\n• Goal: understand what happened to prevent recurrence\n• Examples: total internet outage, unexplained server crash\n\nChain: Event → (threshold crossed) → Alert → (multiple adverse) → Incident → (cause unknown) → Problem"},{"id":"d7_fc_045","domain":"D7","front":"Incident severity levels — exam nuances: Disaster vs Catastrophe, snowstorm trap, geographic redundancy?","back":"Severity ladder:\nInconvenience → Emergency → Disaster → Catastrophe\n\nKey definitions:\n• Inconvenience: NON-DISRUPTIVE — hard disk fail, 1 server down in cluster, operations continue\n• Emergency/Crisis: potential LOSS OF LIFE or PROPERTY — urgent, immediate action required\n• Disaster: ENTIRE facility unusable for 24+ HOURS — facility still exists\n• Catastrophe: facility DESTROYED — nothing to return to\n\nExam traps:\n• A snowstorm CAN be a Disaster if it makes the facility unusable for 24+ hours — classification is based on IMPACT, not cause\n• Disaster vs Catastrophe = unusable vs destroyed\n\nMitigation:\n• Geographic diversity + redundancy reduces disaster impact significantly — workloads shift to other sites"},{"id":"d7_fc_046","domain":"D7","front":"Lessons Learned phase — why it matters, what it produces, and where it goes?","back":"Most overlooked phase: organisations skip it once the problem is resolved — this is a mistake.\n\nWhat it evaluates:\n• The specific incident (what happened, how it was caused)\n• The RESPONSE (what worked, what didn't, how well the team handled it)\n• Organisational growth: fixing one vulnerability leaves 100s unknown\n\nOutput:\n• Formal REPORT to SENIOR MANAGEMENT with findings and recommendations\n• IT Security can only SUGGEST — management is ultimately in charge and LIABLE\n\nWhere outcomes go:\n• Feed back into PREPARATION — updated controls, playbooks, training\n\nPost-incident shift:\n• After major incidents, organisations often adopt a TOP-DOWN approach\n• Senior management listens more to IT Security — use this momentum"},{"id":"d7_fc_047","domain":"D7","front":"Recovery vs Remediation in incident response — what is the difference?","back":"Recovery (step 6): RESTORE and VALIDATE system functionality so business operations can resume.\n• Restore from backups, rebuild systems, remove malware\n• Goal: get back to normal operation\n• Must happen FIRST — you fix the service before fixing the root cause\n\nRemediation (step 7): FIX the vulnerabilities that were EXPLOITED during the incident.\n• Patch the vulnerability, update configurations, redesign the flawed process\n• Goal: prevent the same incident from happening again\n• Happens AFTER recovery — you cannot remediate effectively while still fighting the incident\n\nMemory hook: Recover the service → Remediate the root cause → Review (Lessons Learned)"},{"id":"d7_fc_048","domain":"D7","front":"Detection (Identification) phase — what does it involve and what is its goal?","back":"Phase 2 of the 8-step IR lifecycle.\n\nActivities:\n• Analyse network traffic for suspicious behaviour\n• Monitor system logs for unusual activity\n• Review IDS/IPS alerts and SIEM correlations\n• Investigate user reports and anomalous patterns\n• Determine if events constitute a real incident\n\nGoal: identify incidents QUICKLY — the sooner an incident is confirmed, the faster containment begins, reducing overall damage.\n\nPreparation sets up the tools; Detection puts them to use.\nDetection hands off to Response (Containment) once an incident is confirmed."},{"id":"d7_fc_049","domain":"D7","front":"False Positive vs False Negative — which is more dangerous and why do we focus on false states?","back":"Why we focus on FALSE states:\nTrue Positive (attack + detected) and True Negative (clean + no action) = system working correctly — no action needed.\nFalse states = failures that require investigation.\n\nFalse Positive (false alarm):\n• Normal traffic triggers an alert and the system acts\n• Problem: alert fatigue, blocks legitimate users, erodes trust in IDS\n• Risk: if analysts ignore the system, real attacks get missed\n\nFalse Negative (missed attack):\n• Attack occurs but system does NOT detect or act\n• MORE DANGEROUS — organisation is exposed with no awareness\n• Heuristic/behavioral detection reduces False Negatives for novel attacks\n\nMemory hook: False Positive = boy who cried wolf. False Negative = wolf got in unnoticed."},{"id":"d7_fc_050","domain":"D7","front":"SIEM inputs vs outputs — what feeds in and what comes out?","back":"SIEM INPUTS (what it ingests):\n• Log collection\n• Log analysis\n• Event correlation\n• Log forensics\n• IT compliance data\n• Application log monitoring\n• Object access monitoring\n\nSIEM OUTPUTS (what it produces):\n• Real-time alerting\n• User activity monitoring\n• Dashboards\n• Reporting\n• File integrity monitoring\n• System & device log monitoring\n• Log retention\n\nKey: SIEM gathers from ALL systems and provides a holistic view — but it only detects and alerts. Action requires a human or SOAR."},{"id":"d7_fc_051","domain":"D7","front":"SOAR full breakdown — capabilities, integrations, and strategic purpose?","back":"SOAR = Security Orchestration, Automation, and Response\n\nWhat it does:\n• Uses AI to automatically RESPOND to security incidents (not just alert)\n• Handles alert overload — SIEMs generate more alerts than SOC teams can manually process\n• Case management, standardisation, workflows, and analytics\n\nIntegrations:\n• Vulnerability Management (VM)\n• IT Service Management (ITSM)\n• Threat Intelligence platforms\n• Plus SIEM, endpoint tools, firewalls, etc.\n\nStrategic purpose:\n• Enables a detailed DEFENSE-IN-DEPTH solution\n• Ties together all security controls into one orchestrated, automated response platform\n\nSOAR vs SIEM: both detect/alert — SOAR also acts."},{"id":"d7_fc_052","domain":"D7","front":"SOAR core components — what is included and what is NOT?","back":"Core SOAR components:\n• Playbooks: step-by-step response guides for specific incident types (phishing, ransomware, data breach)\n• Case management: organise, track, and document incidents from detection to resolution\n• Threat intelligence: contextualise alerts with information about known threats and threat actors\n• Workflows and automation: execute response actions automatically\n• Analytics: correlate data and identify patterns\n\nNOT a SOAR component:\n• Encryption — SOAR orchestrates response; it does not protect data confidentiality\n\nPrimary benefit: IMPROVED RESPONSE TIMES through automation of repetitive tasks — reducing analyst burden and human error."},{"id":"d7_fc_053","domain":"D7","front":"Honeypot deployment levels — from lowest to highest?","back":"Lowest to Highest deployment scope:\n\n1. Low-interaction honeypot: mimics a limited set of services/protocols — easier to deploy, less data\n\n2. High-interaction honeypot: full range of services, realistic attacker engagement — more data but more complex and risky\n\n3. Production honeypot: deployed in a live environment alongside real systems — detects real attacker activity\n\n4. Honeynet (HIGHEST): a NETWORK of multiple honeypots — broadest monitoring scope, most data, most realistic environment for attackers to explore\n\nBest use of all: gather attacker TTPs (tactics, techniques, procedures) to improve defences — NOT a standalone control."},{"id":"d7_fc_054","domain":"D7","front":"Application negative list vs positive list — what are they?","back":"Negative list (Blacklist):\n• Lists applications PROHIBITED from use\n• Blocks known-bad/risky applications\n• Anything not on the list is allowed by default\n• Risk: new/unknown threats not yet listed can still run\n\nPositive list (Whitelist):\n• Lists applications AUTHORISED for use\n• Only approved applications can run — everything else is blocked\n• More secure but harder to maintain\n• Risk: legitimate new applications need to be added before they can run\n\nMemory hook: Negative = prohibited (blocked). Positive = permitted (allowed)."},{"id":"d7_fc_055","domain":"D7","front":"Change Management — process, board composition, submitter requirements, and approval threshold?","back":"Definition: formalized process for handling changes to environments.\nWhen done right: full documentation + understanding + communication to appropriate parties.\n\nChange Review Board:\n• Must include BOTH IT and other operational units\n• Non-IT units are affected by changes and must raise concerns early\n• Researches proposed changes to understand FULL impact\n\nSubmitter must provide:\n• Reasons for the change\n• Pros AND cons of implementing it\n• Pros AND cons of NOT implementing it\n• Related system/process changes\n• All supporting information the board needs\n\nApproval threshold:\n• Board can approve within a predefined range\n• Above threshold → board makes recommendation, SENIOR LEADERSHIP approves"},{"id":"d7_fc_056","domain":"D7","front":"Change Management PDCA process — all 4 phases and their steps?","back":"PLAN:\n1. Request — change formally submitted\n2. Analyse — research full impact on systems and organisation\n3. Approve (CAB = Change Advisory Board) — board reviews and approves/rejects\n\nDO:\n1. Plan implementation — prepare how the change will be executed\n2. Communicate — notify all relevant stakeholders BEFORE the change\n3. Implement and test — execute and verify\n\nCHECK:\n• Success → Communicate (inform stakeholders change is live)\n• Failure → ROLLBACK (revert to previous state immediately)\n\nACT:\n1. Acceptance — formally accept the change as the new standard\n2. Lessons Learned → feeds back into future PLAN phases\n\nCycle: PDCA is iterative — Lessons Learned improves the next change."},{"id":"d7_fc_057","domain":"D7","front":"0-day vs 1-day/n-day vulnerability — what is each and why does it matter?","back":"0-day vulnerability:\n• Unknown to the public AND the software vendor\n• No patch exists — vendor has had ZERO DAYS to address it\n• Most dangerous: can be exploited before any defence is possible\n• Once a patch is released, it is NO LONGER a 0-day\n\n1-day / n-day vulnerability:\n• Has been discovered and disclosed (may or may not be widely known)\n• A patch opportunity exists — the vendor knows about it\n• Still dangerous if unpatched, but less critical than a true 0-day\n\nKey distinctions:\n• Known + patched → NOT a 0-day (remediation exists)\n• Widely known + unexploited → NOT a 0-day (vendor can act)\n• Unknown to vendor → 0-DAY (zero days to fix)"},{"id":"d7_fc_058","domain":"D7","front":"Change management vs configuration management — how do they differ?","back":"Change management:\n• Process for APPROVING and CONTROLLING alterations to the IT environment\n• All changes must be logged, evaluated, approved, tested, implemented, and reviewed\n• Managed by the Change Advisory Board (CAB)\n• Scope: any change to the environment (software, hardware, processes)\n• Goal: minimise disruption from changes\n\nConfiguration management:\n• Process for ensuring changes are IMPLEMENTED EFFICIENTLY AND SECURELY\n• Focuses on the technical execution: proposal → approval → test → implement → document → audit\n• Includes tracking the current state of systems (baseline configuration)\n• Goal: controlled, secure, and auditable change implementation\n\nRelationship: Change management governs WHETHER a change happens. Configuration management governs HOW it is implemented."},{"id":"d7_fc_059","domain":"D7","front":"Full backup — what it backs up, archive bits, restoration, and trade-offs?","back":"What it backs up:\n• EVERYTHING in the backup policy — entire database or system\n• No distinction between changed and unchanged files\n\nArchive bits:\n• Full backup CLEARS ALL archive bits after completion\n• All files marked as backed up (bit reset to 0)\n\nRestoration:\n• Requires ONLY 1 TAPE (the most recent full backup)\n• Single operation — no chaining of multiple tapes needed\n• Example: Failure on Thursday → restore from Wednesday full backup tape = 1 tape\n\nTrade-off — Completeness vs Time:\n• Advantage: simplest and most complete backup/restore\n• Disadvantage: large datasets can take MANY HOURS → infrequent runs\n• Common strategy: weekly full backup + daily incremental or differential backups"},{"id":"d7_fc_060","domain":"D7","front":"Incremental backup — what it backs up, archive bits, restoration, and trade-offs?","back":"What it backs up:\n• Everything changed since the LAST BACKUP (last incremental OR last full)\n• NOT since the last full — only since the most recent backup of any kind\n\nArchive bits:\n• CLEARS archive bits on all files it backs up (same as full backup)\n• Next incremental will only pick up files whose bits get set again (new changes)\n\nRestoration:\n• Requires the last full backup PLUS EVERY incremental tape since\n• Example: Thursday restore with Sunday full + daily incrementals = 4 tapes\n  (Sunday full + Mon + Tue + Wed incrementals, applied in sequence)\n• Monthly full + daily incremental = up to 30 tapes in worst case\n\nTrade-off vs Differential:\n• Incremental: FAST to create, SLOW to restore (many tapes)\n• Differential: SLOWER to create (grows daily), FAST to restore (always 2 tapes: full + latest differential)"},{"id":"d7_fc_061","domain":"D7","front":"Differential backup — what it backs up, archive bits, restoration, trade-offs, and comparison to incremental?","back":"What it backs up:\n• Everything changed since the LAST FULL BACKUP\n• Grows larger each day (Monday+Tuesday+Wednesday... all included in Wednesday's differential)\n\nArchive bits:\n• Does NOT clear archive bits (key difference from incremental and full)\n• Files remain flagged — every differential re-captures all changes since last full\n\nRestoration:\n• Always requires ONLY 2 TAPES: last full + most recent differential\n• Example: Thursday restore = Sunday full + Wednesday differential = 2 tapes\n\nTrade-offs:\n• Backup speed: SLOWER than incremental (set grows daily)\n• Restore speed: FAST (always just 2 tapes)\n\nComparison to Incremental:\n| | Incremental | Differential |\n| Backs up | Since last backup (any) | Since last FULL |\n| Archive bits | CLEARS | Does NOT clear |\n| Backup speed | Fast | Slower (grows) |\n| Restore | Many tapes | 2 tapes always |\n\nRule: Never mix both on the SAME data — archive bit conflict causes backup gaps."},{"id":"d7_fc_062","domain":"D7","front":"RAID — what it is, 2 basic forms, and RAID 0 vs 1 vs 5 comparison?","back":"RAID = Redundant Array of Independent/Inexpensive Disks\nPurpose: fault tolerance through redundant hardware → maximum uptime\n\n2 basic forms:\n• Disk Mirroring: same data on multiple disks; SLOWER (writes twice); 2x disk space; at least 2 disks\n• Disk Striping: data written simultaneously across disks; FASTER; NO redundancy alone\n  → Add parity (XOR) for redundancy: needs at least 3 disks\n\nRAID levels for exam:\n\nRAID 0 — Striping, no parity, no fault tolerance\n• Speed only; 2+ disks; if 1 disk fails, ALL data lost\n\nRAID 1 — Mirroring (mirror set)\n• 2 disks, identical data, writes to both simultaneously\n• Full redundancy; uses 2x disk space\n\nRAID 5 — Block-level striping + DISTRIBUTED parity\n• 3+ disks; speed AND redundancy\n• Survives 1 disk failure; if 2 fail before rebuild → restore from tape"},{"id":"d7_fc_063","domain":"D7","front":"MTBF and MTTR — what they mean, why they matter for RAID, and the same-manufacturer risk?","back":"MTBF = Mean Time Between Failures\n• Average time a component is expected to operate before failing\n• Disks from the same manufacturer + same production batch share the same MTBF\n• Risk: all disks in a server may fail around the same time\n\nSame-manufacturer disk risk:\n• A second disk may fail BEFORE the first is replaced and the RAID array rebuilt\n• RAID 5 only survives 1 disk failure → 2 failures before rebuild = restore from tapes\n\nMTTR = Mean Time To Repair\n• Time within which a vendor must deliver a replacement disk onsite\n• Larger data centres include MTTR in SLAs with disk/server vendors\n• Common SLA windows: 4 hours or 8 hours\n• Shorter MTTR = less time the array is vulnerable during a single-disk failure\n\nKey relationship: MTBF tells you WHEN disks will fail; MTTR tells you HOW FAST you can replace them."},{"id":"d7_fc_064","domain":"D7","front":"E-vaulting — what is it, how does it work, and what makes it different from a regular backup?","back":"E-vaulting (Electronic Vaulting):\n• Definition: a backup service that AUTOMATICALLY transfers data to an OFFSITE storage location\n• Primary purpose: disaster recovery — recover data if primary systems fail or lose data\n\nHow it works:\n• Transfers only CHANGES since the last backup (incremental)\n• Allows more frequent backups than full backups (faster to run, less data each time)\n• Offsite storage is the key feature — not encryption or cloud platform choice\n\nRecovery:\n• When primary systems lose data, restore from the offsite e-vault copy\n• Fast
