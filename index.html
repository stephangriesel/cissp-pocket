damentally about sensitivity — understanding the impact if data is improperly accessed, disclosed, modified, or destroyed. This impact could be legal, financial, reputational, or operational. Sensitivity levels drive every other decision: how long to keep it, who may access it, how to store and protect it, and how to destroy it. Storage capacity is a practical constraint, not a classification driver. Retention policies and access controls are downstream outcomes of classification, not inputs to it."},{"id":"d2_q_011","domain":"D2","difficulty":"easy","question":"Who is responsible for creating the policies that govern an organisation's data security?","options":["Data custodians — the technical staff who implement security controls","Mission/business owners — senior executives who set policy for data security","Data controllers — who create and manage sensitive organisational data","System owners — the managers responsible for systems housing the data"],"answer":1,"explanation":"Mission/business owners are senior executives who create the policies that govern data security across the organisation. They operate at the highest level of data governance. Data custodians are technical staff who implement and execute controls. System owners manage the infrastructure that houses data. Data controllers create and manage sensitive data but are not the policymakers — that responsibility sits with senior leadership."},{"id":"d2_q_012","domain":"D2","difficulty":"easy","question":"A data/information owner works at which level of the organisation, and what are the TWO key things they are responsible for assigning?","options":["Technical level — assigns firewall rules and patch schedules","Management level — assigns sensitivity labels and backup frequency","Executive level — creates security policies and audit schedules","Technical level — performs backups, restores, and system configuration"],"answer":1,"explanation":"The data/information owner operates at the management level and is specifically responsible for assigning sensitivity labels (classifying the data) and backup frequency (how often the data is backed up). They are not necessarily IT staff — this role could be filled by a manager from HR, payroll, finance, or any department that owns the data. Data custodians carry out the backups; senior executives set the policies."},{"id":"d2_q_013","domain":"D2","difficulty":"medium","question":"What is the system owner's primary responsibility, and at what level of the organisation do they typically operate?","options":["Technical level — performs backups, restores, and patching on the systems","Executive level — creates organisation-wide data security policies","Management level — owns and is responsible for the systems that house the data","Technical level — assigns sensitivity labels to data stored in the systems"],"answer":2,"explanation":"The system owner operates at the management level and is responsible for the systems (hardware, software, infrastructure) that house the organisation's data. Common examples are a data center manager or an infrastructure manager. They are distinct from the data owner (who classifies the data and sets backup frequency) and from the data custodian (who performs the hands-on technical work like backups and patches)."},{"id":"d2_q_014","domain":"D2","difficulty":"medium","question":"Your HR department manages employee payroll data internally and outsources the actual payroll calculations to an external vendor. Which roles do these two parties fulfil?","options":["HR = data processor, external vendor = data controller","HR = data controller, external vendor = data processor","Both HR and the external vendor are data controllers","HR = system owner, external vendor = data custodian"],"answer":1,"explanation":"HR creates and manages the sensitive payroll data, making them the data controller. The external vendor processes that data on HR's behalf (running the calculations) but does not own or govern it — that makes them the data processor. The key distinction: controllers determine the purpose and means of processing; processors act on the controller's instructions. This distinction is critical under regulations such as GDPR."},{"id":"d2_q_015","domain":"D2","difficulty":"easy","question":"A data custodian carries out backups, restores, patches, and system configuration. Whose directions do they follow when performing these tasks?","options":["The mission/business owner — the senior executive who sets data policy","The data/information owner — who determines what must be done and how","The system owner — the manager responsible for the infrastructure","The data controller — who creates and governs the sensitive data"],"answer":1,"explanation":"Data custodians are the technical hands-on staff who implement instructions — but they follow the directions of the data/information owner, not the executive or the infrastructure manager. The data owner decides what labels to apply, how often backups occur, and what the configuration requirements are. The custodian then executes those decisions. This division separates governance (data owner) from implementation (custodian)."},{"id":"d2_q_016","domain":"D2","difficulty":"medium","question":"In data roles and responsibilities, the business/mission owner is PRIMARILY responsible for which of the following?","options":["Ensuring data integrity through validation and error-correction mechanisms","Determining data storage methods and selecting appropriate technology","Providing day-to-day data input into databases and repositories","Setting data access policies — defining who can access which data, under what conditions"],"answer":3,"explanation":"Business/mission owners set data access policies at a strategic level — defining who gets access to what data, under what conditions, and aligned with business objectives. They understand the sensitivity and significance of different data assets, making them best-placed to make these governance decisions. Ensuring data integrity is the domain of data stewards and engineers. Selecting storage methods is the role of data architects. Day-to-day data input is handled by employees or data-entry staff."},{"id":"d2_q_017","domain":"D2","difficulty":"medium","question":"Which of the following is NOT a common responsibility of a data custodian?","options":["Ensuring data integrity and accuracy during storage and transmission","Ensuring data is accessible to authorised users when needed","Designing and implementing comprehensive organisation-wide security controls","Performing regular backups and restoring data after failures"],"answer":2,"explanation":"Designing and implementing organisation-wide security controls is the responsibility of security officers and IT security teams — not data custodians. Custodians execute specific security procedures that have already been designed and mandated by others. Their core duties are hands-on and operational: ensuring data integrity, maintaining availability for authorised users, performing backups and restores, applying patches, and configuring systems — all following the directions of the data owner."},{"id":"d2_q_018","domain":"D2","difficulty":"medium","question":"A company outsources payroll processing to a third-party vendor in another state. The security team is concerned about the vendor's data protection practices. What is the MOST appropriate measure to verify those practices?","options":["Trust the vendor's marketing materials and security certifications at face value","Assume the vendor follows equivalent laws because both parties are in the same country","Exercise the right to audit the vendor's processes and data handling practices","Transfer all liability to the vendor through a verbal agreement"],"answer":2,"explanation":"When data processing is outsourced to a data processor, the organisation should retain and exercise the right to audit the vendor, typically on an annual basis. Audits are the only reliable way to verify that the vendor's policies, procedures, and controls actually meet required standards. Marketing materials are unverifiable claims. Being in the same country does not mean identical state-level laws apply. Verbal agreements have no legal standing and liability cannot be fully transferred regardless — the data controller retains responsibility for ensuring its processor protects the data."},{"id":"d2_q_019","domain":"D2","difficulty":"easy","question":"When disposing of paper documents containing sensitive data, why is cross shredding recommended over standard strip shredding?","options":["Cross shredding is faster and more cost-effective than strip shredding","Standard strip shreds can be re-assembled by software, making them insufficiently secure","Cross shredding produces pieces that are easier to sort for recycling","Strip shredding is not approved for any document containing data"],"answer":1,"explanation":"Standard strip shredding cuts paper into long parallel strips that can be re-assembled by software programs, potentially recovering the original document. Cross shredding (also called confetti or micro-cut shredding) cuts paper in two directions, producing small irregular pieces that are far harder to reconstruct. For any document containing sensitive data, cross shredding is the recommended method. Any paper with data on it should be shredded securely — cross shredding meets that standard."},{"id":"d2_q_020","domain":"D2","difficulty":"easy","question":"A user deletes a sensitive file from their workstation. Which statement BEST describes what happens to the data?","options":["The data is permanently erased from the storage medium and cannot be recovered","The data is overwritten with zeros, making recovery infeasible","The file is only removed from the file system's table; the underlying data remains on disk and is recoverable","The operating system automatically purges the data from the storage medium"],"answer":2,"explanation":"Deleting a file only removes the reference to it from the file system's index (the table of contents). The actual data blocks remain on the disk and are fully recoverable using forensic tools until those blocks are overwritten by new data. Deleting is the weakest form of data disposal and provides no meaningful protection for sensitive information. Overwriting with zeros is a separate, stronger operation (Clear). Purging requires an even more thorough process."},{"id":"d2_q_021","domain":"D2","difficulty":"medium","question":"What is the key difference between Sanitization and Purge as data disposal methods?","options":["Sanitization physically destroys the media; Purge only overwrites it with zeros","Sanitization removes the file table entry; Purge overwrites the actual data blocks","Sanitization renders data infeasible to recover for a given effort level; Purge renders recovery infeasible even in a laboratory environment","Both methods produce identical results — the terms are interchangeable"],"answer":2,"explanation":"Sanitization renders the target data infeasible to recover for a specific anticipated level of recovery effort — it is defined relative to a threat model. Purge goes further: it removes data to a point where recovery is not feasible even with state-of-the-art laboratory techniques. Purge is the stronger method. Neither involves only a file-table operation (that is deletion) nor is it necessarily physical destruction (which is a separate category). The two terms are not interchangeable."},{"id":"d2_q_022","domain":"D2","difficulty":"medium","question":"Which of the following groups of disposal methods are collectively classified as 'soft destruction'?","options":["Degaussing, physical destruction, and incineration","Deleting, formatting, and overwriting","Purging, sanitization, and degaussing","Physical destruction and cryptographic erasure"],"answer":1,"explanation":"Soft destruction methods — deleting, formatting, and overwriting — do not physically harm the storage medium. Deleting removes the file system reference; formatting lays a new file structure over the old one; overwriting writes 0s or random characters over existing data. All three leave the medium intact and reusable. Hard destruction methods (degaussing, shredding, incineration) physically damage or destroy the media. Soft methods vary greatly in effectiveness: deleting and formatting are easily reversed, while overwriting is significantly stronger."},{"id":"d2_q_023","domain":"D2","difficulty":"easy","question":"Which data disposal technique works by writing 0s or random characters over the existing data on a storage medium?","options":["Deleting — removing the file from the file system's directory","Formatting — laying a new file structure over the existing one","Overwriting (Clear) — writing 0s or random characters over the actual data","Degaussing — applying a strong magnetic field to erase magnetic media"],"answer":2,"explanation":"Overwriting, also known as Clear, writes 0s or random characters directly over the data blocks on the storage medium, making the original content unreadable without physically destroying the device. It is stronger than deleting (which only removes the directory entry) or formatting (which lays a new file structure on top but leaves most data intact). Degaussing uses magnetism and only works on magnetic media. Overwriting works on any writable medium but is not effective on SSDs in the same way it is on HDDs."},{"id":"d2_q_024","domain":"D2","difficulty":"medium","question":"Which of the following represents the HIGHEST level of data destruction?","options":["Degaussing — applying a strong magnetic field to erase magnetic storage media","Shredding — cutting storage media into small pieces","Overwriting — replacing data with 0s or random characters across multiple passes","Incineration — completely destroying the physical media by burning"],"answer":3,"explanation":"Incineration is the highest level of data destruction because it completely eliminates the physical medium — there is simply nothing left to recover data from. Physical destruction methods (incineration, melting, crushing, shredding) make storage media completely unusable. Shredding is physical destruction but sophisticated labs could theoretically reconstruct data from large enough pieces. Degaussing is effective for magnetic media but relies on completeness of the process. Overwriting is software-based and cannot reach defective sectors that are hidden from the OS."},{"id":"d2_q_025","domain":"D2","difficulty":"medium","question":"You have 12 decommissioned servers, each with four spinning-disk hard drives. Which of the following would be the LEAST acceptable method for dealing with data remanence?","options":["Overwriting the entire drive multiple times with random data","Degaussing the drives using a certified degausser","Using encryption software to encrypt the data on each drive","Physically destroying the drives through shredding or incineration"],"answer":2,"explanation":"Encrypting the data does not address remanence — the original data is still present on the disk; it is simply made unreadable without the decryption key. If the key is ever compromised or if advanced decryption techniques are applied, the data could still be recovered. Remanence must be addressed by removing or destroying the actual data, not by obscuring it. Overwriting replaces the actual bits. Degaussing randomises the magnetic domains. Physical destruction eliminates the media entirely. Encryption alone is not an acceptable remanence-mitigation technique."},{"id":"d2_q_026","domain":"D2","difficulty":"easy","question":"Which of the following is a KEY characteristic of RAM (Random Access Memory)?","options":["RAM is a form of long-term storage media, similar to a hard drive","RAM is non-volatile — its contents persist even after the power is removed","RAM is volatile — all data stored in it is lost when the power supply is removed","RAM is a type of processor that executes program instructions"],"answer":2,"explanation":"RAM is volatile memory — its contents exist only while the system is powered on. When power is lost or the system shuts down, all data in RAM is gone. This makes RAM ideal for temporarily storing data and instructions that the CPU needs immediate access to, but unsuitable for long-term storage. Non-volatile memory (hard drives, SSDs, ROM, flash) retains data without power. RAM is a memory component, not a processor — the CPU performs computations; RAM holds the data the CPU works on."},{"id":"d2_q_027","domain":"D2","difficulty":"easy","question":"When applying standards and frameworks, what does the process of tailoring allow an organisation to do?","options":["Develop entirely new standards and frameworks from scratch","Ignore sections of the standard that seem inconvenient","Customise the standard or framework to fit the organisation's specific needs","Use the standard as a guideline without making any modifications"],"answer":2,"explanation":"Tailoring is the process of adapting an existing standard or framework to the unique requirements of a specific organisation — omitting irrelevant controls, strengthening others, or incorporating additional requirements. It does not mean ignoring the standard or starting from scratch. Using a standard as-is without modification is scoping, not tailoring. Tailoring ensures the standard remains relevant and effective in the organisation's specific operational context."},{"id":"d2_q_028","domain":"D2","difficulty":"medium","question":"Which process involves formally evaluating and testing the security controls of an information system before it is put into operation?","options":["Provisioning — setting up systems and assigning user accounts and access privileges","Validation — confirming a system meets defined business requirements","Verification — confirming user or system identity through authentication","Certification — formally evaluating whether a system's security controls meet required standards"],"answer":3,"explanation":"Certification is the formal process of evaluating, testing, and examining the security controls built into an information system before it goes live. It produces documented assurance that the system meets its security requirements. Provisioning sets up systems and accounts but does not evaluate security controls. Validation checks whether a system meets business requirements during development. Verification confirms identity (authentication). Only after certification does accreditation (management sign-off accepting residual risk) follow."},{"id":"d2_q_029","domain":"D2","difficulty":"medium","question":"What is the term for the formal, official declaration that an information system is approved to operate within an organisation's network under a specific set of security guidelines?","options":["Authorization — granting users or systems specific access rights and permissions","Accreditation — the senior official's formal acceptance that the system may operate and that residual risk is acceptable","Validation — confirming that a system fulfils the requirements it was designed to address","Certification — the technical assessment of whether security controls meet required standards"],"answer":1,"explanation":"Accreditation is the formal declaration — made by a senior agency or organisational official — that an information system is approved to operate in a particular security configuration. It represents the organisation's acceptance of the residual risk after certification. Certification is the technical evaluation that comes before accreditation. Authorization is about granting users access rights (different concept). Validation confirms requirements are met during development. Accreditation is the management decision that says 'we accept the risk and approve this system to go live.'"},{"id":"d2_q_030","domain":"D2","difficulty":"medium","question":"An organisation adopts a cloud-based application for storing customer data. What are the PRIMARY benefits of implementing a Cloud Access Security Broker (CASB)?","options":["Improved user experience and productivity when accessing cloud services","Enhanced collaboration and communication among remote team members","Improved visibility into cloud usage and potential threats","Enhanced data protection and regulatory compliance across cloud services"],"answer":3,"explanation":"A CASB acts as a security enforcement point between the organisation and cloud service providers, offering encryption, data loss prevention, and access control. Its primary value is enhancing data protection and ensuring compliance with internal policies and regulations across multiple cloud services. Visibility is a secondary benefit — useful but not the primary driver for implementing a CASB. Productivity and collaboration are not CASB functions; a CASB is a security tool, not a collaboration platform."},{"id":"d2_q_031","domain":"D2","difficulty":"medium","question":"Before deploying a DLP (Data Loss Prevention) system, the security team realises the system cannot distinguish sensitive data from non-sensitive data. What must the organisation do FIRST?","options":["Encrypt all data so the DLP system does not need to differentiate between types","Block all outbound traffic permanently until the DLP system is fully configured","Perform data identification and classification — manually or through machine learning — so the DLP system knows what to protect","Allow the DLP system to run in passive mode for a full year before making configuration decisions"],"answer":2,"explanation":"A DLP system can only protect data it has been told is sensitive. Without data identification and classification, the system has no basis to decide what to allow or block. Classification can be applied manually (labels on files/datasets) or automatically through machine learning that analyses content. Encrypting everything does not solve the classification problem — the DLP still needs to know what should not leave the network. Blocking all outbound traffic cripples operations. A year-long passive phase leaves the organisation exposed for twelve months."},{"id":"d2_q_032","domain":"D2","difficulty":"medium","question":"Your organisation uses a cloud platform and receives reports of unauthorised access to sensitive data by external parties. As IT security manager, which solution BEST addresses this specific threat?","options":["Implement a strong DLP strategy to prevent data from leaving the network","Establish a CSPM process to identify misconfigurations in the cloud environment","Implement a CASB to sit between the organisation and the cloud provider, providing visibility, access control, and threat protection","Set up a strict BYOD policy to control the risks from personal devices"],"answer":2,"explanation":"A CASB is specifically designed for cloud environments — it sits between on-premises infrastructure and the cloud provider, offering visibility, compliance enforcement, data security, and threat protection. For unauthorised external access to cloud-stored data, a CASB is the most targeted solution. DLP prevents data from leaving, but does not directly address external unauthorised access to cloud services. CSPM focuses on misconfiguration and compliance monitoring, not active access threats. A BYOD policy controls personal device risk but lacks cloud-specific access controls."},{"id":"d2_q_033","domain":"D2","difficulty":"medium","question":"When applying standards and frameworks, what does SCOPING mean?","options":["Implementing the full standard, but to a higher level in some areas","Determining how much implementation will cost the organisation","Picking and choosing which parts of the standard to implement","Evaluating whether the standard is the right fit for the organisation"],"answer":2,"explanation":"Scoping means selecting which parts of a standard or framework apply to your environment — you implement the relevant portions rather than blindly adopting every control. Compare with tailoring, which customises the controls you do implement."},{"id":"d2_q_034","domain":"D2","difficulty":"medium","question":"Which of the following is a COMMON physical attack against data at rest?","options":["Man-in-the-Middle (MITM) interception","Stealing unencrypted laptops or storage devices to access stored data","Using screen scrapers to capture displayed content","Deploying keyloggers to record user input"],"answer":1,"explanation":"A very common real-world attack on data at rest is the physical theft of unencrypted laptops or portable drives. This is why encrypting data at rest is essential — if the device is stolen, the data remains protected. MITM attacks target data in motion; screen scrapers and keyloggers target data in use."},{"id":"d2_q_035","domain":"D2","difficulty":"easy","question":"What are we trying to get rid of when we dispose of data?","options":["The hardware the data was stored on","Data remanence — the residual data that remains after deletion attempts","The encryption keys used to protect the data","The audit logs associated with the data"],"answer":1,"explanation":"The goal of data disposal is to eliminate data remanence — the residual traces of data that remain on media even after standard deletion or formatting. Techniques like overwriting, degaussing, and physical destruction are used to ensure no recoverable data remains."},{"id":"d2_q_036","domain":"D2","difficulty":"easy","question":"How long should an organisation keep backup data?","options":["Forever — backup data should never be deleted","As long as it is useful OR required by regulation, whichever period is longer","At most one month if a full backup is kept","Always a minimum of one year regardless of content"],"answer":1,"explanation":"The rule of thumb for backup retention is: keep data as long as it is useful to the organisation OR as long as it is required by law or regulation — whichever is the longer period. This balances operational value against legal obligations."},{"id":"d2_q_037","domain":"D2","difficulty":"medium","question":"Which set of controls BEST protects data while it is actively in use?","options":["Full-disk encryption and VPN tunnels","Clean desk policies, print policies, and locking workstations when unattended","Need-to-know access policies alone","Clean desk policies, job rotation, and mandatory leave"],"answer":1,"explanation":"Data in use cannot be encrypted while being processed, so physical and procedural controls are key: clean desk policies (limiting exposed paper/screens), print policies (collecting printouts immediately), and locking workstations when stepping away all reduce the risk of unauthorised access or viewing."},{"id":"d2_q_038","domain":"D2","difficulty":"medium","question":"How do you erase an EPROM chip?","options":["It cannot be erased once written","Use software to overwrite the existing data","Expose the chip window to UV (ultraviolet) light","Remove the chip and degauss it"],"answer":2,"explanation":"EPROM (Erasable Programmable ROM) has a small transparent window on the chip. Exposing that window to UV light for a set period discharges the stored charge, erasing the content. It can then be reprogrammed. EEPROM and flash use electrical signals to erase; degaussing only works on magnetic media."},{"id":"d2_q_039","domain":"D2","difficulty":"medium","question":"Why do data disposal procedures often require the use of MULTIPLE destruction methods?","options":["Because it is easier and faster than using a single method","To ensure no data remanence — multiple methods address the weaknesses of any single approach","To ensure the data is still partially accessible for recovery after disposal","Because regulators always mandate exactly two destruction methods"],"answer":1,"explanation":"Using multiple destruction methods (for example, overwriting and then shredding) provides defence in depth against data remanence. No single method is guaranteed to be perfect, so layering techniques reduces the risk that any residual data could be recovered."},{"id":"d2_q_040","domain":"D2","difficulty":"easy","question":"Which statement BEST describes what a clean desk policy requires?","options":["Keeping your physical desk surface free of all clutter at all times","Minimal use of paper copies, and using them only while actively at your desk","Shredding all paper documents before leaving the office each day","Collecting printouts from the printer the moment they are produced"],"answer":1,"explanation":"A clean desk policy means minimising the use of paper copies and ensuring any paper documents containing sensitive data are only out on the desk while actively being used. When you leave your desk or are done with a document, it should be secured — not left exposed for others to view."},{"id":"d2_q_041","domain":"D2","difficulty":"easy","question":"What is the PRIMARY control used to protect data at rest?","options":["Clean desk policy","Encryption","Privacy screens","Discretionary Access Control (DAC)"],"answer":1,"explanation":"Encryption is the primary control for protecting data at rest. Encrypting stored data ensures that even if media is stolen or a storage device is removed, the data cannot be read without the decryption key. Clean desk policies and privacy screens protect data in use; DAC controls access but does not protect the data itself."},{"id":"d2_q_042","domain":"D2","difficulty":"medium","question":"Which of the following is a COMMON technical attack against data at rest?","options":["Shoulder surfing","Eavesdropping on network traffic","Cryptanalysis — attempting to break the cryptographic protection on stored data","All of these equally target data at rest"],"answer":2,"explanation":"Cryptanalysis — the practice of attempting to break cryptographic algorithms or find weaknesses in encryption — directly targets data at rest that is protected by encryption. Shoulder surfing is an attack on data in use, and eavesdropping targets data in motion."},{"id":"d2_q_043","domain":"D2","difficulty":"medium","question":"During which data state does encryption FAIL to protect data, and why?","options":["Data at rest — encryption keys can be stolen from storage","Data in motion — packets can be captured before decryption","Data in use — data must be decrypted to be actively processed by the CPU","Data on backup tapes — encryption degrades over long storage periods"],"answer":2,"explanation":"When data is actively being used (processed by applications or the CPU), it must be decrypted and held in memory in plaintext form. At that moment, encryption cannot protect it. Physical controls (clean desk, screen filters, locked workstations) are used instead to protect data while in use."},{"id":"d2_q_044","domain":"D2","difficulty":"medium","question":"Which type of read-only memory can be programmed EXACTLY ONCE and cannot be erased?","options":["EPROM (Erasable Programmable ROM)","PROM (Programmable ROM)","EEPROM (Electrically Erasable Programmable ROM)","DRAM (Dynamic RAM)"],"answer":1,"explanation":"PROM (Programmable ROM) can be programmed once — typically by 'blowing' microscopic fuses — and after that the data is permanent and cannot be erased or changed. EPROM can be erased with UV light; EEPROM can be erased electrically; DRAM is volatile RAM, not ROM."},{"id":"d2_q_045","domain":"D2","difficulty":"easy","question":"In the US government classification scheme, which level applies to information whose disclosure would cause NO harm to national security?","options":["Unregulated","Unclassified","Secret","Common Knowledge"],"answer":1,"explanation":"In the US government system, Unclassified is the designation for information that can be shared without harming national security. The harm-based hierarchy runs: Unclassified (no harm) → Confidential (damage) → Secret (serious damage) → Top Secret (exceptionally grave damage)."},{"id":"d2_q_046","domain":"D2","difficulty":"medium","question":"A data retention policy defines which data to keep, how long to keep it, and where to store it. Which of the following should NOT be a primary consideration in a data retention policy?","options":["Which categories of data must be retained","How to safely destroy data once the retention period expires","How long each category of data must be kept","Where backup copies will be stored"],"answer":1,"explanation":"Data destruction procedures belong in a separate data disposal or destruction policy, not the retention policy itself. A retention policy focuses on what data to keep, for how long, and where — not on how to destroy it when the period ends. Mixing the two can create confusion and compliance gaps."},{"id":"d2_q_047","domain":"D2","difficulty":"easy","question":"An attacker steals a backup tape from an off-site storage facility. What BEST prevents them from accessing the data on the tape?","options":["Proper physical handling procedures for backup media","Proper data encryption applied to the backup data","Proper labelling and inventory control of the tape","A robust data retention policy governing backup frequency"],"answer":1,"explanation":"If backup data is encrypted, a stolen tape is useless to an attacker — they cannot read the data without the decryption key. Physical handling procedures, labelling, and retention policies are all important, but only encryption directly prevents the attacker from reading the stolen data."},{"id":"d2_q_048","domain":"D2","difficulty":"easy","question":"End-to-end encryption is specifically designed to protect data in which state?","options":["Data at rest — stored on servers or hard drives","Data in motion — while being transmitted across a network","Data in use — while being actively processed","All three states simultaneously"],"answer":1,"explanation":"End-to-end encryption protects data in motion — it encrypts data at the source and keeps it encrypted across every hop of the network until it reaches the intended recipient. This prevents eavesdropping or interception during transmission."},{"id":"d2_q_049","domain":"D2","difficulty":"medium","question":"An organisation adds access logs to its backup servers, tracking who accesses backup data and when. This is an example of which data management practice?","options":["Proper data storage","Proper data handling","Data retention management","Data encryption at rest"],"answer":1,"explanation":"Access logging — recording who accesses data and when — is a component of proper data handling. Data handling covers all procedures around how data is accessed, used, transferred, and tracked throughout its lifecycle, ensuring accountability and auditability."},{"id":"d2_q_050","domain":"D2","difficulty":"easy","question":"Which of the following would be the MOST appropriate method for securely disposing of an SSD drive?","options":["Degaussing the drive using a strong magnetic field","Formatting the drive using a standard operating system format tool","Shredding the drive using an industrial media shredder","Simply deleting all files and emptying the recycle bin"],"answer":2,"explanation":"SSDs store data on flash memory chips, which are not magnetic — degaussing has no effect. Standard formatting and file deletion do not reliably erase SSD data due to wear-levelling. Physical shredding destroys the chips entirely, ensuring data remanence is eliminated."},{"id":"d2_q_051","domain":"D2","difficulty":"easy","question":"An organisation handles highly sensitive customer data. Which of these storage and transmission mediums should be encrypted?","options":["Hard disks only — network traffic is protected by the firewall","Backup tapes only — primary disks are physically secured","All of these — hard disks, backup tapes, and data sent over the network","Data sent over the network only — stored data is hard to intercept"],"answer":2,"explanation":"Sensitive data should be encrypted in all storage and transmission contexts: hard disks (data at rest), backup tapes (data at rest in another location), and network transmission (data in motion). Relying on physical security or firewalls alone is insufficient defence in depth."},{"id":"d2_q_052","domain":"D2","difficulty":"medium","question":"An SSD drive has been physically damaged and its chips are partially destroyed. The drive cannot be accessed or overwritten. Which disposal method BEST ensures no data remanence?","options":["Degauss the drive","Attempt to overwrite accessible sectors","Incinerate the drive","Format the drive using a secure erase utility"],"answer":2,"explanation":"When a drive is physically damaged and cannot be overwritten, incineration is the most reliable method to guarantee no data remanence. It destroys the storage chips completely. Degaussing is ineffective on SSDs; overwriting and secure erase require the drive to be functional."},{"id":"d2_q_053","domain":"D2","difficulty":"medium","question":"What is e-discovery in the context of data management and legal proceedings?","options":["Discovering and cataloguing all electronic assets owned by the organisation","Setting retention policies to ensure data is available if needed for litigation","The process of producing electronic information to internal or external legal teams when required","Automatically deleting data whose retention period has expired to avoid legal exposure"],"answer":2,"explanation":"E-discovery (electronic discovery) is the process of identifying, collecting, and producing electronically stored information (ESI) in response to a legal request or investigation. It requires organisations to have processes in place to locate and preserve relevant data — and to avoid destroying it once a legal hold is in place."},{"id":"d2_q_054","domain":"D2","difficulty":"medium","question":"In the US government data classification scheme, which level applies to information whose unauthorised disclosure would CAUSE DAMAGE to national security?","options":["Unclassified — no harm to national security","Secret — serious damage to national security","Confidential — damage to national security","Top Secret — exceptionally grave damage to national security"],"answer":2,"explanation":"Confidential is the US government classification level for information whose unauthorised disclosure could damage national security. The levels by harm severity: Unclassified (no harm), Confidential (damage), Secret (serious damage), Top Secret (exceptionally grave damage)."},{"id":"d2_q_055","domain":"D2","difficulty":"easy","question":"Which C-suite executive is primarily responsible for the day-to-day financial leadership and oversight of an organisation?","options":["CEO — responsible for overall organisational operations and strategy","CIO — responsible for IT strategy and information systems","CFO — responsible for day-to-day financial management and reporting","CSO — responsible for physical and personnel security"],"answer":2,"explanation":"The CFO (Chief Financial Officer) leads the day-to-day financial operations of the organisation, including budgeting, accounting, financial reporting, and treasury. The CEO oversees overall strategy; the CIO leads IT; the CSO leads physical/personnel security; the CISO leads information security."},{"id":"d2_q_056","domain":"D2","difficulty":"medium","question":"When assigning a data sensitivity level, which of the following should NOT be a determining factor?","options":["The data's potential value to competitors or attackers","The data storage format (file type, database schema, encoding)","Who will have access to the data and their clearance level","Legal or regulatory requirements governing the data type"],"answer":1,"explanation":"The storage format (CSV, JSON, database table, etc.) is irrelevant to how sensitive the data itself is. Sensitivity is determined by factors such as the data's value, the harm its disclosure could cause, legal requirements, and who needs access — not the technical format in which it is stored."},{"id":"d2_q_057","domain":"D2","difficulty":"medium","question":"Flash drives (USB drives) use which type of memory technology?","options":["SDRAM — synchronous dynamic random-access memory","PROM — programmable read-only memory","DRAM — dynamic random-access memory","EEPROM — electrically erasable programmable read-only memory"],"answer":3,"explanation":"Flash drives use EEPROM (Electrically Erasable Programmable ROM) — specifically a type of EEPROM optimised for block-level erasure and high storage density. Unlike traditional EEPROM (which erases byte-by-byte), flash erases in blocks. SDRAM and DRAM are volatile RAM types; PROM can only be written once."},{"id":"d2_q_058","domain":"D2","difficulty":"easy","question":"Which of the following is a COMMON attack that specifically targets data in motion?","options":["Cryptanalysis of stored encrypted files","Shoulder surfing to view displayed information","Eavesdropping — unauthorised interception of data during network transmission","All of these equally target data in motion"],"answer":2,"explanation":"Eavesdropping (packet sniffing, network interception) is the classic attack against data in motion — the attacker intercepts data while it is being transmitted across a network. Controls like TLS/SSL and VPNs are used to protect data in motion. Cryptanalysis targets stored data; shoulder surfing targets data in use."},{"id":"d2_q_059","domain":"D2","difficulty":"medium","question":"Which of the following memory types is considered VOLATILE?","options":["PROM — Programmable Read-Only Memory","Flash memory (EEPROM-based storage)","EPROM — Erasable Programmable Read-Only Memory","DRAM — Dynamic Random-Access Memory"],"answer":3,"explanation":"DRAM (Dynamic RAM) is volatile — it loses its contents when power is removed. It uses tiny capacitors that must be continuously refreshed. PROM, EPROM, and Flash (EEPROM) are all forms of non-volatile ROM that retain data without power."},{"id":"d3_q_001","domain":"D3","difficulty":"hard","question":"A model enforces 'No Read Up' and 'No Write Down'. What does it protect and what type is it?","options":["Integrity, using Biba","Confidentiality, using Bell-LaPadula","Availability, using Clark-Wilson","Integrity, using Clark-Wilson"],"answer":1,"explanation":"'No Read Up' (Simple Security Property) and 'No Write Down' (* Security Property) are Bell-LaPadula, which protects CONFIDENTIALITY and is a MAC model."},{"id":"d3_q_002","domain":"D3","difficulty":"hard","question":"A subject with Top Secret clearance must not read Secret-level data to avoid corruption from lower-integrity information. Which rule and model is this?","options":["No Write Up — Bell-LaPadula","No Read Down (Simple Integrity Axiom) — Biba","No Read Up — Bell-LaPadula","No Write Down — Biba"],"answer":1,"explanation":"'No Read Down' is Biba's Simple Integrity Axiom. Biba protects INTEGRITY — we don't want lower-integrity data corrupting a higher level. Biba's reads/writes are the opposite of Bell-LaPadula's."},{"id":"d3_q_003","domain":"D3","difficulty":"medium","question":"A web app encrypts data with the recipient's public key. Why can't an eavesdropper decrypt it with that same public key?","options":["Public keys can only encrypt, not decrypt; only the matching private key decrypts","The public key is hidden from attackers","The encryption uses a one-time pad","Symmetric keys are used for the actual transfer"],"answer":0,"explanation":"In asymmetric encryption, the public key encrypts and only the matching PRIVATE key (kept secret by the recipient) can decrypt. The public key being public doesn't compromise confidentiality."},{"id":"d3_q_004","domain":"D3","difficulty":"hard","question":"An attacker forges a Kerberos ticket using the krbtgt account hash, allowing them to create ANY ticket in the domain. What is this attack?","options":["Pass the Hash","Silver Ticket","Golden Ticket","ASREPRoast"],"answer":2,"explanation":"A Golden Ticket uses the hash of the krbtgt (Kerberos service) account to create any ticket within Active Directory. A Silver Ticket forges a TGS ticket from a specific service account's hash (more limited)."},{"id":"d3_q_005","domain":"D3","difficulty":"medium","question":"A digital signature provides which two security properties, and which key creates it?","options":["Confidentiality and Availability, using the public key","Integrity and Non-Repudiation, using the sender's private key","Confidentiality and Integrity, using the recipient's public key","Availability and Authentication, using a symmetric key"],"answer":1,"explanation":"A digital signature provides Integrity and Non-Repudiation. The sender hashes the message and encrypts the hash with their PRIVATE key. The recipient verifies with the sender's public key."},{"id":"d3_q_006","domain":"D3","difficulty":"hard","question":"A data center needs gas fire suppression in a room that is sometimes occupied. Why is CO2 a poor choice here?","options":["It damages electronics","It is colorless/odorless and displaces oxygen, causing people to pass out and die","It depletes the ozone layer and is banned","It leaves a corrosive residue"],"answer":1,"explanation":"CO2 is colorless and odorless, displaces oxygen, and can kill occupants — it should only be used in UNMANNED areas. (Halon was banned for ozone depletion; that's a different issue.)"},{"id":"d3_q_007","domain":"D3","difficulty":"medium","question":"On a Type 1 vs. Type 2 hypervisor question, which runs directly on the host hardware (bare metal)?","options":["Type 2, like VMware Workstation on Windows","Type 1, a virtualization OS running directly on hardware","Both run on a host OS","Neither — both require a guest OS first"],"answer":1,"explanation":"Type 1 (Bare Metal) runs directly on the host hardware as part of a virtualization OS (data center). Type 2 runs on top of a regular OS like Windows (your PC)."},{"id":"d3_q_008","domain":"D3","difficulty":"hard","question":"You need encryption for a low-power IoT device but want strength comparable to a 3,072-bit RSA key with a much shorter key. What should you use?","options":["256-bit ECC, which matches ~3,072-bit RSA strength","Single DES, which is fast","512-bit RSA","MD5 hashing"],"answer":0,"explanation":"Elliptic Curve Cryptography (ECC) is much stronger per bit — a 256-bit ECC key is roughly as strong as a 3,072-bit RSA key, making it ideal for low-power devices needing short keys."},{"id":"d3_q_009","domain":"D3","difficulty":"medium","question":"What is the primary goal of the Bell-LaPadula model?","options":["Protect data confidentiality using 'no read up, no write down'","Protect data integrity against unauthorized modification","Protect against malware and viruses","Provide general access control mechanisms"],"answer":0,"explanation":"Bell-LaPadula (developed by the NSA in the 1970s) protects confidentiality via two rules: the simple security property (no read up — a lower-clearance subject cannot read higher-classified data) and the *-property (no write down — a higher-clearance subject cannot write to a lower-classified object). Integrity models like Biba handle the integrity goal instead."},{"id":"d3_q_010","domain":"D3","difficulty":"medium","question":"Which security model is specifically designed to enforce separation of duties and protect the integrity of high-value transactions?","options":["Biba model","Bell-LaPadula model","Brewer and Nash model","Clark-Wilson model"],"answer":3,"explanation":"Clark-Wilson focuses on well-formed transactions and separation of duties to protect data integrity in commercial environments. Biba also targets integrity but uses 'no write up, no read down' without addressing transaction integrity or separation of duties. Brewer-Nash prevents conflict of interest. Bell-LaPadula targets confidentiality."},{"id":"d3_q_011","domain":"D3","difficulty":"medium","question":"Which threat modeling methodology categorises threats as Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, and Elevation of privilege?","options":["PASTA","DREAD","STRIDENT","STRIDE"],"answer":3,"explanation":"STRIDE (developed by Microsoft) provides a systematic way to identify and classify threats across six categories, enabling teams to address security risks during the design phase. PASTA is a risk-centric seven-step methodology. DREAD is a scoring model used to prioritise identified threats, not identify them. STRIDENT is not a real methodology."},{"id":"d3_q_012","domain":"D3","difficulty":"medium","question":"We have 100 users all needing to communicate with each other. Using asymmetric encryption, how many keys would be needed?","options":["10","50","100","200"],"answer":3,"explanation":"In asymmetric encryption each user needs a public key and a private key. 100 users × 2 keys = 200 keys total. The number of keys scales linearly with users, unlike symmetric encryption which requires n(n-1)/2 shared keys."},{"id":"d3_q_013","domain":"D3","difficulty":"easy","question":"In asymmetric encryption, what is your public key?","options":["The key known only to the sender","The key used to encrypt the message","The key used to decrypt the message","The key shared openly so others can encrypt data sent to you"],"answer":3,"explanation":"The public key is distributed freely and allows others to encrypt messages addressed to you. The corresponding private key — kept secret by you — is required to decrypt those messages. The public key is defined by its visibility, not just its encryption function."},{"id":"d3_q_014","domain":"D3","difficulty":"easy","question":"What is the primary difference between symmetric and asymmetric encryption?","options":["Symmetric uses a secret key; asymmetric uses only a public key","Symmetric is faster; asymmetric is more secure","Symmetric uses one key for both encryption and decryption; asymmetric uses two separate keys","Symmetric is more complex; asymmetric is simpler"],"answer":2,"explanation":"The defining distinction is key usage: symmetric encryption uses one shared secret key for both encrypting and decrypting data, while asymmetric encryption uses a public key to encrypt and a mathematically related private key to decrypt."},{"id":"d3_q_015","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST likely vulnerability of an Industrial Control System (ICS)?","options":["Lack of physical security measures","Weak password policies","Unpatched software","Inadequate network segmentation"],"answer":2,"explanation":"ICS systems frequently run on outdated software because the cost, downtime, and risk of upgrades is high. This leaves them without critical security patches, and attackers specifically target these known, unmitigated vulnerabilities."},{"id":"d3_q_016","domain":"D3","difficulty":"easy","question":"Which of the following is the MOST effective way to secure a mobile device against malware?","options":["Installing a firewall on the device","Disabling all non-essential applications","Enabling a screen lock","Keeping the operating system updated"],"answer":3,"explanation":"OS updates deliver patches for known vulnerabilities that malware exploits. Firewalls address network traffic, screen locks address physical access, and disabling apps is impractical — none directly patch exploitable OS flaws."},{"id":"d3_q_017","domain":"D3","difficulty":"hard","question":"A colleague mentions 'polyinstantiation'. What does this refer to?","options":["The process of collecting data from multiple sources for analysis","Deducing sensitive facts by observing non-sensitive data","Monitoring network traffic to establish a baseline","Creating multiple instances of the same data record with different content based on the viewer's security level"],"answer":3,"explanation":"Polyinstantiation stores different versions of the same data object for different security clearance levels, preventing low-clearance users from inferring the existence or content of higher-classified records through indirect observation."},{"id":"d3_q_018","domain":"D3","difficulty":"easy","question":"In which order does a CPU process work through its instruction cycle?","options":["Decode, execute, fetch","Execute, fetch, decode","Fetch, execute, decode","Fetch, decode, execute"],"answer":3,"explanation":"The CPU first fetches the instruction from memory, then decodes it to interpret what operation is required, then executes it. This fetch-decode-execute cycle repeats continuously for every instruction."},{"id":"d3_q_019","domain":"D3","difficulty":"medium","question":"Which of the following is the PRIMARY advantage of containerization for businesses?","options":["It provides a more efficient way to manage resources","It allows for better scalability and flexibility","It ensures a higher level of security for applications","It allows for faster deployment and updates of applications"],"answer":3,"explanation":"Containerization encapsulates an application with its environment, making it portable and consistent across computing environments. This directly enables rapid, reliable deployment and updates, significantly accelerating development cycles — the primary business benefit."},{"id":"d3_q_020","domain":"D3","difficulty":"medium","question":"A server is processing a batch report when the IDS detects an attack and signals the CPU to handle it immediately. The CPU pauses the report, handles the alert, then resumes. What is this signal called?","options":["A thread","A process swap","A pipeline flush","An interrupt"],"answer":3,"explanation":"An interrupt is a signal sent by hardware or software notifying the CPU that a higher-priority event requires immediate attention. The CPU suspends its current task, handles the interrupt routine, then resumes where it left off."},{"id":"d3_q_021","domain":"D3","difficulty":"easy","question":"What is the main difference between a Trojan and a virus?","options":["A Trojan spreads via email; a virus spreads via social media","A Trojan steals data; a virus disrupts systems","A Trojan is harder to detect; a virus is easily caught by antivirus software","A Trojan is hidden within a legitimate program; a virus replicates itself and spreads to other files"],"answer":3,"explanation":"Trojans disguise themselves as or embed inside legitimate software, relying on users to execute them — they do not self-replicate. Viruses attach to clean files and self-propagate throughout systems. The key distinction is propagation method."},{"id":"d3_q_022","domain":"D3","difficulty":"easy","question":"Which type of malware is embedded within a legitimate-looking program?","options":["Worm","Virus","Ransomware","Trojan Horse"],"answer":3,"explanation":"A Trojan Horse is malware disguised as or hidden inside legitimate software. Worms self-propagate across networks without user action. Viruses self-replicate by attaching to other files. Ransomware encrypts data and demands payment, but is often delivered via a Trojan rather than being one itself."},{"id":"d3_q_023","domain":"D3","difficulty":"medium","question":"When does a logic bomb typically detonate?","options":["When the user inputs a specific code","When the user opens a specific file","When the user logs into their account","When a certain date or time is reached"],"answer":3,"explanation":"A logic bomb executes its malicious payload when a predefined condition is met, most commonly a specific date or time. The time delay between planting and detonation helps the author evade immediate detection."},{"id":"d3_q_024","domain":"D3","difficulty":"medium","question":"Which of the following is the HIGHEST benefit of using asymmetric encryption?","options":["It has faster encryption and decryption times","It simplifies key management with a single key","It scales up encryption more efficiently","It provides higher security: only the recipient holds the private key needed to decrypt"],"answer":3,"explanation":"The primary benefit of asymmetric encryption is that the private key never leaves the recipient, so even if the public key is widely distributed, only the intended recipient can decrypt the message — a security guarantee symmetric encryption cannot match."},{"id":"d3_q_025","domain":"D3","difficulty":"easy","question":"Which type of cryptography uses the same algorithm to transform plaintext into ciphertext and vice versa?","options":["Hashing","Asymmetric-key cryptography","Steganography","Symmetric-key cryptography"],"answer":3,"explanation":"Symmetric-key cryptography uses the same shared secret key and corresponding algorithm for both encryption and decryption. Hashing is one-way and irreversible, asymmetric cryptography uses two different keys, and steganography hides data without encrypting it."},{"id":"d3_q_026","domain":"D3","difficulty":"easy","question":"Which of the following is a TRUE statement about symmetric encryption?","options":["Symmetric encryption uses a different key for encrypting and decrypting","Symmetric encryption is not as secure as asymmetric encryption","Symmetric encryption is a type of public key encryption","Symmetric encryption uses the same key for encrypting and decrypting"],"answer":3,"explanation":"Symmetric encryption uses a single shared secret key for both encryption and decryption — this is its defining characteristic. Using different keys describes asymmetric encryption. Calling symmetric encryption 'public key encryption' is incorrect; that term refers to asymmetric systems."},{"id":"d3_q_027","domain":"D3","difficulty":"hard","question":"Your company suffered an acoustic side-channel attack where an attacker inferred sensitive data from sounds emitted by your systems. What is the BEST preventive measure?","options":["Implementing stronger encryption algorithms on all data","Using noise-cancelling headphones while accessing sensitive data","Regularly updating and patching all software and hardware","Implementing physical barriers between computer systems and potential attackers"],"answer":3,"explanation":"Acoustic side-channel attacks capture physical sounds (keystrokes, electronic components) to infer sensitive data. Physical barriers or soundproofing eliminate the attack vector at its source. Encryption protects data content but not acoustic emissions; patching addresses software flaws, not physical sound leakage."},{"id":"d3_q_028","domain":"D3","difficulty":"hard","question":"Which of the following is the MOST effective method to prevent a side-channel attack?","options":["Encrypting all data transmitted over the network","Implementing two-factor authentication","Conducting regular security audits","Isolating sensitive data in a separate network"],"answer":3,"explanation":"Side-channel attacks exploit physical implementation details (timing, power consumption, EM emissions) rather than software flaws. Network isolation minimises the attacker's access to these physical signals. Encryption, 2FA, and audits address different threat vectors and do not directly block side-channel information leakage."},{"id":"d3_q_029","domain":"D3","difficulty":"hard","question":"An insider is suspected of using a covert timing channel to exfiltrate data to an external party. What is the MOST effective countermeasure?","options":["Implementing strong access controls on all devices","Using encryption for all communications","Training employees on cybersecurity best practices","Monitoring network traffic for anomalies"],"answer":3,"explanation":"Covert timing channels encode messages in the timing patterns of network events, bypassing content inspection. Because the insider has legitimate access, access controls and encryption do not block the channel. Real-time traffic monitoring detects the unusual timing patterns that reveal the covert communication."},{"id":"d3_q_030","domain":"D3","difficulty":"easy","question":"Which of the following is the PRIMARY benefit of using Software as a Service (SaaS)?","options":["It allows for easy data sharing between multiple users","It allows for better data security","It allows for seamless integration with other software systems","It reduces IT costs and maintenance"],"answer":3,"explanation":"SaaS offloads hardware procurement, software installation, updates, and maintenance to the provider. The pay-as-you-go model further controls costs. Data sharing, integration, and security vary by provider and are not universal primary benefits."},{"id":"d3_q_031","domain":"D3","difficulty":"medium","question":"Which of the following is the PRIMARY difference between a Type 1 and a Type 2 hypervisor?","options":["Type 1 hypervisors are less secure than Type 2 hypervisors","Type 1 hypervisors have better performance than Type 2 hypervisors","Type 1 is for enterprise use; Type 2 is for personal use","Type 1 hypervisors are installed directly on the hardware; Type 2 hypervisors are installed on top of an operating system"],"answer":3,"explanation":"The defining difference is installation layer: Type 1 (bare metal) runs directly on the host hardware with no underlying OS, while Type 2 runs on top of an existing operating system. Performance and security advantages of Type 1 are consequences of this, not the primary distinction."},{"id":"d3_q_032","domain":"D3","difficulty":"easy","question":"Which of the following is NOT a common vulnerability of IoT devices?","options":["Lack of strong authentication protocols","Inability to patch and update software","Inadequate data encryption and privacy protection","Robust security measures"],"answer":3,"explanation":"Robust security measures would be a strength, not a vulnerability. IoT devices are commonly criticised for lacking strong authentication, update mechanisms, and adequate encryption — the opposite of robust security."},{"id":"d3_q_033","domain":"D3","difficulty":"medium","question":"When we talk about using cryptanalysis in our work, what are we doing?","options":["Analysing the strength and vulnerabilities of cryptographic systems only","Encrypting messages to ensure their security","Using mathematical algorithms to create random numbers","Breaking codes and ciphers to decipher encrypted messages without the original key"],"answer":3,"explanation":"Cryptanalysis is the science of breaking codes, ciphers, and cryptographic systems — deciphering encoded messages without the intended decryption key. Techniques include frequency analysis, pattern recognition, brute-force, and advanced mathematical attacks."},{"id":"d3_q_034","domain":"D3","difficulty":"medium","question":"Which technique is MOST effective for breaking ciphertext encrypted with a monoalphabetic substitution cipher?","options":["Dictionary attack","Brute force attack","Known plaintext attack","Frequency analysis"],"answer":3,"explanation":"Monoalphabetic substitution preserves letter frequency distributions. Frequency analysis compares character frequencies in the ciphertext against known letter frequencies in the target language (e.g., E, T, A in English) to deduce substitutions without needing any plaintext or brute force."},{"id":"d3_q_035","domain":"D3","difficulty":"easy","question":"In cryptography, what is the technique called when you rearrange the order of characters in the plaintext?","options":["Substitution","Encryption","Ciphering","Transposition"],"answer":3,"explanation":"Transposition ciphers rearrange the positions of plaintext characters without replacing them. Substitution replaces characters with different ones. Encryption and ciphering are broader terms encompassing all methods of encoding data, not just rearrangement."},{"id":"d3_q_036","domain":"D3","difficulty":"medium","question":"At which ring level does virtualization software (the hypervisor) run?","options":["Ring 0","Ring 1","Ring 2","Ring -1"],"answer":3,"explanation":"The hypervisor runs at Ring -1, below the operating system (Ring 0) and directly above the hardware. This privileged position lets it control all guest OSes without them being able to interfere with each other."},{"id":"d3_q_037","domain":"D3","difficulty":"easy","question":"In a virtualized environment, what is the physical hardware machine called that runs multiple virtual servers?","options":["Client","Guest","Host","Hypervisor"],"answer":2,"explanation":"The physical machine is called the host. The virtual servers running on it are the clients (or guests). The hypervisor is the software layer managing them, but the physical box itself is the host."},{"id":"d3_q_038","domain":"D3","difficulty":"medium","question":"Which of the following is TRUE about network traffic between two virtual machines running on the same physical host?","options":["Traffic must traverse the external network and be routed back","Traffic between VMs on the same host does not need to traverse the physical network","All inter-VM traffic is automatically encrypted by the hypervisor","Each VM requires a dedicated physical NIC for communication"],"answer":1,"explanation":"Traffic between VMs on the same host is handled internally by the hypervisor's virtual switch and never hits the physical network. This is a key security consideration — that traffic is invisible to external network monitoring tools."},{"id":"d3_q_039","domain":"D3","difficulty":"easy","question":"Which cloud computing model operates on shared tenancy, where a provider rents infrastructure to anyone who wants it (e.g. AWS, Microsoft Azure, Google Cloud)?","options":["Private Cloud","Hybrid Cloud","Community Cloud","Public Cloud"],"answer":3,"explanation":"Public Cloud uses shared tenancy — a provider builds massive infrastructure and rents it out to any customer. Examples include Amazon AWS, Microsoft Azure, and Google Cloud. Private Cloud is organisation-owned, Community Cloud is restricted to a specific group, and Hybrid is a mix."},{"id":"d3_q_040","domain":"D3","difficulty":"medium","question":"Which cloud computing model is restricted exclusively to organisations sharing common concerns such as mission, security requirements, or compliance obligations?","options":["Private Cloud","Public Cloud","Hybrid Cloud","Community Cloud"],"answer":3,"explanation":"Community Cloud is shared only among a specific community of organisations with shared concerns — for example, government agencies sharing compliance and security requirements. It differs from Public Cloud (open to all) and Private Cloud (single organisation)."},{"id":"d3_q_041","domain":"D3","difficulty":"easy","question":"An organisation uses a private cloud for sensitive data and a public cloud for non-sensitive workloads. What cloud model is this?","options":["Community Cloud","Distributed Cloud","Hybrid Cloud","Private Cloud"],"answer":2,"explanation":"Hybrid Cloud combines Private and Public Cloud, allowing organisations to keep sensitive data on their private infrastructure while using public cloud capacity for less sensitive workloads. This balances control with cost efficiency."},{"id":"d3_q_042","domain":"D3","difficulty":"medium","question":"In which cloud service model does the vendor manage networking, storage, servers, and virtualisation, while the customer manages the OS and everything above?","options":["SaaS","PaaS","IaaS","CaaS"],"answer":2,"explanation":"IaaS (Infrastructure as a Service) gives the customer a blank OS layer to configure. The vendor handles the physical data centre, networking, storage, servers, and virtualisation. The customer owns everything from the OS upward."},{"id":"d3_q_043","domain":"D3","difficulty":"medium","question":"In a PaaS model, what does the vendor provide and what does the customer manage?","options":["Vendor provides everything; customer only interacts with applications","Vendor provides pre-configured OSs; customer adds all programs and applications","Vendor provides raw hardware only; customer manages everything from networking up","Vendor provides applications; customer manages the underlying infrastructure"],"answer":1,"explanation":"PaaS (Platform as a Service) provides a pre-configured OS and runtime environment. The customer is responsible for installing and managing their own applications and data, but does not manage the underlying OS, virtualisation, or hardware."},{"id":"d3_q_044","domain":"D3","difficulty":"easy","question":"Gmail, Office 365, and Dropbox are examples of which cloud service model?","options":["IaaS","PaaS","SaaS","DaaS"],"answer":2,"explanation":"SaaS (Software as a Service) delivers fully managed applications over the internet. The vendor handles everything from the data centre to the application layer. The customer simply uses the software, either manually or via integration with other systems."},{"id":"d3_q_045","domain":"D3","difficulty":"medium","question":"What is the PRIMARY purpose of adding a salt to a password before hashing it?","options":["To speed up the hashing process","To defend against dictionary attacks and pre-compiled rainbow table attacks","To encrypt the password before storage","To extend the password to a minimum required length"],"answer":1,"explanation":"A salt is random data added to a password before hashing. It ensures that identical passwords produce different hashes, defeating pre-compiled rainbow tables and making dictionary attacks significantly more expensive because each entry must be rehashed per user."},{"id":"d3_q_046","domain":"D3","difficulty":"medium","question":"What is a nonce in cryptography?","options":["A type of symmetric encryption key","A method of securely storing passwords","A type of digital signature algorithm","An arbitrary number used only once in an authentication protocol to prevent replay attacks"],"answer":3,"explanation":"A nonce (number used once) is a random or pseudo-random value issued in an authentication protocol. Because it is unique per session, an attacker who captures a valid authentication exchange cannot reuse it — preventing replay attacks."},{"id":"d3_q_047","domain":"D3","difficulty":"medium","question":"Beyond preventing replay attacks, what additional cryptographic role can a nonce serve?","options":["As a hash key for symmetric encryption","As a public key certificate","As an initialization vector in cryptographic functions","As a digital signature for non-repudiation"],"answer":2,"explanation":"Nonces can serve as initialization vectors (IVs) in block cipher modes (e.g. CBC), providing a unique starting state for each encryption operation. Like their role in authentication, using a unique IV per message prevents pattern analysis across ciphertext blocks."},{"id":"d3_q_048","domain":"D3","difficulty":"medium","question":"What type of attack is a Man-in-the-Middle (MitM) attack?","options":["Denial of Service (DoS)","Sniffing","Session Hijacking","Replay"],"answer":2,"explanation":"In a MitM attack the attacker actively intercepts, and potentially alters, messages between two parties who believe they are communicating directly — making it a form of session hijacking. Sniffing is passive eavesdropping only. DoS denies availability. A replay attack reuses a captured transmission but does not require positioning in the live communication stream."},{"id":"d3_q_049","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST important reason for using digital signatures?","options":["To provide proof of receipt","To provide confidentiality for the message","To provide proof of origin only","To provide non-repudiation"],"answer":3,"explanation":"Digital signatures primarily provide non-repudiation — the sender cannot deny having signed or sent the document, and the recipient cannot deny having received it. They verify authenticity and integrity but do not provide confidentiality (that requires encryption) and do not confirm the message was opened."},{"id":"d3_q_050","domain":"D3","difficulty":"medium","question":"Which of the following hashing algorithms is MOST likely to suffer from a hash collision?","options":["SHA-256","SHA-1","PBKDF2","MD5"],"answer":3,"explanation":"MD5 produces a 128-bit hash and has well-documented collision vulnerabilities — different inputs can produce the same output. SHA-1 (160-bit) is more resistant. SHA-256 (256-bit) is significantly stronger and designed to resist collision attacks. PBKDF2 is a key derivation function, not a standalone hash, and is not directly comparable."},{"id":"d3_q_051","domain":"D3","difficulty":"easy","question":"Which security service does the IPSec AH (Authentication Header) protocol explicitly NOT provide?","options":["Authentication","Integrity","Replay attack protection","Confidentiality"],"answer":3,"explanation":"AH provides authentication and integrity per packet and protects against replay attacks — but it does NOT encrypt the payload, so it provides no confidentiality. Think of AH as a digital signature for the packet: it proves who sent it and that it wasn't changed, but anyone can still read the contents."},{"id":"d3_q_052","domain":"D3","difficulty":"easy","question":"Which IPSec protocol should you choose when you need to encrypt (keep confidential) your VPN traffic?","options":["AH (Authentication Header) only","Neither — IPSec does not support confidentiality","Both AH and ESP provide confidentiality equally","ESP (Encapsulation Security Payload)"],"answer":3,"explanation":"Only ESP provides confidentiality through encryption. AH explicitly does not encrypt data. ESP can also provide authentication and integrity, making it more versatile — it can fully replace AH while adding encryption."},{"id":"d3_q_053","domain":"D3","difficulty":"easy","question":"IPSec is most commonly implemented to support which of the following?","options":["Email encryption between mail servers","VPNs — secure traffic over the internet with a local-network feel","Web browser HTTPS connections","Database-level encryption at rest"],"answer":1,"explanation":"IPSec's primary real-world use is VPNs (Virtual Private Networks), providing a cryptographic layer over internet traffic so remote users or sites experience the security of a local network. HTTPS uses TLS, not IPSec. Database encryption at rest is handled separately."},{"id":"d3_q_054","domain":"D3","difficulty":"medium","question":"A security engineer needs IPSec to provide authentication and integrity for each packet but does NOT require encryption. Which protocol should they use?","options":["ESP only","AH only","Both AH and ESP are required","Neither — IPSec cannot provide integrity without encryption"],"answer":1,"explanation":"AH (Authentication Header) is designed exactly for this: it provides per-packet authentication and integrity and protects against replay attacks, without any encryption overhead. ESP would add unnecessary encryption; AH alone is the efficient choice when confidentiality is not required."},{"id":"d3_q_055","domain":"D3","difficulty":"medium","question":"Which of the following is the PRIMARY difference between SSL and TLS?","options":["SSL uses symmetric cryptography; TLS uses asymmetric cryptography","SSL is for internet communication; TLS is for local networks","SSL uses a handshake to establish a connection; TLS does not","SSL is older and less secure than TLS"],"answer":3,"explanation":"TLS (Transport Layer Security) was developed by the IETF as a more secure successor to SSL (Secure Sockets Layer), which was created by Netscape in the mid-1990s. All SSL versions are now deprecated due to vulnerabilities. Both protocols use a combination of asymmetric (handshake) and symmetric (data transfer) cryptography, and both use a handshake process."},{"id":"d3_q_056","domain":"D3","difficulty":"easy","question":"What is the correct order of the TCP 3-way handshake?","options":["SYN, ACK, SYN","ACK, SYN, SYN-ACK","SYN-ACK, SYN, ACK","SYN, SYN-ACK, ACK"],"answer":3,"explanation":"The TCP 3-way handshake establishes a reliable connection: (1) Client sends SYN with its sequence number. (2) Server responds with SYN-ACK, acknowledging the client's SYN and sending its own sequence number. (3) Client sends ACK, acknowledging the server's SYN-ACK. The connection is now established."},{"id":"d3_q_057","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST commonly used mode of IPSec?","options":["Transport mode","Hybrid mode","SSH mode","Tunnel mode"],"answer":3,"explanation":"Tunnel mode is the most common IPSec mode — it encrypts the entire IP packet (header + payload) and wraps it in a new IP header, making it ideal for VPNs. Transport mode only encrypts the payload, leaving the original header exposed, and is used for end-to-end host communication. SSH mode does not exist in IPSec."},{"id":"d3_q_058","domain":"D3","difficulty":"easy","question":"Which of the following is the MOST effective physical security control for protecting a perimeter?","options":["Security cameras","Guard dogs","Motion sensors","Fences and gates"],"answer":3,"explanation":"Fences and gates are physical barriers that actively prevent or deter unauthorized entry — they are the first line of defence in a layered security approach. Cameras, motion sensors, and guard dogs are detective or deterrent controls that alert to intrusion but do not physically stop it the way a barrier does."},{"id":"d3_q_059","domain":"D3","difficulty":"medium","question":"Which of the following is the PRIMARY indicator that a secured door in an access control system is functioning properly?","options":["The door opens without resistance","The door makes a clicking sound when locked","The door has a visible security camera attached to it","The door remains locked when an unauthorised person attempts to open it"],"answer":3,"explanation":"The primary function of a secured door is to deny access to unauthorised individuals. The definitive test is that the door stays locked when someone without valid credentials tries to open it. Clicking sounds can be mimicked or occur without actual locking; a camera presence has no bearing on the door mechanism itself."},{"id":"d3_q_060","domain":"D3","difficulty":"medium","question":"When designing a new data center, what is the MOST important consideration for its physical structure?","options":["Use sub-ceilings and sub-floors throughout for cable management","Focus on perimeter security while using lightweight internal materials","Prioritise aesthetics with glass walls and electronic access controls","Use slab-to-slab, fire-rated walls of sturdy materials and treat the data center as a fully enclosed secure box"],"answer":3,"explanation":"Slab-to-slab construction eliminates crawl-space bypass routes. Fire-rated, robust materials (reinforced concrete, cinder block) resist physical breach. Treating the data center as a sealed box — equal attention to walls, doors, ceiling, and floor — prevents the weakest surface from becoming an entry point. Lightweight materials like sheetrock can be breached easily regardless of electronic controls."},{"id":"d3_q_061","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST important factor to consider when designing site and facility security controls?","options":["The location of the site","The security budget allocated for the controls","The availability of security personnel","The potential threats to the site and facilities"],"answer":3,"explanation":"Security controls must be designed to mitigate specific risks. Without identifying the potential threats (natural disasters, theft, vandalism, etc.) first, it's impossible to know which controls are appropriate. Location, budget, and personnel are all secondary — they inform how to implement controls after the threats are understood."},{"id":"d3_q_062","domain":"D3","difficulty":"medium","question":"An organisation is considering building a data center in a flood-prone area. What should the IT security team do?","options":["Build there but invest in flood protection measures","Proceed — the organisation has never experienced flooding before"
