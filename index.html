a drive is physically damaged and cannot be overwritten, incineration is the most reliable method to guarantee no data remanence. It destroys the storage chips completely. Degaussing is ineffective on SSDs; overwriting and secure erase require the drive to be functional."},{"id":"d2_q_053","domain":"D2","difficulty":"medium","question":"What is e-discovery in the context of data management and legal proceedings?","options":["Discovering and cataloguing all electronic assets owned by the organisation","Setting retention policies to ensure data is available if needed for litigation","The process of producing electronic information to internal or external legal teams when required","Automatically deleting data whose retention period has expired to avoid legal exposure"],"answer":2,"explanation":"E-discovery (electronic discovery) is the process of identifying, collecting, and producing electronically stored information (ESI) in response to a legal request or investigation. It requires organisations to have processes in place to locate and preserve relevant data — and to avoid destroying it once a legal hold is in place."},{"id":"d2_q_054","domain":"D2","difficulty":"medium","question":"In the US government data classification scheme, which level applies to information whose unauthorised disclosure would CAUSE DAMAGE to national security?","options":["Unclassified — no harm to national security","Secret — serious damage to national security","Confidential — damage to national security","Top Secret — exceptionally grave damage to national security"],"answer":2,"explanation":"Confidential is the US government classification level for information whose unauthorised disclosure could damage national security. The levels by harm severity: Unclassified (no harm), Confidential (damage), Secret (serious damage), Top Secret (exceptionally grave damage)."},{"id":"d2_q_055","domain":"D2","difficulty":"easy","question":"Which C-suite executive is primarily responsible for the day-to-day financial leadership and oversight of an organisation?","options":["CEO — responsible for overall organisational operations and strategy","CIO — responsible for IT strategy and information systems","CFO — responsible for day-to-day financial management and reporting","CSO — responsible for physical and personnel security"],"answer":2,"explanation":"The CFO (Chief Financial Officer) leads the day-to-day financial operations of the organisation, including budgeting, accounting, financial reporting, and treasury. The CEO oversees overall strategy; the CIO leads IT; the CSO leads physical/personnel security; the CISO leads information security."},{"id":"d2_q_056","domain":"D2","difficulty":"medium","question":"When assigning a data sensitivity level, which of the following should NOT be a determining factor?","options":["The data's potential value to competitors or attackers","The data storage format (file type, database schema, encoding)","Who will have access to the data and their clearance level","Legal or regulatory requirements governing the data type"],"answer":1,"explanation":"The storage format (CSV, JSON, database table, etc.) is irrelevant to how sensitive the data itself is. Sensitivity is determined by factors such as the data's value, the harm its disclosure could cause, legal requirements, and who needs access — not the technical format in which it is stored."},{"id":"d2_q_057","domain":"D2","difficulty":"medium","question":"Flash drives (USB drives) use which type of memory technology?","options":["SDRAM — synchronous dynamic random-access memory","PROM — programmable read-only memory","DRAM — dynamic random-access memory","EEPROM — electrically erasable programmable read-only memory"],"answer":3,"explanation":"Flash drives use EEPROM (Electrically Erasable Programmable ROM) — specifically a type of EEPROM optimised for block-level erasure and high storage density. Unlike traditional EEPROM (which erases byte-by-byte), flash erases in blocks. SDRAM and DRAM are volatile RAM types; PROM can only be written once."},{"id":"d2_q_058","domain":"D2","difficulty":"easy","question":"Which of the following is a COMMON attack that specifically targets data in motion?","options":["Cryptanalysis of stored encrypted files","Shoulder surfing to view displayed information","Eavesdropping — unauthorised interception of data during network transmission","All of these equally target data in motion"],"answer":2,"explanation":"Eavesdropping (packet sniffing, network interception) is the classic attack against data in motion — the attacker intercepts data while it is being transmitted across a network. Controls like TLS/SSL and VPNs are used to protect data in motion. Cryptanalysis targets stored data; shoulder surfing targets data in use."},{"id":"d2_q_059","domain":"D2","difficulty":"medium","question":"Which of the following memory types is considered VOLATILE?","options":["PROM — Programmable Read-Only Memory","Flash memory (EEPROM-based storage)","EPROM — Erasable Programmable Read-Only Memory","DRAM — Dynamic Random-Access Memory"],"answer":3,"explanation":"DRAM (Dynamic RAM) is volatile — it loses its contents when power is removed. It uses tiny capacitors that must be continuously refreshed. PROM, EPROM, and Flash (EEPROM) are all forms of non-volatile ROM that retain data without power."},{"id":"d3_q_001","domain":"D3","difficulty":"hard","question":"A model enforces 'No Read Up' and 'No Write Down'. What does it protect and what type is it?","options":["Integrity, using Biba","Confidentiality, using Bell-LaPadula","Availability, using Clark-Wilson","Integrity, using Clark-Wilson"],"answer":1,"explanation":"'No Read Up' (Simple Security Property) and 'No Write Down' (* Security Property) are Bell-LaPadula, which protects CONFIDENTIALITY and is a MAC model."},{"id":"d3_q_002","domain":"D3","difficulty":"hard","question":"A subject with Top Secret clearance must not read Secret-level data to avoid corruption from lower-integrity information. Which rule and model is this?","options":["No Write Up — Bell-LaPadula","No Read Down (Simple Integrity Axiom) — Biba","No Read Up — Bell-LaPadula","No Write Down — Biba"],"answer":1,"explanation":"'No Read Down' is Biba's Simple Integrity Axiom. Biba protects INTEGRITY — we don't want lower-integrity data corrupting a higher level. Biba's reads/writes are the opposite of Bell-LaPadula's."},{"id":"d3_q_003","domain":"D3","difficulty":"medium","question":"A web app encrypts data with the recipient's public key. Why can't an eavesdropper decrypt it with that same public key?","options":["Public keys can only encrypt, not decrypt; only the matching private key decrypts","The public key is hidden from attackers","The encryption uses a one-time pad","Symmetric keys are used for the actual transfer"],"answer":0,"explanation":"In asymmetric encryption, the public key encrypts and only the matching PRIVATE key (kept secret by the recipient) can decrypt. The public key being public doesn't compromise confidentiality."},{"id":"d3_q_004","domain":"D3","difficulty":"hard","question":"An attacker forges a Kerberos ticket using the krbtgt account hash, allowing them to create ANY ticket in the domain. What is this attack?","options":["Pass the Hash","Silver Ticket","Golden Ticket","ASREPRoast"],"answer":2,"explanation":"A Golden Ticket uses the hash of the krbtgt (Kerberos service) account to create any ticket within Active Directory. A Silver Ticket forges a TGS ticket from a specific service account's hash (more limited)."},{"id":"d3_q_005","domain":"D3","difficulty":"medium","question":"A digital signature provides which two security properties, and which key creates it?","options":["Confidentiality and Availability, using the public key","Integrity and Non-Repudiation, using the sender's private key","Confidentiality and Integrity, using the recipient's public key","Availability and Authentication, using a symmetric key"],"answer":1,"explanation":"A digital signature provides Integrity and Non-Repudiation. The sender hashes the message and encrypts the hash with their PRIVATE key. The recipient verifies with the sender's public key."},{"id":"d3_q_006","domain":"D3","difficulty":"hard","question":"A data center needs gas fire suppression in a room that is sometimes occupied. Why is CO2 a poor choice here?","options":["It damages electronics","It is colorless/odorless and displaces oxygen, causing people to pass out and die","It depletes the ozone layer and is banned","It leaves a corrosive residue"],"answer":1,"explanation":"CO2 is colorless and odorless, displaces oxygen, and can kill occupants — it should only be used in UNMANNED areas. (Halon was banned for ozone depletion; that's a different issue.)"},{"id":"d3_q_007","domain":"D3","difficulty":"medium","question":"On a Type 1 vs. Type 2 hypervisor question, which runs directly on the host hardware (bare metal)?","options":["Type 2, like VMware Workstation on Windows","Type 1, a virtualization OS running directly on hardware","Both run on a host OS","Neither — both require a guest OS first"],"answer":1,"explanation":"Type 1 (Bare Metal) runs directly on the host hardware as part of a virtualization OS (data center). Type 2 runs on top of a regular OS like Windows (your PC)."},{"id":"d3_q_008","domain":"D3","difficulty":"hard","question":"You need encryption for a low-power IoT device but want strength comparable to a 3,072-bit RSA key with a much shorter key. What should you use?","options":["256-bit ECC, which matches ~3,072-bit RSA strength","Single DES, which is fast","512-bit RSA","MD5 hashing"],"answer":0,"explanation":"Elliptic Curve Cryptography (ECC) is much stronger per bit — a 256-bit ECC key is roughly as strong as a 3,072-bit RSA key, making it ideal for low-power devices needing short keys."},{"id":"d3_q_009","domain":"D3","difficulty":"medium","question":"What is the primary goal of the Bell-LaPadula model?","options":["Protect data confidentiality using 'no read up, no write down'","Protect data integrity against unauthorized modification","Protect against malware and viruses","Provide general access control mechanisms"],"answer":0,"explanation":"Bell-LaPadula (developed by the NSA in the 1970s) protects confidentiality via two rules: the simple security property (no read up — a lower-clearance subject cannot read higher-classified data) and the *-property (no write down — a higher-clearance subject cannot write to a lower-classified object). Integrity models like Biba handle the integrity goal instead."},{"id":"d3_q_010","domain":"D3","difficulty":"medium","question":"Which security model is specifically designed to enforce separation of duties and protect the integrity of high-value transactions?","options":["Biba model","Bell-LaPadula model","Brewer and Nash model","Clark-Wilson model"],"answer":3,"explanation":"Clark-Wilson focuses on well-formed transactions and separation of duties to protect data integrity in commercial environments. Biba also targets integrity but uses 'no write up, no read down' without addressing transaction integrity or separation of duties. Brewer-Nash prevents conflict of interest. Bell-LaPadula targets confidentiality."},{"id":"d3_q_011","domain":"D3","difficulty":"medium","question":"Which threat modeling methodology categorises threats as Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, and Elevation of privilege?","options":["PASTA","DREAD","STRIDENT","STRIDE"],"answer":3,"explanation":"STRIDE (developed by Microsoft) provides a systematic way to identify and classify threats across six categories, enabling teams to address security risks during the design phase. PASTA is a risk-centric seven-step methodology. DREAD is a scoring model used to prioritise identified threats, not identify them. STRIDENT is not a real methodology."},{"id":"d3_q_012","domain":"D3","difficulty":"medium","question":"We have 100 users all needing to communicate with each other. Using asymmetric encryption, how many keys would be needed?","options":["10","50","100","200"],"answer":3,"explanation":"In asymmetric encryption each user needs a public key and a private key. 100 users × 2 keys = 200 keys total. The number of keys scales linearly with users, unlike symmetric encryption which requires n(n-1)/2 shared keys."},{"id":"d3_q_013","domain":"D3","difficulty":"easy","question":"In asymmetric encryption, what is your public key?","options":["The key known only to the sender","The key used to encrypt the message","The key used to decrypt the message","The key shared openly so others can encrypt data sent to you"],"answer":3,"explanation":"The public key is distributed freely and allows others to encrypt messages addressed to you. The corresponding private key — kept secret by you — is required to decrypt those messages. The public key is defined by its visibility, not just its encryption function."},{"id":"d3_q_014","domain":"D3","difficulty":"easy","question":"What is the primary difference between symmetric and asymmetric encryption?","options":["Symmetric uses a secret key; asymmetric uses only a public key","Symmetric is faster; asymmetric is more secure","Symmetric uses one key for both encryption and decryption; asymmetric uses two separate keys","Symmetric is more complex; asymmetric is simpler"],"answer":2,"explanation":"The defining distinction is key usage: symmetric encryption uses one shared secret key for both encrypting and decrypting data, while asymmetric encryption uses a public key to encrypt and a mathematically related private key to decrypt."},{"id":"d3_q_015","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST likely vulnerability of an Industrial Control System (ICS)?","options":["Lack of physical security measures","Weak password policies","Unpatched software","Inadequate network segmentation"],"answer":2,"explanation":"ICS systems frequently run on outdated software because the cost, downtime, and risk of upgrades is high. This leaves them without critical security patches, and attackers specifically target these known, unmitigated vulnerabilities."},{"id":"d3_q_016","domain":"D3","difficulty":"easy","question":"Which of the following is the MOST effective way to secure a mobile device against malware?","options":["Installing a firewall on the device","Disabling all non-essential applications","Enabling a screen lock","Keeping the operating system updated"],"answer":3,"explanation":"OS updates deliver patches for known vulnerabilities that malware exploits. Firewalls address network traffic, screen locks address physical access, and disabling apps is impractical — none directly patch exploitable OS flaws."},{"id":"d3_q_017","domain":"D3","difficulty":"hard","question":"A colleague mentions 'polyinstantiation'. What does this refer to?","options":["The process of collecting data from multiple sources for analysis","Deducing sensitive facts by observing non-sensitive data","Monitoring network traffic to establish a baseline","Creating multiple instances of the same data record with different content based on the viewer's security level"],"answer":3,"explanation":"Polyinstantiation stores different versions of the same data object for different security clearance levels, preventing low-clearance users from inferring the existence or content of higher-classified records through indirect observation."},{"id":"d3_q_018","domain":"D3","difficulty":"easy","question":"In which order does a CPU process work through its instruction cycle?","options":["Decode, execute, fetch","Execute, fetch, decode","Fetch, execute, decode","Fetch, decode, execute"],"answer":3,"explanation":"The CPU first fetches the instruction from memory, then decodes it to interpret what operation is required, then executes it. This fetch-decode-execute cycle repeats continuously for every instruction."},{"id":"d3_q_019","domain":"D3","difficulty":"medium","question":"Which of the following is the PRIMARY advantage of containerization for businesses?","options":["It provides a more efficient way to manage resources","It allows for better scalability and flexibility","It ensures a higher level of security for applications","It allows for faster deployment and updates of applications"],"answer":3,"explanation":"Containerization encapsulates an application with its environment, making it portable and consistent across computing environments. This directly enables rapid, reliable deployment and updates, significantly accelerating development cycles — the primary business benefit."},{"id":"d3_q_020","domain":"D3","difficulty":"medium","question":"A server is processing a batch report when the IDS detects an attack and signals the CPU to handle it immediately. The CPU pauses the report, handles the alert, then resumes. What is this signal called?","options":["A thread","A process swap","A pipeline flush","An interrupt"],"answer":3,"explanation":"An interrupt is a signal sent by hardware or software notifying the CPU that a higher-priority event requires immediate attention. The CPU suspends its current task, handles the interrupt routine, then resumes where it left off."},{"id":"d3_q_021","domain":"D3","difficulty":"easy","question":"What is the main difference between a Trojan and a virus?","options":["A Trojan spreads via email; a virus spreads via social media","A Trojan steals data; a virus disrupts systems","A Trojan is harder to detect; a virus is easily caught by antivirus software","A Trojan is hidden within a legitimate program; a virus replicates itself and spreads to other files"],"answer":3,"explanation":"Trojans disguise themselves as or embed inside legitimate software, relying on users to execute them — they do not self-replicate. Viruses attach to clean files and self-propagate throughout systems. The key distinction is propagation method."},{"id":"d3_q_022","domain":"D3","difficulty":"easy","question":"Which type of malware is embedded within a legitimate-looking program?","options":["Worm","Virus","Ransomware","Trojan Horse"],"answer":3,"explanation":"A Trojan Horse is malware disguised as or hidden inside legitimate software. Worms self-propagate across networks without user action. Viruses self-replicate by attaching to other files. Ransomware encrypts data and demands payment, but is often delivered via a Trojan rather than being one itself."},{"id":"d3_q_023","domain":"D3","difficulty":"medium","question":"When does a logic bomb typically detonate?","options":["When the user inputs a specific code","When the user opens a specific file","When the user logs into their account","When a certain date or time is reached"],"answer":3,"explanation":"A logic bomb executes its malicious payload when a predefined condition is met, most commonly a specific date or time. The time delay between planting and detonation helps the author evade immediate detection."},{"id":"d3_q_024","domain":"D3","difficulty":"medium","question":"Which of the following is the HIGHEST benefit of using asymmetric encryption?","options":["It has faster encryption and decryption times","It simplifies key management with a single key","It scales up encryption more efficiently","It provides higher security: only the recipient holds the private key needed to decrypt"],"answer":3,"explanation":"The primary benefit of asymmetric encryption is that the private key never leaves the recipient, so even if the public key is widely distributed, only the intended recipient can decrypt the message — a security guarantee symmetric encryption cannot match."},{"id":"d3_q_025","domain":"D3","difficulty":"easy","question":"Which type of cryptography uses the same algorithm to transform plaintext into ciphertext and vice versa?","options":["Hashing","Asymmetric-key cryptography","Steganography","Symmetric-key cryptography"],"answer":3,"explanation":"Symmetric-key cryptography uses the same shared secret key and corresponding algorithm for both encryption and decryption. Hashing is one-way and irreversible, asymmetric cryptography uses two different keys, and steganography hides data without encrypting it."},{"id":"d3_q_026","domain":"D3","difficulty":"easy","question":"Which of the following is a TRUE statement about symmetric encryption?","options":["Symmetric encryption uses a different key for encrypting and decrypting","Symmetric encryption is not as secure as asymmetric encryption","Symmetric encryption is a type of public key encryption","Symmetric encryption uses the same key for encrypting and decrypting"],"answer":3,"explanation":"Symmetric encryption uses a single shared secret key for both encryption and decryption — this is its defining characteristic. Using different keys describes asymmetric encryption. Calling symmetric encryption 'public key encryption' is incorrect; that term refers to asymmetric systems."},{"id":"d3_q_027","domain":"D3","difficulty":"hard","question":"Your company suffered an acoustic side-channel attack where an attacker inferred sensitive data from sounds emitted by your systems. What is the BEST preventive measure?","options":["Implementing stronger encryption algorithms on all data","Using noise-cancelling headphones while accessing sensitive data","Regularly updating and patching all software and hardware","Implementing physical barriers between computer systems and potential attackers"],"answer":3,"explanation":"Acoustic side-channel attacks capture physical sounds (keystrokes, electronic components) to infer sensitive data. Physical barriers or soundproofing eliminate the attack vector at its source. Encryption protects data content but not acoustic emissions; patching addresses software flaws, not physical sound leakage."},{"id":"d3_q_028","domain":"D3","difficulty":"hard","question":"Which of the following is the MOST effective method to prevent a side-channel attack?","options":["Encrypting all data transmitted over the network","Implementing two-factor authentication","Conducting regular security audits","Isolating sensitive data in a separate network"],"answer":3,"explanation":"Side-channel attacks exploit physical implementation details (timing, power consumption, EM emissions) rather than software flaws. Network isolation minimises the attacker's access to these physical signals. Encryption, 2FA, and audits address different threat vectors and do not directly block side-channel information leakage."},{"id":"d3_q_029","domain":"D3","difficulty":"hard","question":"An insider is suspected of using a covert timing channel to exfiltrate data to an external party. What is the MOST effective countermeasure?","options":["Implementing strong access controls on all devices","Using encryption for all communications","Training employees on cybersecurity best practices","Monitoring network traffic for anomalies"],"answer":3,"explanation":"Covert timing channels encode messages in the timing patterns of network events, bypassing content inspection. Because the insider has legitimate access, access controls and encryption do not block the channel. Real-time traffic monitoring detects the unusual timing patterns that reveal the covert communication."},{"id":"d3_q_030","domain":"D3","difficulty":"easy","question":"Which of the following is the PRIMARY benefit of using Software as a Service (SaaS)?","options":["It allows for easy data sharing between multiple users","It allows for better data security","It allows for seamless integration with other software systems","It reduces IT costs and maintenance"],"answer":3,"explanation":"SaaS offloads hardware procurement, software installation, updates, and maintenance to the provider. The pay-as-you-go model further controls costs. Data sharing, integration, and security vary by provider and are not universal primary benefits."},{"id":"d3_q_031","domain":"D3","difficulty":"medium","question":"Which of the following is the PRIMARY difference between a Type 1 and a Type 2 hypervisor?","options":["Type 1 hypervisors are less secure than Type 2 hypervisors","Type 1 hypervisors have better performance than Type 2 hypervisors","Type 1 is for enterprise use; Type 2 is for personal use","Type 1 hypervisors are installed directly on the hardware; Type 2 hypervisors are installed on top of an operating system"],"answer":3,"explanation":"The defining difference is installation layer: Type 1 (bare metal) runs directly on the host hardware with no underlying OS, while Type 2 runs on top of an existing operating system. Performance and security advantages of Type 1 are consequences of this, not the primary distinction."},{"id":"d3_q_032","domain":"D3","difficulty":"easy","question":"Which of the following is NOT a common vulnerability of IoT devices?","options":["Lack of strong authentication protocols","Inability to patch and update software","Inadequate data encryption and privacy protection","Robust security measures"],"answer":3,"explanation":"Robust security measures would be a strength, not a vulnerability. IoT devices are commonly criticised for lacking strong authentication, update mechanisms, and adequate encryption — the opposite of robust security."},{"id":"d3_q_033","domain":"D3","difficulty":"medium","question":"When we talk about using cryptanalysis in our work, what are we doing?","options":["Analysing the strength and vulnerabilities of cryptographic systems only","Encrypting messages to ensure their security","Using mathematical algorithms to create random numbers","Breaking codes and ciphers to decipher encrypted messages without the original key"],"answer":3,"explanation":"Cryptanalysis is the science of breaking codes, ciphers, and cryptographic systems — deciphering encoded messages without the intended decryption key. Techniques include frequency analysis, pattern recognition, brute-force, and advanced mathematical attacks."},{"id":"d3_q_034","domain":"D3","difficulty":"medium","question":"Which technique is MOST effective for breaking ciphertext encrypted with a monoalphabetic substitution cipher?","options":["Dictionary attack","Brute force attack","Known plaintext attack","Frequency analysis"],"answer":3,"explanation":"Monoalphabetic substitution preserves letter frequency distributions. Frequency analysis compares character frequencies in the ciphertext against known letter frequencies in the target language (e.g., E, T, A in English) to deduce substitutions without needing any plaintext or brute force."},{"id":"d3_q_035","domain":"D3","difficulty":"easy","question":"In cryptography, what is the technique called when you rearrange the order of characters in the plaintext?","options":["Substitution","Encryption","Ciphering","Transposition"],"answer":3,"explanation":"Transposition ciphers rearrange the positions of plaintext characters without replacing them. Substitution replaces characters with different ones. Encryption and ciphering are broader terms encompassing all methods of encoding data, not just rearrangement."},{"id":"d3_q_036","domain":"D3","difficulty":"medium","question":"At which ring level does virtualization software (the hypervisor) run?","options":["Ring 0","Ring 1","Ring 2","Ring -1"],"answer":3,"explanation":"The hypervisor runs at Ring -1, below the operating system (Ring 0) and directly above the hardware. This privileged position lets it control all guest OSes without them being able to interfere with each other."},{"id":"d3_q_037","domain":"D3","difficulty":"easy","question":"In a virtualized environment, what is the physical hardware machine called that runs multiple virtual servers?","options":["Client","Guest","Host","Hypervisor"],"answer":2,"explanation":"The physical machine is called the host. The virtual servers running on it are the clients (or guests). The hypervisor is the software layer managing them, but the physical box itself is the host."},{"id":"d3_q_038","domain":"D3","difficulty":"medium","question":"Which of the following is TRUE about network traffic between two virtual machines running on the same physical host?","options":["Traffic must traverse the external network and be routed back","Traffic between VMs on the same host does not need to traverse the physical network","All inter-VM traffic is automatically encrypted by the hypervisor","Each VM requires a dedicated physical NIC for communication"],"answer":1,"explanation":"Traffic between VMs on the same host is handled internally by the hypervisor's virtual switch and never hits the physical network. This is a key security consideration — that traffic is invisible to external network monitoring tools."},{"id":"d3_q_039","domain":"D3","difficulty":"easy","question":"Which cloud computing model operates on shared tenancy, where a provider rents infrastructure to anyone who wants it (e.g. AWS, Microsoft Azure, Google Cloud)?","options":["Private Cloud","Hybrid Cloud","Community Cloud","Public Cloud"],"answer":3,"explanation":"Public Cloud uses shared tenancy — a provider builds massive infrastructure and rents it out to any customer. Examples include Amazon AWS, Microsoft Azure, and Google Cloud. Private Cloud is organisation-owned, Community Cloud is restricted to a specific group, and Hybrid is a mix."},{"id":"d3_q_040","domain":"D3","difficulty":"medium","question":"Which cloud computing model is restricted exclusively to organisations sharing common concerns such as mission, security requirements, or compliance obligations?","options":["Private Cloud","Public Cloud","Hybrid Cloud","Community Cloud"],"answer":3,"explanation":"Community Cloud is shared only among a specific community of organisations with shared concerns — for example, government agencies sharing compliance and security requirements. It differs from Public Cloud (open to all) and Private Cloud (single organisation)."},{"id":"d3_q_041","domain":"D3","difficulty":"easy","question":"An organisation uses a private cloud for sensitive data and a public cloud for non-sensitive workloads. What cloud model is this?","options":["Community Cloud","Distributed Cloud","Hybrid Cloud","Private Cloud"],"answer":2,"explanation":"Hybrid Cloud combines Private and Public Cloud, allowing organisations to keep sensitive data on their private infrastructure while using public cloud capacity for less sensitive workloads. This balances control with cost efficiency."},{"id":"d3_q_042","domain":"D3","difficulty":"medium","question":"In which cloud service model does the vendor manage networking, storage, servers, and virtualisation, while the customer manages the OS and everything above?","options":["SaaS","PaaS","IaaS","CaaS"],"answer":2,"explanation":"IaaS (Infrastructure as a Service) gives the customer a blank OS layer to configure. The vendor handles the physical data centre, networking, storage, servers, and virtualisation. The customer owns everything from the OS upward."},{"id":"d3_q_043","domain":"D3","difficulty":"medium","question":"In a PaaS model, what does the vendor provide and what does the customer manage?","options":["Vendor provides everything; customer only interacts with applications","Vendor provides pre-configured OSs; customer adds all programs and applications","Vendor provides raw hardware only; customer manages everything from networking up","Vendor provides applications; customer manages the underlying infrastructure"],"answer":1,"explanation":"PaaS (Platform as a Service) provides a pre-configured OS and runtime environment. The customer is responsible for installing and managing their own applications and data, but does not manage the underlying OS, virtualisation, or hardware."},{"id":"d3_q_044","domain":"D3","difficulty":"easy","question":"Gmail, Office 365, and Dropbox are examples of which cloud service model?","options":["IaaS","PaaS","SaaS","DaaS"],"answer":2,"explanation":"SaaS (Software as a Service) delivers fully managed applications over the internet. The vendor handles everything from the data centre to the application layer. The customer simply uses the software, either manually or via integration with other systems."},{"id":"d3_q_045","domain":"D3","difficulty":"medium","question":"What is the PRIMARY purpose of adding a salt to a password before hashing it?","options":["To speed up the hashing process","To defend against dictionary attacks and pre-compiled rainbow table attacks","To encrypt the password before storage","To extend the password to a minimum required length"],"answer":1,"explanation":"A salt is random data added to a password before hashing. It ensures that identical passwords produce different hashes, defeating pre-compiled rainbow tables and making dictionary attacks significantly more expensive because each entry must be rehashed per user."},{"id":"d3_q_046","domain":"D3","difficulty":"medium","question":"What is a nonce in cryptography?","options":["A type of symmetric encryption key","A method of securely storing passwords","A type of digital signature algorithm","An arbitrary number used only once in an authentication protocol to prevent replay attacks"],"answer":3,"explanation":"A nonce (number used once) is a random or pseudo-random value issued in an authentication protocol. Because it is unique per session, an attacker who captures a valid authentication exchange cannot reuse it — preventing replay attacks."},{"id":"d3_q_047","domain":"D3","difficulty":"medium","question":"Beyond preventing replay attacks, what additional cryptographic role can a nonce serve?","options":["As a hash key for symmetric encryption","As a public key certificate","As an initialization vector in cryptographic functions","As a digital signature for non-repudiation"],"answer":2,"explanation":"Nonces can serve as initialization vectors (IVs) in block cipher modes (e.g. CBC), providing a unique starting state for each encryption operation. Like their role in authentication, using a unique IV per message prevents pattern analysis across ciphertext blocks."},{"id":"d3_q_048","domain":"D3","difficulty":"medium","question":"What type of attack is a Man-in-the-Middle (MitM) attack?","options":["Denial of Service (DoS)","Sniffing","Session Hijacking","Replay"],"answer":2,"explanation":"In a MitM attack the attacker actively intercepts, and potentially alters, messages between two parties who believe they are communicating directly — making it a form of session hijacking. Sniffing is passive eavesdropping only. DoS denies availability. A replay attack reuses a captured transmission but does not require positioning in the live communication stream."},{"id":"d3_q_049","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST important reason for using digital signatures?","options":["To provide proof of receipt","To provide confidentiality for the message","To provide proof of origin only","To provide non-repudiation"],"answer":3,"explanation":"Digital signatures primarily provide non-repudiation — the sender cannot deny having signed or sent the document, and the recipient cannot deny having received it. They verify authenticity and integrity but do not provide confidentiality (that requires encryption) and do not confirm the message was opened."},{"id":"d3_q_050","domain":"D3","difficulty":"medium","question":"Which of the following hashing algorithms is MOST likely to suffer from a hash collision?","options":["SHA-256","SHA-1","PBKDF2","MD5"],"answer":3,"explanation":"MD5 produces a 128-bit hash and has well-documented collision vulnerabilities — different inputs can produce the same output. SHA-1 (160-bit) is more resistant. SHA-256 (256-bit) is significantly stronger and designed to resist collision attacks. PBKDF2 is a key derivation function, not a standalone hash, and is not directly comparable."},{"id":"d3_q_051","domain":"D3","difficulty":"easy","question":"Which security service does the IPSec AH (Authentication Header) protocol explicitly NOT provide?","options":["Authentication","Integrity","Replay attack protection","Confidentiality"],"answer":3,"explanation":"AH provides authentication and integrity per packet and protects against replay attacks — but it does NOT encrypt the payload, so it provides no confidentiality. Think of AH as a digital signature for the packet: it proves who sent it and that it wasn't changed, but anyone can still read the contents."},{"id":"d3_q_052","domain":"D3","difficulty":"easy","question":"Which IPSec protocol should you choose when you need to encrypt (keep confidential) your VPN traffic?","options":["AH (Authentication Header) only","Neither — IPSec does not support confidentiality","Both AH and ESP provide confidentiality equally","ESP (Encapsulation Security Payload)"],"answer":3,"explanation":"Only ESP provides confidentiality through encryption. AH explicitly does not encrypt data. ESP can also provide authentication and integrity, making it more versatile — it can fully replace AH while adding encryption."},{"id":"d3_q_053","domain":"D3","difficulty":"easy","question":"IPSec is most commonly implemented to support which of the following?","options":["Email encryption between mail servers","VPNs — secure traffic over the internet with a local-network feel","Web browser HTTPS connections","Database-level encryption at rest"],"answer":1,"explanation":"IPSec's primary real-world use is VPNs (Virtual Private Networks), providing a cryptographic layer over internet traffic so remote users or sites experience the security of a local network. HTTPS uses TLS, not IPSec. Database encryption at rest is handled separately."},{"id":"d3_q_054","domain":"D3","difficulty":"medium","question":"A security engineer needs IPSec to provide authentication and integrity for each packet but does NOT require encryption. Which protocol should they use?","options":["ESP only","AH only","Both AH and ESP are required","Neither — IPSec cannot provide integrity without encryption"],"answer":1,"explanation":"AH (Authentication Header) is designed exactly for this: it provides per-packet authentication and integrity and protects against replay attacks, without any encryption overhead. ESP would add unnecessary encryption; AH alone is the efficient choice when confidentiality is not required."},{"id":"d3_q_055","domain":"D3","difficulty":"medium","question":"Which of the following is the PRIMARY difference between SSL and TLS?","options":["SSL uses symmetric cryptography; TLS uses asymmetric cryptography","SSL is for internet communication; TLS is for local networks","SSL uses a handshake to establish a connection; TLS does not","SSL is older and less secure than TLS"],"answer":3,"explanation":"TLS (Transport Layer Security) was developed by the IETF as a more secure successor to SSL (Secure Sockets Layer), which was created by Netscape in the mid-1990s. All SSL versions are now deprecated due to vulnerabilities. Both protocols use a combination of asymmetric (handshake) and symmetric (data transfer) cryptography, and both use a handshake process."},{"id":"d3_q_056","domain":"D3","difficulty":"easy","question":"What is the correct order of the TCP 3-way handshake?","options":["SYN, ACK, SYN","ACK, SYN, SYN-ACK","SYN-ACK, SYN, ACK","SYN, SYN-ACK, ACK"],"answer":3,"explanation":"The TCP 3-way handshake establishes a reliable connection: (1) Client sends SYN with its sequence number. (2) Server responds with SYN-ACK, acknowledging the client's SYN and sending its own sequence number. (3) Client sends ACK, acknowledging the server's SYN-ACK. The connection is now established."},{"id":"d3_q_057","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST commonly used mode of IPSec?","options":["Transport mode","Hybrid mode","SSH mode","Tunnel mode"],"answer":3,"explanation":"Tunnel mode is the most common IPSec mode — it encrypts the entire IP packet (header + payload) and wraps it in a new IP header, making it ideal for VPNs. Transport mode only encrypts the payload, leaving the original header exposed, and is used for end-to-end host communication. SSH mode does not exist in IPSec."},{"id":"d3_q_058","domain":"D3","difficulty":"easy","question":"Which of the following is the MOST effective physical security control for protecting a perimeter?","options":["Security cameras","Guard dogs","Motion sensors","Fences and gates"],"answer":3,"explanation":"Fences and gates are physical barriers that actively prevent or deter unauthorized entry — they are the first line of defence in a layered security approach. Cameras, motion sensors, and guard dogs are detective or deterrent controls that alert to intrusion but do not physically stop it the way a barrier does."},{"id":"d3_q_059","domain":"D3","difficulty":"medium","question":"Which of the following is the PRIMARY indicator that a secured door in an access control system is functioning properly?","options":["The door opens without resistance","The door makes a clicking sound when locked","The door has a visible security camera attached to it","The door remains locked when an unauthorised person attempts to open it"],"answer":3,"explanation":"The primary function of a secured door is to deny access to unauthorised individuals. The definitive test is that the door stays locked when someone without valid credentials tries to open it. Clicking sounds can be mimicked or occur without actual locking; a camera presence has no bearing on the door mechanism itself."},{"id":"d3_q_060","domain":"D3","difficulty":"medium","question":"When designing a new data center, what is the MOST important consideration for its physical structure?","options":["Use sub-ceilings and sub-floors throughout for cable management","Focus on perimeter security while using lightweight internal materials","Prioritise aesthetics with glass walls and electronic access controls","Use slab-to-slab, fire-rated walls of sturdy materials and treat the data center as a fully enclosed secure box"],"answer":3,"explanation":"Slab-to-slab construction eliminates crawl-space bypass routes. Fire-rated, robust materials (reinforced concrete, cinder block) resist physical breach. Treating the data center as a sealed box — equal attention to walls, doors, ceiling, and floor — prevents the weakest surface from becoming an entry point. Lightweight materials like sheetrock can be breached easily regardless of electronic controls."},{"id":"d3_q_061","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST important factor to consider when designing site and facility security controls?","options":["The location of the site","The security budget allocated for the controls","The availability of security personnel","The potential threats to the site and facilities"],"answer":3,"explanation":"Security controls must be designed to mitigate specific risks. Without identifying the potential threats (natural disasters, theft, vandalism, etc.) first, it's impossible to know which controls are appropriate. Location, budget, and personnel are all secondary — they inform how to implement controls after the threats are understood."},{"id":"d3_q_062","domain":"D3","difficulty":"medium","question":"An organisation is considering building a data center in a flood-prone area. What should the IT security team do?","options":["Build there but invest in flood protection measures","Proceed — the organisation has never experienced flooding before","Defer entirely to senior management without providing any input","Conduct a risk analysis and present senior management with costs for the flood-prone site vs an alternative location"],"answer":3,"explanation":"Due diligence and due care require the security team to perform a thorough risk analysis — quantifying flood damage costs, downtime, and mitigation expenses — and compare them against an alternative site. This gives senior management data-driven input to make an informed decision and creates a paper trail of proactive risk management."},{"id":"d3_q_063","domain":"D3","difficulty":"medium","question":"A data center has four UPSs, two on each side of the room, but all servers are connected to one side. One overloaded UPS fails, causing a cascading power outage. What would have BEST prevented this?","options":["Install additional UPSs on the overloaded side","Monitor and reactively adjust load distribution","Accept the risk and rely on the four-UPS redundancy","Distribute server connections evenly across UPSs on both sides of the room"],"answer":3,"explanation":"Balanced load distribution is the correct preventative design. By spreading connections across both sides, no single UPS is overloaded, each server has access to two power sources, and a single UPS failure cannot cascade into a widespread outage. Reactive monitoring and adding UPSs to one side don't fix the underlying design flaw."},{"id":"d3_q_064","domain":"D3","difficulty":"easy","question":"What is the MOST effective way to store backups to prevent data loss in case of a disaster?","options":["On the same server as the original data","On a cloud-based server","On a tape-based system in the same building","In a separate physical location (offsite)"],"answer":3,"explanation":"Offsite backups ensure a disaster at the primary location (fire, flood, earthquake) cannot destroy both the original data and the backup simultaneously. Cloud is useful but can be impacted by cyber attacks and may be slower to restore. Tape in the same building shares the same disaster risk as the original. Storing backups on the same server means a single hardware failure wipes everything."},{"id":"d3_q_065","domain":"D3","difficulty":"medium","question":"Which of the following is NOT part of server hardening?","options":["Installing the latest patches and updates","Changing default administrative passwords","Disabling unused services and protocols","Using FTP for file transfers"],"answer":3,"explanation":"FTP sends data including credentials in clear text and would WEAKEN server security, not harden it. Server hardening replaces insecure protocols like FTP with secure alternatives (SFTP, FTPS). Hardening includes patching, changing default passwords, and disabling unnecessary services to reduce the attack surface."},{"id":"d3_q_066","domain":"D3","difficulty":"medium","question":"Which of the following would NOT typically be part of server hardening before promoting a server to production?","options":["Installing the latest security patches","Changing the default administrator password","Disabling unnecessary services and protocols","Enabling automatic updates for all software"],"answer":3,"explanation":"Automatic updates are risky in production environments — they can introduce incompatible changes, cause service instability, or deploy untested code without warning. Production updates should be staged and tested before deployment. Patching, changing default passwords, and disabling unneeded services are all standard hardening steps."},{"id":"d3_q_067","domain":"D3","difficulty":"easy","question":"When we experience a power surge, what is happening?","options":["Electrical current is being temporarily cut off","Electrical current is flowing in the opposite direction","Electrical current is flowing at a lower rate than usual","Electrical current is flowing at a higher voltage than usual, increasing current through the circuit"],"answer":3,"explanation":"A power surge is an unexpected increase in voltage, which proportionally increases current (Ohm's law: V = IR). The excess energy causes overheating and can damage electronic components. Surges can carry tens of thousands of volts and last fractions of a second. A cut-off is a blackout; low voltage is a brownout or sag; reversed current indicates a fault."},{"id":"d3_q_068","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST important indicator of the efficiency of a UPS (Uninterruptible Power Supply)?","options":["The cost of the UPS","The physical size of the UPS","The maximum power output (watts) of the UPS","The amount of time the UPS can provide power without interruption"],"answer":3,"explanation":"The primary measure of a UPS's efficiency is its runtime — how long it can sustain power during an outage. This determines whether staff can safely save work and shut down systems, or whether critical infrastructure can keep running. Cost, size, and wattage are important specs but do not directly indicate efficiency or runtime."},{"id":"d3_q_069","domain":"D3","difficulty":"medium","question":"Which leg of the CIA triad do power fluctuations MOST directly compromise?","options":["Confidentiality","Integrity","All three equally","Availability"],"answer":3,"explanation":"Power fluctuations (surges, outages, brownouts) primarily compromise Availability by causing system crashes, slowdowns, or outages that prevent users from accessing data and services. Integrity can be affected if a crash corrupts data mid-write, but modern journaling file systems mitigate this. Confidentiality is not directly impacted — power loss does not grant unauthorised access."},{"id":"d3_q_070","domain":"D3","difficulty":"easy","question":"Which of the following is the MOST effective fire security control that provides BOTH detection and suppression?","options":["Smoke alarms","Fire drills","A no-smoking policy","A sprinkler system"],"answer":3,"explanation":"A sprinkler system automatically detects heat and suppresses the fire before it can spread, combining both functions. Smoke alarms only detect and alert — they do not suppress. Fire drills and no-smoking policies are preventative administrative controls with no suppression capability."},{"id":"d3_q_071","domain":"D3","difficulty":"medium","question":"Photoelectric detectors are installed in your data center. What do they detect?","options":["Fire (flames directly)","Water or moisture","Carbon dioxide","Smoke"],"answer":3,"explanation":"Photoelectric detectors use a light source and sensor inside a chamber. When smoke particles enter, they scatter the light beam, triggering the sensor and alarm. They are especially effective at detecting slow, smouldering fires that produce large amounts of smoke. Heat detectors sense temperature change; flame detectors sense infrared/UV radiation; CO2 and water have separate dedicated sensors."},{"id":"d3_q_072","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST important indicator of a well-functioning HVAC system?","options":["High energy efficiency","Lower maintenance costs","Long system lifespan","Proper airflow — adequate ventilation and thermal comfort"],"answer":3,"explanation":"The primary function of an HVAC system is to maintain proper airflow, ensuring adequate ventilation and a stable temperature. A system can be efficient, cheap to maintain, or long-lasting, but if it is not delivering proper airflow, it is not fulfilling its core purpose — which in a data center context also means protecting equipment from overheating."},{"id":"d3_q_073","domain":"D3","difficulty":"easy","question":"What is the MOST important thing to secure FIRST in an emergency?","options":["Evacuation of the premises","Security protocols","Confidential information","Human life and safety"],"answer":3,"explanation":"Human life is always the first priority in any emergency. Medical assistance must be provided to those in danger before attention turns to evacuation, security protocols, or protecting data. No asset, information, or procedure is more important than preserving human life."},{"id":"d3_q_074","domain":"D3","difficulty":"easy","question":"In the event of a natural disaster, what is the FIRST step an organisation should take to protect its assets?","options":["Activate the disaster recovery plan","Execute data backup and storage procedures","Assess damage and prioritise recovery efforts","Ensure the safety of all employees"],"answer":3,"explanation":"Human safety always comes first — employees must be notified and evacuated before any technical response begins. Disaster recovery plans, backups, and damage assessments are all secondary to getting people to safety. Backups and DR plans should already be in place before any disaster strikes."},{"id":"d3_q_075","domain":"D3","difficulty":"medium","question":"During a fire alarm, elevators shut down. A wheelchair user on the fourth floor cannot use the stairs. What does this highlight about evacuation planning?","options":["Disabled employees should only work on the ground floor","Elevators should never shut down during emergencies","Employees who cannot use stairs should be excused from drills","Organisations must have specific evacuation plans for employees with disabilities or special needs"],"answer":3,"explanation":"Evacuation plans must account for every employee, including those with disabilities. Alternatives such as designated assistance teams, evacuation chairs, or refuge areas on each floor must exist and be practised in drills — not invented during a real emergency. Restricting where disabled employees work is discriminatory, and elevators correctly shut down during fires for safety reasons."},{"id":"d3_q_076","domain":"D3","difficulty":"medium","question":"Which of the following is the MOST effective countermeasure against rainbow table attacks?","options":["Key stretching","Limiting login attempts","Keeping password hashes in plaintext","Salting"],"answer":3,"explanation":"A salt is a unique random value added to each password before hashing. Even if two users share the same password, their hashes differ because of unique salts, making pre-computed rainbow tables useless — the attacker would need a new table per unique salt. Key stretching slows brute force; login limits block online attacks; plaintext hashes offer zero protection."},{"id":"d3_q_077","domain":"D3","difficulty":"easy","question":"Which type of antivirus software MUST be constantly updated to remain effective?","options":["Heuristic","Embedded","Formal","Signature-based"],"answer":3,"explanation":"Signature-based antivirus relies on a database of known malware fingerprints and can only detect threats it already has signatures for. It must be constantly updated as new malware is discovered. Heuristic antivirus analyses behaviour patterns and can detect unknown variants without requiring constant signature updates."},{"id":"d3_q_078","domain":"D3","difficulty":"medium","question":"In telecommunications, what does the term 'Demarc' (Point of Demarcation) refer to?","options":["Where all the organisation's routers and switches are located","Where servers are placed to ensure faster speeds","Ensuring all tenants have access to the network equipment","The point where the ISP's line terminates and the customer's network begins"],"answer":3,"explanation":"The Demarc (Point of Demarcation) is the physical boundary where the telecommunications provider's responsibility ends and the customer's network responsibility begins. Everything beyond the Demarc is the customer's to manage, secure, and maintain."},{"id":"d3_q_079","domain":"D3","difficulty":"medium","question":"When a computer uses more than one processor simultaneously to handle a task, it is called what?","options":["Multithreading","Multitasking","Multiprogramming","Multiprocessing"],"answer":3,"explanation":"Multiprocessing uses multiple CPUs simultaneously on one or more tasks, improving performance and reliability. Multithreading divides a single process into concurrent threads on one or more CPUs. Multitasking runs multiple applications on a single CPU via time-slicing. Multiprogramming keeps the CPU busy by switching between multiple loaded programs."},{"id":"d3_q_080","domain":"D3","difficulty":"medium","question":"After a security assessment of an acquired facility, you find four issues: an opening in the fence, a broken turnstile, a broken camera, and poor lighting. To prevent unauthorised people from getting inside the perimeter, which should you fix FIRST?","options":["The opening in the fence","The broken turnstile","The broken camera","The poor lighting"],"answer":0,"explanation":"The opening in the fence is a direct breach of the physical perimeter — it allows anyone to walk in unchallenged. A broken turnstile affects a controlled entry point but not the full perimeter. Cameras and lighting are detective controls; they don't physically stop entry. Securing the perimeter barrier is always the first priority."},{"id":"d3_q_081","domain":"D3","difficulty":"medium","question":"Your organisation is considering new symmetric encryption. Which of the following is no longer considered secure and should NOT be used?","options":["RC4","3DES","AES","Twofish"],"answer":0,"explanation":"RC4 is a stream cipher with well-documented vulnerabilities exploitable in practical attacks. It has been removed from TLS and is no longer recommended. 3DES is deprecated but still more secure than RC4. AES is the current gold standard. Twofish is also considered secure, though less widely adopted than AES."},{"id":"d3_q_082","domain":"D3","difficulty":"medium","question":"A logic bomb is triggered by which of the following?","options":["When a certain event occurs or a specific time is reached","As soon as it is introduced to the system","When it has infected the entire network","When the system gains internet access"],"answer":0,"explanation":"Logic bombs lie dormant until a pre-set condition is met — either a specific time/date or a triggering event (e.g., a user logging in, a file being opened, or an employee being removed from payroll). They do not activate immediately, do not spread like worms, and are not triggered by internet connectivity."},{"id":"d3_q_083","domain":"D3","difficulty":"medium","question":"A senior VP asks what technologies PKI (Public Key Infrastructure) uses. What is the correct answer?","options":["A combination of asymmetric encryption, symmetric encryption, and hashes","Asymmetric encryption only","Symmetric encryption only","Hashes only"],"answer":0,"explanation":"PKI uses all three: asymmetric encryption for secure key exchange and digital signatures during the handshake; symmetric encryption for fast bulk data transfer once the session is established; and hash functions to ensure data integrity and enable digital signatures (private-key-encrypted hash = signature)."},{"id":"d3_q_084","domain":"D3","difficulty":"medium","question":"Your organisation uses cloud computing with IaaS. Who is responsible for managing the databases?","options":["The vendor","The customer","The security team","The network team"],"answer":1,"explanation":"In IaaS (Infrastructure as a Service), the vendor provides and maintains the underlying infrastructure (compute, storage, networking). Everything from the OS upward — including databases, applications, and security configurations — is the customer's responsibility to install, configure, and maintain."},{"id":"d3_q_085","domain":"D3","difficulty":"medium","question":"Jane is explaining digital signatures to a friend. Which of the following is one of the MAIN reasons organisations use digital signatures?","options":["Confidentiality","Availability","Integrity","Authentication"],"answer":2,"explanation":"Digital signatures primarily ensure integrity — verifying that data has not been altered in transit. They also provide non-repudiation (the signer cannot deny signing) and authentication (confirming identity). They do not provide confidentiality (encryption does that) and do not affect availability."},{"id":"d3_q_086","domain":"D3","difficulty":"medium","question":"When installing motion sensors, which types of security controls are you implementing?","options":["Administrative and detective","Deterrence and preventative","Preventative and detective","Detective and deterrence"],"answer":3,"explanation":"Motion sensors detect movement (detective control) and, when visible, deter potential intruders (deterrence control). They do not physically block access, so they are not preventative. Administrative controls are policies and procedures — not physical devices."},{"id":"d3_q_087","domain":"D3","difficulty":"medium","question":"Your data center uses passive infrared (PIR) motion detectors for monitoring. What do they use to detect movement?","options":["Heat (infrared radiation)","Pulses of ultrasonic energy","Changes in ambient light","High-frequency sound waves"],"answer":0,"explanation":"Passive infrared (PIR) detectors sense heat — they detect the change in infrared radiation pattern when a warm object (like a human) moves through the sensor's field. They emit no energy themselves (passive). Ultrasonic sensors use pulses; photodetectors use light; ultrasonic sensors use sound."},{"id":"d3_q_088","domain":"D3","difficulty":"medium","question":"When using frequency analysis in cryptanalysis, what are you specifically examining?","options":["How often certain letters appear in the ciphertext","How often pairs of letters appear together","How many messages have been sent","How frequently messages are transmitted"],"answer":0,"explanation":"Frequency analysis examines how often individual letters appear in a ciphertext and compares that distribution to known letter frequencies in the target language (e.g., E, T, A in English). This works because monoalphabetic substitution ciphers preserve letter frequency. Bigram/digraph analysis looks at pairs; traffic analysis looks at message volume/timing."},{"id":"d3_q_089","domain":"D3","difficulty":"easy","question":"When we talk about WORM media, which of the following is an example?","options":["RAM","EEPROM","Recordable DVDs (R DVDs)","Traditional hard disks"],"answer":2,"explanation":"WORM (Write Once, Read Many) media allows data to be written exactly once and read many times — it cannot be erased or overwritten. Recordable DVDs (DVD-R) are a classic example. RAM is volatile and rewritable. EEPROM can be electrically erased and reprogrammed. Traditional hard disks are fully rewritable."},{"id":"d3_q_090","domain":"D3","difficulty":"easy","question":"Which physical access control prevents cars and vans from entering a perimeter while still allowing pedestrians through?","options":["Lights","Bollards","Cameras","Motion sensors"],"answer":1,"explanation":"Bollards are short vertical posts designed to stop vehicle access while allowing foot traffic. They can be fixed, retractable, or crash-rated. Lights, cameras, and motion sensors are detective/deterrence controls — they observe and deter but do not physically block vehicles."},{"id":"d3_q_091","domain":"D3","difficulty":"hard","question":"Which of the following hashing algorithms is still considered secure and highly collision-resistant?","options":["MD5","RIPEMD-160","SHA-1","MD6"],"answer":1,"explanation":"RIPEMD-160 produces a 160-bit hash and remains collision-resistant. MD5 (128-bit) is broken and vulnerable to collisions. SHA-1 (160-bit) has been demonstrated vulnerable to practical collision attacks. MD6 was withdrawn before the NIST competition concluded and is not widely used or validated."},{"id":"d3_q_092","domain":"D3","difficulty":"medium","question":"Which ASTM standard gate class is designed for residential use at a private home?","options":["Class III","Class IV","Class I","Class XI"],"answer":2,"explanation":"ASTM Class I gates are for residential applications — low-frequency use by a family unit. Class III is for industrial or restricted multi-tenant use. Class IV is for high-volume commercial locations like bus depots. Class XI does not exist in ASTM gate standards (Classes I–IV only)."},{"id":"d3_q_093","domain":"D3","difficulty":"easy","question":"In which part of the computer are all arithmetic and logical calculations performed?","options":["CPU (Central Processing Unit)","CU (Control Unit)","ALU (Arithmetic Logic Unit)","ROM (Read-Only Memory)"],"answer":2,"explanation":"The ALU (Arithmetic Logic Unit) is the component that executes all arithmetic and logical operations. The CPU is the broader processor that contains the ALU. The CU (Control Unit) directs CPU operations but does not perform calculations. ROM is non-volatile storage — not involved in computation."},{"id":"d3_q_094","domain":"D3","difficulty":"hard","question":"The NSA proposed embedding the Clipper chip in all telecommunications devices. Which encryption algorithm did it use?","options":["DSA","Skipjack","3DES","RSA"],"answer":1,"explanation":"The Clipper chip (proposed in the 1990s) used the Skipjack symmetric encryption algorithm. The chip was controversial because it included key escrow — government agencies could access keys under certain conditions. DSA is a digital signature algorithm, not encryption. 3DES and RSA were not used in the Clipper chip."},{"id":"d3_q_095","domain":"D3","difficulty":"medium","question":"What is the complete order of steps in the CPU instruction cycle, including writing results back to memory?","options":["Fetch, execute, decode, store","Fetch, decode, execute, store","Execute, fetch, decode, store","Fetch, decode, store, execute"],"answer":1,"explanation":"The full CPU instruction cycle is: Fetch (retrieve instruction from memory) → Decode (interpret the instruction) → Execute (perform the operation) → Store/Write-back (write the result back to memory or a register). You cannot execute before decoding, and results must be stored after execution."},{"id":"d3_q_096","domain":"D3","difficulty":"medium","question":"When your private and public keys are held in key escrow, what does that mean?","options":["The server where your public and private keys are stored","The private key you hold on your own system","The public key available to everyone","A trusted third party holds copies of your keys, often accessible by law enforcement under legal process"],"answer":3,"explanation":"Key escrow means a neutral third party (escrow agent or government authority) holds copies of your cryptographic keys. The keys can be released under specific conditions — typically a court order. This is distinct from simply storing keys on a server, holding your own private key, or distributing your public key."},{"id":"d3_q_097","domain":"D3","difficulty":"hard","question":"Which of the following is TRUE about IDEA (International Data Encryption Algorithm)?","options":["64-bit block cipher with a 56-bit key (like DES)","64-bit block cipher with a 112-bit key (like two-key 3DES)","128-bit block cipher with 128, 192, or 256-bit keys (like AES)","64-bit block cipher with a 128-bit key"],"answer":3,"explanation":"IDEA is a symmetric 64-bit block cipher using a 128-bit key, designed as a replacement for DES. It is known for its security and efficient software implementation. DES uses a 56-bit key; two-key 3DES uses an effective 112-bit key; AES uses 128-bit blocks with 128/192/256-bit keys."},{"id":"d3_q_098","domain":"D3","difficulty":"medium","question":"What are Distributed Control Systems (DCSs) primarily used for?","options":["Monitoring servers, workstations, and network devices","High-level supervisory management of multiple sites","Controlling manufacturing assembly lines only","Computerized control of a continuous industrial process or plant"],"answer":3,"explanation":"DCSs are used to manage complex, continuous industrial processes (chemical plants, power generation, oil refining, water treatment). Unlike SCADA (which provides high-level supervisory management across multiple sites), DCSs focus on distributed, real-time control within a single plant or process."},{"id":"d3_q_099","domain":"D3","difficulty":"medium","question":"Jane and Bob are discussing hashing and use the abbreviation MAC. In this context, what does MAC stand for?","options":["Mandatory Access Control","Media Access Control","Message Access Code","Message Authentication Code"],"answer":3,"explanation":"In a hashing/cryptography context, MAC stands for Message Authentication Code — a short value generated by combining a secret key with message data (often using HMAC) to verify both the integrity and authenticity of a message. Mandatory Access Control is a security model. Media Access Control is a network hardware address. Message Access Code is not a real standard term."},{"id":"d3_q_100","domain":"D3","difficulty":"medium","question":"In which IP protocol version is IPSec built in natively rather than added on as an extension?","options":["IPv4","PGP","HMAC","IPv6"],"answer":3,"explanation":"IPSec is a mandatory, integrated component of IPv6 — it was designed in from the start. In IPv4, IPSec was retrofitted as an add-on because IPv4 was originally built for trusted research/military networks and had no inherent security. PGP and HMAC are not IP protocols."},{"id":"d3_q_101","domain":"D3","difficulty":"medium","question":"What component in the computer kernel handles all access decisions between subjects (users/processes) and objects (files/resources)?","options":["User mode","Supervisor mode","Superuser mode","The reference monitor"],"answer":3,"explanation":"The reference monitor is a security concept implemented in the OS kernel that mediates every access request from a subject to an object and enforces the security policy. User mode is where applications run with limited privileges. Supervisor/kernel mode is where the OS runs — the reference monitor is the specific kernel component enforcing access control. 'Superuser mode' is not a standard term."},{"id":"d4_q_001","domain":"D4","difficulty":"medium","question":"On the exam you see an unfamiliar protocol starting with 'I' and must guess its OSI layer. What's the safest answer (and the exception)?","options":["Layer 7, except for IPSEC","Layer 3, except for IMAP which is Layer 7","Layer 2, except for ICMP","Layer 4, except for IP"],"answer":1,"explanation":"Protocols starting with 'I' (IP, IGMP, IGRP, IPSEC, IKE, ISAKMP) are generally Layer 3. The exception is IMAP, which is Layer 7 (Application)."},{"id":"d4_q_002","domain":"D4","difficulty":"hard","question":"A real-time VOIP application prioritizes timing over guaranteed delivery. Which transport protocol does it use, and what attack exploits it?","options":["TCP, exploited by SYN floods","UDP, exploited by Fraggle attacks","TCP, exploited by Fraggle attacks","UDP, exploited by SYN floods"],"answer":1,"explanation":"VOIP uses UDP (connectionless, timing over delivery). A Fraggle attack works like Smurf but uses UDP instead of ICMP. SYN floods exploit TCP's 3-way handshake."},{"id":"d4_q_003","domain":"D4","difficulty":"medium","question":"DNSSEC adds which protections to DNS, and which does it NOT provide?","options":["Confidentiality and Integrity, but not Authentication","Authentication and Integrity, but NOT Confidentiality","Confidentiality only","Availability and Confidentiality"],"answer":1,"explanation":"DNSSEC provides Authentication and Integrity using PKI — like a digital signature for DNS — but does NOT provide Confidentiality. It defends against DNS poisoning."},{"id":"d4_q_004","domain":"D4","difficulty":"hard","question":"An attacker sets up an access point with the SAME SSID as the corporate network but with no security, and devices auto-connect to it. What is this attack?","options":["Rogue Access Point","Evil Twin","Jamming","War Driving"],"answer":1,"explanation":"An Evil Twin mimics the legitimate SSID (with no security) so devices connect automatically, compromising confidentiality and integrity. A rogue AP is simply an unauthorized AP added to the network."},{"id":"d4_q_005","domain":"D4","difficulty":"medium","question":"Which wireless security standard replaces the pre-shared key (PSK) with Simultaneous Authentication of Equals (SAE)?","options":["WEP","WPA","WPA2","WPA3"],"answer":3,"explanation":"WPA3 (2020) replaces the PSK exchange with SAE and uses AES-256 in GCM mode with SHA-384. WPA2 commonly uses WPA2-PSK with AES."},{"id":"d4_q_006","domain":"D4","difficulty":"hard","question":"You need a firewall that can detect malware hidden in an HTTP payload on an allowed port. Which firewall type is required?","options":["Packet filtering firewall (Layer 3)","Stateful firewall (Layer 4)","Application layer firewall / NGFW with deep packet inspection (Layer 7)","A dual-homed host"],"answer":2,"explanation":"Only an application-layer firewall or NGFW with deep packet inspection can examine the actual payload (Layer 7) to detect malicious content or protocols misusing an allowed port. Lower-layer firewalls only see headers."},{"id":"d4_q_007","domain":"D4","difficulty":"medium","question":"Which routing protocol is used to route between Autonomous Systems on the Internet and is path-vector based?","options":["RIP","OSPF","BGP","EIGRP"],"answer":2,"explanation":"BGP (Border Gateway Protocol) is the routing protocol of the Internet, routing between Autonomous Systems based on paths/policies. It's a path-vector protocol that typically never fully converges."},{"id":"d4_q_008","domain":"D4","difficulty":"hard","question":"802.1X authentication involves three parties. What is the role of the 'authenticator'?","options":["The client device requesting access","The network device (switch or wireless AP) that controls access","The RADIUS server validating credentials","The certificate authority issuing keys"],"answer":1,"explanation":"In 802.1X: the supplicant is the client device, the authenticator is the network device (switch or wireless AP), and the AS (authentication server, usually RADIUS) validates credentials."},{"id":"d4_q_009","domain":"D4","difficulty":"medium","question":"What is the key security difference between Telnet and SSH?","options":["Telnet uses TCP; SSH uses UDP","Telnet sends all data including credentials in plaintext; SSH encrypts the connection","SSH is older and less secure than Telnet","Telnet encrypts only the password"],"answer":1,"explanation":"Telnet (TCP 23) sends ALL data including usernames and passwords in plaintext and should not be used. SSH provides a secure (encrypted) connection over an unsecured network."},{"id":"d7_q_001","domain":"D7","difficulty":"medium","question":"An employee's accounts are locked and audited while they are forced to take time off, to detect any fraud they may be concealing. Which control is this?","options":["Separation of Duties","Job Rotation","Mandatory Vacations","Least Privilege"],"answer":2,"explanation":"Mandatory Vacations ensure one person isn't always performing the same task; their accounts are locked and audited while away. If they were committing and covering up fraud, the audit reveals it. Don't give too much advance notice."},{"id":"d7_q_002","domain":"D7","difficulty":"hard","question":"You must restore a system to Thursday using a Sunday full backup plus daily DIFFERENTIAL backups. How many tapes do you need?","options":["1 tape","2 tapes","4 tapes","7 tapes"],"answer":1,"explanation":"Differential backs up everything since the last FULL. So you need just 2 tapes: the Sunday full + Wednesday's differential. (Incremental would need many more — full + each day's incremental.)"},{"id":"d7_q_003","domain":"D7","difficulty":"medium","question":"Which backup type clears the archive bit and backs up only what changed since the last backup?","options":["Full backup","Differential backup","Incremental backup","Copy backup"],"answer":2,"explanation":"Incremental backs up everything changed since the last backup (full or incremental) and CLEARS the archive bit. Differential does NOT clear it. Copy is a full that doesn't clear the bit."},{"id":"d7_q_004","domain":"D7","difficulty":"hard","question":"An attack is occurring but the IDS does not detect it and takes no action. What category is this, and why is it the most dangerous?","options":["False Positive — it wastes analyst time","True Negative — normal operation","False Negative — a real attack goes completely undetected","True Positive — the system acts correctly"],"answer":2,"explanation":"A False Negative is when an attack happens but the system misses it entirely. It's the most dangerous because the threat proceeds with no alert or response."},{"id":"d7_q_005","domain":"D7","difficulty":"medium","question":"Your team is overwhelmed by SIEM alerts and wants automated response to certain incidents. Which solution adds AI-driven automatic reaction?","options":["A second SIEM","SOAR (Security Orchestration, Automation, and Response)","A network IDS","A host-based firewall"],"answer":1,"explanation":"SOAR uses AI to automatically REACT to some events, reducing the alert overload a SIEM generates. SIEM centralizes and correlates but only alerts; SOAR adds orchestrated response."},{"id":"d7_q_006","domain":"D7","difficulty":"hard","question":"After a disaster, which recovery team brings systems back at the alternate site, and in what order?","options":["Salvage team — most critical systems first","Recovery team — most critical systems first","Rescue team — least critical systems first","Recovery team — least critical systems first"],"answer":1,"explanation":"The Recovery team (failover) gets the alternate site running, bringing the MOST critical systems up first. The Salvage team (failback) returns to the primary site, bringing LEAST critical systems up first."},{"id":"d7_q_007","domain":"D7","difficulty":"medium","question":"An organization wants a recovery site with near-real-time data and the ability to switch over in under an hour, housing only critical systems. Which site type?","options":["Cold site","Warm site","Hot site","Reciprocal agreement site"],"answer":2,"explanation":"A Hot site houses critical applications with near-real-time data and allows a manual switch in about an hour or less. Warm sites restore from backups (4-24hr); cold sites have no hardware (weeks)."},{"id":"d7_q_008","domain":"D7","difficulty":"hard","question":"After eradicating an incident, you fix the same vulnerability across ALL systems org-wide, not just the compromised one. What process drives this?","options":["Lessons Learned","Root-Cause Analysis","Containment","Detection"],"answer":1,"explanation":"Root-Cause Analysis identifies the underlying weakness so you can remediate it everywhere it exists. Without it, the same problem recurs. Fixing only the one system leaves the root cause in place."},{"id":"d7_q_009","domain":"D7","difficulty":"easy","question":"Administrative security controls are PRIMARILY concerned with controlling what?","options":["Technology and system configuration settings","People's operational access to data","Physical access to buildings and data centres","Network perimeter defences and firewall rules"],"answer":1,"explanation":"Administrative security controls provide the means to control people's operational access to data. They are policy-based and process-based controls that govern how people interact with data, systems, and each other — examples include least privilege, need to know, and separation of duties."},{"id":"d7_q_010","domain":"D7","difficulty":"easy","question":"Which principle states that employees should receive ONLY the minimum access necessary to perform their job duties — no more, no less?","options":["Need to Know","Separation of Duties","Least Privilege","Mandatory Vacations"],"answer":2,"explanation":"Least Privilege means granting users the minimum level of access rights required to perform their specific job functions — nothing beyond that. This limits the potential damage from accidents, errors, or malicious actions by ensuring no one has more access than they actually need."},{"id":"d7_q_011","domain":"D7","difficulty":"medium","question":"A hospital employee has database access to all patient records as part of their system role, but is currently treating only patients in Ward A. Under which principle should they NOT access Ward B patient records?","options":["Least Privilege — their access should have been restricted at setup","Need to Know — even with access, you should not access data you have no legitimate reason to view","Separation of Duties — multiple approvals are neede
