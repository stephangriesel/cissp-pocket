t 223?","options":["Class C — subnet mask 255.255.255.0","Class A — subnet mask 255.0.0.0","Class B — subnet mask 255.255.0.0","Class D — used for multicast"],"answer":0,"explanation":"Class A: 1–127 (mask 255.0.0.0). Class B: 128–191 (mask 255.255.0.0). Class C: 192–223 (mask 255.255.255.0). Class D (224–239) is reserved for multicast. Knowing class ranges and default masks is essential for CISSP."},{"id":"d4_q_052","domain":"D4","question":"At which OSI layers do a bridge and a router operate, respectively?","options":["Bridge at Data Link (L2); Router at Network (L3)","Bridge at Network (L3); Router at Data Link (L2)","Both operate at the Network layer (L3)","Bridge at Physical (L1); Router at Transport (L4)"],"answer":0,"explanation":"Bridges operate at Layer 2 (Data Link) — they forward frames based on MAC addresses and do not use IP addressing. Routers operate at Layer 3 (Network) — they open packets, read IP addresses, and route to the correct network."},{"id":"d4_q_053","domain":"D4","question":"What is attenuation in networking?","options":["A decrease in signal amplitude as it propagates along a transmission medium","An increase in signal noise caused by electromagnetic interference","The maximum distance a signal can travel without amplification","The process of encrypting a signal before transmission"],"answer":0,"explanation":"Attenuation is the weakening of a signal over distance. Repeaters and amplifiers are used to combat attenuation. Fiber optic cables are immune to electromagnetic interference (EMI) and suffer less attenuation than copper cables."},{"id":"d4_q_054","domain":"D4","question":"Another term for DMZ (Demilitarized Zone) in network security is:","options":["Screened subnet","Perimeter router","Bastion host","Air-gapped network"],"answer":0,"explanation":"A DMZ is also called a screened subnet. It sits between the trusted internal network and the untrusted internet, typically containing public-facing servers (web, email, DNS). Traffic is filtered by firewalls on both sides."},{"id":"d4_q_055","domain":"D4","question":"Which wireless security protocol is based on 802.11i, uses AES encryption with CCMP, and is the most secure?","options":["WPA2","WPA","WEP","TKIP"],"answer":0,"explanation":"WPA2 is based on 802.11i and uses AES with CCMP — the most secure Wi-Fi encryption standard. WPA uses TKIP (RC4-based). WEP is broken and crackable in seconds. TKIP is a protocol used by WPA, not a standalone standard."},{"id":"d4_q_056","domain":"D4","question":"WPA2 Enterprise mode uses which additional authentication mechanism?","options":["RADIUS (Remote Authentication Dial-In User Service)","LDAP over SSL (LDAP-S)","Pre-shared keys (PSK)","Kerberos ticket-based authentication"],"answer":0,"explanation":"WPA2 Enterprise uses RADIUS for centralised authentication — each user authenticates individually. WPA2 Personal uses a pre-shared key (PSK). RADIUS also includes account lockout if a password-cracker is detected."},{"id":"d4_q_057","domain":"D4","question":"Which port does secure LDAP (LDAP-S) use, and how does it differ from standard LDAP?","options":["TCP 636 — LDAP-S encrypts traffic over SSL/TLS; standard LDAP uses TCP 389 and is unencrypted","TCP 389 — LDAP-S uses the same port but adds a password; LDAP is anonymous","TCP 445 — LDAP-S is the secure version used only by Active Directory","UDP 636 — LDAP-S uses UDP for faster directory queries"],"answer":0,"explanation":"Standard LDAP uses TCP 389 and transmits data unencrypted. LDAP-S (LDAP Secure) runs over SSL/TLS on TCP 636, encrypting the directory queries and results. OpenLDAP stores passwords in cleartext — another reason to use LDAP-S."},{"id":"d4_q_058","domain":"D4","question":"Which email security protocol provides signing AND encryption of email messages and can also be used as part of an SSO solution?","options":["S/MIME (Secure/Multipurpose Internet Mail Extensions)","DKIM (DomainKeys Identified Mail)","PEM (Privacy Enhanced Mail)","MOSS (MIME Object Security Services)"],"answer":0,"explanation":"S/MIME provides signed and encrypted emails and can integrate with SSO. DKIM is a domain validation tool for email authenticity (not full encryption). PEM and MOSS both provide authentication, confidentiality, integrity, and nonrepudiation but are older standards."},{"id":"d4_q_059","domain":"D4","question":"Which LAN device operates at the Physical layer (L1) and simply amplifies signals to extend network reach?","options":["Repeater","Bridge","Switch","Router"],"answer":0,"explanation":"Repeaters (and hubs, which are multi-port repeaters) operate at Layer 1. They amplify the signal but have no intelligence — they repeat everything. Bridges and switches operate at L2; routers at L3. Hubs = multi-port repeaters = physical layer."},{"id":"d4_q_060","domain":"D4","question":"What is the data transmission speed of a T-1 line?","options":["1.544 Mbps","44.736 Mbps","155 Mbps","64 Kbps"],"answer":0,"explanation":"T-1 = 1.544 Mbps. T-3 = 44.736 Mbps (approximately 45 Mbps). ATM = 155 Mbps. ISDN = 64 or 128 Kbps. These are commonly tested WAN speed values on the CISSP exam."},{"id":"d4_q_061","domain":"D4","question":"Data backups address which of the following security properties?","options":["Availability, integrity, and recovery — but NOT confidentiality","Confidentiality, integrity, and availability equally","Confidentiality and availability only","Integrity and nonrepudiation only"],"answer":0,"explanation":"Backups protect availability (data can be restored), integrity (clean copy preserved), and support recovery. They do NOT address confidentiality — an unencrypted backup can expose data. Encrypting backups is a separate control needed to protect confidentiality."},{"id":"d4_q_062","domain":"D4","question":"Which network device forwards data to ALL other network segments if the destination is not on the local segment, and operates at Layer 2 without IP addressing?","options":["Bridge","Router","Switch","Gateway"],"answer":0,"explanation":"Bridges operate at L2 (Data Link) using MAC addresses. They forward frames to all other segments when the destination is not local — they do not use IP addressing. Switches (also L2) are smarter and send only to the specific destination port. Routers (L3) use IP addresses."}]};

let progressCache=null;

function getLocalP(){try{return JSON.parse(localStorage.getItem('cp')||'{}')}catch(e){return{}}}
function saveLocalP(p){try{localStorage.setItem('cp',JSON.stringify(p))}catch(e){}}
function getPendingIds(){try{return JSON.parse(localStorage.getItem('cp_pending')||'[]')}catch(e){return[]}}
function savePendingIds(ids){try{localStorage.setItem('cp_pending',JSON.stringify(ids))}catch(e){}}
function addPending(id){const ids=getPendingIds();if(!ids.includes(id)){ids.push(id);savePendingIds(ids);}}
function clearPending(id){savePendingIds(getPendingIds().filter(x=>x!==id));}

async function loadProgress(){
  const local=getLocalP();
  const localActions=getLocalActions();
  const pending=getPendingIds();
  try{
    const {data,error}=await sb.from('progress').select('card_id,score,last_action');
    if(error)throw error;
    const remote={};
    const remoteActions={};
    data.forEach(row=>{remote[row.card_id]=row.score;if(row.last_action)remoteActions[row.card_id]=row.last_action;});
    // Merge: remote is authoritative EXCEPT for cards with a pending (unconfirmed) local write
    const merged={...remote};
    const mergedActions={...remoteActions};
    pending.forEach(id=>{
      if(local[id]!==undefined) merged[id]=local[id];
      if(localActions[id]!==undefined) mergedActions[id]=localActions[id];
    });
    progressCache=merged;
    syncStatus=pending.length?'offline':'synced';
    saveLocalP(merged);
    saveLocalActions(mergedActions);
  }catch(e){
    progressCache=local;
    syncStatus='offline';
  }
  updSyncBadge();
  await loadStudyTime();
  // stats are computed live from last_action, no separate load needed
  startTimer();
  reset();
  retryPendingSyncs();
}

function getP(){return progressCache||getLocalP();}

function saveP(p){
  progressCache=p;
  saveLocalP(p); // always mirror locally, instant + offline-safe
}

function getLocalActions(){try{return JSON.parse(localStorage.getItem('cp_actions')||'{}')}catch(e){return{}}}
function saveLocalActions(a){try{localStorage.setItem('cp_actions',JSON.stringify(a))}catch(e){}}
function setLastAction(cardId,action){
  const a=getLocalActions();a[cardId]=action;saveLocalActions(a);
}

async function syncCard(cardId,score,lastAction){
  addPending(cardId);
  setLastAction(cardId,lastAction);
  try{
    const {error}=await sb.from('progress').upsert({card_id:cardId,score:score,last_action:lastAction,updated_at:new Date().toISOString()});
    if(error)throw error;
    clearPending(cardId);
    syncStatus=getPendingIds().length?'offline':'synced';
  }catch(e){
    syncStatus='offline';
  }
  updSyncBadge();
}

async function retryPendingSyncs(){
  const ids=getPendingIds();
  if(!ids.length)return;
  const p=getP();
  const actions=getLocalActions();
  for(const id of ids){
    if(p[id]!==undefined) await syncCard(id,p[id],actions[id]);
  }
}

function updSyncBadge(){
  const el=document.getElementById('syncBadge');
  if(!el)return;
  if(syncStatus==='synced'){el.textContent='● synced';el.style.color='var(--correct)';}
  else if(syncStatus==='offline'){el.textContent='● offline (saved locally)';el.style.color='var(--wrong)';}
  else{el.textContent='● syncing…';el.style.color='var(--muted)';}
}

// ---- Persistent Got/Again counters ----
function computeStats(){
  const actions=getLocalActions();
  let got=0,again=0;
  Object.values(actions).forEach(a=>{ if(a==='got')got++; else if(a==='again')again++; });
  return {got,again};
}

// ---- Study time tracking ----
let totalSeconds=0;       // last known synced/local total, NOT including current running tick
let pendingSeconds=0;     // seconds accumulated this active stretch, not yet flushed
let timerInterval=null;
const FLUSH_EVERY_SEC=30; // push to Supabase this often

function getLocalTime(){try{return parseInt(localStorage.getItem('studySeconds')||'0',10)}catch(e){return 0}}
function saveLocalTime(s){try{localStorage.setItem('studySeconds',String(s))}catch(e){}}

async function loadStudyTime(){
  try{
    const {data,error}=await sb.from('study_time').select('total_seconds').eq('id','total').single();
    if(error)throw error;
    totalSeconds=data.total_seconds;
    saveLocalTime(totalSeconds);
  }catch(e){
    totalSeconds=getLocalTime();
  }
  renderTime();
}

function renderTime(){
  const el=document.getElementById('totalTimeLabel');
  if(!el)return;
  const grand=totalSeconds+pendingSeconds;
  const h=Math.floor(grand/3600);
  const m=Math.floor((grand%3600)/60);
  el.textContent=h+'h '+m+'m';
}

function startTimer(){
  if(timerInterval)return;
  timerInterval=setInterval(()=>{
    if(document.visibilityState!=='visible')return; // only count active foreground time
    pendingSeconds++;
    renderTime();
    if(pendingSeconds>=FLUSH_EVERY_SEC)flushTime();
  },1000);
}

async function flushTime(){
  if(pendingSeconds<=0)return;
  const toFlush=pendingSeconds;
  pendingSeconds=0;
  const newTotal=totalSeconds+toFlush;
  totalSeconds=newTotal;
  saveLocalTime(newTotal);
  renderTime();
  try{
    const {error}=await sb.from('study_time').upsert({id:'total',total_seconds:newTotal,updated_at:new Date().toISOString()});
    if(error)throw error;
  }catch(e){
    // offline: local total already updated above, will retry next flush/visit
  }
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden')flushTime();
});
window.addEventListener('beforeunload',()=>{
  saveLocalTime(totalSeconds+pendingSeconds); // best-effort local save; network flush may not complete in time
});

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function buildDeck(){
  const src=mode==='flash'?DATA.flashcards:DATA.questions;
  const filtered=domain==='all'?src:src.filter(c=>c.domain===domain);
  const prog=getP();
  const weighted=filtered.map(c=>{
    const score=prog[c.id]||0;
    const dr={'D1':3,'D2':1,'D3':2,'D4':3,'D5':2,'D6':3,'D7':1,'D8':1}[c.domain]||1;
    const br=score<0?2:score===0?1:0;
    return{c,w:dr+br};
  });
  shuffle(weighted);
  weighted.sort((a,b)=>b.w-a.w);
  return weighted.map(x=>x.c);
}

  const newCorrect=shuffled.indexOf(correctText);
  const opts=shuffled.map((o,i)=>'<button class="q-option" id="o'+i+'" onclick="ans('+i+','+newCorrect+',\''+c.id+'\')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('');
  a.innerHTML='<div class="q-card"><div class="q-domain '+dc(c.domain)+'">'+c.domain+'</div><div class="q-text">'+c.question+'</div><div class="q-options">'+opts+'</div><div id="qe" style="display:none" class="q-explanation"></div></div><button class="q-next" id="qn" style="display:none" onclick="nextQ()">Next question →</button>';
  qAnswered=false;
}

function ans(chosen,correct,cid){
  if(qAnswered)return;qAnswered=true;
  const c=deck[idx];const p=getP();const ok=chosen===correct;
  p[cid]=(p[cid]||0)+(ok?1:-1);saveP(p);
  const action=ok?'got':'again';
  syncCard(cid,p[cid],action);
  c.options.forEach((_,i)=>{
    const el=document.getElementById('o'+i);
    if(i===correct)el.className='q-option correct';
    else if(i===chosen&&!ok)el.className='q-option wrong';
    el.disabled=true;
  });
  document.getElementById('qe').textContent=c.explanation;
  document.getElementById('qe').style.display='block';
  document.getElementById('qn').style.display='block';
  upd();
}

function nextQ(){idx++;qAnswered=false;render();}

function renderEnd(a){
  const stats=computeStats();
  const total=stats.got+stats.again;
  const pct=total>0?Math.round((stats.got/total)*100):0;
  a.innerHTML='<div class="session-end"><div class="end-icon">'+(pct>=70?'🎯':'📚')+'</div><div class="end-title">'+(pct>=70?'Deck complete!':'Deck complete \u2014 keep grinding.')+'</div><div class="end-sub">'+stats.got+' of '+total+' correct overall ('+pct+'%).<br>Weak cards surface more next round.</div><button class="restart-btn" onclick="reset()">Go again</button></div>';
  upd();
}

const EDGE_FN='https://qdcfdppcaoffbkjnfvzd.supabase.co/functions/v1/verify-password';

function setAuthCookie(token){
  const expires=new Date(Date.now()+30*864e5).toUTCString();
  document.cookie='cissp_token='+encodeURIComponent(token)+';expires='+expires+';path=/;SameSite=Strict';
}
function getAuthCookie(){
  const m=document.cookie.match(/(?:^|;\s*)cissp_token=([^;]+)/);
  return m?decodeURIComponent(m[1]):null;
}

async function checkAuth(){
  const token=getAuthCookie();
  if(token){
    try{
      const r=await fetch(EDGE_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
      const d=await r.json();
      if(d.valid){unlockApp();return;}
    }catch(e){unlockApp();return;}
  }
  const overlay=document.getElementById('authOverlay');
  overlay.style.display='flex';
  setTimeout(()=>document.getElementById('authInput').focus(),100);
}

async function hashPw(pw){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function submitPassword(){
  const pw=document.getElementById('authInput').value;
  const err=document.getElementById('authError');
  err.textContent='';
  if(!pw)return;
  const btn=document.querySelector('.auth-btn');
  btn.disabled=true;btn.textContent='Checking…';
  try{
    const r=await fetch(EDGE_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json();
    if(d.valid&&d.token){
      hashPw(pw).then(h=>localStorage.setItem('cissp_pw_hash',h));
      setAuthCookie(d.token);
      unlockApp();
    }else{
      err.textContent='Incorrect password.';
      btn.disabled=false;btn.textContent='Unlock';
    }
  }catch(e){
    const stored=localStorage.getItem('cissp_pw_hash');
    if(stored){
      const h=await hashPw(pw);
      if(h===stored){unlockApp();return;}
    }
    err.textContent='No connection. Try again when online.';
    btn.disabled=false;btn.textContent='Unlock';
  }
}

function unlockApp(){
  document.getElementById('authOverlay').style.display='none';
  loadProgress();
}

checkAuth();

// PWA
let _pwaPrompt=null;
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  _pwaPrompt=e;
  if(!sessionStorage.getItem('pwa_dismissed')){
    document.getElementById('pwaBar').classList.add('visible');
  }
});
async function installPWA(){
  if(!_pwaPrompt)return;
  _pwaPrompt.prompt();
  const{outcome}=await _pwaPrompt.userChoice;
  if(outcome==='accepted')_pwaPrompt=null;
  document.getElementById('pwaBar').classList.remove('visible');
}
function dismissPWA(){
  document.getElementById('pwaBar').classList.remove('visible');
  sessionStorage.setItem('pwa_dismissed','1');
}
