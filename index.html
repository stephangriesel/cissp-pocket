<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>CISSP Pocket Trainer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2a2f45;
  --text:#e8eaf0;--muted:#6b7394;--d1:#f7945d;--d2:#9b8cf0;--d3:#5ec8c4;--d4:#f7945d;--d5:#4f8ef7;--d6:#e85d75;--d7:#7fb069;--d8:#c9a227;
  --correct:#3dba7a;--wrong:#e85d75;--accent:#f7c34f;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
nav{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.nav-title{font-size:15px;font-weight:600;letter-spacing:0.3px}
.nav-badge{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
.badge-d1{background:rgba(255,255,255,0.06);color:var(--d1)}.badge-d2{background:rgba(255,255,255,0.06);color:var(--d2)}.badge-d3{background:rgba(255,255,255,0.06);color:var(--d3)}.badge-d4{background:rgba(255,255,255,0.06);color:var(--d4)}.badge-d5{background:rgba(255,255,255,0.06);color:var(--d5)}.badge-d6{background:rgba(255,255,255,0.06);color:var(--d6)}.badge-d7{background:rgba(255,255,255,0.06);color:var(--d7)}.badge-d8{background:rgba(255,255,255,0.06);color:var(--d8)}.badge-all{background:var(--surface2);color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:16px 16px 0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.tab{padding:11px;text-align:center;font-size:13px;font-weight:600;background:var(--surface);color:var(--muted);cursor:pointer;transition:all 0.2s}
.tab.active{background:var(--surface2);color:var(--text)}
.filter-row{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.filter-row::-webkit-scrollbar{display:none}
.filter-btn{flex:0 0 auto;white-space:nowrap;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s}
.filter-btn.active-d1{background:rgba(255,255,255,0.08);color:var(--d1);border-color:var(--d1)}.filter-btn.active-d2{background:rgba(255,255,255,0.08);color:var(--d2);border-color:var(--d2)}.filter-btn.active-d3{background:rgba(255,255,255,0.08);color:var(--d3);border-color:var(--d3)}.filter-btn.active-d4{background:rgba(255,255,255,0.08);color:var(--d4);border-color:var(--d4)}.filter-btn.active-d5{background:rgba(255,255,255,0.08);color:var(--d5);border-color:var(--d5)}.filter-btn.active-d6{background:rgba(255,255,255,0.08);color:var(--d6);border-color:var(--d6)}.filter-btn.active-d7{background:rgba(255,255,255,0.08);color:var(--d7);border-color:var(--d7)}.filter-btn.active-d8{background:rgba(255,255,255,0.08);color:var(--d8);border-color:var(--d8)}
.filter-btn.active-all{background:var(--surface2);color:var(--text);border-color:var(--muted)}
.progress-bar{height:3px;background:var(--border);margin:0 16px}
.progress-fill{height:3px;background:var(--accent);transition:width 0.4s ease;border-radius:2px}
.progress-row{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0}
.progress-label{font-size:11px;color:var(--muted)}
.shuffle-btn{font-size:11px;color:var(--accent);background:none;border:1px solid var(--border);border-radius:6px;padding:2px 8px;cursor:pointer;font-weight:600;letter-spacing:0.3px}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:700;color:var(--text)}.stat-label{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}
.stat-num.green{color:var(--correct)}.stat-num.red{color:var(--wrong)}
.card-area{flex:1;padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}
.flashcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px 20px;min-height:190px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;transition:border-color 0.2s}
.flashcard:active{opacity:0.9}
.card-domain{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.card-domain.d1{color:var(--d1)}.card-domain.d2{color:var(--d2)}.card-domain.d3{color:var(--d3)}.card-domain.d4{color:var(--d4)}.card-domain.d5{color:var(--d5)}.card-domain.d6{color:var(--d6)}.card-domain.d7{color:var(--d7)}.card-domain.d8{color:var(--d8)}
.card-label{font-size:10px;color:var(--muted);letter-spacing:0.5px;margin-bottom:8px;text-transform:uppercase}
.card-text{font-size:15px;line-height:1.6;color:var(--text)}
.card-back{display:none}
.flashcard.flipped .card-front{display:none}
.flashcard.flipped .card-back{display:block}
.flashcard.flipped{border-color:var(--accent)}
.flip-hint{font-size:11px;color:var(--muted);text-align:center}
.rating-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rating-btn{padding:13px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.rating-btn:active{opacity:0.85}
.btn-got-it{background:#1a3d2d;color:var(--correct);border:1px solid var(--correct)}
.btn-again{background:#3d1a24;color:var(--wrong);border:1px solid var(--wrong)}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.q-domain{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.q-domain.d1{color:var(--d1)}.q-domain.d2{color:var(--d2)}.q-domain.d3{color:var(--d3)}.q-domain.d4{color:var(--d4)}.q-domain.d5{color:var(--d5)}.q-domain.d6{color:var(--d6)}.q-domain.d7{color:var(--d7)}.q-domain.d8{color:var(--d8)}
.q-text{font-size:15px;line-height:1.55;margin-bottom:18px;color:var(--text)}
.q-options{display:flex;flex-direction:column;gap:8px}
.q-option{padding:13px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-size:13px;color:var(--text);cursor:pointer;text-align:left;line-height:1.4;transition:all 0.15s;width:100%}
.q-option.correct{background:#1a3d2d;border-color:var(--correct);color:var(--correct)}
.q-option.wrong{background:#3d1a24;border-color:var(--wrong);color:var(--wrong)}
.q-explanation{margin-top:14px;padding:14px;background:var(--surface2);border-radius:10px;font-size:13px;color:var(--muted);line-height:1.55;border-left:3px solid var(--accent)}
.q-next{width:100%;padding:14px;background:var(--accent);color:#0f1117;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
.session-end{text-align:center;padding:40px 20px}
.end-icon{font-size:48px;margin-bottom:16px}
.end-title{font-size:20px;font-weight:700;margin-bottom:8px}
.end-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6}
.restart-btn{padding:15px 32px;background:var(--accent);color:#0f1117;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
#pwaBar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);padding:14px 16px;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,0.4)}
#pwaBar.visible{display:flex}
.pwa-icon{width:40px;height:40px;border-radius:10px;background:#0f1117;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pwa-icon svg{width:24px;height:24px}
.pwa-text{flex:1;min-width:0}
.pwa-title{font-size:13px;font-weight:700;color:var(--text)}
.pwa-sub{font-size:11px;color:var(--muted);margin-top:1px}
.pwa-install{padding:9px 16px;background:var(--accent);color:#0f1117;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.pwa-dismiss{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1}
#authOverlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.auth-box{width:100%;max-width:340px;text-align:center}
.auth-title{font-size:22px;font-weight:700;margin-bottom:8px}
.auth-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.5}
.auth-input{width:100%;padding:14px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;margin-bottom:12px;outline:none;-webkit-appearance:none}
.auth-input:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:14px;background:var(--accent);color:#0f1117;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.auth-error{font-size:13px;color:var(--wrong);margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="authOverlay">
  <div class="auth-box">
    <div class="auth-title">CISSP Pocket Trainer</div>
    <div class="auth-sub">Enter your access password to continue.</div>
    <input class="auth-input" type="password" id="authInput" placeholder="Password" onkeydown="if(event.key==='Enter')submitPassword()">
    <button class="auth-btn" onclick="submitPassword()">Unlock</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>
<div id="pwaBar">
  <div class="pwa-icon">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="96" fill="#0f1117"/><text x="256" y="350" font-family="system-ui,sans-serif" font-size="260" font-weight="700" fill="#f7c34f" text-anchor="middle">C</text></svg>
  </div>
  <div class="pwa-text">
    <div class="pwa-title">CISSP Pocket Trainer</div>
    <div class="pwa-sub">Add to Home Screen for offline access</div>
  </div>
  <button class="pwa-install" onclick="installPWA()">Install</button>
  <button class="pwa-dismiss" onclick="dismissPWA()" aria-label="Dismiss">×</button>
</div>
<nav>
  <div class="nav-title">CISSP Pocket Trainer</div>
  <div style="display:flex;align-items:center;gap:8px">
    <span id="syncBadge" style="font-size:10px;color:var(--muted)">● syncing…</span>
    <div id="navBadge" class="nav-badge badge-all">All Domains</div>
    <button onclick="confirmNewSession()" style="font-size:10px;padding:5px 9px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-weight:600;cursor:pointer">New session</button>
  </div>
</nav>
<div id="timeBar" style="display:flex;justify-content:center;padding:8px 16px 0;font-size:11px;color:var(--muted);letter-spacing:0.3px">
  Total study time: <span id="totalTimeLabel" style="color:var(--accent);font-weight:700;margin-left:4px">0h 0m</span>
</div>
<div class="tabs">
  <div class="tab active" id="tabFlash" onclick="switchMode('flash')">Flashcards</div>
  <div class="tab" id="tabQuiz" onclick="switchMode('quiz')">Quiz</div>
</div>
<div class="filter-row">
  <button class="filter-btn active-all" id="filterAll" onclick="setDomain('all')">All</button>
  <button class="filter-btn" id="filterD1" onclick="setDomain('D1')">D1 — Sec & Risk</button>
  <button class="filter-btn" id="filterD2" onclick="setDomain('D2')">D2 — Asset Sec</button>
  <button class="filter-btn" id="filterD3" onclick="setDomain('D3')">D3 — Sec Arch</button>
  <button class="filter-btn" id="filterD4" onclick="setDomain('D4')">D4 — Comms & Net</button>
  <button class="filter-btn" id="filterD5" onclick="setDomain('D5')">D5 — IAM</button>
  <button class="filter-btn" id="filterD6" onclick="setDomain('D6')">D6 — Assess</button>
  <button class="filter-btn" id="filterD7" onclick="setDomain('D7')">D7 — Sec Ops</button>
  <button class="filter-btn" id="filterD8" onclick="setDomain('D8')">D8 — SW Dev</button>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="progress-row"><div class="progress-label" id="progressLabel">0 / 0</div><button class="shuffle-btn" onclick="reset()">⇄ Shuffle</button></div>
<div class="stats-row">
  <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Cards</div></div>
  <div class="stat-card"><div class="stat-num green" id="statGot">0</div><div class="stat-label">Got it</div></div>
  <div class="stat-card" id="statAgainCard" onclick="showReviewList()" style="cursor:pointer"><div class="stat-num red" id="statAgain">0</div><div class="stat-label">Again (tap to review)</div></div>
</div>
<div class="card-area" id="cardArea"></div>
<script>
const DATA={"flashcards":[{"id":"d5_fc_001","domain":"D5","front":"What does IAAA stand for?","back":"Identification, Authentication, Authorization, and Accountability — the four pillars of access management."},{"id":"d5_fc_002","domain":"D5","front":"What is Type 1 Authentication?","back":"Something you know — passwords, passphrases, PINs. Also called knowledge factors. It is the weakest form of authentication."},{"id":"d5_fc_003","domain":"D5","front":"What is Type 2 Authentication?","back":"Something you have — ID, passport, smart card, token, cookie. Also called possession factors."},{"id":"d5_fc_004","domain":"D5","front":"What is Type 3 Authentication?","back":"Something you are — biometrics such as fingerprint, iris scan, facial geometry. Also called realistic authentication."},{"id":"d5_fc_005","domain":"D5","front":"Does username + password qualify as multi-factor authentication?","back":"No. Both are 'something you know' (Type 1). MFA requires factors from two or more DIFFERENT categories."},{"id":"d5_fc_006","domain":"D5","front":"What is Key Stretching?","back":"Adding 1–2 seconds to password verification to make brute force attacks unfeasible by requiring millions of slow attempts."},{"id":"d5_fc_007","domain":"D5","front":"What is a Salt in password security?","back":"Random data added as input to a one-way hash function. Defends against dictionary attacks and pre-compiled rainbow table attacks."},{"id":"d5_fc_008","domain":"D5","front":"What is a Nonce?","back":"An arbitrary number used only once in an authentication protocol to prevent replay attacks. Also useful as initialization vectors."},{"id":"d5_fc_009","domain":"D5","front":"What are Clipping Levels?","back":"Thresholds that allow a few failed login attempts before locking an account, preventing brute force while not over-burdening admins."},{"id":"d5_fc_010","domain":"D5","front":"What is FRR in biometrics?","back":"False Rejection Rate — Type 1 error. Authorized users are incorrectly rejected. Caused by overly strict sensitivity settings."},{"id":"d5_fc_011","domain":"D5","front":"What is FAR in biometrics?","back":"False Acceptance Rate — Type 2 error. Unauthorized users are incorrectly granted access. This is the more serious error."},{"id":"d5_fc_012","domain":"D5","front":"What is the CER in biometrics?","back":"Crossover Error Rate — the point where FRR and FAR are equal. The optimal balance point for biometric sensitivity settings."},{"id":"d5_fc_013","domain":"D5","front":"Which access control model prioritizes Confidentiality?","back":"MAC (Mandatory Access Control) — uses labels and clearances. Commonly used in military environments."},{"id":"d5_fc_014","domain":"D5","front":"Which access control model prioritizes Availability?","back":"DAC (Discretionary Access Control) — owner assigns access at their discretion. Uses DACLs. Most OS's use this."},{"id":"d5_fc_015","domain":"D5","front":"Which access control model prioritizes Integrity?","back":"RBAC (Role-Based Access Control) — access based on roles/permissions groups. Most commonly used in private organizations."},{"id":"d5_fc_016","domain":"D5","front":"What is ABAC?","back":"Attribute-Based Access Control — grants access based on subject attributes (role, clearance), object attributes (name, owner), AND environmental conditions (location, time). Also called PBAC or CBAC."},{"id":"d5_fc_017","domain":"D5","front":"What is the difference between Context-Based and Content-Based access control?","back":"Context-Based: access controlled by contextual parameters (location, time, access history). Content-Based: access controlled by the attributes or content of the object being accessed."},{"id":"d5_fc_018","domain":"D5","front":"What is HOTP?","back":"HMAC-based One-Time Password — uses a shared secret and an incremental counter. Generates a code when asked; valid until used."},{"id":"d5_fc_019","domain":"D5","front":"What is TOTP?","back":"Time-based One-Time Password — uses a shared secret and time. Codes generated every 30 or 60 seconds. Synchronized clocks are critical."},{"id":"d5_fc_020","domain":"D5","front":"What is the difference between RADIUS and TACACS+?","back":"RADIUS only encrypts the password. TACACS+ encrypts the ENTIRE data package. TACACS+ uses TCP port 49; RADIUS uses UDP 1812 (auth) and 1813 (accounting)."},{"id":"d5_fc_021","domain":"D5","front":"What is Kerberos and what port does it use?","back":"A ticket-based authentication protocol providing mutual authentication over non-secure networks. Uses symmetric keys. UDP port 88. Used in Active Directory."},{"id":"d5_fc_022","domain":"D5","front":"What is Kerberos' main weakness?","back":"Single point of failure — if the KDC is compromised, the attacker gains access to everything that user can access."},{"id":"d5_fc_023","domain":"D5","front":"What is SESAME?","back":"Successor to Kerberos. Uses PKI (asymmetric) encryption instead of symmetric keys. Issues PACs via a PAS instead of tickets. Not widely used."},{"id":"d5_fc_024","domain":"D5","front":"What is the difference between SSO and Super Sign-On?","back":"SSO: one login for multiple systems within an organization. Super Sign-On: one login (e.g. social media account) grants access to many external sites/systems."},{"id":"d5_fc_025","domain":"D5","front":"What is SAML used for?","back":"Security Assertion Markup Language — XML-based standard for exchanging authentication and authorization data. Primary use: web browser SSO."},{"id":"d5_fc_026","domain":"D5","front":"What is JIT Provisioning?","back":"Just-In-Time Provisioning — on first visit to a third-party site, the JIT system verifies the employee and creates their account automatically, most commonly using SAML."},{"id":"d5_fc_027","domain":"D5","front":"What is OpenID Connect (OIDC)?","back":"Adds an identity layer to OAuth 2.0, allowing third-party apps to verify user identity. Enables logging into thousands of sites with a Google or Facebook account."},{"id":"d5_fc_028","domain":"D5","front":"What is the Policy Decision Point (PDP)?","back":"The function that evaluates policies and decides whether access should be granted. Centralizes decision-making for consistent policy application."},{"id":"d5_fc_029","domain":"D5","front":"What is the Policy Enforcement Point (PEP)?","back":"The function that enforces the PDP's decisions. Sits at the point of access (network gateway, database) and blocks non-compliant requests."},{"id":"d5_fc_030","domain":"D5","front":"Why are group/shared accounts never acceptable?","back":"They have zero accountability — you cannot trace an action to a specific individual, which breaks the 'A' in IAAA."},{"id":"d5_fc_031","domain":"D5","front":"What is Privilege/Authorization Creep?","back":"When users accumulate permissions over time (e.g. after transfers) without revoking old access. RBAC with proper role transitions prevents this."},{"id":"d5_fc_032","domain":"D5","front":"What is IDaaS?","back":"Identity as a Service — IAM built, hosted, and managed by a third-party cloud provider. Can provide SSO, FIDM, and password management."},{"id":"d5_fc_033","domain":"D5","front":"What is CHAP and how does it work?","back":"Challenge-Handshake Authentication Protocol — uses a three-way handshake. Shared secret never sent over network. Protects against replay attacks. Used by PPP servers."},{"id":"d5_fc_034","domain":"D5","front":"What is PAP and why is it insecure?","back":"Password Authentication Protocol — sends credentials in plaintext at the start of the connection. One of the oldest protocols; no longer considered secure."},{"id":"d5_fc_035","domain":"D5","front":"What is the minimum recommended password length per DoD/Microsoft guidelines?","back":"14 characters minimum. History: 24 passwords remembered. Max age: 90 days. Min age: 2 days. Never store using reversible encryption."},{"id":"d5_fc_036","domain":"D5","front":"Software tokens on phones — advantages and downsides","back":"Advantage:\n· User-friendly — familiar device, encourages adoption, reduces mistakes\n\nDownsides (exam-relevant):\n· Phone can be LOST — user locked out; attacker may gain access\n· Battery depletion — no charge = no authentication at a critical moment\n· SIM cloning — attacker duplicates the SIM to intercept SMS OTP codes\n· Note: SIM cloning mainly affects SMS-based OTPs, not authenticator apps that generate codes locally (TOTP/HOTP)"},{"id":"d5_fc_037","domain":"D5","front":"Authentication strength — weakest to strongest","back":"Weakest → Strongest:\n1. Shared secrets (security questions, shared passwords) — guessable, social-engineered, shared = exposed\n2. Username + password — phishable, crackable, reused across sites\n3. Token-based (OTP, hardware token) — stronger, but token can be lost/stolen\n4. Biometric — most secure; unique per person, cannot be easily replicated or transferred\n\nKey point: biometrics are 'something you are' (Type 3) and are considered the hardest factor to forge or steal."},{"id":"d5_fc_038","domain":"D5","front":"DAC (Discretionary Access Control) — mechanics and use case","back":"Access is assigned at the DISCRETION of the object's OWNER.\n· Owner can freely add or remove rights for any subject\n· Uses DACLs (Discretionary Access Control Lists) keyed on user identity\n· Default model in most operating systems (Windows, macOS, Linux)\n· Prioritises Availability — most flexible, least restrictive\n· Weakness: owners may grant access too broadly; no central enforcement\n\nContrast: MAC enforces policy centrally; DAC delegates control to owners."},{"id":"d5_fc_039","domain":"D5","front":"MAC (Mandatory Access Control) — labels, clearance, and the dominance rule","back":"Access is driven by LABELS (on objects) and CLEARANCES (on subjects).\n\nObjects → Labels: e.g. Unclassified, Confidential, Secret, Top Secret, Top Secret – Nuclear\nSubjects → Clearance: formal decision based on current and future trustworthiness\n\nDominance rule: subject's clearance must be ≥ object's label to gain access.\nHigher clearance = more thorough background check required.\n\nWhere used: military, intelligence agencies, high-confidentiality environments.\nPrioritises: Confidentiality — most restrictive, central enforcement, owner cannot override."},{"id":"d5_fc_040","domain":"D5","front":"Why stolen password hashes bypass clipping levels","back":"Clipping levels guard the LIVE LOGIN SYSTEM — they count failed attempts on the authentication interface.\n\nOnce an attacker has the hash file, they attack OFFLINE:\n· Copy the hash file\n· Test millions of candidate passwords against the hashes on their own hardware\n· No login attempts = no clipping level triggers\n· No lockouts, no alerts\n\nDefences against offline attacks:\n· Strong hashing algorithm (bcrypt, Argon2 — not MD5/SHA-1)\n· Salting (unique per-user salt makes pre-computation useless)\n· Restrict access to the hash file itself\n\n'Stealing is always easier than decrypting.'"},{"id":"d5_fc_041","domain":"D5","front":"ABAC alternative names and attribute categories","back":"ABAC = Attribute-Based Access Control\nAlso called: PBAC (Policy-Based AC) | CBAC (Claims-Based AC)\n\nThree attribute categories:\n· Subject (user) — name, role, ID, clearance, department\n· Object (resource) — name, owner, date of creation, classification\n· Environment — location, time of access, current threat level\n\nAuthorisation engine evaluates all three → Allow or Deny\n\nStrength: extremely fine-grained and context-aware\nAdoption: ~25% of large enterprises today; expected ~70% within 5 years\nMost powerful but most complex access control model to implement."},{"id":"d5_fc_042","domain":"D5","front":"Identity and access provisioning lifecycle — good vs bad practices","back":"GOOD practices (all should be in a healthy lifecycle):\n· Automated provisioning — assigns/updates/removes rights automatically; scalable, auditable, reduces error\n· Regular access reviews (recertification) — confirm users still need their current rights; catches orphaned accounts and excessive privilege\n· Access certification — validates that rights are appropriate and comply with policy/regulation\n\nBAD practice:\n· Manual provisioning — inefficient, error-prone, cannot scale, lacks automatic audit trails\n\nKey exam point: manual provisioning is the one that does NOT belong."},{"id":"d5_fc_043","domain":"D5","front":"IAM (Identity and Access Management) — definition and scope","back":"IAM is the security principle and framework that ensures:\n· Every user has a UNIQUE IDENTIFIER\n· Users must be AUTHENTICATED before accessing a system or network\n· Access privileges are managed based on roles and need-to-know\n· Access is granted or denied under defined conditions\n\nCore concepts:\n· Identity = representation of an entity (person, service, device) in the system\n· Authentication = verifying who the entity claims to be\n· Authorisation = determining what the authenticated entity is allowed to do\n· IAM ≠ Least Privilege (that governs HOW MUCH access) or SSO (that centralises login)"},{"id":"d5_fc_044","domain":"D5","front":"Kerberos KDC structure — AS and TGS roles","back":"KDC (Key Distribution Center): the central trusted authority in Kerberos.\nContains two logical components:\n\nAS (Authentication Server):\n· Receives the initial TGT request (step 1 — plaintext user ID only)\n· Returns a session key encrypted with the user's secret key + TGT encrypted with TGS secret key (step 2)\n· Does the initial identity verification\n\nTGS (Ticket Granting Server):\n· Receives TGT + service request (step 3)\n· Issues service-specific client-to-server tickets (step 4)\n· Allows users to access services without re-entering their password\n\nKey risk: KDC is a single point of failure — compromise = full access."},{"id":"d5_fc_045","domain":"D5","front":"Kerberos 6-step authentication flow","back":"1. Client → AS: sends plaintext user ID only (no password)\n2. AS → Client: session key (encrypted with user's secret key) + TGT (encrypted with TGS secret key)\n3. Client → TGS: TGT + service request (encrypted with client/TGS session key)\n4. TGS → Client: client-to-server ticket (encrypted with server's secret key) + session key (encrypted with client/TGS session key)\n5. Client → Server: client/session key (encrypted with client/TGS key) + authenticator (encrypted with client/server session key)\n6. Server → Client: timestamp (encrypted with client/server session key) → proves mutual authentication\n\nKey facts:\n· Password never sent over the network\n· Timestamps prevent replay attacks\n· Port 88 (UDP/TCP)"},{"id":"d5_fc_046","domain":"D5","front":"RADIUS — primary function and what it is NOT","back":"RADIUS = Remote Authentication Dial-In User Service\nPrimary function: centralised AAA (Authentication, Authorisation, Accounting) for remote users.\n\n· Authentication — verifies who the user is\n· Authorisation — determines what the user can access\n· Accounting — tracks session start/stop, data usage, duration\n\nWhat RADIUS is NOT:\n· Not a full traffic encryptor — only encrypts the password (TACACS+ encrypts the full packet)\n· Not a network monitor — accounting ≠ full NPMD monitoring\n· Not a credential store — authenticates against a separate database/directory\n\nPorts: UDP 1812 (auth) / 1813 (accounting)"},{"id":"d5_fc_047","domain":"D5","front":"SIEM — Security Information and Event Management","back":"SIEM: centralised platform that collects, aggregates, correlates, and analyses log data from across an organisation's IT infrastructure.\n\nKey capabilities:\n· Log aggregation — pulls logs from servers, firewalls, endpoints, applications\n· Correlation — links events across systems to identify patterns\n· Real-time alerting — prioritised security alerts, reducing manual review\n· Compliance reporting — automated audit trails\n\nWhy it matters: in large organisations, manual log review becomes impossible. SIEM automates this.\n\nContrast:\n· IDS — detects threats, logs events; no log management across systems\n· IPS — detects and blocks; not a log management tool"},{"id":"d5_fc_048","domain":"D5","front":"Active Directory trust types — recognised vs non-existent","back":"Recognised AD trust types:\n· One-way trust — Domain A trusts Domain B's users, but not vice versa\n· Transitive trust — automatically extends to all domains that either domain trusts (default within an AD forest)\n· Intransitive trust — exists only between two specific domains; does not extend further\n· Two-way trust — bidirectional; both domains trust each other's users\n\nNOT a real AD trust type:\n· Reflective trust — this does not exist in AD\n\nExam tip: if asked which is NOT an AD trust, the answer is 'Reflective trust.'"},{"id":"d5_fc_049","domain":"D5","front":"Smart card types — magnetic stripe vs contact vs contactless","back":"Magnetic stripe card:\n· Swiped through a reader\n· Data stored in the stripe on the back\n· Easy to clone; lower security\n\nContact smart card:\n· Inserted into a reader slot\n· Chip makes physical electrical contact with the reader\n· Higher security than magnetic stripe\n\nContactless card (RFID/NFC):\n· Tapped or waved near a reader; no insertion or swipe\n· Uses radio-frequency communication\n· Convenient but must be shielded against skimming\n\nExam tip: 'swiped' = magnetic stripe; 'inserted' = contact; 'tapped/waved' = contactless."},{"id":"d5_fc_050","domain":"D5","front":"Non-repudiation — ensuring accountability","back":"Non-repudiation: a security service that ensures an entity CANNOT DENY having performed an action.\n\nImplemented through:\n· Digital signatures — mathematical proof linking a specific private key (person) to a message or transaction\n· Audit logs with integrity protection — tamper-evident records of who did what and when\n\nIn the IAAA model:\n· Identification — username (who claims to be)\n· Authentication — password/biometric (proving the claim)\n· Authorisation — RBAC/MAC/DAC (what they can do)\n· Accountability — non-repudiation (proof they did it)\n\nNote: usernames and passwords alone do NOT provide non-repudiation — they can be shared or stolen."},{"id":"d5_fc_051","domain":"D5","front":"Type 3 biometrics — the credential you cannot reissue","back":"Type 3 (something you are) uses permanent physical/behavioural characteristics:\nFingerprints · iris patterns · facial geometry · voice · retina · vein patterns\n\nWhy Type 3 is the WORST to compromise:\n· Type 1 (something you know) — reset the password\n· Type 2 (something you have) — replace the token or card\n· Type 3 — you cannot issue someone a new fingerprint\n\nConsequence: biometric templates must be stored with extreme care. If a template database is breached, all affected users are permanently compromised for that biometric modality.\n\nThis is why some systems use biometrics only locally on-device rather than storing templates server-side."},{"id":"d6_fc_001","domain":"D6","front":"What is the difference between a Security Assessment and a Security Audit?","back":"Assessment: broad scope, full picture of control effectiveness — can include pen tests, vuln assessments, policy review. Audit: a test against a PUBLISHED STANDARD (e.g. SOC2, PCI-DSS, HIPAA)."},{"id":"d6_fc_002","domain":"D6","front":"What are the three types of audits?","back":"Unstructured (internal): internal auditors find flaws before external audit. External: outside company audits controls. Structured/3rd Party: validates compliance for a regulatory body."},{"id":"d6_fc_003","domain":"D6","front":"What is SOC 1?","back":"Focuses on controls relevant to financial reporting. For internal use. Type I: design effectiveness at a single point in time. Type II: design AND operating effectiveness over minimum 6 months."},{"id":"d6_fc_004","domain":"D6","front":"What is SOC 2?","back":"Assesses internal controls for compliance and operations. Must meet AICPA trust service criteria: Security, Availability, Processing Integrity, Confidentiality, Privacy. Type I (point in time) vs Type II (6+ months)."},{"id":"d6_fc_005","domain":"D6","front":"What is SOC 3?","back":"Similar to SOC 2 but generalized and publicly available. Includes only the auditor's opinion and limited control description. Covers the same trust service principles as SOC 2."},{"id":"d6_fc_006","domain":"D6","front":"What type of control is reviewing audit logs?","back":"Primarily a DETECTIVE control — it identifies that something happened after the fact, rather than preventing it."},{"id":"d6_fc_007","domain":"D6","front":"What are the 5 problems with audit record management?","back":"1) Logs not reviewed regularly. 2) Not stored long enough. 3) Not standardized/viewable by correlation tools. 4) Entries not prioritized. 5) Only reviewed for bad stuff."},{"id":"d6_fc_008","domain":"D6","front":"In cloud auditing, who is ultimately responsible for data protection?","back":"The ORGANIZATION (customer) — regardless of the cloud provider's fault in case of a breach. The cloud provider does not take on that responsibility."},{"id":"d6_fc_009","domain":"D6","front":"What is the Shared Responsibility Model in cloud auditing?","back":"The cloud provider and customer share security responsibilities, with the split depending on the service model: IaaS (customer does most), PaaS (shared), SaaS (provider does most)."},{"id":"d6_fc_010","domain":"D6","front":"What is Static Testing?","back":"Passively testing code WITHOUT running it — walkthroughs, syntax checking, code reviews. Looks at raw source code for known insecure practices."},{"id":"d6_fc_011","domain":"D6","front":"What is Dynamic Testing?","back":"Actively testing code WHILE EXECUTING it. Can uncover flaws in the implementation and interaction of code that static analysis misses."},{"id":"d6_fc_012","domain":"D6","front":"What is Fuzzing (Fuzz Testing)?","back":"Black box testing that submits random, malformed data as inputs into software to determine if it crashes or enters an unpredictable state."},{"id":"d6_fc_013","domain":"D6","front":"What is Penetration Testing and who sets the goals?","back":"Authorized simulated attack to find security weaknesses. SENIOR MANAGEMENT sets the goals and must sign off. Pen testers document vulnerabilities — they do NOT fix them."},{"id":"d6_fc_014","domain":"D6","front":"What is a SOW in the context of pen testing?","back":"Statement of Work — defines the rules of engagement: IP ranges, time frames, tools, POC, what to test. Must be confirmed with legal team before engaging pen testers."},{"id":"d6_fc_015","domain":"D6","front":"What is Black Box pen testing?","back":"Zero Knowledge — attacker has no information about the organization other than publicly available data. Simulates an external attacker."},{"id":"d6_fc_016","domain":"D6","front":"What is White Box pen testing?","back":"Full Knowledge (Crystal/Clear Box) — attacker has full internal network knowledge and access, like a privileged employee or admin. Most comprehensive test."},{"id":"d6_fc_017","domain":"D6","front":"What is Grey Box pen testing?","back":"Partial Knowledge — attacker has limited knowledge, similar to a normal user, vendor, or someone with basic environment access."},{"id":"d6_fc_018","domain":"D6","front":"What is the pen testing process in order?","back":"Planning > Reconnaissance > Scanning/Enumeration > Vulnerability Assessment > Exploitation > Reporting. (Also: Discovery > Gaining Access > Escalate Privileges > System Browsing > Install Additional Tools > Report)"},{"id":"d6_fc_019","domain":"D6","front":"What is Breach and Attack Simulation (BAS)?","back":"Automated tools that simulate complex cyberattacks continuously (24/7/365) across all attack vectors. Combines red and blue team approaches (purple teaming)."},{"id":"d6_fc_020","domain":"D6","front":"What is the formula for Risk?","back":"Risk = Threat × Vulnerability. Vulnerability scanning shows the vulnerability half; pen testing matches vulnerabilities to threats to show actual risk."},{"id":"d6_fc_021","domain":"D6","front":"What is the difference between White Hat, Black Hat, and Grey Hat hackers?","back":"White Hat: professional pen testers/ethical hackers — find flaws to fix. Black Hat: malicious hackers who exploit flaws (crackers). Grey Hat: somewhere between — may find flaws but not always with permission."},{"id":"d6_fc_022","domain":"D6","front":"What is Social Engineering?","back":"Using people skills to bypass security controls. Common techniques: Authority, Intimidation, Consensus, Scarcity, Urgency, Familiarity."},{"id":"d6_fc_023","domain":"D6","front":"What is Regression Testing?","back":"Finding defects after a major code change — looks for software regressions, including old bugs that have come back after a change."},{"id":"d6_fc_024","domain":"D6","front":"What is the Requirements Traceability Matrix (RTM)?","back":"A table that maps customer requirements to the testing plan using a many-to-many relationship. Ensures all requirements are covered in testing."},{"id":"d6_fc_025","domain":"D6","front":"What is Misuse Case Testing?","back":"Executing a malicious act against a system to test it. Attackers don't behave like normal users, so we must test for misuse scenarios."},{"id":"d6_fc_026","domain":"D6","front":"What is Test Coverage Analysis?","back":"Identifies what percentage of the code was tested relative to the entire application. Ensures no significant gaps that could hide bugs or security issues."},{"id":"d6_fc_027","domain":"D6","front":"What is War Driving?","back":"Driving or walking around mapping wireless access points and attempting to gain access to them. Used in wireless penetration testing."},{"id":"d6_fc_028","domain":"D6","front":"What is Ethical Disclosure?","back":"When discovering an unknown vulnerability during testing, the ethical obligation is to: put in compensating controls, notify the vendor, and give them time to patch before public disclosure."},{"id":"d6_fc_029","domain":"D6","front":"What is Unit Testing?","back":"Tests that verify the functionality of a specific section of code. In OOP, usually at the class level. Typically written by developers (white-box)."},{"id":"d6_fc_030","domain":"D6","front":"What is Integration Testing?","back":"Verifies interfaces between components against a software design. Exposes defects in interactions between integrated modules. Tests progressively larger groups of components."},{"id":"d6_fc_031","domain":"D6","front":"What is Synthetic Monitoring?","back":"Building scripts or tools that simulate normal user activity in an application to continuously test and monitor performance and behaviour."},{"id":"d6_fc_032","domain":"D6","front":"What are the AICPA Trust Service Criteria for SOC 2?","back":"Security, Availability, Processing Integrity, Confidentiality, and Privacy — all five must be addressed in a SOC 2 audit."},{"id":"d6_fc_033","domain":"D6","front":"What is the difference between SOC 2 Type I and Type II?","back":"Type I: tests the SUITABILITY OF DESIGN of controls at a single point in time. Type II: tests design AND OPERATING EFFECTIVENESS over a period (minimum 6 months). Type I = snapshot, Type II = movie."},{"id":"d6_fc_034","domain":"D6","front":"What is Misuse Case Testing and why do we need it?","back":"Testing the system from an ATTACKER's perspective rather than a normal user's. Needed because attackers do not behave like normal users — standard use-case/interface testing won't catch abuse scenarios."},{"id":"d6_fc_035","domain":"D6","front":"Gray Hat vs White Hat — what's the key difference when a vulnerability is found?","back":"White Hat: has PERMISSION, fixes/reports through proper channels. Gray Hat: NO permission, but discloses to the company anyway (sometimes before publishing or for a fee) rather than exploiting maliciously like Black Hat."},{"id":"d6_fc_036","domain":"D6","front":"Which audit log management practice is GOOD (not a problem)?","back":"Logs reviewed regularly and in a timely fashion. The common PROBLEMS are: not reviewed regularly, not retained long enough, and not standardized for SIEM ingestion."},{"id":"d6_fc_037","domain":"D6","front":"What does Component Interface Testing check, specifically?","back":"DATA HANDLING as it passes BETWEEN two units/subsystems — narrower than full Integration Testing, broader than single-unit Unit Testing."},{"id":"d6_fc_038","domain":"D6","front":"Unit Testing vs Component Interface Testing vs Interface Testing — what's the scope of each?","back":"Unit Testing: ONE section/function of code in isolation. Component Interface Testing: data passed BETWEEN units. Interface Testing: ALL exposed interfaces of the finished application (APIs, UI, services)."},{"id":"d6_fc_039","domain":"D6","front":"White Box, Clear Box, and Crystal Box — how are these three terms related?","back":"They are SYNONYMS. All three describe a pen test where the tester has full admin-level knowledge of the organization's systems and infrastructure."},{"id":"d6_fc_040","domain":"D6","front":"After the 'System Browsing' phase of a pen test, where can the tester go next?","back":"Install Additional Tools (to dig deeper) OR back to Discovery (to revise strategy based on what was found). NOT 'Escalate Privileges' or 'Gaining Access' — those typically come BEFORE system browsing."},{"id":"d6_fc_041","domain":"D6","front":"Structured vs Unstructured audit — who performs each, and when?","back":"Unstructured: INTERNAL auditors, informal, done BEFORE the formal audit to catch issues early. Structured: EXTERNAL auditors, formal, independent, well-defined scope/objectives/methodology."},{"id":"d1_fc_001","domain":"D1","front":"What does the CIA Triad stand for, and what is its opposite?","back":"Confidentiality, Integrity, Availability. The opposite is DAD — Disclosure, Alteration, Destruction. Security is about finding the right BALANCE of the three for your organization."},{"id":"d1_fc_002","domain":"D1","front":"What controls/threats relate to Confidentiality?","back":"Use: encryption (AES256), secure transport (TLS/IPSEC), MFA, masking, least privilege, need-to-know. Threats: cryptanalysis, social engineering, keyloggers, steganography, IoT backdoors."},{"id":"d1_fc_004","domain":"D1","front":"Least Privilege vs. Need to Know","back":"Least Privilege = give the minimum access needed, no more, no less. Need to Know = even if you HAVE access, you shouldn't access data unless you have a valid reason to know it."},{"id":"d1_fc_005","domain":"D1","front":"What is Non-repudiation, and what two things does it rely on?","back":"A user cannot deny having performed an action. It uses both Authentication and Integrity."},{"id":"d1_fc_006","domain":"D1","front":"Subject vs. Object","back":"Subject = active (usually a user or program) that manipulates. Object = passive data (paper or digital) that is manipulated. A program can be both at different times."},{"id":"d1_fc_007","domain":"D1","front":"Governance vs. Management","back":"Governance = C-level executives set direction, objectives, and risk appetite (aggressive/neutral/adverse) — 'not you'. Management = plans, builds, runs, monitors to reach those objectives, works with risk tolerance — 'this is you'."},{"id":"d1_fc_008","domain":"D1","front":"In a top-down security organization, who is ULTIMATELY liable for security?","back":"Senior Leadership / Senior Management. You may also be liable depending on Due Care, but ultimate liability rests at the top. (The exam assumes top-down security.)"},{"id":"d1_fc_009","domain":"D1","front":"Due Diligence vs. Due Care","back":"Due Diligence = the research (best practices, evaluating new systems before implementing). Due Care = the prudent-person action (implementing, patching, fixing). Negligence is the opposite of Due Care; proving Due Care usually means you're not liable."},{"id":"d1_fc_010","domain":"D1","front":"Name the types of law tested on the CISSP (Criminal, Civil, Administrative).","back":"Criminal: society is victim, 'beyond reasonable doubt', punish/deter. Civil (Tort): individuals/orgs are victims, 'preponderance of proof', compensate victim. Administrative (Regulatory): laws by govt agencies (HIPAA, FDA)."},{"id":"d1_fc_011","domain":"D1","front":"What are the types of evidence (Real, Direct, Hearsay)?","back":"Real = tangible physical objects (the hard disk, NOT the data on it). Direct = firsthand witness testimony (5 senses). Hearsay = not firsthand knowledge (log files were traditionally hearsay), normally inadmissible."},{"id":"d1_fc_012","domain":"D1","front":"What is the Best Evidence Rule?","back":"Courts prefer the best evidence possible. Evidence should be accurate, complete, relevant, authentic, and convincing."},{"id":"d1_fc_013","domain":"D1","front":"What is Chain of Custody and what does it answer?","back":"Proves the integrity of evidence — that no tampering occurred. Answers: Who handled it? When? What did they do with it? Where did they handle it?"},{"id":"d1_fc_014","domain":"D1","front":"How do we protect evidence integrity in forensics?","back":"Use hashes. All forensics is done on COPIES, never the originals. Check the hash on both original and copy before AND after the forensics."},{"id":"d1_fc_015","domain":"D1","front":"Entrapment vs. Enticement","back":"Entrapment (illegal/unethical): persuading someone to commit a crime they had no intention of committing. Enticement (legal/ethical): making a crime more enticing to someone who has ALREADY decided to break the law. Honeypots use enticement."},{"id":"d1_fc_016","domain":"D1","front":"Copyright, Trademark, Patent, Trade Secret — durations and what they protect.","back":"Copyright: books/art/music/software, life+70yrs (or 95yrs corporate), automatic. Trademark: brand names/logos, 10yrs renewable indefinitely. Patent: inventions, 20yrs, must be novel/useful/nonobvious. Trade Secret: no protection if discovered."},{"id":"d1_fc_017","domain":"D1","front":"What is the (ISC)² Code of Ethics — the four canons in order?","back":"1) Protect society, the common good, necessary public trust and confidence, and the infrastructure. 2) Act honorably, honestly, justly, responsibly, and legally. 3) Provide diligent and competent service to principals. 4) Advance and protect the profession."},{"id":"d1_fc_018","domain":"D1","front":"How are the (ISC)² canons applied if two conflict?","back":"They are applied in ORDER — the canons are listed in priority order. Canon 1 (protect society) takes precedence over the others. There are only four mandatory canons."},{"id":"d1_fc_019","domain":"D1","front":"What is the GDPR data breach notification window, and the max fine?","back":"Breach notification within 72 hours. Max fine: €20 million OR 4% of annual worldwide turnover, whichever is GREATER. Applies to anyone with EU/EEA customers regardless of where based."},{"id":"d1_fc_020","domain":"D1","front":"Name three GDPR data subject rights.","back":"Right to access (free copy of their data), Right to erasure ('right to be forgotten'), Data portability (electronic format). Also: privacy by design, data protection officers, 72hr breach notification."},{"id":"d1_fc_021","domain":"D1","front":"What is the Wassenaar Arrangement?","back":"Export/import controls for conventional arms and dual-use goods/technologies. Cryptography is considered 'dual-use'. 41 countries. It's the organization's responsibility to know what's permitted to import/export to a country."},{"id":"d1_fc_022","domain":"D1","front":"Policies, Standards, Guidelines, Procedures, Baselines — which are mandatory?","back":"Mandatory: Policies (high-level), Standards (specific tech), Procedures (step-by-step), Baselines (minimum benchmarks). NON-mandatory: Guidelines (recommendations/suggestions)."},{"id":"d1_fc_023","domain":"D1","front":"Awareness vs. Training","back":"Awareness = changes user BEHAVIOR (this is what we want). Training = provides a skillset (nice, but useless if knowledge is ignored). Users often pose the largest security risk."},{"id":"d1_fc_024","domain":"D1","front":"Name the six Access Control TYPES.","back":"Preventative (stop it — IPS, encryption), Detective (find it — IDS, CCTV), Corrective (fix it — patches), Recovery (recover — backups, DR), Deterrent (discourage — fences, signs), Compensating (alternative when others are impractical)."},{"id":"d1_fc_025","domain":"D1","front":"Name the three Access Control CATEGORIES.","back":"Administrative (Directive): policies, procedures, training. Technical: hardware/software/firmware (firewalls, encryption). Physical: locks, fences, guards, dogs."},{"id":"d1_fc_026","domain":"D1","front":"What is the formula for Risk? And for Total Risk and Residual Risk?","back":"Risk = Threat × Vulnerability. Total Risk = Threat × Vulnerability × Asset Value. Residual Risk = Total Risk − Countermeasures."},{"id":"d1_fc_027","domain":"D1","front":"Qualitative vs. Quantitative Risk Analysis","back":"Qualitative = 'quality', how likely & how bad (subjective, no $). Quantitative = 'quantity', actual cost in $ (fact-based, math). Normal flow: do qualitative first, then quantitative on the high/extreme items."},{"id":"d1_fc_028","domain":"D1","front":"Define AV, EF, SLE, ARO, and ALE.","back":"AV = Asset Value. EF = Exposure Factor (% lost). SLE = Single Loss Expectancy = AV × EF. ARO = Annual Rate of Occurrence. ALE = Annualized Loss Expectancy = SLE × ARO (cost per year if you do nothing)."},{"id":"d1_fc_029","domain":"D1","front":"What are the types of risk responses? Which is never acceptable?","back":"Accept, Mitigate (Reduce), Transfer (insurance), Avoid. Risk REJECTION (ignoring a known risk) is NEVER acceptable — you are liable. Secondary Risk = mitigating one risk opens another."},{"id":"d1_fc_030","domain":"D1","front":"When is mitigation worth implementing (ROI)?","back":"When TCO (Total Cost of Ownership of the mitigation) < ALE (the annual loss from doing nothing). If the countermeasure costs less than the loss it prevents, it makes fiscal sense."},{"id":"d1_fc_031","domain":"D1","front":"KGI vs. KPI vs. KRI","back":"KGI = Key Goal Indicator (did we achieve the requirement, after the fact). KPI = Key Performance Indicator (how well the process is performing). KRI = Key Risk Indicator (early warning of increasing risk exposure; tied to risk appetite)."},{"id":"d1_fc_032","domain":"D1","front":"What does RACI stand for?","back":"Responsible (does the work), Accountable (ultimately answerable, only ONE), Consulted (two-way communication, provides input), Informed (one-way communication, kept updated)."},{"id":"d1_fc_033","domain":"D1","front":"BCP vs. DRP","back":"BCP (Business Continuity Plan) = long-term, for the ENTIRE organization, the 'what', non-system-specific. DRP (Disaster Recovery Plan) = short-term, focuses on IT systems, the 'how', system-specific. DRP is a SUBSET of the BCP."},{"id":"d1_fc_034","domain":"D1","front":"Define RPO, MTD, RTO, and WRT.","back":"RPO = acceptable amount of data that can't be recovered (data loss). MTD = Maximum Tolerable Downtime, and MTD ≥ RTO + WRT. RTO = time to restore the system (hardware). WRT = Work Recovery Time (configure recovered system / software)."},{"id":"d1_fc_035","domain":"D1","front":"MTBF vs. MTTR","back":"MTBF (Mean Time Between Failures) = how long a system/component functions on average before failing (plan for spares). MTTR (Mean Time to Repair) = how long to recover a failed system."},{"id":"d1_fc_036","domain":"D1","front":"What governance frameworks map to: IT goals, whole-org goals, IT service management?","back":"COBIT = goals for IT (stakeholder needs → IT goals). COSO = goals for the entire organization. ITIL = IT Service Management (ITSM)."},{"id":"d1_fc_037","domain":"D1","front":"What is Defense in Depth?","back":"Also called Layered or Onion Defense. Multiple overlapping security controls protect an asset — both physical and logical. No single control secures an asset. Improves CIA across the organization."},{"id":"d1_fc_038","domain":"D1","front":"Hearsay and log files — what changed?","back":"Computer-generated records (like log files) were traditionally considered hearsay and inadmissible, but case law and Federal Rule of Evidence 803 made business-activity records admissible if kept in the regular course of business."},{"id":"d1_fc_039","domain":"D1","front":"What is the NIST 800-30 first step in its 9-step risk process?","back":"System Characterization — define the risk management scope, boundaries, and system/data sensitivity. (NIST 800-30 is a 9-step risk management process.)"},{"id":"d1_fc_040","domain":"D1","front":"What are External Dependencies in a BIA, and why do they matter?","back":"Third-party services, suppliers, and resources needed for normal operations (cloud providers, ISPs, raw materials). Interruptions can cascade. JIT ordering of critical supplies can be risky (e.g. COVID-19). Manage with dependency mapping, contingency plans, and SLAs."},{"id":"d2_fc_001","domain":"D2","front":"What are the four stages of the Information Life Cycle?","back":"Data Acquisition, Data Use, Data Archival, Data Disposal. CIA must be maintained throughout."},{"id":"d2_fc_002","domain":"D2","front":"Labels vs. Clearance","back":"Labels are assigned to OBJECTS (e.g. 'Top Secret – Nuclear'). Clearance is assigned to SUBJECTS — a formal decision on current and future trustworthiness. Higher clearance = more in-depth background checks."},{"id":"d2_fc_003","domain":"D2","front":"What is required (besides clearance) to access classified data?","back":"Formal Access Approval (a document from the data owner) AND appropriate Security Clearance AND a valid Need to Know. The subject must understand the requirements and liability."},{"id":"d2_fc_004","domain":"D2","front":"What are the three states of data, and how is each protected?","back":"At Rest (disks/tapes/USB → encryption). In Motion (network transfer → encrypt traffic, end-to-end). In Use (actively used, can't be encrypted → clean desk, no shoulder surfing, screen locks, privacy screens)."},{"id":"d2_fc_005","domain":"D2","front":"Data/information owner vs. Data custodian","back":"Data owner = management level, assigns sensitivity labels and backup frequency. Data custodian = technical hands-on staff who do backups, restores, patches, config — following the data owner's directions."},{"id":"d2_fc_006","domain":"D2","front":"Data controller vs. Data processor","back":"Controllers create and manage the sensitive data (HR/Payroll). Processors manage the data on behalf of controllers (e.g. outsourced payroll)."},{"id":"d2_fc_007","domain":"D2","front":"What is Data Remanence?","back":"Data left over after normal removal and deletion of data. Deleting/formatting doesn't truly remove data — it's recoverable until overwritten."},{"id":"d2_fc_008","domain":"D2","front":"ROM vs. RAM (volatile or not?)","back":"ROM = non-volatile, retains memory after power loss (e.g. BIOS). RAM = volatile, loses content on power loss. SRAM (fast, latches/flip-flops, no refresh) vs. DRAM (slower, capacitors, must be refreshed)."},{"id":"d2_fc_009","domain":"D2","front":"Clear vs. Purge vs. Sanitization (data destruction)","back":"Clear (Overwrite) = writing 0s/random data over the data. Sanitization = rendering data infeasible to recover for a given effort level. Purge = removing data so recovery is infeasible even in a lab environment."},{"id":"d2_fc_010","domain":"D2","front":"How do you destroy data on an SSD? Why not degaussing?","back":"SSDs are EEPROM + DRAM and CANNOT be degaussed (no magnetic media). Use ATA Secure Erase and/or physical destruction. Degaussing only works on magnetic media (tapes, spinning disks)."},{"id":"d2_fc_011","domain":"D2","front":"Scoping vs. Tailoring","back":"Scoping = determining which PORTION of a standard applies to your org (what's in/out of scope). Tailoring = CUSTOMIZING a standard to your org (e.g. applying it but with stronger AES-256 encryption)."},{"id":"d2_fc_012","domain":"D2","front":"Certification vs. Accreditation","back":"Certification = the system & its controls meet the security requirements set by the data owner/regulations. Accreditation = the data owner ACCEPTS the certification and residual risk — required before production."},{"id":"d2_fc_013","domain":"D2","front":"What is a CASB (Cloud Access Security Broker)?","back":"On-prem or cloud software between users and cloud apps. Monitors user activity, warns of malicious actions, prevents malware, protects against shadow IT, enforces security policy compliance."},{"id":"d2_fc_014","domain":"D2","front":"What is DLP and what does it protect?","back":"Data Loss Prevention. Distinguishes loss vs. leak. Protects data in use, in motion, and at rest. Can be network-based or endpoint DLP."},{"id":"d2_fc_015","domain":"D2","front":"What is the data retention rule of thumb?","back":"Keep data no longer than its period of usefulness OR the legal requirement, whichever is GREATER. Regulations (HIPAA, PCI-DSS) may dictate specific retention. Know your retention requirements."},{"id":"d2_fc_016","domain":"D2","front":"Attacks by data state — at rest, in motion, in use","back":"Data at rest (stored on disk/tape/USB):\n· Theft of physical media\n· Cryptanalysis against stored encrypted data\n· Protections: encryption (AES-256), degaussing, physical security\n\nData in motion (travelling across a network):\n· Eavesdropping / packet sniffing\n· Man-in-the-Middle (MitM) attacks\n· Protections: TLS/HTTPS, VPN, IPSec, end-to-end encryption\n\nData in use (being viewed/processed on a device):\n· Shoulder surfing — someone physically observing the screen\n· Screen scraping / keylogging malware\n· Protections: privacy screens, clean desk policy, screen locks, least privilege\n\nNote: data in use cannot be encrypted while displayed — only physical and access controls work."},{"id":"d2_fc_017","domain":"D2","front":"Why internal network traffic also needs encryption","back":"Common mistake: encrypt only internet-bound traffic, leave internal traffic in plaintext.\n\nRisk: if an attacker gains access to the internal network (via phishing, insider threat, or compromised host), they can:\n· Capture any unencrypted traffic between servers\n· Read database queries, credentials, patient records, financial data\n\nSolution: assume breach — treat the internal network as untrusted.\n· Encrypt server-to-server traffic (mTLS, TLS inside the LAN)\n· Segment the network (zero-trust architecture)\n· Encrypt database connections, API calls, and internal APIs\n\nKey exam point: intercepted internal traffic = data in motion vulnerability — not a data-at-rest or clean-desk issue."},{"id":"d2_fc_018","domain":"D2","front":"Records retention policy — primary driver and key considerations","back":"Primary driver: LEGAL REQUIREMENTS — laws and regulations dictate minimum retention periods.\n· HIPAA: 6 years for health information\n· PCI-DSS: 1 year for cardholder data logs\n· SOX: 7 years for financial records\n· GDPR: data minimisation — keep no longer than needed\n\nRule of thumb (d2_fc_015): retain for the period of usefulness OR the legal requirement, whichever is GREATER.\n\nSecondary considerations:\n· Storage cost — manageable with modern digital storage; never overrides legal obligation\n· Sensitivity — affects storage method and destruction process, not duration\n· Future access likelihood — pragmatic but does not override legal mandates\n\nExam tip: 'most important factor' = legal requirements. Everything else is secondary."},{"id":"d2_fc_019","domain":"D2","front":"Data classification hierarchy — lowest to highest","back":"Commercial / private sector (common):\nPublic → Internal / Sensitive → Confidential → Restricted / Highly Confidential\n\nGovernment / military:\nUnclassified → Confidential → Secret → Top Secret (and compartments, e.g. TS-SCI)\n\nLowest: Public — freely shareable, no negative consequences if disclosed, no special protection needed.\nHighest: Top Secret / TS — grave or exceptionally grave consequences if disclosed; access severely restricted.\n\nKey rule for classification: determined by SENSITIVITY (impact of disclosure), not volume or age of data.\n\nExam tip: 'lowest classification' = Public. 'Highest' = Top Secret. Classification level drives access controls, handling, and destruction requirements."},{"id":"d2_fc_020","domain":"D2","front":"Mission/business owner vs system owner — roles and level","back":"Mission/business owner:\n· Level: Senior executive\n· Responsibility: Creates and owns the POLICIES that govern data security across the organisation\n· Operates at the governance level — sets the rules everyone else follows\n\nSystem owner:\n· Level: Management\n· Responsibility: Owns the SYSTEMS (hardware, software, infrastructure) that house the data\n· Typical roles: data center manager, infrastructure manager\n· Distinct from the data owner (who classifies data) and the custodian (who does the technical work)\n\nKey distinction: mission owner = policies; system owner = platforms; data owner = data labels + backup frequency; custodian = hands-on execution."},{"id":"d2_fc_021","domain":"D2","front":"Data custodian — what they DO vs what they DON'T do","back":"DO (operational / technical):\n· Perform backups and restores\n· Apply patches and system updates\n· Configure systems per data owner instructions\n· Ensure data integrity during storage and transmission\n· Maintain data availability for authorised users\n· Follow the directions of the data/information owner\n\nDO NOT:\n· Design or define organisation-wide security controls (→ security officers / IT security team)\n· Set data access policies (→ business/mission owner)\n· Assign sensitivity labels or backup frequency (→ data/information owner)\n· Make governance or strategic decisions about data\n\nKey exam point: custodians EXECUTE — they do not DESIGN or GOVERN."},{"id":"d2_fc_022","domain":"D2","front":"Data processor audit rights — verifying third-party data protection","back":"When outsourcing data processing (e.g. payroll to a vendor), the data controller MUST:\n· Retain the right to audit the processor's practices, typically annually\n· Define specific security requirements in a formal written contract (DPA — Data Processing Agreement)\n· Verify the vendor's actual controls, not just marketing claims\n\nWhy audits are essential:\n· Different states/countries have different data protection laws\n· Being in the same country ≠ equivalent legal requirements\n· Verbal agreements have no legal standing\n· Even with a written contract, the controller retains responsibility for ensuring the processor protects the data\n\nUnder GDPR: the data controller is always accountable for how a processor handles data. The audit right is non-negotiable."},{"id":"d2_fc_023","domain":"D2","front":"Data destruction strength hierarchy — weakest to strongest","back":"Weakest → Strongest:\n\n1. Delete — removes file system reference only; data fully recoverable\n2. Format — new file structure laid over old one; data still recoverable in most cases\n3. Overwrite / Clear — writes 0s or random characters over data; medium reusable\n4. Sanitization — renders data infeasible to recover for a given effort/threat level\n5. Purge — renders data irrecoverable even in a laboratory environment\n(Physical destruction — shredding, incineration, degaussing — sits alongside or above Purge)\n\nKey exam tip:\n· 'Still recoverable' = delete and format\n· 'Infeasible for given effort' = sanitization\n· 'Infeasible even in a lab' = purge\n· Overwrite = 'Clear' in NIST terminology"},{"id":"d2_fc_024","domain":"D2","front":"Paper disposal — why cross shredding is required","back":"Rule: ANY paper with data on it should be disposed of securely.\n\nStrip shredding (standard):\n· Cuts into long parallel strips\n· Software can reassemble strips into the original document\n· NOT recommended for sensitive data\n\nCross shredding (recommended):\n· Cuts in two directions → small confetti-like pieces\n· Extremely difficult to reconstruct\n· The recommended standard for sensitive paper disposal\n\nKey exam point: standard shredding is NOT secure — cross shredding is the minimum recommended method.\nSame principle applies to digital media: disposal method must match the sensitivity of the data."},{"id":"d2_fc_025","domain":"D2","front":"Degaussing — how it works, what media, and the trade-off","back":"Degaussing: exposes magnetic storage media to a strong, rapidly changing magnetic field that randomises (scrambles) the magnetic domains, erasing all data.\n\nWorks on:\n· Spinning-disk HDDs\n· Magnetic tapes\n· Floppy disks\n\nDoes NOT work on:\n· SSDs (EEPROM + DRAM — no magnetic media)\n· Optical discs (CDs, DVDs)\n· Flash drives\n\nTrade-off: degaussing also destroys the drive's servo/control tracks — the drive cannot be reused or repurposed after degaussing.\n\nKey exam point: after degaussing, the media is worthless. If re-use is needed, use overwriting (Clear) instead."},{"id":"d2_fc_026","domain":"D2","front":"Why encryption does NOT address data remanence","back":"Remanence = residual data remaining on media after 'removal' attempts.\n\nEncryption does NOT fix remanence because:\n· The original data is still physically present on the disk\n· Encryption only makes it unreadable without the key\n· If the key is compromised, the data is recoverable\n· Advanced decryption or side-channel attacks could expose the data\n\nTo actually address remanence, you must:\n· Overwrite (replace the actual bits with 0s/random data)\n· Degauss (randomise magnetic domains — magnetic media only)\n· Physically destroy the media\n\nKey exam point: encrypting ≠ erasing. The data still exists; it is just obscured. Encryption is a protection mechanism, not a destruction mechanism."},{"id":"d2_fc_027","domain":"D2","front":"Certification and Accreditation — distractors to avoid confusing them with","back":"Certification (technical evaluation before go-live):\nNOT the same as:\n· Provisioning — setting up systems, accounts, and access rights\n· Validation — confirming a system meets business requirements during development\n· Verification — confirming identity (authentication)\n\nAccreditation (management sign-off, accept residual risk):\nNOT the same as:\n· Authorization — granting users or systems specific permissions\n· Validation — requirements-checking during development\n· Certification — the technical step that PRECEDES accreditation\n\nOrder: Certification → Accreditation → Production\nCertification answers 'Is it secure?' | Accreditation answers 'Can it go live?'"},{"id":"d2_fc_028","domain":"D2","front":"DLP prerequisite — data must be identified and classified first","back":"DLP (Data Loss Prevention) cannot protect what it cannot identify.\n\nBefore DLP can work:\n1. Identify sensitive data — what exists and where it lives\n2. Classify / label it — manually (security teams apply labels to files) or automatically (ML analyses content and assigns categories)\n\nWithout this step, DLP has no basis to distinguish:\n· A document with SSNs vs a marketing brochure\n· A medical record vs a public press release\n\nCommon classification labels: Public, Internal, Confidential, Restricted/Highly Confidential\n\nKey exam point: data classification and labeling is a PREREQUISITE for DLP, not something DLP does on its own."},{"id":"d2_fc_029","domain":"D2","front":"CASB vs DLP vs CSPM — what each targets","back":"CASB (Cloud Access Security Broker):\n· Sits between org and cloud providers\n· Targets: unauthorised access, shadow IT, cloud policy enforcement, compliance\n· Best for: controlling who accesses cloud services and how\n\nDLP (Data Loss Prevention):\n· Monitors data movement across endpoints, network, and storage\n· Targets: sensitive data leaving the network (exfiltration)\n· Best for: preventing data leakage/loss across all channels\n\nCSPM (Cloud Security Posture Management):\n· Scans cloud configs for misconfigurations and compliance gaps\n· Targets: insecure settings, compliance drift, risk visibility\n· Best for: keeping cloud infrastructure correctly configured\n\nBYOD policy:\n· Governs personal device use on corporate networks\n· Does not provide cloud-specific access control or monitoring\n\nExam tip: 'unauthorised external access to cloud data' → CASB."},{"id":"d2_fc_030","domain":"D2","front":"ROM subtypes — PROM, EPROM, EEPROM/Flash: how is each erased?","back":"PROM (Programmable ROM): write once by blowing fuses — cannot be erased.\nEPROM (Erasable PROM): erased by exposing the chip window to UV light.\nEEPROM (Electrically Erasable PROM): erased electrically, byte by byte.\nFlash (a type of EEPROM): erased electrically in blocks — used in USB drives, SSDs, memory cards.\nAll are non-volatile (retain data without power). None can be degaussed."},{"id":"d2_fc_031","domain":"D2","front":"US Government data classification levels — what harm does disclosure cause?","back":"Unclassified: disclosure causes NO harm to national security.\nConfidential: could DAMAGE national security.\nSecret: could cause SERIOUS DAMAGE to national security.\nTop Secret: could cause EXCEPTIONALLY GRAVE DAMAGE to national security.\nMemory hook: harm severity increases — damage → serious → grave."},{"id":"d2_fc_032","domain":"D2","front":"What is e-discovery?","back":"E-discovery (electronic discovery) is the process of identifying, collecting, preserving, and producing electronically stored information (ESI) in response to a legal request, regulatory investigation, or litigation.\nKey points:\n• Triggered by a legal hold — once notified, you must NOT destroy relevant data\n• Covers emails, documents, databases, backup tapes, logs\n• Requires organisations to know where their data lives\n• Failing to comply can result in sanctions or adverse court rulings"},{"id":"d2_fc_033","domain":"D2","front":"What factors determine data sensitivity — and what does NOT matter?","back":"Factors that DETERMINE sensitivity:\n• Value of the data to the organisation or to an attacker\n• Harm that disclosure, modification, or loss could cause\n• Legal or regulatory requirements (PCI-DSS, HIPAA, GDPR)\n• Who needs access and their trustworthiness\n\nWhat does NOT determine sensitivity:\n• The storage format (CSV, JSON, database schema, file type)\n• The age of the data (old data can still be sensitive)\n• The physical location of the data"},{"id":"d3_fc_001","domain":"D3","front":"Bell-LaPadula — what does it protect and what are its rules?","back":"Confidentiality (MAC). Simple Security Property: 'No Read UP'. * (star) Security Property: 'No Write DOWN'. Strong * Property: no read/write up or down (own level only)."},{"id":"d3_fc_002","domain":"D3","front":"Biba — what does it protect and what are its rules?","back":"Integrity (MAC). Simple Integrity Axiom: 'No Read DOWN'. * Integrity Axiom: 'No Write UP'. Invocation Property: no read or write UP. (Mnemonic: Biba = integrity, opposite reads/writes from Bell-LaPadula.)"},{"id":"d3_fc_003","domain":"D3","front":"Clark-Wilson model — what does it provide?","back":"Integrity. Separates users from back-end data using 'well-formed transactions' and 'separation of duties'. Uses Subject/Program/Object (a program sits between subject and object). Certifier and implementer must be different."},{"id":"d3_fc_004","domain":"D3","front":"Brewer-Nash (Chinese Wall) model — purpose?","back":"Mitigates conflict of interest in commercial organizations. Built on an information flow model — no information can flow between subjects/objects in a way that creates a conflict of interest."},{"id":"d3_fc_005","domain":"D3","front":"What is the Take-Grant Protection Model?","back":"Uses rules governing subject/object interactions with 4 rules: Take, Grant, Create, Remove. Permissions can be taken from or granted to other subjects."},{"id":"d3_fc_006","domain":"D3","front":"DAC vs. MAC vs. RBAC vs. ABAC vs. RUBAC","back":"DAC: owner's discretion (DACLs). MAC: system-enforced via labels/clearances. RBAC: based on role. ABAC: subject + object + environmental attributes. RUBAC: rule-based, IF/THEN statements."},{"id":"d3_fc_007","domain":"D3","front":"Name the four Security Modes (Dedicated, System High, Compartmented, Multilevel).","back":"Dedicated: clearance + NDA + approval + need-to-know for ALL data. System High: same but need-to-know for SOME. Compartmented: approval + need-to-know for SOME. Multilevel: clearance for SOME data."},{"id":"d3_fc_008","domain":"D3","front":"What is the Common Criteria (ISO 15408) — TOE, PP, ST, EAL?","back":"TOE = Target of Evaluation (the product). PP = Protection Profile (security requirements for a class of devices). ST = Security Target (the target's security properties). EAL = Evaluation Assurance Level 1-7 (test rigor)."},{"id":"d3_fc_009","domain":"D3","front":"What was 'The Orange Book' (TCSEC)?","back":"Trusted Computer System Evaluation Criteria, developed by US DoD in the 1980s — the earliest evaluation model most others are based on. Part of the Rainbow Series. The 'Red Book' (TNI) addressed network systems, which Orange Book did not."},{"id":"d3_fc_010","domain":"D3","front":"PASTA vs. STRIDE vs. DREAD threat modeling","back":"PASTA: attacker-focused, 7-step (Process for Attack Simulation and Threat Analysis). STRIDE: developer-focused (Spoofing, Tampering, Repudiation, Info disclosure, DoS, Elevation of privilege). DREAD: rating system (Damage, Reproducibility, Exploitability, Affected users, Discoverability)."},{"id":"d3_fc_011","domain":"D3","front":"Trust but Verify vs. Zero Trust","back":"Trust but Verify: implicit trust, then verify. Zero Trust (NIST SP 800-207): never trust, always verify — no implicit trust based on physical/logical location; authenticate both subject and device before every session."},{"id":"d3_fc_012","domain":"D3","front":"Fail Securely vs. Secure Defaults","back":"Fail Securely: if a system fails, it stays at least as secure as before (open/safe vs. closed/secure). Secure Defaults: ship as secure as possible, then remove security for usability based on risk analysis."},{"id":"d3_fc_013","domain":"D3","front":"Process Isolation vs. Memory Protection vs. Hardware Segmentation","back":"Memory Protection: prevents one process from affecting another's CIA. Process Isolation: logical control preventing process interference. Hardware Segmentation: maps processes to specific memory locations (a step further)."},{"id":"d3_fc_014","domain":"D3","front":"What is the Ring Model? What is Ring -1?","back":"4-ring model separating Users (untrusted, Ring 3) from Kernel (trusted, Ring 0). Most OSs use only rings 0 and 3. Ring -1 = Hypervisor mode for VM hosts, sits below Ring 0."},{"id":"d3_fc_015","domain":"D3","front":"Kernel mode vs. User mode","back":"Kernel mode (Supervisor mode): unrestricted access to memory/CPU/disk, most trusted, crashes are NOT recoverable. User mode (Problem mode): no direct hardware access (goes through API), crashes ARE recoverable."},{"id":"d3_fc_016","domain":"D3","front":"Monolithic kernel vs. Microkernel","back":"Monolithic: one static executable, all functionality precompiled, runs in supervisor mode. Microkernel: modular, smaller, adds functionality via loadable kernel modules, may run modules in user mode (Ring 3)."},{"id":"d3_fc_017","domain":"D3","front":"What is the Reference Monitor?","back":"A core function of the kernel that handles all access between subjects and objects. It is always on and cannot be bypassed."},{"id":"d3_fc_018","domain":"D3","front":"What is a TPM (Trusted Platform Module)?","back":"An international standard for a secure cryptoprocessor — a dedicated microcontroller that integrates cryptographic keys into devices. Used for RNG, encryption, hashing, secure key storage; most commonly for boot integrity."},{"id":"d3_fc_019","domain":"D3","front":"Type 1 vs. Type 2 Hypervisor","back":"Type 1 (Bare Metal): runs directly on host hardware, part of a virtualization OS (think data center). Type 2: runs on top of a regular OS like Windows (think your PC)."},{"id":"d3_fc_020","domain":"D3","front":"What is VM Escape?","back":"When an attacker jumps from a host or client VM to another client. A bigger concern with different trust-level clients on the same host — they should ideally be on separate hosts."},{"id":"d3_fc_021","domain":"D3","front":"IaaS vs. PaaS vs. SaaS","back":"IaaS: vendor provides infrastructure up to the OS; customer adds OS and up. PaaS: vendor provides pre-configured OS; customer adds apps. SaaS: vendor provides OS and applications (Gmail, Office 365)."},{"id":"d3_fc_022","domain":"D3","front":"What is Containerization (OS-level virtualization)?","back":"Removing redundant OS elements; apps run in containers with only required resources, sharing a host OS. Containers only see their own content. 10-100x more app density per server than normal virtualization."},{"id":"d3_fc_023","domain":"D3","front":"Polyinstantiation vs. Aggregation vs. Inference (database)","back":"Polyinstantiation: two+ versions of the same file shown based on clearance. Aggregation: gathering data to see the bigger picture. Inference: deducing from evidence/reasoning rather than explicit statements."},{"id":"d3_fc_024","domain":"D3","front":"Covert Timing Channel vs. Covert Storage Channel","back":"Timing: information leaked via response-time differences (e.g. wrong username 100ms vs. wrong password 600ms). Storage: hidden info via modification of a stored object (file sizes, ICMP payloads)."},{"id":"d3_fc_025","domain":"D3","front":"What is Steganography?","back":"Hiding a message within another medium (most commonly images or audio) by subtly altering pixels/data. To the naked eye it's not noticeable, but large amounts of info can be hidden."},{"id":"d3_fc_026","domain":"D3","front":"Symmetric vs. Asymmetric encryption — pros and cons.","back":"Symmetric: fast, strong per bit, but needs a pre-sh
