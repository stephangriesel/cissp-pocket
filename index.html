y differ?","back":"Dedicated: ALL users — clearance + need-to-know for ALL data. System High: clearance for ALL, need-to-know for SOME. Compartmented: clearance for all + need-to-know + approval + information labels for SOME. Multi-level: clearance, need-to-know, and approval all vary per user per data item."},{"id":"d4_fc_074","domain":"D4","front":"What are the 4 main firewall types, their OSI layers, and key characteristics?","back":"Packet-filtering (L3/4): source/dest IP and port rules — fast, no state. Stateful inspection (L7): tracks connection state and context. Circuit-level proxy (L5): checks headers only; tunnels all traffic once circuit established. Application proxy (L7): inspects content, auth/encryption — most secure but slowest."},{"id":"d4_fc_075","domain":"D4","front":"What do the key IEEE 802 standards define?","back":"802.3 = Ethernet. 802.11 = Wi-Fi (wireless LAN). 802.15 = Bluetooth. 802.16 = WiMAX. 802.20 = LTE. 802.11i = WPA2 (AES/CCMP). 802.11ac = up to 1 Gbps on 5 GHz."},{"id":"d4_fc_076","domain":"D4","front":"What are the main 802.11 Wi-Fi amendments and their key specs?","back":"802.11a: 54 Mbps, 5 GHz. 802.11b: 11 Mbps, 2.4 GHz. 802.11g: 54 Mbps, 2.4 GHz. 802.11n: 200+ Mbps, 2.4 or 5 GHz. 802.11ac: 1 Gbps, 5 GHz. 802.11i: WPA2 security standard (AES + CCMP)."},{"id":"d4_fc_077","domain":"D4","front":"How does a circuit-level proxy firewall differ from an application proxy firewall?","back":"Circuit-level proxy (L5): inspects packet headers only — once a circuit is approved, all traffic is tunneled without further inspection. Fast and supports many protocols. Application proxy (L7): inspects full packet content including application data. More secure but significantly slower."},{"id":"d4_fc_078","domain":"D4","front":"What are the TCP/IP address class ranges and default subnet masks?","back":"Class A: 1–127, mask 255.0.0.0 (/8). Class B: 128–191, mask 255.255.0.0 (/16). Class C: 192–223, mask 255.255.255.0 (/24). Class D: 224–239 (multicast). Class E: 240–255 (experimental)."},{"id":"d4_fc_079","domain":"D4","front":"What OSI layer does each LAN device operate at?","back":"L1 Physical: Repeaters, Hubs (multi-port repeater). L2 Data Link: Bridges, Switches, WAPs. L3 Network: Routers. L7 Application: Gateways (translate between protocols). LAN extenders = multi-layer switch."},{"id":"d4_fc_080","domain":"D4","front":"What are the key differences between WEP, WPA, and WPA2?","back":"WEP: RC4, crackable in seconds, uses common key + limited IVs — do not use. WPA: TKIP (RC4-based), improvement but still weak. WPA2: AES + CCMP, based on 802.11i, most secure. WPA2 Enterprise adds RADIUS auth; Personal uses PSK."},{"id":"d4_fc_081","domain":"D4","front":"What are the key email security protocols and what does each provide?","back":"S/MIME: signing + encryption, SSO-compatible. DKIM: domain validation for email authenticity. PEM: auth, confidentiality, integrity, nonrepudiation. MOSS: same as PEM. LDAP (389, unencrypted) vs LDAP-S (636, SSL/TLS encrypted)."},{"id":"d4_fc_082","domain":"D4","front":"What are the WAN and cabling speeds to know for CISSP?","back":"T-1: 1.544 Mbps. T-3: 44.736 Mbps. ATM: 155 Mbps. ISDN: 64 or 128 Kbps. CAT 3: 10 Mbps. CAT 5: 100 Mbps. CAT 5e/6: 1000 Mbps (1 Gbps). Fiber: immune to EMI."},{"id":"d4_fc_083","domain":"D4","front":"What are the three wireless network modes?","back":"Ad hoc: direct device-to-device, no access point. Infrastructure: devices connect to central access point (AP) — most common. Stand-alone: isolated system not connected to other networks."}],"questions":[{"id":"d5_q_001","domain":"D5","difficulty":"medium","question":"A user logs in with a fingerprint scanner and a PIN. Which statement is correct?","options":["This is single-factor authentication because biometrics and PINs are both physical","This is multi-factor authentication because it combines Type 3 and Type 1 factors","This is multi-factor authentication because it uses two devices","This is single-factor authentication because the PIN replaces the password"],"answer":1,"explanation":"MFA requires factors from two or more DIFFERENT categories. Fingerprint = Type 3 (something you are), PIN = Type 1 (something you know). Two different categories = MFA."},{"id":"d5_q_002","domain":"D5","difficulty":"hard","question":"An organization needs to choose an access control model where Confidentiality is the highest priority. Which model should they implement?","options":["RBAC — because it separates duties most effectively","DAC — because owners can control access to confidential data","MAC — because access is determined by labels and clearances, not user discretion","ABAC — because environmental conditions add an extra layer of protection"],"answer":2,"explanation":"MAC (Mandatory Access Control) is used when Confidentiality is most important. Access is determined by labels (on objects) and clearances (on subjects), not owner discretion. Commonly used in military environments."},{"id":"d5_q_003","domain":"D5","difficulty":"medium","question":"What is the PRIMARY purpose of salting a password before hashing it?","options":["To make the hash longer and harder to crack","To defend against dictionary attacks and pre-compiled rainbow table attacks","To encrypt the password so it cannot be read by administrators","To add a second authentication factor to the login process"],"answer":1,"explanation":"A salt is random data added to a password before hashing. Its primary function is to defend against dictionary attacks and pre-compiled rainbow table attacks by making each hash unique even if passwords are identical."},{"id":"d5_q_004","domain":"D5","difficulty":"hard","question":"An employee transfers from Payroll to HR. Under RBAC, what is the CORRECT action?","options":["Add the HR role to the employee's existing Payroll role","Remove Payroll access and assign HR access only","Keep Payroll access temporarily until the transition is complete","Ask the employee which permissions they need from each role"],"answer":1,"explanation":"Under RBAC, when employees transfer, they are MOVED from one role to another — old access is removed, new access is assigned. Adding roles without removing old ones leads to privilege creep."},{"id":"d5_q_005","domain":"D5","difficulty":"medium","question":"Which of the following BEST describes a Rainbow Table attack?","options":["A brute force attack using every possible character combination","An attack using a pre-made list of plaintext passwords and their matching hashes","An attack that installs a keylogger to capture passwords in real time","An attack that guesses passwords using dictionary words with numbers appended"],"answer":1,"explanation":"A Rainbow Table is a pre-compiled list of plaintexts and their matching ciphertext/hashes — often millions of password/hash pairs. Salting defeats this attack by making each hash unique."},{"id":"d5_q_006","domain":"D5","difficulty":"hard","question":"A company's biometric system has a very high sensitivity setting. What is the MOST likely result?","options":["Higher FAR — unauthorized users are more likely to be accepted","Higher FRR — authorized users are more likely to be rejected","Lower CER — the system reaches optimal balance faster","Lower FAR — the system becomes easier to bypass"],"answer":1,"explanation":"High sensitivity = high FRR (False Rejection Rate, Type 1 error). Authorized users are rejected more often. The CER (Crossover Error Rate) is where FRR and FAR meet — the optimal balance point."},{"id":"d5_q_007","domain":"D5","difficulty":"medium","question":"What is the MAIN advantage of Kerberos over basic username/password authentication?","options":["It stores passwords in plaintext for easy recovery","It provides mutual authentication — both user and server verify each other","It uses asymmetric encryption making it immune to key theft","It eliminates the need for a centralized authentication server"],"answer":1,"explanation":"Kerberos provides mutual authentication using tickets — both the user and server verify each other's identity. It uses symmetric keys and requires a trusted third party (KDC). UDP port 88."},{"id":"d5_q_008","domain":"D5","difficulty":"hard","question":"What is the key difference between RADIUS and TACACS+?","options":["RADIUS uses TCP; TACACS+ uses UDP","RADIUS encrypts the entire data package; TACACS+ only encrypts the password","TACACS+ encrypts the entire data package; RADIUS only encrypts the password","TACACS+ is used for wireless; RADIUS is used for VPN only"],"answer":2,"explanation":"TACACS+ encrypts the ENTIRE data package. RADIUS only encrypts the password. Both provide AAA management. TACACS+ uses TCP port 49; RADIUS uses UDP 1812/1813."},{"id":"d5_q_009","domain":"D5","difficulty":"medium","question":"Which of the following is the BEST example of multi-factor authentication?","options":["Username and password","Password and security question","Smart card and PIN","Two different passwords"],"answer":2,"explanation":"Smart card = Type 2 (something you have). PIN = Type 1 (something you know). Two different factor types = MFA. Username/password, password/security question, and two passwords all use only Type 1 factors."},{"id":"d5_q_010","domain":"D5","difficulty":"hard","question":"An organization uses a centralized access control system. Which is the MOST significant disadvantage compared to a decentralized approach?","options":["All locations may have inconsistent security postures","Local admins can edit logs from their own facility","Single point of failure — if connectivity to head office is lost, authentication may fail","It is harder to enforce separation of duties centrally"],"answer":2,"explanation":"The main con of centralized access control is the dependency on connectivity to the central system. If the head office connection fails, doors/systems may be unable to authenticate. The other options are actually advantages of centralized systems."},{"id":"d5_q_011","domain":"D5","difficulty":"medium","question":"What is the PRIMARY security concern with Single Sign-On (SSO)?","options":["Users forget their single password more often","If one password is compromised, the attacker gains access to all systems the user can access","SSO requires more complex infrastructure than individual logins","SSO cannot work across different operating systems"],"answer":1,"explanation":"SSO's biggest risk: one compromised password = access to everything. This is why SSO passwords must meet strong requirements. The convenience benefit comes with significant concentration of risk."},{"id":"d5_q_012","domain":"D5","difficulty":"hard","question":"An organization needs to grant a contractor temporary access to a third-party collaboration tool without pre-creating accounts. Which technology BEST supports this?","options":["TACACS+ with dynamic provisioning","JIT (Just-In-Time) Provisioning using SAML","HOTP tokens assigned to the contractor","DAC where the contractor creates their own account"],"answer":1,"explanation":"JIT Provisioning allows users to log in to a third-party site on their first visit, where the JIT system automatically verifies the user and creates their account — most commonly using SAML. No pre-created accounts needed."},{"id":"d5_q_013","domain":"D5","difficulty":"medium","question":"Which of these is NOT a downside to enforcing software tokens on phones for multifactor authentication?","options":["Phones can be lost","SIM cloning attacks are possible","Being user-friendly","Phones have to be charged"],"answer":2,"explanation":"Being user-friendly is not a downside — it is an advantage. It encourages user adherence to security policies and reduces mistakes that can introduce vulnerabilities. The real downsides: a lost phone removes the authentication factor and could give an attacker access; a dead battery locks out the legitimate user at critical moments; and SIM cloning lets an attacker duplicate a SIM to intercept SMS-based OTPs, potentially gaining unauthorised access."},{"id":"d5_q_014","domain":"D5","difficulty":"medium","question":"Which of the following is the MOST secure method of authentication?","options":["Username and password","Biometric authentication","Token-based authentication","Shared secrets"],"answer":1,"explanation":"Biometric authentication (fingerprints, facial recognition, iris scans) is generally the most secure because biometric traits are unique to each individual and cannot be easily replicated, stolen, or shared. Usernames and passwords are highly vulnerable to guessing, phishing, and credential stuffing. Tokens can be lost or stolen. Shared secrets (security questions, shared passwords) are vulnerable to social engineering and, because they are shared, carry inherent exposure risk."},{"id":"d5_q_015","domain":"D5","difficulty":"easy","question":"When authenticating against an access control system, you present only your ID card. Which type of authentication are you using?","options":["Multi-factor authentication","Two-factor authentication","Single-factor authentication","Three-factor authentication"],"answer":2,"explanation":"Single-factor authentication (SFA) requires exactly one verification factor. Presenting an ID card is 'something you have' — one factor, so it qualifies as SFA. Two-factor authentication (2FA) requires two factors (e.g. a card + a PIN). Three-factor authentication adds a third (e.g. biometrics). Multi-factor authentication (MFA) is the umbrella term for any combination requiring more than one factor. Since only the ID card is presented here, none of the multi-factor options apply."},{"id":"d5_q_016","domain":"D5","difficulty":"easy","question":"In biometric authentication, which type of error is considered MORE serious and why?","options":["FRR (Type 1), because it locks out legitimate users and hurts productivity","FAR (Type 2), because it grants unauthorized users access to the system","CER, because it represents the worst-case error rate","Both errors are equally serious"],"answer":1,"explanation":"FAR (False Acceptance Rate) is the Type 2 error and is considered more serious because it grants unauthorized users access — a direct security breach. FRR (Type 1) is disruptive (legitimate users are rejected) but does not compromise security. A well-tuned system aims for the CER (Crossover Error Rate), where FAR and FRR balance each other."},{"id":"d5_q_017","domain":"D5","difficulty":"medium","question":"On a biometric sensitivity graph, what does the CER (Crossover Error Rate) represent?","options":["The error rate at maximum sensitivity settings","The point where FRR and FAR values are equal — the optimal balance point","The minimum acceptable FAR for a system to be considered secure","The percentage of scans that fail due to hardware malfunction"],"answer":1,"explanation":"The CER is the sensitivity setting where the False Rejection Rate (FRR) and the False Acceptance Rate (FAR) are exactly equal. It represents the ideal operating point — the best trade-off between rejecting legitimate users and accepting unauthorised ones. A lower CER generally indicates a more accurate biometric system."},{"id":"d5_q_018","domain":"D5","difficulty":"easy","question":"What is the PRIMARY purpose of a nonce in authentication protocols?","options":["To encrypt the password before it is transmitted","To prevent replay attacks by ensuring old communications cannot be reused","To increase the minimum required password length","To replace salts in password hashing functions"],"answer":1,"explanation":"A nonce (Number used ONCE) is a random or pseudo-random number issued in an authentication exchange. Its primary purpose is to prevent replay attacks — an attacker who captures an authenticated message cannot reuse it because the nonce value changes each time. Nonces are also used as initialisation vectors in cryptographic functions. They are similar to salts but serve a different purpose: salts protect stored passwords; nonces protect live authentication sessions."},{"id":"d5_q_019","domain":"D5","difficulty":"medium","question":"What is the PRIMARY purpose of clipping levels on a login system?","options":["To encrypt all failed login attempts in the audit log","To allow users unlimited login attempts before triggering an alert","To reduce administrative overhead while preventing brute-force guessing","To notify the user's manager after a single failed login attempt"],"answer":2,"explanation":"Clipping levels set a threshold for failed login attempts before locking the account (e.g. 3–5 attempts before a timed lockout or admin unlock). They serve two goals simultaneously: allowing legitimate users who mistyped their password to try again (reducing unnecessary help desk calls) while preventing automated brute-force password guessing. The account lockout then stops the attack and alerts administrators without overwhelming them with single-failure notifications."},{"id":"d5_q_020","domain":"D5","difficulty":"hard","question":"An attacker gains access to a system's file of cryptographic password hashes. Why does this allow them to bypass clipping levels?","options":["Clipping levels only apply to encrypted passwords, not hashes","The attacker can test candidate passwords offline against the stolen hashes without triggering the login system","Hash files are stored outside the operating system and are not protected by clipping levels","Clipping levels are automatically disabled when the hash file is accessed"],"answer":1,"explanation":"Clipping levels enforce lockout on the live authentication system — they count failed logins on the system itself. Once an attacker has the hash file, they can perform offline cracking: rapidly testing millions of candidate passwords against the hash values using their own hardware, completely bypassing the live login system and its clipping levels. This is why strong, salted hashing is critical — the hash file must be treated as sensitive data."},{"id":"d5_q_021","domain":"D5","difficulty":"easy","question":"In Discretionary Access Control (DAC), who determines who can access an object?","options":["A central security administrator using mandatory labels","The system based on the user's assigned role","A security policy enforced by the operating system kernel","The owner of the object, at their own discretion"],"answer":3,"explanation":"In DAC, the owner of the resource (object) decides who can access it and what permissions they have — access is granted at the owner's discretion. The owner can add or remove rights freely. DAC uses Discretionary ACLs (DACLs) based on user identity and is the default model in most operating systems. It prioritises flexibility and Availability, making it the least restrictive access control model."},{"id":"d5_q_022","domain":"D5","difficulty":"medium","question":"In a MAC (Mandatory Access Control) environment, what determines whether a subject can access an object?","options":["The subject's manager approving the access request","The object owner granting permission directly to the subject","The subject's department role as defined in an RBAC policy","The subject's clearance level must dominate (be equal to or higher than) the object's sensitivity label"],"answer":3,"explanation":"In MAC, every object has a sensitivity label (e.g. Confidential, Secret, Top Secret — Nuclear) and every subject has a clearance level. The subject's clearance must dominate (match or exceed) the object's label for access to be granted — the owner cannot override this. MAC is used in military and high-confidentiality environments because access decisions are policy-driven, not owner-driven. Higher clearance levels require more thorough background checks."},{"id":"d5_q_023","domain":"D5","difficulty":"medium","question":"An employee moves from Payroll to HR. Under RBAC, what is the CORRECT way to handle their access permissions?","options":["Add the HR role permissions on top of their existing Payroll permissions","Keep both role memberships active for 30 days then remove Payroll","Move the employee to the HR role group and remove them from the Payroll role group","Give the employee a temporary super-user account until their new permissions are confirmed"],"answer":2,"explanation":"Under RBAC, when an employee changes roles they must be moved to the new role group and removed from the old one. Adding the new role on top of the old one causes privilege/authorisation creep — the employee retains permissions they no longer need, violating least privilege. RBAC's strength is preventing creep by treating role membership as a transfer, not an accumulation. Properly implemented RBAC also enforces separation of duties."},{"id":"d5_q_024","domain":"D5","difficulty":"medium","question":"ABAC (Attribute-Based Access Control) considers three categories of attributes when making an access decision. Which of the following correctly identifies all three?","options":["User identity, application version, and network zone","Subject attributes, object attributes, and environmental conditions","Clearance level, role assignment, and job title","Location, time of day, and threat intelligence feed"],"answer":1,"explanation":"ABAC grants or denies access by evaluating: Subject attributes (e.g. user name, role, ID, clearance), Object attributes (e.g. resource name, owner, date of creation), and Environmental conditions (e.g. location, time of access, current threat level). This fine-grained approach makes ABAC very flexible. It is also called PBAC (Policy-Based AC) or CBAC (Claims-Based AC) and is expected to grow to 70% adoption in large enterprises."},{"id":"d5_q_025","domain":"D5","difficulty":"easy","question":"A user logs into a system with a username and password. Does this qualify as Multi-Factor Authentication (MFA)?","options":["Yes — it uses two separate inputs, which qualifies as two-factor","Yes — combining a username and password is always considered MFA","No — both a username and a password are 'something you know' (Type 1), so only one factor category is used","No — MFA requires at least four separate inputs"],"answer":2,"explanation":"MFA requires authentication from two or more DIFFERENT factor categories: something you know (Type 1), something you have (Type 2), or something you are (Type 3). A username is an identifier, and a password is something you know — both belong to the Type 1 category. Using two items from the same category does not constitute multi-factor authentication. A card + PIN or fingerprint + password qualifies because different categories are combined."},{"id":"d5_q_026","domain":"D5","difficulty":"medium","question":"Which of the following would NOT be part of a good identity and access provisioning lifecycle?","options":["Automated provisioning","Regular access reviews","Manual provisioning","Access certification"],"answer":2,"explanation":"Manual provisioning is not part of a good provisioning lifecycle. It is inefficient, error-prone, and does not scale in large organisations. It also lacks automatic audit trails, creating compliance risks. The other three are all essential components: automated provisioning increases efficiency and reduces human error; regular access reviews (recertification) ensure users still have appropriate rights and catch orphaned accounts; access certification validates that each user's rights are necessary and compliant."},{"id":"d5_q_027","domain":"D5","difficulty":"easy","question":"In identity and access provisioning, what do identities correspond to?","options":["Rights — the permissions granted to a user","Entities — a person, system, or anything uniquely distinguishable in a security context","Attributes — descriptors like username, email, or role","Objects — resources such as files, directories, or devices"],"answer":1,"explanation":"In identity and access provisioning, an identity is a representation of an entity in the system. An entity can be a person, a service account, a device, or any uniquely identifiable subject in a security context. Rights are what identities are granted. Attributes (name, email, role) describe an identity. Objects are the resources to which access is controlled."},{"id":"d5_q_028","domain":"D5","difficulty":"medium","question":"Which security principle states that a user must have a unique identifier and be authenticated before accessing a system or network?","options":["Principle of least privilege","Separation of duties","Single Sign-On (SSO)","Identity and Access Management (IAM)"],"answer":3,"explanation":"IAM (Identity and Access Management) is the principle and framework that ensures every user has a unique identifier and must be authenticated to access a system. IAM manages roles, access privileges, and the conditions under which access is granted or denied — essential for preventing unauthorised access to sensitive information. Least privilege restricts what access users have. Separation of duties divides tasks between users. SSO centralises authentication across systems but does not itself require a unique identifier per system."},{"id":"d5_q_029","domain":"D5","difficulty":"medium","question":"The Kerberos KDC (Key Distribution Center) is made up of which two components?","options":["KAS (Key Authentication Server) and SSO (Single Sign-On) Server","TGS (Ticket Granting Server) and PAS (Privilege Attribute Server)","AS (Authentication Server) and TGS (Ticket Granting Server)","AS (Authentication Server) and PKI (Public Key Infrastructure) Server"],"answer":2,"explanation":"The KDC (Key Distribution Center) is the heart of Kerberos and contains two logical components: the AS (Authentication Server), which verifies the user's identity and issues a TGT; and the TGS (Ticket Granting Server), which issues service-specific tickets when the client presents a valid TGT. Both reside inside the KDC. If the KDC is compromised, it is a single point of failure for all Kerberos-authenticated services."},{"id":"d5_q_030","domain":"D5","difficulty":"medium","question":"In step 1 of the Kerberos authentication flow, what does the client send to the Authentication Server (AS)?","options":["Username and an encrypted password hash","A TGT encrypted with the TGS secret key","Only the plaintext user ID","A session key encrypted with the user's secret key"],"answer":2,"explanation":"In step 1, the client sends only the plaintext user ID — no password is transmitted. The AS uses this to look up the user's secret key. The password never travels over the network, which is one of Kerberos' key security advantages. The response (step 2) is what the user's password is actually used for — to decrypt the session key that the AS sends back."},{"id":"d5_q_031","domain":"D5","difficulty":"hard","question":"In step 2 of the Kerberos flow, what does the Authentication Server return to the client?","options":["A plaintext service ticket for the requested server","A session key encrypted with the user's secret key, AND a TGT encrypted with the TGS secret key","A client/server session key and a timestamp","A direct encrypted channel to the target application server"],"answer":1,"explanation":"The AS returns two things: (1) a client/TGS session key encrypted with the user's secret key (the client decrypts this using their password-derived key), and (2) a TGT (Ticket Granting Ticket) encrypted with the TGS's own secret key (the client cannot read this). The client uses the session key to communicate with the TGS and presents the TGT as proof of identity — without needing to re-enter their password for every service."},{"id":"d5_q_032","domain":"D5","difficulty":"medium","question":"What is the purpose of the TGT (Ticket Granting Ticket) in Kerberos?","options":["To authenticate the client's plaintext identity to the Authentication Server","To encrypt the user's password before it is sent over the network","To allow the client to request service tickets from the TGS without re-entering their password","To establish a direct encrypted session between the client and the target server"],"answer":2,"explanation":"The TGT is issued by the AS after successful authentication and acts as a time-limited proof that the user has already authenticated. The client presents the TGT to the TGS whenever it needs access to a service, receiving service-specific tickets without the user having to re-enter their password. The TGT itself is encrypted with the TGS's secret key, so the client cannot read or forge it — it simply passes it through."},{"id":"d5_q_033","domain":"D5","difficulty":"hard","question":"In the final step (step 6) of Kerberos, the server sends a timestamp authenticated with the Client/Server Session Key. What is the PRIMARY purpose of this?","options":["To tell the client the server's current time zone for clock synchronisation","To prove the server successfully decrypted the session key, completing mutual authentication","To set the expiry time on the client's TGT","To provide the client with a new TGT for future sessions"],"answer":1,"explanation":"In step 6, the server encrypts a timestamp with the shared Client/Server Session Key and sends it back to the client. Because only a server that successfully decrypted the client's ticket (step 5) would know the session key, this proves the server's identity — completing mutual authentication. Both sides have now verified each other. Kerberos uses timestamps throughout to prevent replay attacks (which is also why clock synchronisation across all Kerberos participants is critical)."},{"id":"d5_q_034","domain":"D5","difficulty":"medium","question":"Which of the following is the PRIMARY function of the Ticket Granting Server (TGS) in Kerberos?","options":["To encrypt all data transmitted over the network","To authenticate users to the network by verifying their credentials","To manage the database of users and their associated secret keys","To issue service tickets that authorise access to specific network resources"],"answer":3,"explanation":"The TGS issues service tickets. Once a user has been authenticated by the AS and holds a TGT, they present that TGT to the TGS to request a ticket for a specific service or resource. The TGS validates the TGT and issues the appropriate service ticket, acting as an electronic pass for that resource. Authentication is the AS's job; key database management belongs to the KDC/AS; data encryption is handled by the network services themselves."},{"id":"d5_q_035","domain":"D5","difficulty":"easy","question":"Which of the following BEST describes the PRIMARY function of RADIUS?","options":["To provide centralised Authentication, Authorisation, and Accounting (AAA) management for remote users","To encrypt all network traffic between a client and a server","To monitor and report on overall network usage and performance","To store and manage user credentials in a central directory"],"answer":0,"explanation":"RADIUS (Remote Authentication Dial-In User Service) is a networking protocol that provides centralised AAA management: it authenticates remote users, authorises what they can access, and accounts for their session activity. While RADIUS does encrypt passwords in transit, full traffic encryption is the role of protocols like TLS or IPSec. Comprehensive network monitoring belongs to NPMD tools. The actual storage of credentials typically lives in a separate directory or database — RADIUS authenticates against it rather than managing it."},{"id":"d5_q_036","domain":"D5","difficulty":"medium","question":"Which of the following is the FIRST step in the Kerberos authentication process?","options":["The client encrypts the request with the server's secret key","The client sends a request to the KDC asking for a Ticket Granting Ticket (TGT)","The KDC decrypts the client's request and generates a session key","The client decrypts the KDC's response to obtain the TGT"],"answer":1,"explanation":"The first step is always the client sending a TGT request to the KDC (specifically to the AS component) using only the plaintext user ID. Nothing is encrypted with the server's key at this stage. The KDC cannot generate a session key until it receives the request. And the client cannot decrypt a response until the AS has first processed the request and sent one. All subsequent steps — session key delivery, TGT use, and service ticket exchange — follow from this initial request."},{"id":"d5_q_037","domain":"D5","difficulty":"medium","question":"Jane is manually reviewing logs, but the organisation has grown so much that there are too many logs to review manually in a timely fashion. Which tool would BEST help her?","options":["IPS (Intrusion Prevention System)","IDS (Intrusion Detection System)","SIEM (Security Information and Event Management)","FIDI"],"answer":2,"explanation":"A SIEM aggregates, correlates, and analyses log data from across the IT infrastructure in real time, automating much of the manual review process and generating prioritised security alerts. An IPS blocks threats in real time but does not help with log review. An IDS detects and logs events but does not offer the aggregation and correlation that a SIEM provides. FIDI is not a recognised cybersecurity acronym."},{"id":"d5_q_038","domain":"D5","difficulty":"medium","question":"Your bank sent a one-time number by email when you first logged in. After completing that step, you have not been asked for it again on the same device. Why?","options":["A cookie was placed on your computer — that cookie combined with your username and password constitutes multi-factor authentication","The bank now recognises you and single-factor authentication is sufficient","The process is too cumbersome, so the bank waived MFA for convenience","It is salting — a one-time operation applied to your stored password"],"answer":0,"explanation":"After the initial verification, the bank places a cookie on your device. That cookie represents 'something you have' (your trusted device), and your password is 'something you know'. Together they form MFA. Recognising a returning user does not lower the security requirement. User convenience alone is never a reason to drop MFA in banking. Salting is a password-storage technique unrelated to session authentication."},{"id":"d5_q_039","domain":"D5","difficulty":"medium","question":"An attacker is brute-forcing a user's password. Your organisation has not yet implemented clipping levels. Which countermeasure would BEST slow down the attack?","options":["Deploying rainbow tables to analyse the attacker's dictionary","Enforcing a minimum password age policy","Requiring password changes every 30 days","Implementing key stretching"],"answer":3,"explanation":"Key stretching applies a hash function repeatedly to a password (e.g. bcrypt, PBKDF2), making each password guess computationally expensive. This directly slows brute-force attacks. Rainbow tables are an attacker tool, not a defence. Minimum password age and forced rotation policies address password reuse — they do not prevent a brute-force attack in progress."},{"id":"d5_q_040","domain":"D5","difficulty":"hard","question":"Which of the following countermeasures is LEAST effective specifically against brute-force attacks?","options":["Key stretching","Salting","Limiting the number of incorrect login attempts","Requiring strong, complex passwords"],"answer":1,"explanation":"Salting adds random data to passwords before hashing, which defeats pre-computed rainbow table attacks — but it does not slow down brute force, because an attacker testing live guesses simply hashes each guess with the known salt. Key stretching makes each guess computationally expensive. Login attempt limits stop online brute force directly. Strong passwords enlarge the search space, making brute force take far longer."},{"id":"d5_q_041","domain":"D5","difficulty":"easy","question":"PINs, passwords, and passphrases are all classified as which type of authentication?","options":["Type 3 — something you are","Type 2 — something you have","Type 5 — a non-standard advanced factor","Type 1 — something you know"],"answer":3,"explanation":"Type 1 authentication is 'something you know' — knowledge-based credentials the user must remember. PINs, passwords, and passphrases all fall into this category. Type 2 is 'something you have' (token, smart card). Type 3 is 'something you are' (biometrics). There is no standard Type 5 in the authentication factor model."},{"id":"d5_q_042","domain":"D5","difficulty":"medium","question":"We want to protect against rainbow table attacks by implementing salting. What are rainbow tables made up of?","options":["Pre-arranged lists of common words and number sequences","Pre-computed tables mapping password hashes back to their plaintext equivalents","Pre-made tables matching biometric samples to stored password hashes","Pre-computed tables of password hashes generated using salts"],"answer":1,"explanation":"Rainbow tables are large pre-computed lookup tables that map hash values back to their original plaintext passwords, allowing an attacker to instantly reverse an unsalted hash. They do not contain biometric data. They are NOT built with salts — in fact salting defeats rainbow tables entirely, because each unique salt requires its own table, making pre-computation infeasible."},{"id":"d5_q_043","domain":"D5","difficulty":"easy","question":"Your bank sends a text message with a one-time code to enter alongside your username and password. What is this an example of?","options":["Single-factor authentication","A cookie stored on your device to remember you","Multi-factor authentication","Salting"],"answer":2,"explanation":"This is multi-factor authentication (MFA): your username and password are 'something you know' (Type 1), and the OTP received on your phone is 'something you have' (Type 2). Two different factor categories are combined. Single-factor uses only one category. A cookie represents a trusted device, not an SMS OTP. Salting is a password storage technique, not an authentication method."},{"id":"d5_q_044","domain":"D5","difficulty":"easy","question":"Which of the following is generally considered the WEAKEST form of authentication?","options":["Something you are — biometrics (Type 3)","Something you have — token or device (Type 2)","Something you know — passwords, PINs, passphrases (Type 1)","A combination of all three factors"],"answer":2,"explanation":"'Something you know' is the weakest factor because knowledge can be guessed, phished, socially engineered, or stolen without the victim's awareness. Biometrics (Type 3) are the hardest to replicate. Physical tokens (Type 2) require the attacker to obtain a physical device. Combining all three factors (MFA) is the strongest option."},{"id":"d5_q_045","domain":"D5","difficulty":"hard","question":"Which specific Kerberos security weakness did SESAME address through the use of Public Key Infrastructure (PKI)?","options":["Asymmetric plaintext key storage","PKI being an inherent security vulnerability","Symmetric plaintext key storage","Never sending the password over the network"],"answer":2,"explanation":"Kerberos relies on symmetric keys that must be stored and shared — if a key is stored in a recoverable or plaintext form, it can be compromised. SESAME (Secure European System for Applications in a Multivendor Environment) addressed this by using PKI (asymmetric cryptography) for initial authentication, eliminating the symmetric plaintext key storage risk. PKI is a solution, not a vulnerability. Not sending passwords over the network is a feature Kerberos already had."},{"id":"d5_q_046","domain":"D5","difficulty":"easy","question":"Bob is designing new access controls across the organisation. Which documentation should he reference to determine how and what to implement?","options":["The latest technology reviews and vendor comparisons","His own discretion — he is the most knowledgeable employee on access control","The organisation's policies, procedures, and standards","His peers' recommendations, implementing whatever they agree on"],"answer":2,"explanation":"Access control design must align with the organisation's formal policies, procedures, and standards — documents that encode regulatory obligations, business objectives, and security requirements. Individual expertise and peer input can supplement these, but must not replace them. Implementing access controls based on personal discretion or the latest tech trends risks creating inconsistencies, policy violations, or non-compliant configurations."},{"id":"d5_q_047","domain":"D5","difficulty":"medium","question":"Active Directory (AD) uses trust relationships between domains. Which of the following is NOT a recognised AD trust type?","options":["One-way trust","Reflective trust","Transitive trust","Intransitive trust"],"answer":1,"explanation":"Reflective trust is not a standard Active Directory trust type. AD supports: one-way trust (one domain allows the other's users access but not vice versa), transitive trust (automatically extends to all domains that either domain trusts — the default within an AD forest), and intransitive trust (exists only between two specific domains and does not extend further)."},{"id":"d5_q_048","domain":"D5","difficulty":"easy","question":"When implementing new access controls using the IAAA model, which of the following would be used for identification?","options":["Passwords","Usernames","Role-Based Access Control (RBAC)","Non-repudiation"],"answer":1,"explanation":"In IAAA, identification is the first step — the user claims an identity by providing a unique identifier, most commonly a username. Passwords are used for authentication (verifying the claimed identity). RBAC is an authorisation mechanism. Non-repudiation is part of accountability, ensuring actions cannot be denied."},{"id":"d5_q_049","domain":"D5","difficulty":"medium","question":"A HMAC-based one-time password (HOTP) is an example of which type of authentication factor?","options":["Something you know — knowledge-based","Something you are — biometrics","Somewhere you are — geolocation","Something you have — possession-based"],"answer":3,"explanation":"HOTP is generated by a physical security token or authenticator application — something the user must possess. It qualifies as 'something you have' (Type 2). It is not knowledge-based (the user does not memorise the OTP), not biometric, and not tied to a location. The time-based equivalent (TOTP) also falls under Type 2 for the same reason."},{"id":"d5_q_050","domain":"D5","difficulty":"medium","question":"After the CEO reports that the fingerprint reader frequently fails to recognise her, she asks you to lower the sensitivity on the readers. What is a potential NEGATIVE side effect of this?","options":["Increased false rejects — more legitimate users would be turned away","True accepts would decrease — the system would recognise fewer authorised users","Increased false accepts — the system may grant access to unauthorised individuals","True rejects would increase — more attackers would be blocked"],"answer":2,"explanation":"Lowering sensitivity makes the biometric system less strict, which reduces false rejections (good for the CEO) but increases false acceptance — the system may now match an unauthorised individual's fingerprint to an authorised template. This raises the FAR (False Acceptance Rate), the more serious error type, because it grants unauthorised access. True accepts and true rejects are correct outcomes, not side effects."},{"id":"d5_q_051","domain":"D5","difficulty":"medium","question":"An administrator sees that a user's account is being used from a foreign country at 03:00 when the employee is known to be local. What is the FIRST action the administrator should take?","options":["Lock the account immediately to stop any further unauthorised access","Call the user to check whether they authorised the activity","Monitor the attacker's actions to gather intelligence on their techniques","Take no action until a formal incident response policy is in place"],"answer":0,"explanation":"The first priority is to stop the breach by locking the account — this immediately prevents further unauthorised access or damage. Calling the user and gathering intelligence are valid follow-up steps, but only after the account is secured. Delaying action to wait for a formal policy while an active intrusion is underway is never acceptable; security best practice requires an immediate protective response."},{"id":"d5_q_052","domain":"D5","difficulty":"hard","question":"In Kerberos, when a client wants access to a specific service and contacts the TGS, what does it send?","options":["The user's plaintext password","The user ID used in the initial AS request","The raw session key from the AS","An authenticator (TGT + service request encrypted with the client/TGS session key)"],"answer":3,"explanation":"In step 3 of the Kerberos flow, the client sends the TGS: (1) the TGT received from the AS (encrypted with the TGS secret key), (2) a service request, and (3) an authenticator — a timestamp encrypted with the client/TGS session key, proving the client knows the session key without sending it in clear. Kerberos never sends plaintext passwords. The user ID was only relevant in step 1. The raw session key is never transmitted."},{"id":"d5_q_053","domain":"D5","difficulty":"medium","question":"You want to ensure accountability in your access control implementation — that users cannot deny performing actions. Which mechanism should you use?","options":["Usernames — to uniquely identify users","Passwords — to authenticate users before they act","Role-Based Access Control (RBAC) — to limit what users can do","Non-repudiation — digital signatures or audit trails that prove who did what"],"answer":3,"explanation":"Non-repudiation ensures that an entity cannot deny performing an action. It is achieved through mechanisms such as digital signatures or robust, tamper-evident audit trails. Usernames provide identification but can be shared or stolen. Passwords provide authentication but not accountability. RBAC controls authorisation — it limits actions but does not prove they were taken by a specific individual."},{"id":"d5_q_054","domain":"D5","difficulty":"easy","question":"After implementing biometrics, too many authorised employees are being incorrectly rejected. Which metric describes this problem?","options":["CER — Crossover Error Rate","FAR — False Acceptance Rate","FRE — not a recognised biometric metric","FRR — False Rejection Rate"],"answer":3,"explanation":"FRR (False Rejection Rate) measures how often the biometric system incorrectly rejects an authorised user — the Type 1 error. The scenario describes exactly this. CER is the crossover point where FRR equals FAR (used to benchmark system accuracy). FAR (Type 2 error) is the opposite problem — unauthorised users being accepted. FRE is not a standard biometric term."},{"id":"d5_q_055","domain":"D5","difficulty":"medium","question":"Your startup is evaluating access management models. Which of the following is NOT a recognised, commonly used type of access control?","options":["DAC (Discretionary Access Control)","MAC (Mandatory Access Control)","TRAC (Trust Ratio Access Control)","RBAC (Role-Based Access Control)"],"answer":2,"explanation":"TRAC (Trust Ratio Access Control) is not a recognised or standard access control model. DAC, MAC, and RBAC are all well-established models: DAC gives owners control over their resources; MAC enforces central policy via labels and clearances; RBAC assigns permissions based on organisational roles. Rule-Based Access Control (RuBAC) exists but is not abbreviated as RUBAC or TRAC."},{"id":"d5_q_056","domain":"D5","difficulty":"medium","question":"Which type of authentication is the WORST to have compromised, because the credential cannot be reissued?","options":["Type 1 — something you know (passwords, PINs)","Type 2 — something you have (tokens, smart cards)","Type 3 — something you are (biometrics)","Type 4 — not a recognised standard authentication type"],"answer":2,"explanation":"Type 3 (biometrics) is the worst to have compromised because biometric characteristics — fingerprints, iris patterns, facial geometry — are permanent and cannot be reissued or changed. A compromised password (Type 1) can be reset. A stolen token (Type 2) can be replaced. But you cannot issue someone a new fingerprint. This irreversibility makes protecting biometric templates critically important."},{"id":"d5_q_057","domain":"D5","difficulty":"easy","question":"Your organisation uses one-time passwords pushed to a phone application every 30 seconds. Which type of token is this?","options":["HOTP — HMAC-based One-Time Password (event-based)","ROTP — not a widely recognised OTP standard","TOTP — Time-Based One-Time Password","BOTP — not an established OTP standard"],"answer":2,"explanation":"TOTP (Time-Based One-Time Password) generates a new OTP at fixed time intervals — typically every 30 seconds. This matches the scenario exactly. HOTP is event-based — the password changes after each use, not on a timer. ROTP and BOTP are not recognised OTP standards."},{"id":"d5_q_058","domain":"D5","difficulty":"medium","question":"When discussing Type 3 (biometric) authentication, which of the following terms does NOT belong?","options":["FAR — False Acceptance Rate","CER — Crossover Error Rate","CRR","FRR — False Rejection Rate"],"answer":2,"explanation":"CRR is not a recognised metric in biometric authentication. The standard biometric performance metrics are: FAR (False Acceptance Rate — Type 2 error, unauthorised user accepted), FRR (False Rejection Rate — Type 1 error, authorised user rejected), and CER (Crossover Error Rate — the sensitivity point where FAR equals FRR, used as a benchmark for comparing systems)."},{"id":"d5_q_059","domain":"D5","difficulty":"easy","question":"You are adding random data to each password before it is hashed, to prevent rainbow table and dictionary attacks. What is this technique called?","options":["Applying a nonce","Salting","Key stretching","Setting clipping levels"],"answer":1,"explanation":"Salting is the process of adding a unique random string (the salt) to each password before hashing. Even if two users share the same password, their stored hashes will differ because of unique salts, making pre-computed rainbow tables useless. A nonce prevents replay attacks in authentication sessions. Key stretching slows brute force. Clipping levels set thresholds on failed login attempts."},{"id":"d5_q_060","domain":"D5","difficulty":"easy","question":"When a user swipes an access card through a reader, which technology is the card most likely using?","options":["Contactless (RFID/NFC) — no swipe needed","Magnetic stripe","Contact smart card — inserted into a slot","HOTP token — generates a one-time code"],"answer":1,"explanation":"Swiping implies a magnetic stripe card — the stripe on the back is physically read by the card reader. Contactless cards (RFID/NFC) are tapped or waved near a reader, not swiped. Contact smart cards are inserted into a slot where electrical contacts align with the chip. HOTP tokens generate OTPs and are not swiped."},{"id":"d5_q_061","domain":"D5","difficulty":"hard","question":"Your organisation wants to migrate away from CHAP authentication. Which of the following is a legitimate security concern with CHAP that could justify this?","options":["CHAP sends credentials in plaintext over the network","CHAP stores client passwords on the server in a form that can be exploited offline if the server is compromised","CHAP uses SSL, which is no longer considered secure","CHAP uses PPP, making it incompatible with modern networks"],"answer":1,"explanation":"CHAP uses a challenge-response mechanism so passwords are never sent in plaintext. However, the server must store a verifiable form of the password to validate responses — if an attacker gains access to the server, those stored credentials can be used in offline attacks to recover the original passwords. This is the primary reason organisations migrate to more modern protocols using stronger, non-reversible credential storage. SSL usage and PPP compatibility are not reasons to abandon CHAP."},{"id":"d6_q_001","domain":"D6","difficulty":"medium","question":"What is the PRIMARY difference between a vulnerability scan and a penetration test?","options":["A vulnerability scan is performed by external parties; pen tests are always internal","A vulnerability scan identifies weaknesses; a pen test attempts to EXPLOIT those weaknesses","A pen test is automated; a vulnerability scan is always manual","A vulnerability scan tests physical security; a pen test tests logical security only"],"answer":1,"explanation":"Vulnerability scanning identifies and lists vulnerabilities (the Vulnerability in Risk = Threat × Vulnerability). Pen testing attempts to match those vulnerabilities with actual exploits to prove real Risk. Risk = Threat × Vulnerability."},{"id":"d6_q_002","domain":"D6","difficulty":"hard","question":"During a penetration test, the tester discovers a critical vulnerability not in the original scope. What should they do FIRST?","options":["Exploit it to demonstrate the full risk to management","Document it and report it, but do not exploit it — it is outside the SOW","Fix the vulnerability immediately to help the organization","Ignore it as it is outside scope and continue the test"],"answer":1,"explanation":"Pen testers operate strictly within the SOW. Exploiting out-of-scope systems may be illegal even if permitted. The correct action is to document and report the finding. Testers document vulnerabilities — they do NOT fix them."},{"id":"d6_q_003","domain":"D6","difficulty":"medium","question":"A SOC 2 Type II report differs from a Type I report in which MOST important way?","options":["Type II covers financial reporting; Type I covers operational controls","Type II is publicly available; Type I is confidential","Type II covers operating EFFECTIVENESS over a minimum 6-month period; Type I covers design at a single point in time","Type II is performed by internal auditors; Type I requires a third party"],"answer":2,"explanation":"SOC 2 Type I = suitability of design at a single point in time. SOC 2 Type II = suitability of design AND operating effectiveness over a minimum 6-month period. Type II is better, more expensive, and proves controls are actually working over time."},{"id":"d6_q_004","domain":"D6","difficulty":"hard","question":"An organization uses a SaaS application. During an audit, who is responsible for securing the underlying infrastructure and application?","options":["The customer — they chose the vendor and are fully responsible","The cloud provider — they manage the entire application stack in SaaS","It is split 50/50 between the provider and customer","The regulator who mandated the use of the SaaS platform"],"answer":1,"explanation":"In SaaS, the cloud provider manages and secures the entire application stack (infrastructure, platform, software). The customer is responsible for data and possibly access control. However, ultimate responsibility for data PROTECTION lies with the organization."},{"id":"d6_q_005","domain":"D6","difficulty":"medium","question":"Which type of pen test BEST simulates an attack by a malicious insider with admin access?","options":["Black Box — because insiders have no knowledge","Grey Box — because insiders have partial knowledge","White Box — because it simulates full internal knowledge and privileged access","Red Team — because it uses physical attack methods"],"answer":2,"explanation":"White Box (Crystal/Clear Box) pen testing gives the tester full internal network knowledge and access, equivalent to a privileged employee or administrator. Black Box = external attacker. Grey Box = limited user/vendor access."},{"id":"d6_q_006","domain":"D6","difficulty":"hard","question":"An attacker calls an employee claiming to be the CEO and demands urgent wire transfer of funds to avoid a lawsuit. Which social engineering technique is PRIMARILY being used?","options":["Familiarity — building a common connection with the victim","Scarcity — implying a limited time window","Urgency combined with Authority — creating time pressure while posing as a figure of authority","Consensus — implying everyone else has already complied"],"answer":2,"explanation":"This attack combines Authority (impersonating the CEO — a trusted/feared figure) and Urgency (must act now to avoid lawsuit). These two are frequently combined in whaling and vishing attacks."},{"id":"d6_q_007","domain":"D6","difficulty":"medium","question":"What is the MAIN purpose of reviewing audit logs?","options":["Preventive — to stop attacks before they happen","Detective — to identify what happened after the fact","Corrective — to fix vulnerabilities found during testing","Deterrent — to discourage attackers from targeting the system"],"answer":1,"explanation":"Reviewing audit logs is primarily a DETECTIVE control. It identifies events after they occur. NIST SP 800-92 recommends collecting network security, OS, and application logs. Centralized logging with automation is key."},{"id":"d6_q_008","domain":"D6","difficulty":"hard","question":"A company is auditing its hybrid cloud environment. Which challenge is UNIQUE to hybrid environments compared to pure cloud or pure on-premise?","options":["The shared responsibility model no longer applies","Compliance with HIPAA or PCI-DSS is not required","Maintaining a consistent security posture across both on-premise AND cloud resources simultaneously","Physical security of data centers becomes irrelevant"],"answer":2,"explanation":"Hybrid environments present unique challenges: maintaining consistent security posture across both environments, ensuring proper integration, mapping data flows, and coordinating incident response across both on-premise and cloud. This complexity is the defining challenge."},{"id":"d6_q_009","domain":"D6","difficulty":"medium","question":"A developer runs automated tools that submit random, malformed data to an application to see if it crashes. What testing technique is this?","options":["Static Testing — passively examining the source code","Dynamic Testing — actively executing the code under normal conditions","Fuzzing — submitting random malformed data to find unpredictable states or crashes","Regression Testing — checking for defects introduced by a recent code change"],"answer":2,"explanation":"Fuzzing (Fuzz Testing) submits random, malformed data as inputs to find crashes or unpredictable states. If the program crashes or hangs, the fuzz test has found a vulnerability. It is a black box testing technique."},{"id":"d6_q_010","domain":"D6","difficulty":"hard","question":"After completing a penetration test, the tester discovers sensitive PII files. According to best practices, what should they do?","options":["Copy the files to prove access and include them in the report","Access and read the files to assess the full extent of the breach","Note that they could access the target location (where a dummy file was placed) and report it — without accessing actual PII","Immediately notify the data subjects that their PII may be compromised"],"answer":2,"explanation":"Best practice places a dummy file in the same location as real PII. If the pen tester can reach the dummy file, it proves they could reach the actual data. They report this finding but do NOT access real PII, maintaining data integrity and legal compliance."},{"id":"d6_q_011","domain":"D6","difficulty":"medium","question":"What is the MOST significant risk associated with centralized audit log storage?","options":["Logs take up too much storage space","If the central log repository is compromised, an attacker can delete or modify evidence","Centralized logs cannot be read by correlation tools","Local administrators have too much access to centralized logs"],"answer":1,"explanation":"Centralized logs should be automated, secured, and even administrators should have limited access. Best practice: maintain a hashed, untouched central repository AND a separate copy for analysis. This protects log integrity."},{"id":"d6_q_012","domain":"D6","difficulty":"hard","question":"Which statement BEST describes the relationship between compliance checks and security audits?","options":["Audits are ongoing; compliance checks are point-in-time events","Compliance checks and audits serve identical purposes and can replace each other","Audits are point-in-time events; compliance checks are ongoing and should be the foundation of risk management","Compliance checks are only performed by external third parties; audits can be internal"],"answer":2,"explanation":"Security audits are point-in-time events. Compliance checks are ongoing. Compliance should be the BEGINNING of a risk management program, not the ceiling. Continuous compliance monitoring provides much more value than periodic audits alone."},{"id":"d6_q_013","domain":"D6","difficulty":"medium","question":"A client asks whether your company's controls were merely well-designed, or whether they actually held up under daily operation for the past year. Which report answers that?","options":["SOC 2 Type I","SOC 2 Type II","SOC 3","SOC 1 Type I"],"answer":1,"explanation":"Type II is the only report that evaluates OPERATING EFFECTIVENESS over a period of time (6+ months), not just design. Type I only confirms the controls were suitably designed at one moment."},{"id":"d6_q_014","domain":"D6","difficulty":"hard","question":"QA confirms the login form accepts valid credentials and rejects blank fields. A security engineer separately tries SQL injection strings and oversized payloads in the same fields. What is the security engineer doing?","options":["Interface testing","Misuse case testing","Regression testing","Installation testing"],"answer":1,"explanation":"Misuse case testing evaluates the system against ATTACKER behavior (malicious/abnormal input), not normal expected use. QA's pass/fail check of normal inputs is standard functional testing; the injection attempts are misuse case testing."},{"id":"d6_q_015","domain":"D6","difficulty":"hard","question":"A researcher finds a flaw in your product without authorization, then emails your security team giving you 90 days to patch before they publish their findings. How should this researcher be classified?","options":["Black hat","White hat","Gray hat","Script kiddie"],"answer":2,"explanation":"No authorization to test (rules out white hat) but discloses responsibly rather than exploiting maliciously (rules out black hat). That mix of unauthorized access with non-malicious, disclosure-minded intent is the gray hat profile."},{"id":"d6_q_016","domain":"D6","difficulty":"medium","question":"Which of the following is a SIGN of healthy audit log management, rather than a common organizational failure?","options":["Logs are kept only for 30 days to save storage","Logs are reviewed on a regular, timely cadence","Logs from different systems use inconsistent formats","Logs are only checked after an incident is suspected"],"answer":1,"explanation":"The other three options describe the classic failure modes (short retention, lack of standardization for SIEM correlation, and reactive-only review). Regular, timely review is the practice that should be in place, not a problem to flag."},{"id":"d6_q_017","domain":"D6","difficulty":"hard","question":"A new authentication microservice will receive a session token from the login service and pass a user-permissions object to the billing service. Testing focuses on whether that token and object survive the handoffs correctly. What is being tested?","options":["Unit testing","Component interface testing","Full system interface testing","Installation testing"],"answer":1,"explanation":"This is specifically about data passed BETWEEN two adjacent components (login service to auth service to billing service), which is component interface testing — narrower than testing every exposed interface of the whole application."},{"id":"d6_q_018","domain":"D6","difficulty":"medium","question":"At the end of a development cycle, the QA team verifies every API endpoint, every external web service call, and the user-facing UI all correctly exchange data with each other. What level of testing is this?","options":["Unit testing","Component interface testing","Interface testing","Code coverage analysis"],"answer":2,"explanation":"Testing ALL exposed interfaces of the finished application — APIs, web services, and UI integration points together — is the defining scope of interface testing, broader than the narrower component interface testing."},{"id":"d6_q_019","domain":"D6","difficulty":"medium","question":"Before committing to an expensive third-party structured audit, an organization has its own staff informally review processes and flag likely compliance gaps. What is this preliminary review called, and who performs it?","options":["A structured audit, performed by external auditors","An unstructured audit, performed by internal auditors","A SOC 2 Type I, performed by a CPA firm","A penetration test, performed by ethical hackers"],"answer":1,"explanation":"Informal, preliminary, in-house reviews done ahead of a formal audit are unstructured audits, and they're performed by internal auditors — the opposite pairing (formal/external) describes a structured audit."},{"id":"d6_q_020","domain":"D6","difficulty":"hard","question":"A penetration testing contract states the tester has been given full administrative knowledge of network diagrams, source code, and credentials. Which THREE terms could all correctly describe this engagement?","options":["Black box, zero knowledge, opaque box","Gray box, partial knowledge, translucent box","White box, clear box, crystal box","Red team, blue team, purple team"],"answer":2,"explanation":"White box, clear box, and crystal box are interchangeable terms for full-knowledge penetration testing. The other option sets describe black box (no knowledge) or gray box (partial knowledge) testing, or unrelated red/blue/purple team concepts."},{"id":"d6_q_021","domain":"D6","difficulty":"medium","question":"A tester has just finished browsing a compromised system to understand its file structure and installed software. Which of the following is a LOGICAL next step?","options":["Gaining initial access to the system","Installing additional tools for deeper analysis","Signing the original Statement of Work","Conducting the initial reconnaissance phase from scratch"],"answer":1,"explanation":"Installing additional tools (or returning to discovery) logically follows system browsing. Gaining access and reconnaissance both happen BEFORE system browsing in the typical pen test flow, so the tester wouldn't repeat those next."},{"id":"d6_q_022","domain":"D6","difficulty":"medium","question":"A single developer writes a quick test to confirm that one validation function correctly rejects an empty string input. What kind of test is this?","options":["Component interface testing","Unit testing","Interface testing","Misuse case testing"],"answer":1,"explanation":"Testing the behavior of a single function or section of code, in isolation, is the definition of unit testing — the smallest and narrowest scope of the testing types in this domain."},{"id":"d1_q_001","domain":"D1","difficulty":"hard","question":"A breach occurs on a system you administer. You had applied all patches, followed the security policy, and documented your actions. Who is MOST likely liable?","options":["You, because the system was under your control","Senior management is ultimately liable, and you likely are not liable because you demonstrated Due Care","The vendor who sold the vulnerable software","No one, because breaches are unavoidable"],"answer":1,"explanation":"Senior leadership is ULTIMATELY liable. Because you can prove Due Care (prudent-person actions: patching, following policy, documentation), you are most likely not liable. Negligence is the opposite of Due Care."},{"id":"d1_q_002","domain":"D1","difficulty":"medium","question":"An organization values protecting society and the public good above all. Which (ISC)² Code of Ethics canon takes precedence when two canons conflict?","options":["Act honorably, honestly, justly, responsibly, and legally","Provide diligent and competent service to principals","Protect society, the common good, necessary public trust, and the infrastructure","Advance and protect the profession"],"answer":2,"explanation":"The canons are applied in ORDER of priority. Canon 1 — protect society, the common good, public trust, and infrastructure — takes precedence over the others."},{"id":"d1_q_003","domain":"D1","difficulty":"hard","question":"A laptop is worth $1,000, holds $9,000 of PII, and a theft is a total loss. The company loses 25 laptops per year. What is the ALE?","options":["$10,000","$25,000","$250,000","$225,000"],"answer":2,"explanation":"SLE = AV × EF = $10,000 × 100% = $10,000. ALE = SLE × ARO = $10,000 × 25 = $250,000 per year. This is the cost if you do nothing."},{"id":"d1_q_004","domain":"D1","difficulty":"medium","question":"A manager says 'we know this risk exists but we're choosing to ignore it and do nothing.' Which risk response is this, and is it acceptable?","options":["Risk Acceptance — acceptable for low risks","Risk Transference — acceptable via insurance","Risk Rejection — NEVER acceptable, the organization remains liable","Risk Avoidance — acceptable if the risk is high"],"answer":2,"explanation":"Ignoring a known risk is Risk Rejection, which is NEVER acceptable — you remain liable. Risk Acceptance (knowing the risk but mitigation costs more than the risk) is different and is acceptable for low risks."},{"id":"d1_q_005","domain":"D1","difficulty":"hard","question":"During incident handling, an investigator wants to examine a seized hard drive. What is the CORRECT approach to preserve evidence integrity?","options":["Examine the original drive directly to avoid copy errors","Make a bit-level copy, hash both original and copy, and examine only the copy","Format a backup and restore the data to a clean drive first","Boot the original drive to capture running processes"],"answer":1,"explanation":"Forensics is always done on COPIES, never originals. You hash both the original and the copy, confirm they match before and after the examination, maintaining a documented chain of custody."},{"id":"d1_q_006","domain":"D1","difficulty":"medium","question":"A company has EU customers but is based entirely in the US. A data breach occurs. How quickly must they notify under GDPR?","options":["Within 30 days","Within 72 hours","Within 24 hours","GDPR doesn't apply since they're US-based"],"answer":1,"explanation":"GDPR requires breach notification within 72 hours and applies to anyone with EU/EEA customers REGARDLESS of where the company is based. Fines can reach €20M or 4% of global turnover, whichever is greater."},{"id":"d1_q_007","domain":"D1","difficulty":"hard","question":"Which value is correct: MTD must be ___ RTO + WRT?","options":["less than","equal to","greater than or equal to","exactly half of"],"answer":2,"explanation":"MTD ≥ RTO + WRT. The total recovery time — restoring hardware (RTO) plus configuring/recovering software (WRT) — must be less than or equal to the Maximum Tolerable Downtime."},{"id":"d1_q_008","domain":"D1","difficulty":"medium","question":"In a RACI chart, which role is described as 'ultimately answerable for correct completion' and is limited to exactly one person per task?","options":["Responsible","Accountable","Consulted","Informed"],"answer":1,"explanation":"Accountable = ultimately answerable for the correct and thorough completion of the task; there should be only ONE accountable person. Responsible does the actual work; Consulted gives input (two-way); Informed is kept updated (one-way)."},{"id":"d2_q_001","domain":"D2","difficulty":"medium","question":"A subject has a 'Secret' clearance. To access a 'Secret – Crypto' labeled document, what does the subject need BEYOND the clearance?","options":["Nothing — clearance alone grants access","Formal Access Approval and a valid Need to Know","A higher clearance level","Approval from another subject at the same level"],"answer":1,"explanation":"Beyond appropriate clearance, the subject needs Formal Access Approval (a document from the data owner) AND a valid Need to Know. Having clearance alone is never sufficient."},{"id":"d2_q_002","domain":"D2","difficulty":"hard","question":"You must securely dispose of decommissioned SSDs holding sensitive data. Which method is appropriate?","options":["Degaussing, since it works on all media","ATA Secure Erase and/or physical destruction","A single quick format","Deleting all files and emptying the recycle bin"],"answer":1,"explanation":"SSDs cannot be degaussed (no magnetic media — they're EEPROM + DRAM). Use ATA Secure Erase and/or physical destruction. Formatting and deleting leave data recoverable."},{"id":"d2_q_003","domain":"D2","difficulty":"medium","question":"Who is responsible for performing backups, restores, and patching, following the directions of the data owner?","options":["The data/information owner","The data custodian","The mission/business owner","The auditor"],"answer":1,"explanation":"The data custodian is the technical hands-on role that performs backups, restores, patches, and configuration, following the data owner's directions. The data owner assigns labels and backup frequency."},{"id":"d2_q_004","domain":"D2","difficulty":"hard","question":"Before a new system can be placed into production, the data owner must formally accept the certification and the residual risk. What is this called?","options":["Certification","Accreditation","Scoping","Tailoring"],"answer":1,"explanation":"Accreditation is the data owner's formal acceptance of the certification and residual risk — required before production. Certification is the determination that controls meet requirements."},{"id":"d2_q_005","domain":"D2","difficulty":"easy","question":"An organisation stores sensitive records on hard drives, transmits financial data between offices over the network, and has employees actively viewing patient files on workstations. Which option correctly matches each activity to its data state?","options":["Stored records = data at rest · transmitted data = data in motion · viewed files = data in use","Stored records = data in use · transmitted data = data at rest · viewed files = data in motion","All three activities represent data in motion because the data is accessible","Stored records = data in motion · transmitted data = data in use · viewed files = data at rest"],"answer":0,"explanation":"Data at rest is information sitting on a storage medium (hard drive, tape, USB) that is not being moved or actively processed. Data in motion is information actively travelling across a network. Data in use is information being accessed, viewed, or processed by a user or application. Each state has distinct vulnerabilities and requires different protection strategies — encryption for at rest and in motion, and access controls/privacy screens for in use."},{"id":"d2_q_006","domain":"D2","difficulty":"easy","question":"Which of the following is a COMMON attack specifically targeting data 'in use'?","options":["Cryptanalysis — breaking encrypted ciphertext to recover the original data","Shoulder surfing — physically observing a screen or keyboard to steal information","Eavesdropping — intercepting data travelling across a network","All of the above — all are equally common attacks on data in use"],"answer":1,"explanation":"Shoulder surfing targets data in use by physically observing what is on a screen, notebook, or keyboard. It is a direct attack on actively displayed information. Cryptanalysis targets data at rest or in transit (the data is encrypted and must be broken). Eavesdropping (and MitM attacks) target data in motion on a network. Data in use cannot be encrypted while being displayed, so physical and procedural controls — clean desk policy, privacy screens, screen locks — are the primary defences."},{"id":"d2_q_007","domain":"D2","difficulty":"medium","question":"A company encrypts all traffic leaving its network to the internet but sends internal server-to-server traffic in plaintext. An attacker who compromises an internal machine captures unencrypted database queries containing credit card numbers. What security gap does this reveal?","options":["The company failed to encrypt data at rest on its database servers","The company failed to encrypt data in motion on its internal network","The company failed to implement a clean desk policy","The company failed to use full disk encryption on its firewalls"],"answer":1,"explanation":"The attacker captured data while it was travelling between internal systems — this is data in motion on the internal network. Encrypting only internet-bound traffic is a common mistake; internal traffic is just as vulnerable if an attacker gains a foothold inside the network perimeter. Encrypting internal traffic adds minimal latency but prevents an insider or compromised host from reading intercepted data. Data-at-rest encryption protects stored data on disk, not packets in transit. A clean desk policy protects printed documents. Firewall disk encryption is unrelated to network traffic."},{"id":"d2_q_008","domain":"D2","difficulty":"medium","question":"Which of the following is the MOST important factor to consider when developing a records retention policy?","options":["The cost of storing the records","The legal requirements for retaining the records","The likelihood of the records being accessed in the future","The sensitivity of the information contained in the records"],"answer":1,"explanation":"Legal requirements are the primary driver of a records retention policy. Various laws and regulations (HIPAA, PCI-DSS, SOX, GDPR) specify minimum periods for which certain record types must be kept — non-compliance can result in penalties, fines, and inability to defend against litigation. Storage cost is a secondary consideration and is increasingly manageable with modern digital storage. Future access likelihood and data sensitivity influence how records are stored and protected, but neither overrides a legal retention obligation."},{"id":"d2_q_009","domain":"D2","difficulty":"easy","question":"What is the LOWEST level of data classification used in a typical organisation?","options":["Top Secret — highest classification, grave consequences if disclosed","Secret — serious damage to the organisation if disclosed","Confidential — some damage if disclosed, restricted distribution","Public — freely shareable with no negative consequences"],"answer":3,"explanation":"Public is the lowest classification level. Public data can be openly disseminated without negative consequences and requires no special protection. Moving up: Confidential data could cause some organisational damage if improperly disclosed; Secret data could cause serious damage; Top Secret is the highest level and represents data whose unauthorised disclosure could have grave effects on the organisation or national security. Each level up requires more restrictive access controls."},{"id":"d2_q_010","domain":"D2","difficulty":"medium","question":"What is the MOST important factor to consider when implementing a data classification scheme?","options":["The organisation's available storage capacity for classified data","The sensitivity levels of the data — how much harm would result from unauthorised disclosure","The data retention policy currently in place","The access control system already deployed in the organisation"],"answer":1,"explanation":"Data classification is fun
