ll backup backs up everything covered by the backup policy — typically the entire database or system. Nothing is omitted based on when files were last changed. This completeness is the key strength of full backups, and also what makes them the single source of truth for a restore."},{"id":"d7_q_102","domain":"D7","difficulty":"easy","question":"What happens to archive bits after a full backup is performed?","options":["Archive bits are set to indicate all files now require backing up on the next run","Archive bits are only cleared for files that were actually changed since the last backup","Full backups ignore archive bits entirely — they are only used by incremental backups","All archive bits are cleared — indicating that every file in the backup has been successfully backed up"],"answer":3,"explanation":"A full backup clears all archive bits. The archive bit is a flag on a file that is set whenever the file is modified, signalling that it needs to be backed up. After a full backup runs, every file has been backed up so all archive bits are cleared (reset to 0). This behaviour distinguishes full backups from incremental and differential backups, which handle archive bits differently."},{"id":"d7_q_103","domain":"D7","difficulty":"medium","question":"Why might an organisation choose to perform full backups infrequently rather than every day?","options":["Full backups require a complete system shutdown, making daily runs disruptive to operations","Full backups are less secure than differential backups and should be minimised","Large datasets can take many hours to back up, making frequent full backups operationally impractical","Full backups cannot be automated and must be manually initiated each time"],"answer":2,"explanation":"Full backups capture everything, so for large datasets they can take many hours to complete. Running a multi-hour backup job frequently would strain storage resources, consume significant bandwidth, and potentially impact production systems. For this reason, organisations often schedule full backups weekly or less frequently, supplementing them with incremental or differential backups on other days."},{"id":"d7_q_104","domain":"D7","difficulty":"easy","question":"How many backup tapes are required to fully restore a system that uses only full backups?","options":["One tape — the most recent full backup contains everything needed for a complete restore","Two tapes — the current full backup plus the previous full backup for verification","One tape per database partition or volume in the system","The number of tapes depends on how many days have passed since the last full backup"],"answer":0,"explanation":"Restoring from a full backup requires just one tape (or one backup set) — the most recent full backup. Because a full backup contains a complete snapshot of everything, a single restore operation recovers the entire system. This simplicity of restoration is the primary advantage of full backups over incremental or differential strategies, which require multiple tapes to restore."},{"id":"d7_q_105","domain":"D7","difficulty":"medium","question":"An organisation runs a full backup every Wednesday night. A system failure occurs on Thursday morning. What is needed to restore the system?","options":["The Wednesday full backup tape plus any incremental backup from Wednesday night","The Wednesday full backup tape only — a single tape is sufficient for a complete restore","All full backup tapes from the past month to ensure no data is missed","A new full backup must be taken of the current failed state before restoration can begin"],"answer":1,"explanation":"Because a full backup captures everything in one operation, restoring on Thursday requires only the single Wednesday full backup tape. There is no need to chain multiple tapes or apply additional incremental tapes. This is the restore advantage of full backups: simplicity. One tape = complete restore. (Data created or modified between Wednesday's backup and Thursday's failure would still be lost, as it was not captured in the backup.)"},{"id":"d7_q_106","domain":"D7","difficulty":"medium","question":"What is the key operational trade-off when deciding how often to run full backups?","options":["Security vs accessibility — more frequent full backups increase the risk of sensitive data exposure on backup media","Completeness vs time — full backups capture everything but can take many hours, making frequent runs impractical for large datasets","Cost vs redundancy — additional tape media is expensive, so organisations limit full backup frequency to reduce costs","Reliability vs complexity — full backups are less reliable than incremental backups and should only be run occasionally"],"answer":1,"explanation":"The core trade-off with full backups is completeness versus time. A full backup is the most complete backup type — it captures everything — but for large datasets it can take many hours to run. This makes it impractical to run a full backup every day for large environments. Organisations balance the completeness of full backups with the time and resource cost, often supplementing with faster incremental or differential backups between full backup runs."},{"id":"d7_q_107","domain":"D7","difficulty":"easy","question":"What does an incremental backup include?","options":["Everything in the system — identical to a full backup but stored separately","Only files modified since the last FULL backup, regardless of any incremental backups in between","Everything that has changed since the last backup — whether that was the last incremental or the last full","Only files that have never been backed up before"],"answer":2,"explanation":"An incremental backup captures everything that has changed since the last backup — whether that was the previous incremental backup or the last full backup. It does NOT reset to the last full backup each time. This is what keeps incremental backups small and fast: each run captures only the changes since the most recent backup event."},{"id":"d7_q_108","domain":"D7","difficulty":"easy","question":"What does an incremental backup do to archive bits after it runs?","options":["It sets all archive bits to indicate the entire system now needs a full backup","It clears archive bits only for files that were NOT changed since the last backup","It leaves archive bits unchanged — only full backups modify archive bits","It clears the archive bits on all files it backed up, marking them as successfully saved"],"answer":3,"explanation":"Like a full backup, an incremental backup clears the archive bits on the files it backs up. The archive bit is set when a file changes and cleared when that file is backed up. After an incremental run, all files that were backed up have their archive bits reset to 0. The next incremental will then only pick up files whose archive bits are set again — meaning they changed after the last backup."},{"id":"d7_q_109","domain":"D7","difficulty":"easy","question":"Why are incremental backups generally fast to perform?","options":["They use compression algorithms that are more efficient than those used in full backups","They only back up what has changed since the last backup, resulting in a much smaller data set than a full backup","They run in parallel across all storage volumes simultaneously","They skip verification steps that full backups perform after completion"],"answer":1,"explanation":"Incremental backups are fast because they only back up what has changed since the last backup (incremental or full). If only a small fraction of data changed on a given day, only that fraction needs to be written to backup media. This is far less data than a full backup — making incremental backups quick to run and efficient in terms of storage."},{"id":"d7_q_110","domain":"D7","difficulty":"medium","question":"An organisation runs a full backup every Sunday and an incremental backup every other night. A failure occurs on Thursday morning. How many tapes are required to fully restore the system?","options":["1 tape — the most recent incremental backup contains all changes","2 tapes — the Sunday full backup and Wednesday's incremental","3 tapes — Sunday full, Tuesday incremental, and Wednesday incremental","4 tapes — the Sunday full backup plus Monday, Tuesday, and Wednesday incremental tapes"],"answer":3,"explanation":"With incremental backups, every tape in the chain since the last full backup is needed. To restore to Wednesday's state on Thursday: (1) the Sunday full backup captures the baseline, then (2) Monday's incremental adds Monday's changes, (3) Tuesday's incremental adds Tuesday's changes, and (4) Wednesday's incremental adds Wednesday's changes. All four tapes must be applied in sequence to reach a complete, up-to-date restore."},{"id":"d7_q_111","domain":"D7","difficulty":"medium","question":"What is the primary DISADVANTAGE of using incremental backups?","options":["Incremental backups take much longer to run than full or differential backups","Incremental backups do not clear archive bits, which causes confusion with full backups","Restore time is lengthy — recovery requires the full backup plus every incremental tape since, potentially many tapes","Incremental backups can only be used once per week and cannot be run daily"],"answer":2,"explanation":"The primary disadvantage of incremental backups is restore complexity and time. To restore, you need the last full backup PLUS every individual incremental tape created since that full backup. For example, with a monthly full backup and daily incrementals, a restore near the end of the month could require up to 30 tapes applied in sequence. This is significantly more time-consuming than restoring from 1 full backup and 1 differential backup."},{"id":"d7_q_112","domain":"D7","difficulty":"hard","question":"An organisation performs a monthly full backup and daily incremental backups. Comparing restore time: which scenario is faster — restoring from this strategy or restoring from a weekly full backup plus a single differential backup?","options":["Monthly full + daily incremental is faster — smaller daily backups mean fewer files to restore each time","Both strategies require the same number of restore operations and take the same amount of time","Weekly full + single differential is faster — you need only 2 tapes regardless of when the failure occurs","Monthly full + daily incremental is faster — because incrementals compress better than differentials"],"answer":2,"explanation":"A weekly full + single differential restore always requires just 2 tapes: the last full backup and the most recent differential (which contains everything changed since the full). By contrast, a monthly full + daily incremental restore near month-end could require up to 30 tapes — the full backup plus up to 29 daily incrementals applied in sequence. Incremental backups are fast to CREATE but slow to RESTORE. Differential backups are slower to create (they grow daily) but always fast to restore."},{"id":"d7_q_113","domain":"D7","difficulty":"easy","question":"What does a differential backup include?","options":["Everything in the system — identical in scope to a full backup","Everything that has changed since the last backup of any type (incremental or full)","Everything that has changed since the last FULL backup, regardless of any differential backups in between","Only files that have been modified more than once since the last full backup"],"answer":2,"explanation":"A differential backup captures everything that has changed since the last FULL backup. Unlike an incremental backup (which resets to the last backup of any kind), a differential always measures from the last full backup. This means each differential grows larger day by day, but a restore only ever needs two things: the last full backup and the single most recent differential."},{"id":"d7_q_114","domain":"D7","difficulty":"easy","question":"What does a differential backup do to archive bits?","options":["It clears all archive bits — the same behaviour as a full backup","It clears archive bits only for files that were already backed up in a previous differential","It does NOT clear archive bits — files remain flagged as needing backup after the differential runs","It sets archive bits on all files to prepare them for the next incremental run"],"answer":2,"explanation":"A differential backup does NOT clear archive bits. This is the key technical difference from full and incremental backups (both of which clear archive bits). Because the archive bit is never cleared, every differential backup continues to pick up everything changed since the last full backup — the set of changed files only grows. This is why differentials take progressively longer to run as the week goes on."},{"id":"d7_q_115","domain":"D7","difficulty":"easy","question":"How many tapes are required to fully restore a system that uses a full backup plus differential backups?","options":["1 tape — the most recent differential contains the full system state","2 tapes — the last full backup and the most recent differential backup","One tape for each differential backup run since the last full backup","The full backup plus every differential run since the full backup"],"answer":1,"explanation":"Restoring from a differential strategy requires exactly 2 tapes: (1) the last full backup (which provides the complete baseline) and (2) the single most recent differential backup (which contains all changes since that full backup). You do not need every intermediate differential — only the most recent one, since each differential already includes everything changed since the last full. This is the restore advantage over incremental backups."},{"id":"d7_q_116","domain":"D7","difficulty":"medium","question":"An organisation runs a full backup every Sunday and a differential backup every other night. A system failure occurs on Thursday morning. What tapes are needed to restore?","options":["Wednesday's differential tape only — it contains all changes since Sunday","Sunday full + Monday + Tuesday + Wednesday differential tapes — 4 tapes total","Sunday full backup and Wednesday's differential backup — 2 tapes total","Sunday full backup and every differential tape from Monday through Wednesday — 4 tapes"],"answer":2,"explanation":"With differential backups, restore always requires exactly 2 tapes — regardless of when the failure occurs. Wednesday's differential already contains all changes made since Sunday's full backup (including Monday's and Tuesday's changes). So: Sunday full backup + Wednesday differential = complete restore in 2 tapes. This is the key restore advantage of differentials over incrementals (which would require 4 tapes in the same scenario)."},{"id":"d7_q_117","domain":"D7","difficulty":"medium","question":"Why do differential backups take progressively LONGER to run as the week goes on?","options":["The backup software performs additional integrity checks on each subsequent run","Each differential backs up everything changed since the last FULL backup — the set of changed files only grows larger each day","Differential backups re-verify all previously backed-up data to detect corruption","The archive bits are cleared after each run, so the next differential must re-scan the entire system"],"answer":1,"explanation":"Differential backups do not clear archive bits, so each daily differential includes everything changed since the last full backup — Monday's changes, then Monday+Tuesday's on Tuesday, then Monday+Tuesday+Wednesday's on Wednesday, and so on. The backup set grows larger with every passing day. By contrast, incremental backups are fast because each run only captures what changed since the previous incremental (archive bits ARE cleared, so the slate resets each day)."},{"id":"d7_q_118","domain":"D7","difficulty":"hard","question":"Why should you never mix incremental and differential backups on the SAME data set?","options":["They use incompatible compression formats, causing data corruption during restore","Mixing them causes archive bits to be set and cleared unpredictably — the result is gaps where some changed files are missed in both backup types","Using both on the same data requires proprietary backup software and is not supported by standard tools","Mixing them doubles storage usage because both backup types capture the same changed files"],"answer":1,"explanation":"Incremental backups CLEAR archive bits; differential backups DO NOT. If you mix them on the same data, you get conflicting archive bit states: an incremental run clears bits that a differential was relying on to identify all changes since the last full backup. The result is an inconsistent backup chain with gaps — some changes may not be captured by either type. You can use both strategies in the same backup solution if they target DIFFERENT data sets with different retention needs, but never on the same data."},{"id":"d7_q_119","domain":"D7","difficulty":"easy","question":"What does RAID stand for?","options":["Redundant Array of Integrated Drives","Rapid Access to Indexed Data","Redundant Array of Independent/Inexpensive Disks","Replicated Array of Independent Disks"],"answer":2,"explanation":"RAID stands for Redundant Array of Independent/Inexpensive Disks. It is used to build fault tolerance into systems — using redundant hardware to achieve the highest possible uptime. RAID comes in two basic forms: disk mirroring (same data on multiple disks) and disk striping (data spread across multiple disks for speed)."},{"id":"d7_q_120","domain":"D7","difficulty":"easy","question":"What does RAID 0 provide, and what does it NOT provide?","options":["RAID 0 provides fault tolerance through mirroring — no speed improvement","RAID 0 provides both speed and redundancy using distributed parity across 3 disks","RAID 0 provides faster read/write speed through striping — but provides NO fault tolerance or redundancy","RAID 0 provides mirroring across 2 identical disks with simultaneous writes"],"answer":2,"explanation":"RAID 0 is pure striping — data is written simultaneously across at least 2 disks, providing faster read/write performance. However, RAID 0 has NO mirroring, NO parity, and NO fault tolerance. If one disk fails, all data is lost. RAID 0 is used when speed matters more than redundancy. Minimum disks: 2."},{"id":"d7_q_121","domain":"D7","difficulty":"easy","question":"How does RAID 1 work?","options":["RAID 1 stripes data across disks with distributed parity for redundancy","RAID 1 is a mirror set — 2 disks hold identical data and every write is written to both disks simultaneously","RAID 1 stripes data across multiple disks for speed with no mirroring","RAID 1 uses a dedicated parity disk to allow recovery from a single disk failure"],"answer":1,"explanation":"RAID 1 is a mirror set. It uses 2 disks that hold completely identical data, and every write operation is written to both disks simultaneously. If one disk fails, the other contains a complete copy of all data. RAID 1 provides full redundancy but uses 2x the disk space for the same usable storage — the same trade-off as disk mirroring."},{"id":"d7_q_122","domain":"D7","difficulty":"medium","question":"What are the characteristics of RAID 5?","options":["RAID 5 is pure striping with no parity — identical to RAID 0 but requires 5 disks","RAID 5 uses mirroring across 5 disks for maximum redundancy","RAID 5 is block-level striping with distributed parity — requires at least 3 disks and combines speed with redundancy","RAID 5 requires a dedicated parity disk separate from the striped data disks"],"answer":2,"explanation":"RAID 5 uses block-level striping with distributed parity. Unlike RAID 0 (no parity) or RAID 1 (mirroring), RAID 5 distributes parity information across all disks rather than dedicating a separate parity disk. This gives RAID 5 the best of both worlds: the read/write speed of striping AND redundancy through parity. Minimum disks: 3. It can survive a single disk failure."},{"id":"d7_q_123","domain":"D7","difficulty":"medium","question":"Does disk striping alone provide redundancy? If not, what is required to add it?","options":["Yes — striping distributes data across disks, which inherently protects against single disk failure","No — striping alone provides no redundancy; parity (often using XOR) must be added, and this requires at least 3 disks","Yes — as long as at least 3 disks are used, striping automatically provides fault tolerance","No — redundancy requires a dedicated mirror disk to be added to the stripe set"],"answer":1,"explanation":"Disk striping alone does NOT provide redundancy. Striping splits data across disks for speed — if one disk fails, data is lost. To add redundancy to a striped array, parity must be used (commonly via XOR calculations). Once parity is included, at least 3 disks are required. This is the basis of RAID 5: striping with distributed parity achieves both speed and fault tolerance."},{"id":"d7_q_124","domain":"D7","difficulty":"medium","question":"Why can using disks from the same manufacturer and batch be a risk, even in a fault-tolerant RAID array?","options":["Disks from the same manufacturer use incompatible firmware that causes RAID controller errors","Same-batch disks share identical MTBF characteristics — they tend to fail around the same time, risking simultaneous failure before the first disk is replaced","Same-manufacturer disks cannot be mixed in RAID 1 or RAID 5 configurations","Warranty terms prevent replacing same-manufacturer disks under SLA agreements"],"answer":1,"explanation":"Disks from the same manufacturer and production batch have the same MTBF (Mean Time Between Failures) — meaning they were built to last a similar amount of time and tend to wear out together. In a RAID array where all disks are from the same batch, a second disk may fail before the first failed disk is replaced and the array rebuilt. If more than one disk fails before recovery, RAID can no longer protect the data and a tape restore is required."},{"id":"d7_q_125","domain":"D7","difficulty":"easy","question":"What does MTBF stand for, and what does it measure?","options":["Maximum Threshold Before Failure — the upper limit of disk writes before failure","Mean Time Between Failures — the average time a component is expected to operate before failing","Minimum Time Before Fault — the earliest point at which a disk could fail after installation","Mean Transfer Bandwidth Factor — the rate at which disk performance degrades over time"],"answer":1,"explanation":"MTBF stands for Mean Time Between Failures. It is a measure of how long a hardware component (like a hard disk) is expected to operate before failing. Disks from the same manufacturer and production date share similar MTBF values, which is why a server full of identical disks may experience multiple disk failures around the same time — a significant risk even with RAID protection."},{"id":"d7_q_126","domain":"D7","difficulty":"medium","question":"What is MTTR, and how is it used in data centre SLAs?","options":["Mean Time To Recover — the time taken to restore data from backup tapes after a RAID failure","Maximum Transfer Threshold Rate — the guaranteed minimum disk I/O speed in the SLA","Mean Time To Repair — the time within which a vendor must be onsite with a replacement disk; SLAs often specify 4 or 8 hours","Mean Time To Replicate — the time required to mirror data to an offsite backup location"],"answer":2,"explanation":"MTTR stands for Mean Time To Repair. In data centre SLAs, vendors agree to have a replacement disk onsite within a specified time window — commonly 4 or 8 hours. This metric ensures that when a disk fails, a replacement arrives quickly enough to rebuild the RAID array before a second disk fails. MTTR is especially important given the MTBF risk: if all disks in a server are from the same batch, they may fail close together, so a fast MTTR reduces the window of vulnerability."},{"id":"d7_q_127","domain":"D7","difficulty":"hard","question":"A server uses RAID 5 with 3 disks from the same manufacturer batch. One disk fails, and before a replacement is installed, a second disk also fails. What is the correct course of action?","options":["Replace both failed disks and allow RAID 5 to automatically rebuild the array from parity","Replace one disk, rebuild the array, then replace the second failed disk in a second rebuild cycle","Restore data from backup tapes — RAID 5 can only survive a single disk failure, and a second failure before rebuild means the array cannot recover","Replace the RAID controller — simultaneous disk failures indicate a controller fault, not a disk fault"],"answer":2,"explanation":"RAID 5 can tolerate only a single disk failure. When one disk fails, the array is in a degraded state and continues operating using parity — but it has NO remaining fault tolerance until the failed disk is replaced and rebuilt. If a second disk fails before the first is replaced, the array loses its ability to reconstruct data. The only option is to restore from backup tapes. This is the key RAID limitation: RAID protects against a single disk failure in a fault-tolerant type, but multiple simultaneous failures require tape recovery."},{"id":"d7_q_128","domain":"D7","difficulty":"medium","question":"An organisation is implementing e-vaulting. How does e-vaulting help recover from data loss on primary systems?","options":["It creates local backup copies stored alongside the primary systems for fast on-site recovery","It automatically transfers data to an offsite storage location — enabling rapid recovery by applying only the changes since the last backup","It encrypts all data on a cloud platform, making the data more secure and easier to recover than traditional local backups","It creates point-in-time snapshots stored on the primary systems, which can be used to roll back data without accessing any external storage"],"answer":1,"explanation":"E-vaulting (electronic vaulting) is a backup service that automatically transfers data to an offsite storage system. The offsite copy can be used to recover data if the primary systems experience data loss or failure. E-vaulting is typically fast to recover from because it transfers only the changes since the last backup (incremental), which allows backups to run more frequently than full backups. The defining feature is offsite storage for disaster recovery — not encryption, cloud platform, or local storage."},{"id":"d7_q_129","domain":"D7","difficulty":"medium","question":"In a standard data centre server configuration, which of the following components is commonly NOT made redundant?","options":["Power supplies — most servers have a single power supply with no failover","CPUs — in most standard server configurations, CPUs are not redundant; a CPU failure causes a crash rather than automatic failover","Network interfaces — servers typically have only one network card, making the network connection a single point of failure","Hard drives — RAID is rarely used in data centres due to cost and complexity"],"answer":1,"explanation":"CPUs are typically NOT redundant in standard data centre servers. While some high-end mainframes have redundant CPUs, most servers have a single CPU or multiple CPUs dedicated to specific tasks — if one fails, the server crashes or degrades significantly rather than switching automatically. CPU failures are also rare, and the cost and complexity of CPU redundancy is rarely justified. Server clustering is the preferred approach for CPU-level redundancy. By contrast, power supplies, network interfaces, and hard drives (via RAID) are commonly made redundant in data centre environments."},{"id":"d7_q_130","domain":"D7","difficulty":"easy","question":"What is the MINIMUM number of disks required to implement disk striping in a RAID configuration?","options":["1 disk — striping can be applied to a single high-speed disk to improve sequential read speed","2 disks — disk striping splits data into blocks and spreads them across at least 2 disks simultaneously","3 disks — a third disk is required to store parity information for fault tolerance","4 disks — the minimum for balanced striping performance across multiple I/O channels"],"answer":1,"explanation":"Disk striping (as in RAID 0) requires a minimum of 2 disks. Data is split into blocks and spread across both disks simultaneously, increasing read and write speed because multiple disks are accessed at once. A single disk cannot be used for striping — by definition, striping distributes data across more than one disk. While 3 or more disks can also be used for striping, 2 is the minimum. Note: RAID 0 provides no fault tolerance — if either disk fails, all data is lost."},{"id":"d7_q_131","domain":"D7","difficulty":"easy","question":"What is a Business Continuity Plan (BCP)?","options":["A plan that specifies how the IT department will restore servers and databases after a cyberattack","The process of creating long-term strategic business plans, policies, and procedures for continued operation after a disruptive event","A financial recovery plan that ensures insurance claims are filed correctly after a disaster","A short-term emergency checklist for the first 24 hours after a disaster strikes"],"answer":1,"explanation":"A BCP (Business Continuity Plan) is the process of creating long-term strategic business plans, policies, and procedures that allow an organisation to continue operating after a disruptive event. It covers the entire organisation — not just IT — and lists a range of disaster scenarios along with the steps the organisation must take in each scenario to return to regular operations. If done poorly, the organisation may be severely impacted or forced to close permanently."},{"id":"d7_q_132","domain":"D7","difficulty":"easy","question":"What is the scope of a Business Continuity Plan (BCP)?","options":["It covers only the IT systems and data that the organisation relies on for day-to-day operations","It covers only the critical business processes that generate the most revenue","It covers the entire organisation — everything that could be impacted by a disruptive event, not just IT","It covers only the disaster recovery procedures for the primary data centre"],"answer":2,"explanation":"A BCP applies to the entire organisation — everything that could be impacted by a disruptive event, not just IT. While IT systems are a key component, a BCP also addresses business operations, staff, facilities, communications, and any other organisational function that must continue or recover after a disaster. Limiting the scope to IT only would leave critical non-IT business functions unprotected."},{"id":"d7_q_133","domain":"D7","difficulty":"medium","question":"Which statistics best illustrate why Business Continuity Planning is critical for organisations?","options":["60% of organisations recover within 30 days and only 5% close permanently after a major data loss","Organisations with a BCP recover 10 times faster than those without one, but long-term closure rates are similar","Of companies that experience a major data loss, 43% never reopen and 29% close within two years","Data loss events cost an average of $5 million per incident, but insurance typically covers 80% of losses"],"answer":2,"explanation":"The statistics make the stakes of BCP clear: 43% of companies that experience a major data loss never reopen, and an additional 29% close within two years. This means that over 70% of organisations that suffer a major data loss eventually go out of business. This underscores why avoiding disasters, mitigating their impact, and having a strong recovery plan are not optional — they are existential for the organisation."},{"id":"d7_q_134","domain":"D7","difficulty":"medium","question":"A BCP often contains a range of sub-plans. Which of the following is NOT typically a sub-plan contained within a BCP?","options":["COOP (Continuity of Operations Plan) and Crisis Communications Plan","DRP (Disaster Recovery Plan) and ISCP (Information System Contingency Plan)","Occupant Emergency Plan and Critical Infrastructure Protection Plan","Data Classification Policy and Access Control Standard"],"answer":3,"explanation":"Data Classification Policy and Access Control Standard are security governance documents — not BCP sub-plans. A BCP typically contains: COOP (Continuity of Operations Plan), Crisis Communications Plan, Critical Infrastructure Protection Plan, Cyber Incident Response Plan, DRP (Disaster Recovery Plan), ISCP (Information System Contingency Plan), and an Occupant Emergency Plan. These plans together address how all aspects of the organisation continue, communicate, and recover after a disruptive event."},{"id":"d7_q_135","domain":"D7","difficulty":"easy","question":"What does COOP stand for in the context of a Business Continuity Plan?","options":["Crisis Operations and Oversight Plan","Continuity of Operations Plan","Critical Outage Operations Protocol","Coordinated Organisational Operations Plan"],"answer":1,"explanation":"COOP stands for Continuity of Operations Plan. It is one of the sub-plans typically contained within a BCP. The COOP addresses how essential functions of the organisation will continue to operate during and after a disruption — ensuring that critical activities do not stop even when normal operations are impaired. It is distinct from the DRP (Disaster Recovery Plan), which focuses more on restoring IT systems."},{"id":"d7_q_136","domain":"D7","difficulty":"medium","question":"What are the five phases of the BCP lifecycle, in the correct order?","options":["Planning → Testing → Implementation → Review → Archiving","Risk Assessment → BIA → Strategy → Planning → Testing","Analysis → Solution Design → Implementation → Test & Acceptance → Maintenance","Identification → Classification → Mitigation → Response → Recovery"],"answer":2,"explanation":"The BCP lifecycle follows five phases in a continuous cycle: (1) Analysis — assess risks, threats, and business impacts; (2) Solution Design — develop the strategies and plans to address identified risks; (3) Implementation — put the plans and controls in place; (4) Test & Acceptance — validate that the plan works through exercises and testing; (5) Maintenance — keep the plan updated as the organisation and threat landscape evolve. The cycle then repeats, feeding lessons learned back into Analysis."},{"id":"d7_q_137","domain":"D7","difficulty":"easy","question":"What are the four phases of the DRP (Disaster Recovery Plan) lifecycle, in the correct order?","options":["Identify, Protect, Detect, Respond","Prevention, Detection, Containment, Recovery","Mitigation, Preparation, Response, Recovery","Analysis, Planning, Execution, Review"],"answer":2,"explanation":"The DRP lifecycle consists of four phases: (1) Mitigation — reduce the impact and likelihood of a disaster; (2) Preparation — build the programs, procedures, and tools needed to respond; (3) Response — react during the disaster by following the established procedures; (4) Recovery — reestablish basic functionality and return to full production. The first two phases are pre-disaster; the last two are post-disaster."},{"id":"d7_q_138","domain":"D7","difficulty":"easy","question":"What is the goal of the MITIGATION phase in the DRP lifecycle?","options":["Reestablish basic functionality and get the organisation back to full production after a disaster","Build the programs, procedures, and tools that staff will use when a disaster occurs","Reduce the impact and likelihood of a disaster occurring","React to an active disaster by following established response procedures"],"answer":2,"explanation":"Mitigation aims to reduce both the impact and the likelihood of a disaster. This is a pre-disaster phase — actions are taken before a disaster occurs to make it less probable and less damaging if it does happen. Examples include implementing redundant systems, conducting risk assessments, applying security controls, and enforcing policies. Mitigation is distinguished from Preparation (which builds response tools) and Recovery (which restores operations after a disaster)."},{"id":"d7_q_139","domain":"D7","difficulty":"easy","question":"What does the PREPARATION phase of the DRP lifecycle involve?","options":["Reducing the probability and impact of a disaster through pre-emptive controls and policies","Building the programs, procedures, and tools that will be used when responding to a disaster","Following established procedures to react to an active disaster as it unfolds","Restoring systems and returning the organisation to full production after a disaster"],"answer":1,"explanation":"Preparation involves building the programs, procedures, and tools needed to respond when a disaster happens. This includes writing and testing the DRP, training staff, running drills, stockpiling resources, and establishing communication plans. Preparation is a pre-disaster phase — the work is done in advance so that when a disaster strikes, the organisation can respond quickly and effectively without improvising."},{"id":"d7_q_140","domain":"D7","difficulty":"easy","question":"What does the RECOVERY phase of the DRP lifecycle involve?","options":["Reducing the impact and likelihood of future disasters through updated controls","Activating response teams and following emergency procedures during an active disaster","Documenting lessons learned and updating the DRP after a disaster","Reestablishing basic functionality and getting the organisation back to full production after a disaster"],"answer":3,"explanation":"Recovery is the post-disaster phase focused on reestablishing basic functionality and returning the organisation to full production. It begins after the immediate response phase has stabilised the situation. Recovery involves restoring systems, data, and services — progressing from basic operations back to normal business capacity. It is different from the Response phase (reacting to the active disaster) and Mitigation (reducing future risk)."},{"id":"d7_q_141","domain":"D7","difficulty":"medium","question":"Which of the four DRP lifecycle phases are PRE-disaster activities, and which are POST-disaster?","options":["All four phases are pre-disaster — the entire plan is created before any disaster occurs","Mitigation and Recovery are pre-disaster; Preparation and Response are post-disaster","Mitigation and Preparation are pre-disaster; Response and Recovery are post-disaster","Preparation and Response are pre-disaster; Mitigation and Recovery are post-disaster"],"answer":2,"explanation":"Mitigation (reduce impact/likelihood) and Preparation (build programs, procedures, and tools) are pre-disaster phases — they happen before a disaster to reduce risk and get ready to respond. Response (react during the disaster) and Recovery (restore functionality after) are post-disaster phases — they are activated when a disaster actually occurs. Understanding this split helps the organisation prioritise investment: pre-disaster work reduces the cost and complexity of post-disaster work."},{"id":"d7_q_142","domain":"D7","difficulty":"hard","question":"A major flood has struck an organisation's data centre. The emergency team has just completed containing the immediate damage and the building is now safe to re-enter. Which DRP lifecycle phase does the organisation enter next?","options":["Mitigation — the team should now reduce the likelihood of a future flood by improving drainage and flood barriers","Preparation — the team should update the DRP and retrain staff based on lessons learned from the flood","Response — the team is still actively responding to the disaster until all systems are back online","Recovery — the team now focuses on reestablishing basic functionality and returning to full production"],"answer":3,"explanation":"Once the immediate Response phase (containing damage, ensuring safety, activating emergency procedures) is complete, the organisation enters the Recovery phase — focusing on reestablishing basic functionality and progressively returning to full production. Recovery covers restoring systems, data, and services from backups and alternate sites. Mitigation and Preparation are pre-disaster phases and are not activated during an active disaster event, though lessons learned will eventually feed back into them."},{"id":"d7_q_143","domain":"D7","difficulty":"easy","question":"The BCP team has three sub-teams responsible for handling a disaster or disruption. What are they?","options":["Prevention Team, Response Team, and Restore Team","Rescue Team, Recovery Team, and Salvage Team","Activation Team, Mitigation Team, and Continuity Team","Assessment Team, Failover Team, and Rebuild Team"],"answer":1,"explanation":"The BCP team is divided into three sub-teams: (1) Rescue Team (Activation/Notification) — handles the disaster as it happens; (2) Recovery Team (Failover) — gets the alternate site or rebuilt systems up and running; (3) Salvage Team (Failback) — returns full operations back to the primary site. Each team has a distinct role in the disaster timeline, from initial response through to returning home."},{"id":"d7_q_144","domain":"D7","difficulty":"easy","question":"What is the Rescue Team (Activation/Notification) responsible for during a disaster?","options":["Getting the alternate site operational and rebuilding systems as quickly as possible","Returning infrastructure, staff, and operations back to the primary site after recovery","Dealing with the disaster as it happens — evacuating employees, notifying personnel via call trees, pulling the network or shutting down systems, and performing initial damage assessment","Prioritising and restoring the most critical systems first to maintain minimum viable operations"],"answer":2,"explanation":"The Rescue Team activates during the disaster itself. Their responsibilities include: evacuating employees to safety, notifying appropriate personnel using call trees, taking immediate technical action (such as pulling the network from an infected server or shutting down systems), and conducting an initial damage assessment. They are the first responders — their job is to control the immediate situation before the Recovery Team takes over."},{"id":"d7_q_145","domain":"D7","difficulty":"medium","question":"What is the Recovery Team (Failover) responsible for, and in what order do they bring systems back online?","options":["Returning operations to the primary site; they bring the least critical systems up first to stabilise before moving critical ones","Getting the alternate site operational or rebuilding systems; they bring the MOST CRITICAL systems up first","Conducting damage assessment and notifying stakeholders; critical systems are documented but not yet restored","Maintaining communication with external vendors; system restoration order is determined by vendor availability"],"answer":1,"explanation":"The Recovery Team is responsible for failover — getting the alternate site up and running as fast as possible, or rebuilding systems at the primary site. Critically, they bring the MOST CRITICAL systems online first, ensuring that the organisation's highest-priority functions are restored before less important ones. This is the opposite of the Salvage Team's approach during failback, which starts with least critical systems first."},{"id":"d7_q_146","domain":"D7","difficulty":"medium","question":"What is the Salvage Team (Failback) responsible for, and why do they bring the LEAST critical systems back first?","options":["Returning full infrastructure, staff, and operations to the primary site (or a new facility); least critical systems come back first to ensure the new site is stable before moving critical systems","Decommissioning the alternate site after operations return to normal; least critical systems are shut down first to minimise disruption","Restoring data from backup tapes to primary systems; least critical data is restored first because it takes less time","Negotiating with insurance providers about damaged equipment; least critical equipment claims are filed first"],"answer":0,"explanation":"The Salvage Team handles failback — returning the full infrastructure, staff, and operations to the primary site (or to a new facility if the old one was destroyed). They deliberately bring least critical systems back first. This cautious approach ensures the primary site is stable and ready before critical systems are moved back. Moving critical systems to an unstable environment could cause a second outage, so the Salvage Team validates the site with non-critical workloads before committing the most important systems."},{"id":"d7_q_147","domain":"D7","difficulty":"medium","question":"What is the key difference in system restoration priority between the Recovery Team (Failover) and the Salvage Team (Failback)?","options":["Both teams bring the most critical systems up first — speed is the priority in all phases of disaster recovery","The Recovery Team brings up least critical systems first; the Salvage Team brings up most critical systems first","The Recovery Team brings up MOST critical systems first; the Salvage Team brings up LEAST critical systems first","Both teams bring the least critical systems up first to verify stability before risking critical workloads"],"answer":2,"explanation":"This is a key exam distinction: the Recovery Team (Failover) brings up the MOST CRITICAL systems first — the goal is to get the organisation's highest-priority functions operational at the alternate site as quickly as possible. The Salvage Team (Failback) brings up the LEAST CRITICAL systems first — because before moving critical systems back to the primary site, the team needs to verify that the site is stable and ready. Moving critical systems to an unverified environment risks a second disruption."},{"id":"d7_q_148","domain":"D7","difficulty":"hard","question":"A fire has destroyed part of an organisation's primary data centre. The organisation is now operating from an alternate site. The primary data centre has been rebuilt and is ready to receive systems again. Which BCP sub-team takes the lead now, and how do they sequence the work?","options":["Recovery Team — they lead the return to the primary site and bring the most critical systems back first to restore full business operations quickly","Rescue Team — they lead the return because their call trees and notification procedures are needed to coordinate the move back to the primary site","Salvage Team — they lead the failback, returning infrastructure and operations to the primary site and bringing the least critical systems back first to verify stability before moving critical systems","All three teams operate simultaneously — the Rescue Team notifies, the Recovery Team rebuilds, and the Salvage Team moves systems back at the same time"],"answer":2,"explanation":"This scenario describes failback — returning from the alternate site to the (now rebuilt) primary site. This is the Salvage Team's responsibility. They return the full infrastructure, staff, and operations to the primary site, deliberately starting with least critical systems first. This validates that the rebuilt site is stable and ready before the critical systems are moved back. If critical systems were moved first and the site had a hidden issue, the organisation would face a third disruption. The Rescue Team's role ended at the initial response; the Recovery Team completed failover to the alternate site. Now the Salvage Team completes the cycle."},{"id":"d7_q_149","domain":"D7","difficulty":"easy","question":"What is a BIA (Business Impact Analysis) and what is its primary purpose?","options":["A financial audit that calculates the total cost of a disaster recovery programme","A risk scoring tool that ranks threats by likelihood and maps them to existing security controls","A process that identifies critical and non-critical organisation systems, functions, and activities for continuity planning","A legal review that determines which regulatory requirements apply to the organisation's data handling"],"answer":2,"explanation":"A BIA (Business Impact Analysis) identifies and classifies the organisation's systems, functions, and activities as either critical or non-critical. For each critical item, the BIA assigns values (such as RPO and RTO) that define acceptable levels of disruption and data loss. The BIA is a foundational input to the BCP and DRP — you cannot build an effective continuity plan without first knowing which functions are critical and what the acceptable impact limits are."},{"id":"d7_q_150","domain":"D7","difficulty":"medium","question":"According to a BIA, what makes a system or function 'critical'?","options":["A function is critical only if it directly generates revenue for the organisation","A function is critical if it is managed by the IT department and runs on production infrastructure","A function is critical if disruption is considered unacceptable — acceptability is also based on the cost of recovery — or if it is required by law","A function is critical if it has been identified as a single point of failure in the network architecture"],"answer":2,"explanation":"In a BIA, 'critical' means that disruption to the function would be unacceptable to the organisation. Acceptability is evaluated against the cost of recovery — if recovery would be too expensive relative to the business value lost, the function is likely critical. A function may also be deemed critical if compliance or law mandates it must remain operational (e.g., regulatory reporting, safety systems). Revenue generation alone is not the defining criterion."},{"id":"d7_q_151","domain":"D7","difficulty":"easy","question":"What does RPO stand for, and what does it measure?","options":["Recovery Process Outcome — the documented steps taken to restore a system after a disaster","Recovery Point Objective — the acceptable amount of data that cannot be recovered (the maximum tolerable data loss)","Redundancy Planning Overview — the minimum hardware redundancy required for a critical system","Restoration Priority Order — the sequence in which systems must be restored after a disaster"],"answer":1,"explanation":"RPO stands for Recovery Point Objective. It defines the acceptable amount of data that cannot be recovered — in other words, the maximum tolerable data loss for a given system, function, or activity. The RPO must be set so that this data loss threshold is never exceeded. It is one of two values assigned to each critical system in a BIA, and it directly drives backup frequency decisions."},{"id":"d7_q_152","domain":"D7","difficulty":"medium","question":"An organisation only performs a full backup once per week. What does this imply about their RPO for the affected systems?","options":["Their RPO is zero — weekly backups mean no data loss is ever accepted","Their RPO is 24 hours — daily recovery points are implied by a weekly schedule","Their RPO is up to one week — they accept the loss of up to one week of data if a disaster strikes before the next backup","Their RPO is undefined — RPO can only be calculated when using incremental or differential backups"],"answer":2,"explanation":"If an organisation only backs up once per week, their effective RPO is up to one week. A disaster occurring just before the weekly backup could result in losing nearly a full week of data — and by running weekly backups, the organisation has implicitly accepted that level of loss. To achieve a tighter RPO (e.g., 1 hour of data loss), more frequent backups would be required. RPO directly determines how often backups must run."},{"id":"d7_q_153","domain":"D7","difficulty":"medium","question":"How many values does the BIA assign to each critical in-scope system, function, or activity?","options":["One value — a criticality rating from 1 to 5 based on business impact","Two values — including RPO (Recovery Point Objective) as one of them","Three values — likelihood, impact, and recovery time","Four values — one for each phase of the DRP lifecycle"],"answer":1,"explanation":"For each critical system, function, or activity identified in the BIA, two values are assigned. RPO (Recovery Point Objective) is one of them — defining the maximum acceptable data loss. The second value is RTO (Recovery Time Objective) — defining how long the system can be down before the impact becomes unacceptable. Together, RPO and RTO give the recovery team measurable targets to design the continuity and disaster recovery strategies around."},{"id":"d7_q_154","domain":"D7","difficulty":"hard","question":"A legal regulation requires an organisation to maintain real-time transaction logs at all times. How does this affect the BIA classification and RPO for the transaction logging system?","options":["The legal requirement means the system is automatically excluded from the BIA — regulatory systems are handled separately","The system is classified as critical (legal mandate makes disruption unacceptable) and its RPO must be near-zero — even minutes of data loss would breach compliance","The system is classified as non-critical because legal compliance is the regulator's concern, not the organisation's continuity team","The RPO is set to match the regulatory filing cycle — typically monthly or quarterly"],"answer":1,"explanation":"When a function is required by law, the BIA automatically classifies it as critical — regulatory mandates make any disruption unacceptable by definition. The RPO must then reflect that legal requirement: if real-time transaction logs must be maintained at all times, the organisation cannot afford to lose even a few minutes of log data. This forces a very aggressive RPO (near-zero), which in turn demands continuous backup or replication rather than periodic backups. Legal requirements are a key driver of both BIA criticality classification and RPO tightness."},{"id":"d7_q_155","domain":"D7","difficulty":"easy","question":"What does MTD stand for, and what does it measure in business continuity planning?","options":["Mean Time to Deploy — the average time needed to deploy a patched system back into production","Maximum Tolerable Downtime — the total time a system can be inoperable before the organisation is severely impacted","Minimum Time to Detect — the fastest possible detection time for a system failure or security incident","Managed Threat Detection — a process for identifying and prioritising security threats to critical systems"],"answer":1,"explanation":"MTD stands for Maximum Tolerable Downtime. It is the total time a system can remain inoperable before the organisation suffers severe impact. The time required to rebuild and reconfigure a system must be less than or equal to the MTD. Other frameworks use different terms (MAD, MTO, MAO, MTPoD), but for the CISSP exam the term to know and use is MTD. The formula that governs it is: MTD ≥ RTO + WRT."},{"id":"d7_q_156","domain":"D7","difficulty":"easy","question":"What does RTO (Recovery Time Objective) measure in the context of BIA and DRP?","options":["The maximum amount of data that can be lost without exceeding the organisation's acceptable threshold","The time required to configure and test software on a recovered system before it returns to production","The amount of time to restore the system hardware after a disaster — the hardware recovery target","The total time the organisation can survive without any IT systems before severe business impact"],"answer":2,"explanation":"RTO (Recovery Time Objective) is the amount of time it takes to restore the system hardware after a disaster. It is the hardware recovery target — how fast the physical or virtual system infrastructure must be back online. The RTO must not exceed the MTD. RTO covers the hardware restoration; WRT (Work Recovery Time) then covers the subsequent software configuration and testing needed before the system is fully operational."},{"id":"d7_q_157","domain":"D7","difficulty":"easy","question":"What does WRT (Work Recovery Time) measure?","options":["The time required to restore hardware to an operational state after a disaster","The acceptable amount of data that cannot be recovered after a system failure","The amount of time required to configure a recovered system — the software configuration time after hardware is restored","The total maximum time a system can be down before causing severe organisational impact"],"answer":2,"explanation":"WRT (Work Recovery Time) is the time required to configure a recovered system — specifically, the software configuration and setup time needed after the hardware has been restored. Once RTO brings the hardware back online, WRT covers the work of restoring data, reinstalling software, testing, and making the system ready for production use. Together, RTO (hardware) + WRT (software configuration) must not exceed the MTD."},{"id":"d7_q_158","domain":"D7","difficulty":"medium","question":"What is the relationship between MTD, RTO, and WRT?","options":["RTO = MTD + WRT — the recovery time is the sum of total downtime and configuration time","MTD = RTO × WRT — maximum downtime is calculated by multiplying the two recovery targets","WRT must always equal RTO — both must be identical to maintain a balanced recovery strategy","MTD ≥ RTO + WRT — the maximum tolerable downtime must be at least as long as the hardware restore time plus the software configuration time combined"],"answer":3,"explanation":"The governing formula is MTD ≥ RTO + WRT. MTD is the absolute ceiling — the total time a system can be down. RTO is the time to restore hardware, and WRT is the time to configure software after hardware is restored. The combined total (RTO + WRT) must not exceed the MTD. If RTO + WRT would exceed the MTD, the recovery strategy is insufficient and must be improved — faster hardware restoration, faster configuration, or both."},{"id":"d7_q_159","domain":"D7","difficulty":"medium","question":"Which CISSP exam term should be used for the maximum time a system can be down, and what are the equivalent terms used by other frameworks?","options":["Use RTO for the CISSP exam; other frameworks call it MTD, WRT, or MTO","Use MTD for the CISSP exam; equivalent terms in other frameworks include MAD (Maximum Allowable Downtime), MTO (Maximum Tolerable Outage), MAO (Maximum Acceptable Outage), and MTPoD (Maximum Tolerable Period of Disruption)","Use RPO for the CISSP exam; MTD, RTO, and WRT are all synonyms for the same concept","Use BIA for the CISSP exam; MTD, MAD, and MTO are all sub-components of the BIA process"],"answer":1,"explanation":"For the CISSP exam, the term to know and use is MTD — Maximum Tolerable Downtime. Other frameworks and standards may use MAD (Maximum Allowable Downtime), MTO (Maximum Tolerable Outage), MAO (Maximum Acceptable Outage), or MTPoD (Maximum Tolerable Period of Disruption) to refer to the same concept. Despite the different names, they all describe the same thing: the maximum time a system can be inoperable before causing severe organisational impact. On the exam, always answer with MTD."},{"id":"d7_q_160","domain":"D7","difficulty":"hard","question":"A critical system has an MTD of 8 hours. The team estimates it takes 5 hours to restore the hardware (RTO) and 4 hours to reconfigure the software (WRT). Is this recovery plan acceptable?","options":["Yes — the plan is acceptable because RTO (5 hours) is less than the MTD (8 hours)","Yes — the plan is acceptable because WRT (4 hours) is less than the MTD (8 hours)","No — the plan is unacceptable because RTO + WRT = 9 hours, which exceeds the MTD of 8 hours","No — the plan is unacceptable because the RTO alone already exceeds the WRT, which violates BIA requirements"],"answer":2,"explanation":"Applying the formula: MTD ≥ RTO + WRT → 8 hours ≥ 5 + 4 = 9 hours. The plan fails: 9 hours exceeds the 8-hour MTD. Even though each individual component (RTO and WRT) may seem manageable in isolation, what matters is their combined total. The recovery strategy must be revised — either the hardware restore must be accelerated (lower RTO), the software configuration sped up (lower WRT), or both — until RTO + WRT ≤ 8 hours."},{"id":"d7_q_161","domain":"D7","difficulty":"medium","question":"In the BIA context, what practical planning benefit does MTBF provide beyond simply predicting when hardware will fail?","options":["It sets the RTO — MTBF directly defines how quickly a failed component must be replaced","It defines the RPO — MTBF determines how frequently backups must run to avoid data loss","It helps the organisation plan for spare parts inventory and estimate how often hardware replacements will be needed","It calculates the MTD — MTBF determines the maximum time a system can be down before severe impact"],"answer":2,"explanation":"In a BIA context, MTBF (Mean Time Between Failures) helps the organisation plan spare parts inventory and estimate hardware replacement frequency. Knowing that a component fails on average every X hours allows the team to stock appropriate spare parts and schedule maintenance windows proactively. This reduces surprise failures and shortens MTTR, which directly protects the MTD. MTBF does not directly set RTO, RPO, or MTD — it informs the planning that surrounds them."},{"id":"d7_q_162","domain":"D7","difficulty":"easy","question":"What is MOR (Minimum Operating Requirements) in the context of BIA and disaster recovery?","options":["The minimum number of staff required on-site for the organisation to be considered legally operational","The minimum environmental and connectivity requirements for critical systems to function — also used to define minimum system requirements for DR sites","The minimum backup frequency required to meet the RPO for each critical system","The minimum financial reserves an organisation must maintain to fund disaster recovery operations"],"answer":1,"explanation":"MOR (Minimum Operating Requirements) defines the minimum environmental and connectivity requirements for critical systems to function. This includes factors like power, cooling, network connectivity, and hardware specifications. MOR also applies to DR sites — it defines the minimum specification a DR facility must meet to host critical systems. Importantly, the MOR is not the same as full production specifications: an organisation may not need a fully spec'd system to resume essential business functionality."},{"id":"d7_q_163","domain":"D7","difficulty":"medium","question":"What is the key insight about MOR (Minimum Operating Requirements) when activating a DR site?","options":["The DR site must match full production specifications exactly — any degradation violates the SLA","The DR site only needs to meet the MOR — a fully spec'd system is not required to resume critical business functionality","MOR applies only to the primary site; DR sites must be over-provisioned to handle unexpected load during a disaster","MOR is only applicable to network connectivity — hardware specs at the DR site are determined separately by the recovery team"],"answer":1,"explanation":"A key MOR insight is that the DR site does not need to replicate the full production environment — it only needs to meet the Minimum Operating Requirements. Critical systems can often function on lower-spec hardware in a DR environment because the MOR defines the floor, not the ceiling. This allows organisations to use less expensive DR infrastructure and still resume essential business operations. Full production capacity can be restored later once the primary site is rebuilt."},{"id":"d7_q_164","domain":"D7","difficulty":"medium","question":"On the BIA recovery timeline, what period does RPO (Recovery Point Objective) actually measure?","options":["The time from when a disaster is declared to when the first recovery action begins","The time from when systems are recovered to when full production resumes","The data loss window going BACKWARD from the disaster to the last backup — the period for which data cannot be recovered","The total span from disaster to the point where normal business operations are fully restored"],"answer":2,"explanation":"On the BIA timeline, RPO runs backward from the disaster event to the most recent backup. It represents the data loss window — the period during which data was created but not yet backed up when the disaster struck. For example, if the last backup was taken 6 hours before the disaster, the RPO gap is 6 hours of lost data. Reducing RPO means backing up more frequently, so the gap between the last backup and any potential disaster is minimised."},{"id":"d7_q_165","domain":"D7","difficulty":"medium","question":"On the BIA recovery timeline, what specific activities does the WRT (Work Recovery Time) span cover?","options":["WRT covers the period from disaster declaration to when physical hardware has been replaced","WRT covers the period from the last backup to when the disaster is declared","WRT covers restoring backups and systems testing — the period after hardware is recovered but before the system returns to full production","WRT covers the initial damage assessment and notification of stakeholders immediately following the disaster"],"answer":2,"explanation":"On the BIA timeline, WRT (Work Recovery Time) begins once the hardware is back online (end of RTO) and spans two key activities: (1) Restore backups — loading data from backup media onto the recovered system; (2) Systems testing — verifying the system works correctly before returning it to production. WRT ends when 'Resume Production' is reached. Together, RTO (hardware) + WRT (restore backups + systems testing) must not exceed the MTD."},{"id":"d7_q_166","domain":"D7","difficulty":"hard","question":"What is the correct sequence of events on the BIA recovery timeline, from normal operations through to resuming production after a disaster?","options":["Disaster → Normal Business → System recovery starts → Systems recovered → Resume Production → Systems testing","Normal Business (Backup) → Disaster → System recovery starts → Systems recovered → Restore backups → Systems testing → Resume Production","Normal Business (Backup) → Disaster → Restore backups → Systems recovered → System recovery starts → Resume Production → Systems testing","Disaster → System recovery starts → Restore backups → Systems recovered → Normal Business → Systems testing → Resume Production"],"answer":1,"explanation":"The correct BIA recovery timeline sequence is: Normal Business (Backup) → [RPO gap: data loss window] → Disaster → System recovery starts → Systems recovered [end of RTO] → Restore backups → Systems testing [this is WRT] → Resume Production. MTD spans from the disaster all the way to Resume Production (covering both RTO and WRT). Understanding this sequence is critical for CISSP scenarios that test which phase or metric applies to a given point in the timeline."},{"id":"d7_q_167","domain":"D7","difficulty":"easy","question":"Which of the following is the HIGHEST priority when developing a Business Continuity Plan (BCP)?","options":["Implementing the most efficient and resilient IT systems to support continued operations","Ensuring the safety and well-being of all employees and personnel","Conducting regular backups and data recovery processes to protect organisational data","Protecting company assets and minimising financial losses during a disruption"],"answer":1,"explanation":"The highest priority in any BCP is ensuring the safety and well-being of employees and personnel. Human lives are irreplaceable — business assets, data, and finances can often be recovered, repaired, or compensated. IT systems can be upgraded, data can often be rebuilt, and financial losses can be mitigated through insurance. But the same cannot be said for human lives. In any disaster or crisis, human safety must come first before any operational or financial consideration."},{"id":"d7_q_168","domain":"D7","difficulty":"medium","question":"Which of the following is a key element of a comprehensive DRP (Disaster Recovery Plan)?","options":["Employee training programmes covering general workplace safety and emergency procedures","Fire prevention measures such as sprinkler systems and fire suppression equipment","Backup of data — ensuring systems and data can be restored quickly after a disaster","Intrusion detection systems to identify malicious activity on the network"],"answer":2,"explanation":"Data backup is a key element of a DRP because it is fundamental to restoring systems and enabling the organisation to continue functioning after a disaster. Without backed-up data, recovery may be impossible. Employee training is important but is not a component of the DRP itself — it supports execution of the plan. Fire prevention measures are part of a general safety plan, not a recovery plan. Intrusion detection systems are preventative security controls, whereas a DRP is a responsive measure for after a disaster has occurred."},{"id":"d7_q_169","domain":"D7","difficulty":"medium","question":"Which of the following is NOT a key component of a Business Continuity Plan (BCP)?","options":["Backup and recovery procedures — strategies to restore hardware, applications, and data","Risk assessment and management — identifying threats and mitigating risks to operations","Employee training and awareness — ensuring staff know their roles during a disruption","Legal and regulatory compliance — ensuring the organisation meets all applicable legal obligations"],"answer":3,"explanation":"Legal and regulatory compliance is important for all organisational operations, but it is not a specific component of a BCP. A BCP focuses on: backup and recovery procedures (restoring systems and data), risk assessment (identifying and managing threats), and employee training and awareness (ensuring staff understand their roles in a disruption). Compliance considerations may inform the BCP — for example, regulations may drive RPO or RTO requirements — but legal compliance itself is not one of the BCP's structural components."},{"id":"d7_q_170","domain":"D7","difficulty":"medium","question":"An IT security professional has built a recovery strategy covering detailed procedures for restoring servers, applications, and databases. A senior colleague says the plan is incomplete. Which critical elements should ALSO be addressed beyond IT system restoration?","options":["Only the restoration of email services, since email is the most critical business function for communication during a disaster","The color scheme and visual formatting of the disaster recovery documentation to ensure it is easy to read under pressure","Supply chain continuity, fuel availability for generators, internet connectivity alternatives, and dependencies on utilities such as power, water, and sewage","Only the physical security of the building perimeter during a disaster to prevent unauthorised access to damaged facilities"],"answer":2,"explanation":"A recovery strategy limited to IT systems is incomplete. The business depends on a web of supporting elements: generators need fuel (and the plan must address how it is obtained during a disaster), internet connectivity must have alternatives if regional infrastructure fails, supply chains need backup vendors, and basic utilities (power, water, sewage) must be accounted for because their loss makes a facility unusable even if all IT systems are operational. IT security professionals must think beyond their technical comfort zone and consider everything the organisation needs to function."},{"id":"d7_q_171","domain":"D7","difficulty":"medium","question":"Which of the following is the MOST effective method to mitigate supply chain risks?","options":["Implementing encryption on all communication channels to protect sensitive supply chain data","Conducting regular supply chain audits to assess supplier reliability, performance, and compliance, and to identify potential vulnerabilities proactively","Implementing strict vendor contract terms to enforce reliability and set clear expectations with suppliers","Implementing a regular training programme for supply chain employees to ensure they understand their roles and processes"],"answer":1,"explanation":"Regular supply chain audits are the most effective method among these options. Audits allow organisations to assess operations, evaluate supplier reliability and compliance, and identify risks — such as single-source dependencies, performance issues, or geopolitical vulnerabilities — before they cause disruption. Encryption protects communication but does not address supplier reliability or transport risks. Strict contract terms set expectations but cannot prevent disruptions from natural disasters or political instability. Employee training is valuable but addresses internal processes, not external supply chain risks. Audits drive proactive risk identification and mitigation."},{"id":"d7_q_172","domain":"D7","difficulty":"medium","question":"A data centre is experiencing frequent power outages causing unexpected downtime. Which strategy MOST effectively ensures power redundancy for the data centre?","options":["Implementing a single backup generator to provide power when the primary supply fails","Implementing a UPS (Uninterruptible Power Supply) system to provide immediate short-term power during outages","Implementing a dual feed power supply — drawing power from two independent sources so that if one fails, the other keeps operations fully running","Implementing a fuel cell system to convert fuel to electricity and reduce reliance on the grid"],"answer":2,"explanation":"A dual feed power supply is the most effective solution because it draws from two independent power sources. If one source fails or goes offline for maintenance, the other keeps the data centre fully operational with no gap in coverage. A single backup generator still represents a single point of failure (if it fails, there is no redundancy), and there is a brief switchover delay. A UPS provides only short-term bridging power and cannot sustain a data centre through an extended outage. A fuel cell system also represents a single point of failure and may have fuel supply, scalability, and compatibility challenges."},{"id":"d8_q_001","domain":"D8","difficulty":"medium","question":"On a CISSP question about the SDLC, an answer option describes the phases but never mentions 'secure' or 'security'. What should you do?","options":["Select it — security is implied","Eliminate it — for the exam, the SDLC always includes security in each phase","Select it only if it mentions testing","It depends on the methodology"],"answer":1,"explanation":"For the exam, the SDLC always has security built into each phase. If an SDLC answer omits 'secure' or 'security', it's wrong and can be eliminated."},{"id":"d8_q_002","domain":"D8","difficulty":"hard","question":"In Scrum, who is responsible for removing impediments to the team and ensuring the framework is followed, acting as a buffer rather than a traditional manager?","options":["Product Owner","Development Team","Scrum Master","Project Sponsor"],"answer":2,"explanation":"The Scrum Master facilitates, removes impediments, and ensures the Scrum framework is followed — acting as a buffer, NOT a traditional team lead or project manager. The Product Owner is the voice of the customer."},{"id":"d8_q_003","domain":"D8","difficulty":"medium","question":"A well-structured software system should have which combination of coupling and cohesion?","options":["High coupling and high cohesion","Low coupling and low cohesion","Low coupling and high cohesion","High coupling and low cohesion"],"answer":2,"explanation":"Low coupling (modules are independent) plus high cohesion (elements inside a module belong together) indicates a well-structured, readable, maintainable design."},{"id":"d8_q_004","domain":"D8","difficulty":"hard","question":"A foreign key in a child table does not match any primary key in the parent table. Which database integrity is broken?","options":["Semantic integrity","Entity integrity","Referential integrity","User-defined integrity"],"answer":2,"explanation":"Referential integrity requires every foreign key to match a primary key in the parent table. It's broken when a foreign key has no matching primary key. Entity integrity = unique non-null primary key; semantic = value matches data type."},{"id":"d8_q_005","domain":"D8","difficulty":"medium","question":"Which set of SQL statements belongs to the Data Definition Language (DDL)?","options":["SELECT, INSERT, UPDATE, DELETE","CREATE, ALTER, DROP","GRANT, REVOKE, COMMIT","BEGIN, ROLLBACK, SAVEPOINT"],"answer":1,"explanation":"DDL defines database structures: CREATE, ALTER, DROP. DML (Data Manipulation Language) works with the data itself: SELECT, INSERT, UPDATE, DELETE."},{"id":"d1_q_009","domain":"D1","difficulty":"easy","question":"During an attack, some of your data was deleted. Which leg of the CIA triad would be MOST affected?","options":["Availability — the data can no longer be accessed by authorized users","Confidentiality — unauthorized individuals may have seen the data before deletion","Integrity — the data is no longer accurate or complete","Authenticity — the origin of the data can no longer be verified"],"answer":0,"explanation":"Availability means authorized users can access data when needed. Deletion directly removes that access, making availability the primary impact. Integrity is also affected (data is incomplete), but the principal issue is that the data is simply gone and unavailable."},{"id":"d1_q_010","domain":"D1","difficulty":"medium","question":"You are the IT security manager at a large pharmaceutical company with sensitive research data and proprietary manufacturing processes. Which aspect of the CIA triad is MOST important to prioritize?","options":["Confidentiality — to prevent unauthorized access to sensitive research and proprietary processes","Integrity — to ensure research data is not altered or tampered with","Availability — to ensure authorized staff can always access the data they need","All three are equally important and must be addressed together"],"answer":0,"explanation":"In a pharmaceutical company, the primary risk is unauthorized access to proprietary research and manufacturing processes — which would cause loss of competitive advantage, regulatory breaches, and reputational damage. While integrity and availability matter, confidentiality is the dominant concern given the sensitivity of the data."},{"id":"d1_q_011","domain":"D1","difficulty":"medium","question":"With the CIA triad in mind, if an organization enforces too much confidentiality, which other principle will suffer the MOST?","options":["Availability — excessive access restrictions prevent authorized users from getting to data when needed","Integrity — heavy encryption introduces risks of data corruption or loss","Confidentiality — too many controls can undermine the confidentiality model itself","Accessibility — stricter controls reduce the overall accessibility of systems"],"answer":0,"explanation":"The CIA triad components must be balanced. When confidentiality is over-enforced — too many barriers, strict access controls, heavy encryption — authorized users struggle to access data when needed, directly reducing availability. Integrity is less directly impacted. Accessibility is not a standalone CIA triad component; it falls under availability."},{"id":"d1_q_012","domain":"D1","difficulty":"easy","question":"We often use the IAAA model in IT security. What does it do?","options":["Identifies, authenticates, and authorizes users and resources","Integrates and analyzes security data across the organization","Protects the confidentia
