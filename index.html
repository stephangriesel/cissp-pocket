de up of?","options":["Pre-arranged lists of common words and number sequences","Pre-computed tables mapping password hashes back to their plaintext equivalents","Pre-made tables matching biometric samples to stored password hashes","Pre-computed tables of password hashes generated using salts"],"answer":1,"explanation":"Rainbow tables are large pre-computed lookup tables that map hash values back to their original plaintext passwords, allowing an attacker to instantly reverse an unsalted hash. They do not contain biometric data. They are NOT built with salts — in fact salting defeats rainbow tables entirely, because each unique salt requires its own table, making pre-computation infeasible."},{"id":"d5_q_043","domain":"D5","difficulty":"easy","question":"Your bank sends a text message with a one-time code to enter alongside your username and password. What is this an example of?","options":["Single-factor authentication","A cookie stored on your device to remember you","Multi-factor authentication","Salting"],"answer":2,"explanation":"This is multi-factor authentication (MFA): your username and password are 'something you know' (Type 1), and the OTP received on your phone is 'something you have' (Type 2). Two different factor categories are combined. Single-factor uses only one category. A cookie represents a trusted device, not an SMS OTP. Salting is a password storage technique, not an authentication method."},{"id":"d5_q_044","domain":"D5","difficulty":"easy","question":"Which of the following is generally considered the WEAKEST form of authentication?","options":["Something you are — biometrics (Type 3)","Something you have — token or device (Type 2)","Something you know — passwords, PINs, passphrases (Type 1)","A combination of all three factors"],"answer":2,"explanation":"'Something you know' is the weakest factor because knowledge can be guessed, phished, socially engineered, or stolen without the victim's awareness. Biometrics (Type 3) are the hardest to replicate. Physical tokens (Type 2) require the attacker to obtain a physical device. Combining all three factors (MFA) is the strongest option."},{"id":"d5_q_045","domain":"D5","difficulty":"hard","question":"Which specific Kerberos security weakness did SESAME address through the use of Public Key Infrastructure (PKI)?","options":["Asymmetric plaintext key storage","PKI being an inherent security vulnerability","Symmetric plaintext key storage","Never sending the password over the network"],"answer":2,"explanation":"Kerberos relies on symmetric keys that must be stored and shared — if a key is stored in a recoverable or plaintext form, it can be compromised. SESAME (Secure European System for Applications in a Multivendor Environment) addressed this by using PKI (asymmetric cryptography) for initial authentication, eliminating the symmetric plaintext key storage risk. PKI is a solution, not a vulnerability. Not sending passwords over the network is a feature Kerberos already had."},{"id":"d5_q_046","domain":"D5","difficulty":"easy","question":"Bob is designing new access controls across the organisation. Which documentation should he reference to determine how and what to implement?","options":["The latest technology reviews and vendor comparisons","His own discretion — he is the most knowledgeable employee on access control","The organisation's policies, procedures, and standards","His peers' recommendations, implementing whatever they agree on"],"answer":2,"explanation":"Access control design must align with the organisation's formal policies, procedures, and standards — documents that encode regulatory obligations, business objectives, and security requirements. Individual expertise and peer input can supplement these, but must not replace them. Implementing access controls based on personal discretion or the latest tech trends risks creating inconsistencies, policy violations, or non-compliant configurations."},{"id":"d5_q_047","domain":"D5","difficulty":"medium","question":"Active Directory (AD) uses trust relationships between domains. Which of the following is NOT a recognised AD trust type?","options":["One-way trust","Reflective trust","Transitive trust","Intransitive trust"],"answer":1,"explanation":"Reflective trust is not a standard Active Directory trust type. AD supports: one-way trust (one domain allows the other's users access but not vice versa), transitive trust (automatically extends to all domains that either domain trusts — the default within an AD forest), and intransitive trust (exists only between two specific domains and does not extend further)."},{"id":"d5_q_048","domain":"D5","difficulty":"easy","question":"When implementing new access controls using the IAAA model, which of the following would be used for identification?","options":["Passwords","Usernames","Role-Based Access Control (RBAC)","Non-repudiation"],"answer":1,"explanation":"In IAAA, identification is the first step — the user claims an identity by providing a unique identifier, most commonly a username. Passwords are used for authentication (verifying the claimed identity). RBAC is an authorisation mechanism. Non-repudiation is part of accountability, ensuring actions cannot be denied."},{"id":"d5_q_049","domain":"D5","difficulty":"medium","question":"A HMAC-based one-time password (HOTP) is an example of which type of authentication factor?","options":["Something you know — knowledge-based","Something you are — biometrics","Somewhere you are — geolocation","Something you have — possession-based"],"answer":3,"explanation":"HOTP is generated by a physical security token or authenticator application — something the user must possess. It qualifies as 'something you have' (Type 2). It is not knowledge-based (the user does not memorise the OTP), not biometric, and not tied to a location. The time-based equivalent (TOTP) also falls under Type 2 for the same reason."},{"id":"d5_q_050","domain":"D5","difficulty":"medium","question":"After the CEO reports that the fingerprint reader frequently fails to recognise her, she asks you to lower the sensitivity on the readers. What is a potential NEGATIVE side effect of this?","options":["Increased false rejects — more legitimate users would be turned away","True accepts would decrease — the system would recognise fewer authorised users","Increased false accepts — the system may grant access to unauthorised individuals","True rejects would increase — more attackers would be blocked"],"answer":2,"explanation":"Lowering sensitivity makes the biometric system less strict, which reduces false rejections (good for the CEO) but increases false acceptance — the system may now match an unauthorised individual's fingerprint to an authorised template. This raises the FAR (False Acceptance Rate), the more serious error type, because it grants unauthorised access. True accepts and true rejects are correct outcomes, not side effects."},{"id":"d5_q_051","domain":"D5","difficulty":"medium","question":"An administrator sees that a user's account is being used from a foreign country at 03:00 when the employee is known to be local. What is the FIRST action the administrator should take?","options":["Lock the account immediately to stop any further unauthorised access","Call the user to check whether they authorised the activity","Monitor the attacker's actions to gather intelligence on their techniques","Take no action until a formal incident response policy is in place"],"answer":0,"explanation":"The first priority is to stop the breach by locking the account — this immediately prevents further unauthorised access or damage. Calling the user and gathering intelligence are valid follow-up steps, but only after the account is secured. Delaying action to wait for a formal policy while an active intrusion is underway is never acceptable; security best practice requires an immediate protective response."},{"id":"d5_q_052","domain":"D5","difficulty":"hard","question":"In Kerberos, when a client wants access to a specific service and contacts the TGS, what does it send?","options":["The user's plaintext password","The user ID used in the initial AS request","The raw session key from the AS","An authenticator (TGT + service request encrypted with the client/TGS session key)"],"answer":3,"explanation":"In step 3 of the Kerberos flow, the client sends the TGS: (1) the TGT received from the AS (encrypted with the TGS secret key), (2) a service request, and (3) an authenticator — a timestamp encrypted with the client/TGS session key, proving the client knows the session key without sending it in clear. Kerberos never sends plaintext passwords. The user ID was only relevant in step 1. The raw session key is never transmitted."},{"id":"d5_q_053","domain":"D5","difficulty":"medium","question":"You want to ensure accountability in your access control implementation — that users cannot deny performing actions. Which mechanism should you use?","options":["Usernames — to uniquely identify users","Passwords — to authenticate users before they act","Role-Based Access Control (RBAC) — to limit what users can do","Non-repudiation — digital signatures or audit trails that prove who did what"],"answer":3,"explanation":"Non-repudiation ensures that an entity cannot deny performing an action. It is achieved through mechanisms such as digital signatures or robust, tamper-evident audit trails. Usernames provide identification but can be shared or stolen. Passwords provide authentication but not accountability. RBAC controls authorisation — it limits actions but does not prove they were taken by a specific individual."},{"id":"d5_q_054","domain":"D5","difficulty":"easy","question":"After implementing biometrics, too many authorised employees are being incorrectly rejected. Which metric describes this problem?","options":["CER — Crossover Error Rate","FAR — False Acceptance Rate","FRE — not a recognised biometric metric","FRR — False Rejection Rate"],"answer":3,"explanation":"FRR (False Rejection Rate) measures how often the biometric system incorrectly rejects an authorised user — the Type 1 error. The scenario describes exactly this. CER is the crossover point where FRR equals FAR (used to benchmark system accuracy). FAR (Type 2 error) is the opposite problem — unauthorised users being accepted. FRE is not a standard biometric term."},{"id":"d5_q_055","domain":"D5","difficulty":"medium","question":"Your startup is evaluating access management models. Which of the following is NOT a recognised, commonly used type of access control?","options":["DAC (Discretionary Access Control)","MAC (Mandatory Access Control)","TRAC (Trust Ratio Access Control)","RBAC (Role-Based Access Control)"],"answer":2,"explanation":"TRAC (Trust Ratio Access Control) is not a recognised or standard access control model. DAC, MAC, and RBAC are all well-established models: DAC gives owners control over their resources; MAC enforces central policy via labels and clearances; RBAC assigns permissions based on organisational roles. Rule-Based Access Control (RuBAC) exists but is not abbreviated as RUBAC or TRAC."},{"id":"d5_q_056","domain":"D5","difficulty":"medium","question":"Which type of authentication is the WORST to have compromised, because the credential cannot be reissued?","options":["Type 1 — something you know (passwords, PINs)","Type 2 — something you have (tokens, smart cards)","Type 3 — something you are (biometrics)","Type 4 — not a recognised standard authentication type"],"answer":2,"explanation":"Type 3 (biometrics) is the worst to have compromised because biometric characteristics — fingerprints, iris patterns, facial geometry — are permanent and cannot be reissued or changed. A compromised password (Type 1) can be reset. A stolen token (Type 2) can be replaced. But you cannot issue someone a new fingerprint. This irreversibility makes protecting biometric templates critically important."},{"id":"d5_q_057","domain":"D5","difficulty":"easy","question":"Your organisation uses one-time passwords pushed to a phone application every 30 seconds. Which type of token is this?","options":["HOTP — HMAC-based One-Time Password (event-based)","ROTP — not a widely recognised OTP standard","TOTP — Time-Based One-Time Password","BOTP — not an established OTP standard"],"answer":2,"explanation":"TOTP (Time-Based One-Time Password) generates a new OTP at fixed time intervals — typically every 30 seconds. This matches the scenario exactly. HOTP is event-based — the password changes after each use, not on a timer. ROTP and BOTP are not recognised OTP standards."},{"id":"d5_q_058","domain":"D5","difficulty":"medium","question":"When discussing Type 3 (biometric) authentication, which of the following terms does NOT belong?","options":["FAR — False Acceptance Rate","CER — Crossover Error Rate","CRR","FRR — False Rejection Rate"],"answer":2,"explanation":"CRR is not a recognised metric in biometric authentication. The standard biometric performance metrics are: FAR (False Acceptance Rate — Type 2 error, unauthorised user accepted), FRR (False Rejection Rate — Type 1 error, authorised user rejected), and CER (Crossover Error Rate — the sensitivity point where FAR equals FRR, used as a benchmark for comparing systems)."},{"id":"d5_q_059","domain":"D5","difficulty":"easy","question":"You are adding random data to each password before it is hashed, to prevent rainbow table and dictionary attacks. What is this technique called?","options":["Applying a nonce","Salting","Key stretching","Setting clipping levels"],"answer":1,"explanation":"Salting is the process of adding a unique random string (the salt) to each password before hashing. Even if two users share the same password, their stored hashes will differ because of unique salts, making pre-computed rainbow tables useless. A nonce prevents replay attacks in authentication sessions. Key stretching slows brute force. Clipping levels set thresholds on failed login attempts."},{"id":"d5_q_060","domain":"D5","difficulty":"easy","question":"When a user swipes an access card through a reader, which technology is the card most likely using?","options":["Contactless (RFID/NFC) — no swipe needed","Magnetic stripe","Contact smart card — inserted into a slot","HOTP token — generates a one-time code"],"answer":1,"explanation":"Swiping implies a magnetic stripe card — the stripe on the back is physically read by the card reader. Contactless cards (RFID/NFC) are tapped or waved near a reader, not swiped. Contact smart cards are inserted into a slot where electrical contacts align with the chip. HOTP tokens generate OTPs and are not swiped."},{"id":"d5_q_061","domain":"D5","difficulty":"hard","question":"Your organisation wants to migrate away from CHAP authentication. Which of the following is a legitimate security concern with CHAP that could justify this?","options":["CHAP sends credentials in plaintext over the network","CHAP stores client passwords on the server in a form that can be exploited offline if the server is compromised","CHAP uses SSL, which is no longer considered secure","CHAP uses PPP, making it incompatible with modern networks"],"answer":1,"explanation":"CHAP uses a challenge-response mechanism so passwords are never sent in plaintext. However, the server must store a verifiable form of the password to validate responses — if an attacker gains access to the server, those stored credentials can be used in offline attacks to recover the original passwords. This is the primary reason organisations migrate to more modern protocols using stronger, non-reversible credential storage. SSL usage and PPP compatibility are not reasons to abandon CHAP."},{"id":"d6_q_001","domain":"D6","difficulty":"medium","question":"What is the PRIMARY difference between a vulnerability scan and a penetration test?","options":["A vulnerability scan is performed by external parties; pen tests are always internal","A vulnerability scan identifies weaknesses; a pen test attempts to EXPLOIT those weaknesses","A pen test is automated; a vulnerability scan is always manual","A vulnerability scan tests physical security; a pen test tests logical security only"],"answer":1,"explanation":"Vulnerability scanning identifies and lists vulnerabilities (the Vulnerability in Risk = Threat × Vulnerability). Pen testing attempts to match those vulnerabilities with actual exploits to prove real Risk. Risk = Threat × Vulnerability."},{"id":"d6_q_002","domain":"D6","difficulty":"hard","question":"During a penetration test, the tester discovers a critical vulnerability not in the original scope. What should they do FIRST?","options":["Exploit it to demonstrate the full risk to management","Document it and report it, but do not exploit it — it is outside the SOW","Fix the vulnerability immediately to help the organization","Ignore it as it is outside scope and continue the test"],"answer":1,"explanation":"Pen testers operate strictly within the SOW. Exploiting out-of-scope systems may be illegal even if permitted. The correct action is to document and report the finding. Testers document vulnerabilities — they do NOT fix them."},{"id":"d6_q_003","domain":"D6","difficulty":"medium","question":"A SOC 2 Type II report differs from a Type I report in which MOST important way?","options":["Type II covers financial reporting; Type I covers operational controls","Type II is publicly available; Type I is confidential","Type II covers operating EFFECTIVENESS over a minimum 6-month period; Type I covers design at a single point in time","Type II is performed by internal auditors; Type I requires a third party"],"answer":2,"explanation":"SOC 2 Type I = suitability of design at a single point in time. SOC 2 Type II = suitability of design AND operating effectiveness over a minimum 6-month period. Type II is better, more expensive, and proves controls are actually working over time."},{"id":"d6_q_004","domain":"D6","difficulty":"hard","question":"An organization uses a SaaS application. During an audit, who is responsible for securing the underlying infrastructure and application?","options":["The customer — they chose the vendor and are fully responsible","The cloud provider — they manage the entire application stack in SaaS","It is split 50/50 between the provider and customer","The regulator who mandated the use of the SaaS platform"],"answer":1,"explanation":"In SaaS, the cloud provider manages and secures the entire application stack (infrastructure, platform, software). The customer is responsible for data and possibly access control. However, ultimate responsibility for data PROTECTION lies with the organization."},{"id":"d6_q_005","domain":"D6","difficulty":"medium","question":"Which type of pen test BEST simulates an attack by a malicious insider with admin access?","options":["Black Box — because insiders have no knowledge","Grey Box — because insiders have partial knowledge","White Box — because it simulates full internal knowledge and privileged access","Red Team — because it uses physical attack methods"],"answer":2,"explanation":"White Box (Crystal/Clear Box) pen testing gives the tester full internal network knowledge and access, equivalent to a privileged employee or administrator. Black Box = external attacker. Grey Box = limited user/vendor access."},{"id":"d6_q_006","domain":"D6","difficulty":"hard","question":"An attacker calls an employee claiming to be the CEO and demands urgent wire transfer of funds to avoid a lawsuit. Which social engineering technique is PRIMARILY being used?","options":["Familiarity — building a common connection with the victim","Scarcity — implying a limited time window","Urgency combined with Authority — creating time pressure while posing as a figure of authority","Consensus — implying everyone else has already complied"],"answer":2,"explanation":"This attack combines Authority (impersonating the CEO — a trusted/feared figure) and Urgency (must act now to avoid lawsuit). These two are frequently combined in whaling and vishing attacks."},{"id":"d6_q_007","domain":"D6","difficulty":"medium","question":"What is the MAIN purpose of reviewing audit logs?","options":["Preventive — to stop attacks before they happen","Detective — to identify what happened after the fact","Corrective — to fix vulnerabilities found during testing","Deterrent — to discourage attackers from targeting the system"],"answer":1,"explanation":"Reviewing audit logs is primarily a DETECTIVE control. It identifies events after they occur. NIST SP 800-92 recommends collecting network security, OS, and application logs. Centralized logging with automation is key."},{"id":"d6_q_008","domain":"D6","difficulty":"hard","question":"A company is auditing its hybrid cloud environment. Which challenge is UNIQUE to hybrid environments compared to pure cloud or pure on-premise?","options":["The shared responsibility model no longer applies","Compliance with HIPAA or PCI-DSS is not required","Maintaining a consistent security posture across both on-premise AND cloud resources simultaneously","Physical security of data centers becomes irrelevant"],"answer":2,"explanation":"Hybrid environments present unique challenges: maintaining consistent security posture across both environments, ensuring proper integration, mapping data flows, and coordinating incident response across both on-premise and cloud. This complexity is the defining challenge."},{"id":"d6_q_009","domain":"D6","difficulty":"medium","question":"A developer runs automated tools that submit random, malformed data to an application to see if it crashes. What testing technique is this?","options":["Static Testing — passively examining the source code","Dynamic Testing — actively executing the code under normal conditions","Fuzzing — submitting random malformed data to find unpredictable states or crashes","Regression Testing — checking for defects introduced by a recent code change"],"answer":2,"explanation":"Fuzzing (Fuzz Testing) submits random, malformed data as inputs to find crashes or unpredictable states. If the program crashes or hangs, the fuzz test has found a vulnerability. It is a black box testing technique."},{"id":"d6_q_010","domain":"D6","difficulty":"hard","question":"After completing a penetration test, the tester discovers sensitive PII files. According to best practices, what should they do?","options":["Copy the files to prove access and include them in the report","Access and read the files to assess the full extent of the breach","Note that they could access the target location (where a dummy file was placed) and report it — without accessing actual PII","Immediately notify the data subjects that their PII may be compromised"],"answer":2,"explanation":"Best practice places a dummy file in the same location as real PII. If the pen tester can reach the dummy file, it proves they could reach the actual data. They report this finding but do NOT access real PII, maintaining data integrity and legal compliance."},{"id":"d6_q_011","domain":"D6","difficulty":"medium","question":"What is the MOST significant risk associated with centralized audit log storage?","options":["Logs take up too much storage space","If the central log repository is compromised, an attacker can delete or modify evidence","Centralized logs cannot be read by correlation tools","Local administrators have too much access to centralized logs"],"answer":1,"explanation":"Centralized logs should be automated, secured, and even administrators should have limited access. Best practice: maintain a hashed, untouched central repository AND a separate copy for analysis. This protects log integrity."},{"id":"d6_q_012","domain":"D6","difficulty":"hard","question":"Which statement BEST describes the relationship between compliance checks and security audits?","options":["Audits are ongoing; compliance checks are point-in-time events","Compliance checks and audits serve identical purposes and can replace each other","Audits are point-in-time events; compliance checks are ongoing and should be the foundation of risk management","Compliance checks are only performed by external third parties; audits can be internal"],"answer":2,"explanation":"Security audits are point-in-time events. Compliance checks are ongoing. Compliance should be the BEGINNING of a risk management program, not the ceiling. Continuous compliance monitoring provides much more value than periodic audits alone."},{"id":"d6_q_013","domain":"D6","difficulty":"medium","question":"A client asks whether your company's controls were merely well-designed, or whether they actually held up under daily operation for the past year. Which report answers that?","options":["SOC 2 Type I","SOC 2 Type II","SOC 3","SOC 1 Type I"],"answer":1,"explanation":"Type II is the only report that evaluates OPERATING EFFECTIVENESS over a period of time (6+ months), not just design. Type I only confirms the controls were suitably designed at one moment."},{"id":"d6_q_014","domain":"D6","difficulty":"hard","question":"QA confirms the login form accepts valid credentials and rejects blank fields. A security engineer separately tries SQL injection strings and oversized payloads in the same fields. What is the security engineer doing?","options":["Interface testing","Misuse case testing","Regression testing","Installation testing"],"answer":1,"explanation":"Misuse case testing evaluates the system against ATTACKER behavior (malicious/abnormal input), not normal expected use. QA's pass/fail check of normal inputs is standard functional testing; the injection attempts are misuse case testing."},{"id":"d6_q_015","domain":"D6","difficulty":"hard","question":"A researcher finds a flaw in your product without authorization, then emails your security team giving you 90 days to patch before they publish their findings. How should this researcher be classified?","options":["Black hat","White hat","Gray hat","Script kiddie"],"answer":2,"explanation":"No authorization to test (rules out white hat) but discloses responsibly rather than exploiting maliciously (rules out black hat). That mix of unauthorized access with non-malicious, disclosure-minded intent is the gray hat profile."},{"id":"d6_q_016","domain":"D6","difficulty":"medium","question":"Which of the following is a SIGN of healthy audit log management, rather than a common organizational failure?","options":["Logs are kept only for 30 days to save storage","Logs are reviewed on a regular, timely cadence","Logs from different systems use inconsistent formats","Logs are only checked after an incident is suspected"],"answer":1,"explanation":"The other three options describe the classic failure modes (short retention, lack of standardization for SIEM correlation, and reactive-only review). Regular, timely review is the practice that should be in place, not a problem to flag."},{"id":"d6_q_017","domain":"D6","difficulty":"hard","question":"A new authentication microservice will receive a session token from the login service and pass a user-permissions object to the billing service. Testing focuses on whether that token and object survive the handoffs correctly. What is being tested?","options":["Unit testing","Component interface testing","Full system interface testing","Installation testing"],"answer":1,"explanation":"This is specifically about data passed BETWEEN two adjacent components (login service to auth service to billing service), which is component interface testing — narrower than testing every exposed interface of the whole application."},{"id":"d6_q_018","domain":"D6","difficulty":"medium","question":"At the end of a development cycle, the QA team verifies every API endpoint, every external web service call, and the user-facing UI all correctly exchange data with each other. What level of testing is this?","options":["Unit testing","Component interface testing","Interface testing","Code coverage analysis"],"answer":2,"explanation":"Testing ALL exposed interfaces of the finished application — APIs, web services, and UI integration points together — is the defining scope of interface testing, broader than the narrower component interface testing."},{"id":"d6_q_019","domain":"D6","difficulty":"medium","question":"Before committing to an expensive third-party structured audit, an organization has its own staff informally review processes and flag likely compliance gaps. What is this preliminary review called, and who performs it?","options":["A structured audit, performed by external auditors","An unstructured audit, performed by internal auditors","A SOC 2 Type I, performed by a CPA firm","A penetration test, performed by ethical hackers"],"answer":1,"explanation":"Informal, preliminary, in-house reviews done ahead of a formal audit are unstructured audits, and they're performed by internal auditors — the opposite pairing (formal/external) describes a structured audit."},{"id":"d6_q_020","domain":"D6","difficulty":"hard","question":"A penetration testing contract states the tester has been given full administrative knowledge of network diagrams, source code, and credentials. Which THREE terms could all correctly describe this engagement?","options":["Black box, zero knowledge, opaque box","Gray box, partial knowledge, translucent box","White box, clear box, crystal box","Red team, blue team, purple team"],"answer":2,"explanation":"White box, clear box, and crystal box are interchangeable terms for full-knowledge penetration testing. The other option sets describe black box (no knowledge) or gray box (partial knowledge) testing, or unrelated red/blue/purple team concepts."},{"id":"d6_q_021","domain":"D6","difficulty":"medium","question":"A tester has just finished browsing a compromised system to understand its file structure and installed software. Which of the following is a LOGICAL next step?","options":["Gaining initial access to the system","Installing additional tools for deeper analysis","Signing the original Statement of Work","Conducting the initial reconnaissance phase from scratch"],"answer":1,"explanation":"Installing additional tools (or returning to discovery) logically follows system browsing. Gaining access and reconnaissance both happen BEFORE system browsing in the typical pen test flow, so the tester wouldn't repeat those next."},{"id":"d6_q_022","domain":"D6","difficulty":"medium","question":"A single developer writes a quick test to confirm that one validation function correctly rejects an empty string input. What kind of test is this?","options":["Component interface testing","Unit testing","Interface testing","Misuse case testing"],"answer":1,"explanation":"Testing the behavior of a single function or section of code, in isolation, is the definition of unit testing — the smallest and narrowest scope of the testing types in this domain."},{"id":"d1_q_001","domain":"D1","difficulty":"hard","question":"A breach occurs on a system you administer. You had applied all patches, followed the security policy, and documented your actions. Who is MOST likely liable?","options":["You, because the system was under your control","Senior management is ultimately liable, and you likely are not liable because you demonstrated Due Care","The vendor who sold the vulnerable software","No one, because breaches are unavoidable"],"answer":1,"explanation":"Senior leadership is ULTIMATELY liable. Because you can prove Due Care (prudent-person actions: patching, following policy, documentation), you are most likely not liable. Negligence is the opposite of Due Care."},{"id":"d1_q_002","domain":"D1","difficulty":"medium","question":"An organization values protecting society and the public good above all. Which (ISC)² Code of Ethics canon takes precedence when two canons conflict?","options":["Act honorably, honestly, justly, responsibly, and legally","Provide diligent and competent service to principals","Protect society, the common good, necessary public trust, and the infrastructure","Advance and protect the profession"],"answer":2,"explanation":"The canons are applied in ORDER of priority. Canon 1 — protect society, the common good, public trust, and infrastructure — takes precedence over the others."},{"id":"d1_q_003","domain":"D1","difficulty":"hard","question":"A laptop is worth $1,000, holds $9,000 of PII, and a theft is a total loss. The company loses 25 laptops per year. What is the ALE?","options":["$10,000","$25,000","$250,000","$225,000"],"answer":2,"explanation":"SLE = AV × EF = $10,000 × 100% = $10,000. ALE = SLE × ARO = $10,000 × 25 = $250,000 per year. This is the cost if you do nothing."},{"id":"d1_q_004","domain":"D1","difficulty":"medium","question":"A manager says 'we know this risk exists but we're choosing to ignore it and do nothing.' Which risk response is this, and is it acceptable?","options":["Risk Acceptance — acceptable for low risks","Risk Transference — acceptable via insurance","Risk Rejection — NEVER acceptable, the organization remains liable","Risk Avoidance — acceptable if the risk is high"],"answer":2,"explanation":"Ignoring a known risk is Risk Rejection, which is NEVER acceptable — you remain liable. Risk Acceptance (knowing the risk but mitigation costs more than the risk) is different and is acceptable for low risks."},{"id":"d1_q_005","domain":"D1","difficulty":"hard","question":"During incident handling, an investigator wants to examine a seized hard drive. What is the CORRECT approach to preserve evidence integrity?","options":["Examine the original drive directly to avoid copy errors","Make a bit-level copy, hash both original and copy, and examine only the copy","Format a backup and restore the data to a clean drive first","Boot the original drive to capture running processes"],"answer":1,"explanation":"Forensics is always done on COPIES, never originals. You hash both the original and the copy, confirm they match before and after the examination, maintaining a documented chain of custody."},{"id":"d1_q_006","domain":"D1","difficulty":"medium","question":"A company has EU customers but is based entirely in the US. A data breach occurs. How quickly must they notify under GDPR?","options":["Within 30 days","Within 72 hours","Within 24 hours","GDPR doesn't apply since they're US-based"],"answer":1,"explanation":"GDPR requires breach notification within 72 hours and applies to anyone with EU/EEA customers REGARDLESS of where the company is based. Fines can reach €20M or 4% of global turnover, whichever is greater."},{"id":"d1_q_007","domain":"D1","difficulty":"hard","question":"Which value is correct: MTD must be ___ RTO + WRT?","options":["less than","equal to","greater than or equal to","exactly half of"],"answer":2,"explanation":"MTD ≥ RTO + WRT. The total recovery time — restoring hardware (RTO) plus configuring/recovering software (WRT) — must be less than or equal to the Maximum Tolerable Downtime."},{"id":"d1_q_008","domain":"D1","difficulty":"medium","question":"In a RACI chart, which role is described as 'ultimately answerable for correct completion' and is limited to exactly one person per task?","options":["Responsible","Accountable","Consulted","Informed"],"answer":1,"explanation":"Accountable = ultimately answerable for the correct and thorough completion of the task; there should be only ONE accountable person. Responsible does the actual work; Consulted gives input (two-way); Informed is kept updated (one-way)."},{"id":"d2_q_001","domain":"D2","difficulty":"medium","question":"A subject has a 'Secret' clearance. To access a 'Secret – Crypto' labeled document, what does the subject need BEYOND the clearance?","options":["Nothing — clearance alone grants access","Formal Access Approval and a valid Need to Know","A higher clearance level","Approval from another subject at the same level"],"answer":1,"explanation":"Beyond appropriate clearance, the subject needs Formal Access Approval (a document from the data owner) AND a valid Need to Know. Having clearance alone is never sufficient."},{"id":"d2_q_002","domain":"D2","difficulty":"hard","question":"You must securely dispose of decommissioned SSDs holding sensitive data. Which method is appropriate?","options":["Degaussing, since it works on all media","ATA Secure Erase and/or physical destruction","A single quick format","Deleting all files and emptying the recycle bin"],"answer":1,"explanation":"SSDs cannot be degaussed (no magnetic media — they're EEPROM + DRAM). Use ATA Secure Erase and/or physical destruction. Formatting and deleting leave data recoverable."},{"id":"d2_q_003","domain":"D2","difficulty":"medium","question":"Who is responsible for performing backups, restores, and patching, following the directions of the data owner?","options":["The data/information owner","The data custodian","The mission/business owner","The auditor"],"answer":1,"explanation":"The data custodian is the technical hands-on role that performs backups, restores, patches, and configuration, following the data owner's directions. The data owner assigns labels and backup frequency."},{"id":"d2_q_004","domain":"D2","difficulty":"hard","question":"Before a new system can be placed into production, the data owner must formally accept the certification and the residual risk. What is this called?","options":["Certification","Accreditation","Scoping","Tailoring"],"answer":1,"explanation":"Accreditation is the data owner's formal acceptance of the certification and residual risk — required before production. Certification is the determination that controls meet requirements."},{"id":"d2_q_005","domain":"D2","difficulty":"easy","question":"An organisation stores sensitive records on hard drives, transmits financial data between offices over the network, and has employees actively viewing patient files on workstations. Which option correctly matches each activity to its data state?","options":["Stored records = data at rest · transmitted data = data in motion · viewed files = data in use","Stored records = data in use · transmitted data = data at rest · viewed files = data in motion","All three activities represent data in motion because the data is accessible","Stored records = data in motion · transmitted data = data in use · viewed files = data at rest"],"answer":0,"explanation":"Data at rest is information sitting on a storage medium (hard drive, tape, USB) that is not being moved or actively processed. Data in motion is information actively travelling across a network. Data in use is information being accessed, viewed, or processed by a user or application. Each state has distinct vulnerabilities and requires different protection strategies — encryption for at rest and in motion, and access controls/privacy screens for in use."},{"id":"d2_q_006","domain":"D2","difficulty":"easy","question":"Which of the following is a COMMON attack specifically targeting data 'in use'?","options":["Cryptanalysis — breaking encrypted ciphertext to recover the original data","Shoulder surfing — physically observing a screen or keyboard to steal information","Eavesdropping — intercepting data travelling across a network","All of the above — all are equally common attacks on data in use"],"answer":1,"explanation":"Shoulder surfing targets data in use by physically observing what is on a screen, notebook, or keyboard. It is a direct attack on actively displayed information. Cryptanalysis targets data at rest or in transit (the data is encrypted and must be broken). Eavesdropping (and MitM attacks) target data in motion on a network. Data in use cannot be encrypted while being displayed, so physical and procedural controls — clean desk policy, privacy screens, screen locks — are the primary defences."},{"id":"d2_q_007","domain":"D2","difficulty":"medium","question":"A company encrypts all traffic leaving its network to the internet but sends internal server-to-server traffic in plaintext. An attacker who compromises an internal machine captures unencrypted database queries containing credit card numbers. What security gap does this reveal?","options":["The company failed to encrypt data at rest on its database servers","The company failed to encrypt data in motion on its internal network","The company failed to implement a clean desk policy","The company failed to use full disk encryption on its firewalls"],"answer":1,"explanation":"The attacker captured data while it was travelling between internal systems — this is data in motion on the internal network. Encrypting only internet-bound traffic is a common mistake; internal traffic is just as vulnerable if an attacker gains a foothold inside the network perimeter. Encrypting internal traffic adds minimal latency but prevents an insider or compromised host from reading intercepted data. Data-at-rest encryption protects stored data on disk, not packets in transit. A clean desk policy protects printed documents. Firewall disk encryption is unrelated to network traffic."},{"id":"d2_q_008","domain":"D2","difficulty":"medium","question":"Which of the following is the MOST important factor to consider when developing a records retention policy?","options":["The cost of storing the records","The legal requirements for retaining the records","The likelihood of the records being accessed in the future","The sensitivity of the information contained in the records"],"answer":1,"explanation":"Legal requirements are the primary driver of a records retention policy. Various laws and regulations (HIPAA, PCI-DSS, SOX, GDPR) specify minimum periods for which certain record types must be kept — non-compliance can result in penalties, fines, and inability to defend against litigation. Storage cost is a secondary consideration and is increasingly manageable with modern digital storage. Future access likelihood and data sensitivity influence how records are stored and protected, but neither overrides a legal retention obligation."},{"id":"d2_q_009","domain":"D2","difficulty":"easy","question":"What is the LOWEST level of data classification used in a typical organisation?","options":["Top Secret — highest classification, grave consequences if disclosed","Secret — serious damage to the organisation if disclosed","Confidential — some damage if disclosed, restricted distribution","Public — freely shareable with no negative consequences"],"answer":3,"explanation":"Public is the lowest classification level. Public data can be openly disseminated without negative consequences and requires no special protection. Moving up: Confidential data could cause some organisational damage if improperly disclosed; Secret data could cause serious damage; Top Secret is the highest level and represents data whose unauthorised disclosure could have grave effects on the organisation or national security. Each level up requires more restrictive access controls."},{"id":"d2_q_010","domain":"D2","difficulty":"medium","question":"What is the MOST important factor to consider when implementing a data classification scheme?","options":["The organisation's available storage capacity for classified data","The sensitivity levels of the data — how much harm would result from unauthorised disclosure","The data retention policy currently in place","The access control system already deployed in the organisation"],"answer":1,"explanation":"Data classification is fundamentally about sensitivity — understanding the impact if data is improperly accessed, disclosed, modified, or destroyed. This impact could be legal, financial, reputational, or operational. Sensitivity levels drive every other decision: how long to keep it, who may access it, how to store and protect it, and how to destroy it. Storage capacity is a practical constraint, not a classification driver. Retention policies and access controls are downstream outcomes of classification, not inputs to it."},{"id":"d2_q_011","domain":"D2","difficulty":"easy","question":"Who is responsible for creating the policies that govern an organisation's data security?","options":["Data custodians — the technical staff who implement security controls","Mission/business owners — senior executives who set policy for data security","Data controllers — who create and manage sensitive organisational data","System owners — the managers responsible for systems housing the data"],"answer":1,"explanation":"Mission/business owners are senior executives who create the policies that govern data security across the organisation. They operate at the highest level of data governance. Data custodians are technical staff who implement and execute controls. System owners manage the infrastructure that houses data. Data controllers create and manage sensitive data but are not the policymakers — that responsibility sits with senior leadership."},{"id":"d2_q_012","domain":"D2","difficulty":"easy","question":"A data/information owner works at which level of the organisation, and what are the TWO key things they are responsible for assigning?","options":["Technical level — assigns firewall rules and patch schedules","Management level — assigns sensitivity labels and backup frequency","Executive level — creates security policies and audit schedules","Technical level — performs backups, restores, and system configuration"],"answer":1,"explanation":"The data/information owner operates at the management level and is specifically responsible for assigning sensitivity labels (classifying the data) and backup frequency (how often the data is backed up). They are not necessarily IT staff — this role could be filled by a manager from HR, payroll, finance, or any department that owns the data. Data custodians carry out the backups; senior executives set the policies."},{"id":"d2_q_013","domain":"D2","difficulty":"medium","question":"What is the system owner's primary responsibility, and at what level of the organisation do they typically operate?","options":["Technical level — performs backups, restores, and patching on the systems","Executive level — creates organisation-wide data security policies","Management level — owns and is responsible for the systems that house the data","Technical level — assigns sensitivity labels to data stored in the systems"],"answer":2,"explanation":"The system owner operates at the management level and is responsible for the systems (hardware, software, infrastructure) that house the organisation's data. Common examples are a data center manager or an infrastructure manager. They are distinct from the data owner (who classifies the data and sets backup frequency) and from the data custodian (who performs the hands-on technical work like backups and patches)."},{"id":"d2_q_014","domain":"D2","difficulty":"medium","question":"Your HR department manages employee payroll data internally and outsources the actual payroll calculations to an external vendor. Which roles do these two parties fulfil?","options":["HR = data processor, external vendor = data controller","HR = data controller, external vendor = data processor","Both HR and the external vendor are data controllers","HR = system owner, external vendor = data custodian"],"answer":1,"explanation":"HR creates and manages the sensitive payroll data, making them the data controller. The external vendor processes that data on HR's behalf (running the calculations) but does not own or govern it — that makes them the data processor. The key distinction: controllers determine the purpose and means of processing; processors act on the controller's instructions. This distinction is critical under regulations such as GDPR."},{"id":"d2_q_015","domain":"D2","difficulty":"easy","question":"A data custodian carries out backups, restores, patches, and system configuration. Whose directions do they follow when performing these tasks?","options":["The mission/business owner — the senior executive who sets data policy","The data/information owner — who determines what must be done and how","The system owner — the manager responsible for the infrastructure","The data controller — who creates and governs the sensitive data"],"answer":1,"explanation":"Data custodians are the technical hands-on staff who implement instructions — but they follow the directions of the data/information owner, not the executive or the infrastructure manager. The data owner decides what labels to apply, how often backups occur, and what the configuration requirements are. The custodian then executes those decisions. This division separates governance (data owner) from implementation (custodian)."},{"id":"d2_q_016","domain":"D2","difficulty":"medium","question":"In data roles and responsibilities, the business/mission owner is PRIMARILY responsible for which of the following?","options":["Ensuring data integrity through validation and error-correction mechanisms","Determining data storage methods and selecting appropriate technology","Providing day-to-day data input into databases and repositories","Setting data access policies — defining who can access which data, under what conditions"],"answer":3,"explanation":"Business/mission owners set data access policies at a strategic level — defining who gets access to what data, under what conditions, and aligned with business objectives. They understand the sensitivity and significance of different data assets, making them best-placed to make these governance decisions. Ensuring data integrity is the domain of data stewards and engineers. Selecting storage methods is the role of data architects. Day-to-day data input is handled by employees or data-entry staff."},{"id":"d2_q_017","domain":"D2","difficulty":"medium","question":"Which of the following is NOT a common responsibility of a data custodian?","options":["Ensuring data integrity and accuracy during storage and transmission","Ensuring data is accessible to authorised users when needed","Designing and implementing comprehensive organisation-wide security controls","Performing regular backups and restoring data after failures"],"answer":2,"explanation":"Designing and implementing organisation-wide security controls is the responsibility of security officers and IT security teams — not data custodians. Custodians execute specific security procedures that have already been designed and mandated by others. Their core duties are hands-on and operational: ensuring data integrity, maintaining availability for authorised users, performing backups and restores, applying patches, and configuring systems — all following the directions of the data owner."},{"id":"d2_q_018","domain":"D2","difficulty":"medium","question":"A company outsources payroll processing to a third-party vendor in another state. The security team is concerned about the vendor's data protection practices. What is the MOST appropriate measure to verify those practices?","options":["Trust the vendor's marketing materials and security certifications at face value","Assume the vendor follows equivalent laws because both parties are in the same country","Exercise the right to audit the vendor's processes and data handling practices","Transfer all liability to the vendor through a verbal agreement"],"answer":2,"explanation":"When data processing is outsourced to a data processor, the organisation should retain and exercise the right to audit the vendor, typically on an annual basis. Audits are the only reliable way to verify that the vendor's policies, procedures, and controls actually meet required standards. Marketing materials are unverifiable claims. Being in the same country does not mean identical state-level laws apply. Verbal agreements have no legal standing and liability cannot be fully transferred regardless — the data controller retains responsibility for ensuring its processor protects the data."},{"id":"d2_q_019","domain":"D2","difficulty":"easy","question":"When disposing of paper documents containing sensitive data, why is cross shredding recommended over standard strip shredding?","options":["Cross shredding is faster and more cost-effective than strip shredding","Standard strip shreds can be re-assembled by software, making them insufficiently secure","Cross shredding produces pieces that are easier to sort for recycling","Strip shredding is not approved for any document containing data"],"answer":1,"explanation":"Standard strip shredding cuts paper into long parallel strips that can be re-assembled by software programs, potentially recovering the original document. Cross shredding (also called confetti or micro-cut shredding) cuts paper in two directions, producing small irregular pieces that are far harder to reconstruct. For any document containing sensitive data, cross shredding is the recommended method. Any paper with data on it should be shredded securely — cross shredding meets that standard."},{"id":"d2_q_020","domain":"D2","difficulty":"easy","question":"A user deletes a sensitive file from their workstation. Which statement BEST describes what happens to the data?","options":["The data is permanently erased from the storage medium and cannot be recovered","The data is overwritten with zeros, making recovery infeasible","The file is only removed from the file system's table; the underlying data remains on disk and is recoverable","The operating system automatically purges the data from the storage medium"],"answer":2,"explanation":"Deleting a file only removes the reference to it from the file system's index (the table of contents). The actual data blocks remain on the disk and are fully recoverable using forensic tools until those blocks are overwritten by new data. Deleting is the weakest form of data disposal and provides no meaningful protection for sensitive information. Overwriting with zeros is a separate, stronger operation (Clear). Purging requires an even more thorough process."},{"id":"d2_q_021","domain":"D2","difficulty":"medium","question":"What is the key difference between Sanitization and Purge as data disposal methods?","options":["Sanitization physically destroys the media; Purge only overwrites it with zeros","Sanitization removes the file table entry; Purge overwrites the actual data blocks","Sanitization renders data infeasible to recover for a given effort level; Purge renders recovery infeasible even in a laboratory environment","Both methods produce identical results — the terms are interchangeable"],"answer":2,"explanation":"Sanitization renders the target data infeasible to recover for a specific anticipated level of recovery effort — it is defined relative to a threat model. Purge goes further: it removes data to a point where recovery is not feasible even with state-of-the-art laboratory techniques. Purge is the stronger method. Neither involves only a file-table operation (that is deletion) nor is it necessarily physical destruction (which is a separate category). The two terms are not interchangeable."},{"id":"d2_q_022","domain":"D2","difficulty":"medium","question":"Which of the following groups of disposal methods are collectively classified as 'soft destruction'?","options":["Degaussing, physical destruction, and incineration","Deleting, formatting, and overwriting","Purging, sanitization, and degaussing","Physical destruction and cryptographic erasure"],"answer":1,"explanation":"Soft destruction methods — deleting, formatting, and overwriting — do not physically harm the storage medium. Deleting removes the file system reference; formatting lays a new file structure over the old one; overwriting writes 0s or random characters over existing data. All three leave the medium intact and reusable. Hard destruction methods (degaussing, shredding, incineration) physically damage or destroy the media. Soft methods vary greatly in effectiveness: deleting and formatting are easily reversed, while overwriting is significantly stronger."},{"id":"d2_q_023","domain":"D2","difficulty":"easy","question":"Which data disposal technique works by writing 0s or random characters over the existing data on a storage medium?","options":["Deleting — removing the file from the file system's directory","Formatting — laying a new file structure over the existing one","Overwriting (Clear) — writing 0s or random characters over the actual data","Degaussing — applying a strong magnetic field to erase magnetic media"],"answer":2,"explanation":"Overwriting, also known as Clear, writes 0s or random characters directly over the data blocks on the storage medium, making the original content unreadable without physically destroying the device. It is stronger than deleting (which only removes the directory entry) or formatting (which lays a new file structure on top but leaves most data intact). Degaussing uses magnetism and only works on magnetic media. Overwriting works on any writable medium but is not effective on SSDs in the same way it is on HDDs."},{"id":"d2_q_024","domain":"D2","difficulty":"medium","question":"Which of the following represents the HIGHEST level of data destruction?","options":["Degaussing — applying a strong magnetic field to erase magnetic storage media","Shredding — cutting storage media into small pieces","Overwriting — replacing data with 0s or random characters across multiple passes","Incineration — completely destroying the physical media by burning"],"answer":3,"explanation":"Incineration is the highest level of data destruction because it completely eliminates the physical medium — there is simply nothing left to recover data from. Physical destruction methods (incineration, melting, crushing, shredding) make storage media completely unusable. Shredding is physical destruction but sophisticated labs could theoretically reconstruct data from large enough pieces. Degaussing is effective for magnetic media but relies on completeness of the process. Overwriting is software-based and cannot reach defective sectors that are hidden from the OS."},{"id":"d2_q_025","domain":"D2","difficulty":"medium","question":"You have 12 decommissioned servers, each with four spinning-disk hard drives. Which of the following would be the LEAST acceptable method for dealing with data remanence?","options":["Overwriting the entire drive multiple times with random data","Degaussing the drives using a certified degausser","Using encryption software to encrypt the data on each drive","Physically destroying the drives through shredding or incineration"],"answer":2,"explanation":"Encrypting the data does not address remanence — the original data is still present on the disk; it is simply made unreadable without the decryption key. If the key is ever compromised or if advanced decryption techniques are applied, the data could still be recovered. Remanence must be addressed by removing or destroying the actual data, not by obscuring it. Overwriting replaces the actual bits. Degaussing randomises the magnetic domains. Physical destruction eliminates the media entirely. Encryption alone is not an acceptable remanence-mitigation technique."},{"id":"d2_q_026","domain":"D2","difficulty":"easy","question":"Which of the following is a KEY characteristic of RAM (Random Access Memory)?","options":["RAM is a form of long-term storage media, similar to a hard drive","RAM is non-volatile — its contents persist even after the power is removed","RAM is volatile — all data stored in it is lost when the power supply is removed","RAM is a type of processor that executes program instructions"],"answer":2,"explanation":"RAM is volatile memory — its contents exist only while the system is powered on. When power is lost or the system shuts down, all data in RAM is gone. This makes RAM ideal for temporarily storing data and instructions that the CPU needs immediate access to, but unsuitable for long-term storage. Non-volatile memory (hard drives, SSDs, ROM, flash) retains data without power. RAM is a memory component, not a processor — the CPU performs computations; RAM holds the data the CPU works on."},{"id":"d2_q_027","domain":"D2","difficulty":"easy","question":"When applying standards and frameworks, what does the process of tailoring allow an organisation to do?","options":["Develop entirely new standards and frameworks from scratch","Ignore sections of the standard that seem inconvenient","Customise the standard or framework to fit the organisation's specific needs","Use the standard as a guideline without making any modifications"],"answer":2,"explanation":"Tailoring is the process of adapting an existing standard or framework to the unique requirements of a specific organisation — omitting irrelevant controls, strengthening others, or incorporating additional requirements. It does not mean ignoring the standard or starting from scratch. Using a standard as-is without modification is scoping, not tailoring. Tailoring ensures the standard remains relevant and effective in the organisation's specific operational context."},{"id":"d2_q_028","domain":"D2","difficulty":"medium","question":"Which process involves formally evaluating and testing the security controls of an information system before it is put into operation?","options":["Provisioning — setting up systems and assigning user accounts and access privileges","Validation — confirming a system meets defined business requirements","Verification — confirming user or system identity through authentication","Certification — formally evaluating whether a system's security controls meet required standards"],"answer":3,"explanation":"Certification is the formal process of evaluating, testing, and examining the security controls built into an information system before it goes live. It produces documented assurance that the system meets its security requirements. Provisioning sets up systems and accounts but does not evaluate security controls. Validation checks whether a system meets business requirements during development. Verification confirms identity (authentication). Only after certification does accreditation (management sign-off accepting residual risk) follow."},{"id":"d2_q_029","domain":"D2","difficulty":"medium","question":"What is the term for the formal, official declaration that an information system is approved to operate within an organisation's network under a specific set of security guidelines?","options":["Authorization — granting users or systems specific access rights and permissions","Accreditation — the senior official's formal acceptance that the system may operate and that residual risk is acceptable","Validation — confirming that a system fulfils the requirements it was designed to address","Certification — the technical assessment of whether security controls meet required standards"],"answer":1,"explanation":"Accreditation is the formal declaration — made by a senior agency or organisational official — that an information system is approved to operate in a particular security configuration. It represents the organisation's acceptance of the residual risk after certification. Certification is the technical evaluation that comes before accreditation. Authorization is about granting users access rights (different concept). Validation confirms requirements are met during development. Accreditation is the management decision that says 'we accept the risk and approve this system to go live.'"},{"id":"d2_q_030","domain":"D2","difficulty":"medium","question":"An organisation adopts a cloud-based application for storing customer data. What are the PRIMARY benefits of implementing a Cloud Access Security Broker (CASB)?","options":["Improved user experience and productivity when accessing cloud services","Enhanced collaboration and communication among remote team members","Improved visibility into cloud usage and potential threats","Enhanced data protection and regulatory compliance across cloud services"],"answer":3,"explanation":"A CASB acts as a security enforcement point between the organisation and cloud service providers, offering encryption, data loss prevention, and access control. Its primary value is enhancing data protection and ensuring compliance with internal policies and regulations across multiple cloud services. Visibility is a secondary benefit — useful but not the primary driver for implementing a CASB. Productivity and collaboration are not CASB functions; a CASB is a security tool, not a collaboration platform."},{"id":"d2_q_031","domain":"D2","difficulty":"medium","question":"Before deploying a DLP (Data Loss Prevention) system, the security team realises the system cannot distinguish sensitive data from non-sensitive data. What must the organisation do FIRST?","options":["Encrypt all data so the DLP system does not need to differentiate between types","Block all outbound traffic permanently until the DLP system is fully configured","Perform data identification and classification — manually or through machine learning — so the DLP system knows what to protect","Allow the DLP system to run in passive mode for a full year before making configuration decisions"],"answer":2,"explanation":"A DLP system can only protect data it has been told is sensitive. Without data identification and classification, the system has no basis to decide what to allow or block. Classification can be applied manually (labels on files/datasets) or automatically through machine learning that analyses content. Encrypting everything does not solve the classification problem — the DLP still needs to know what should not leave the network. Blocking all outbound traffic cripples operations. A year-long passive phase leaves the organisation exposed for twelve months."},{"id":"d2_q_032","domain":"D2","difficulty":"medium","question":"Your organisation uses a cloud platform and receives reports of unauthorised access to sensitive data by external parties. As IT security manager, which solution BEST addresses this specific threat?","options":["Implement a strong DLP strategy to prevent data from leaving the network","Establish a CSPM process to identify misconfigurations in the cloud environment","Implement a CASB to sit between the organisation and the cloud provider, providing visibility, access control, and threat protection","Set up a strict BYOD policy to control the risks from personal devices"],"answer":2,"explanation":"A CASB is specifically designed for cloud environments — it sits between on-premises infrastructure and the cloud provider, offering visibility, compliance enforcement, data security, and threat protection. For unauthorised external access to cloud-stored data, a CASB is the most targeted solution. DLP prevents data from leaving, but does not directly address external unauthorised access to cloud services. CSPM focuses on misconfiguration and compliance monitoring, not active access threats. A BYOD policy controls personal device risk but lacks cloud-specific access controls."},{"id":"d2_q_033","domain":"D2","difficulty":"medium","question":"When applying standards and frameworks, what does SCOPING mean?","options":["Implementing the full standard, but to a higher level in some areas","Determining how much implementation will cost the organisation","Picking and choosing which parts of the standard to implement","Evaluating whether the standard is the right fit for the organisation"],"answer":2,"explanation":"Scoping means selecting which parts of a standard or framework apply to your environment — you implement the relevant portions rather than blindly adopting every control. Compare with tailoring, which customises the controls you do implement."},{"id":"d2_q_034","domain":"D2","difficulty":"medium","question":"Which of the following is a COMMON physical attack against data at rest?","options":["Man-in-the-Middle (MITM) interception","Stealing unencrypted laptops or storage devices to access stored data","Using screen scrapers to capture displayed content","Deploying keyloggers to record user input"],"answer":1,"explanation":"A very common real-world attack on data at rest is the physical theft of unencrypted laptops or portable drives. This is why encrypting data at rest is essential — if the device is stolen, the data remains protected. MITM attacks target data in motion; screen scrapers and keyloggers target data in use."},{"id":"d2_q_035","domain":"D2","difficulty":"easy","question":"What are we trying to get rid of when we dispose of data?","options":["The hardware the data was stored on","Data remanence — the residual data that remains after deletion attempts","The encryption keys used to protect the data","The audit logs associated with the data"],"answer":1,"explanation":"The goal of data disposal is to eliminate data remanence — the residual traces of data that remain on media even after standard deletion or formatting. Techniques like overwriting, degaussing, and physical destruction are used to ensure no recoverable data remains."},{"id":"d2_q_036","domain":"D2","difficulty":"easy","question":"How long should an organisation keep backup data?","options":["Forever — backup data should never be deleted","As long as it is useful OR required by regulation, whichever period is longer","At most one month if a full backup is kept","Always a minimum of one year regardless of content"],"answer":1,"explanation":"The rule of thumb for backup retention is: keep data as long as it is useful to the organisation OR as long as it is required by law or regulation — whichever is the longer period. This balances operational value against legal obligations."},{"id":"d2_q_037","domain":"D2","difficulty":"medium","question":"Which set of controls BEST protects data while it is actively in use?","options":["Full-disk encryption and VPN tunnels","Clean desk policies, print policies, and locking workstations when unattended","Need-to-know access policies alone","Clean desk policies, job rotation, and mandatory leave"],"answer":1,"explanation":"Data in use cannot be encrypted while being processed, so physical and procedural controls are key: clean desk policies (limiting exposed paper/screens), print policies (collecting printouts immediately), and locking workstations when stepping away all reduce the risk of unauthorised access or viewing."},{"id":"d2_q_038","domain":"D2","difficulty":"medium","question":"How do you erase an EPROM chip?","options":["It cannot be erased once written","Use software to overwrite the existing data","Expose the chip window to UV (ultraviolet) light","Remove the chip and degauss it"],"answer":2,"explanation":"EPROM (Erasable Programmable ROM) has a small transparent window on the chip. Exposing that window to UV light for a set period discharges the stored charge, erasing the content. It can then be reprogrammed. EEPROM and flash use electrical signals to erase; degaussing only works on magnetic media."},{"id":"d2_q_039","domain":"D2","difficulty":"medium","question":"Why do data disposal procedures often require the use of MULTIPLE destruction methods?","options":["Because it is easier and faster than using a single method","To ensure no data remanence — multiple methods address the weaknesses of any single approach","To ensure the data is still partially accessible for recovery after disposal","Because regulators always mandate exactly two destruction methods"],"answer":1,"explanation":"Using multiple destruction methods (for example, overwriting and then shredding) provides defence in depth against data remanence. No single method is guaranteed to be perfect, so layering techniques reduces the risk that any residual data could be recovered."},{"id":"d2_q_040","domain":"D2","difficulty":"easy","question":"Which statement BEST describes what a clean desk policy requires?","options":["Keeping your physical desk surface free of all clutter at all times","Minimal use of paper copies, and using them only while actively at your desk","Shredding all paper documents before leaving the office each day","Collecting printouts from the printer the moment they are produced"],"answer":1,"explanation":"A clean desk policy means minimising the use of paper copies and ensuring any paper documents containing sensitive data are only out on the desk while actively being used. When you leave your desk or are done with a document, it should be secured — not left exposed for others to view."},{"id":"d2_q_041","domain":"D2","difficulty":"easy","question":"What is the PRIMARY control used to protect data at rest?","options":["Clean desk policy","Encryption","Privacy screens","Discretionary Access Control (DAC)"],"answer":1,"explanation":"Encryption is the primary control for protecting data at rest. Encrypting stored data ensures that even if media is stolen or a storage device is removed, the data cannot be read without the decryption key. Clean desk policies and privacy screens protect data in use; DAC controls access but does not protect the data itself."},{"id":"d2_q_042","domain":"D2","difficulty":"medium","question":"Which of the following is a COMMON technical attack against data at rest?","options":["Shoulder surfing","Eavesdropping on network traffic","Cryptanalysis — attempting to break the cryptographic protection on stored data","All of these equally target data at rest"],"answer":2,"explanation":"Cryptanalysis — the practice of attempting to break cryptographic algorithms or find weaknesses in encryption — directly targets data at rest that is protected by encryption. Shoulder surfing is an attack on data in use, and eavesdropping targets data in motion."},{"id":"d2_q_043","domain":"D2","difficulty":"medium","question":"During which data state does encryption FAIL to protect data, and why?","options":["Data at rest — encryption keys can be stolen from storage","Data in motion — packets can be captured before decryption","Data in use — data must be decrypted to be actively processed by the CPU","Data on backup tapes — encryption degrades over long storage periods"],"answer":2,"explanation":"When data is actively being used (processed by applications or the CPU), it must be decrypted and held in memory in plaintext form. At that moment, encryption cannot protect it. Physical controls (clean desk, screen filters, locked workstations) are used instead to protect data while in use."},{"id":"d2_q_044","domain":"D2","difficulty":"medium","question":"Which type of read-only memory can be programmed EXACTLY ONCE and cannot be erased?","options":["EPROM (Erasable Programmable ROM)","PROM (Programmable ROM)","EEPROM (Electrically Erasable Programmable ROM)","DRAM (Dynamic RAM)"],"answer":1,"explanation":"PROM (Programmable ROM) can be programmed once — typically by 'blowing' microscopic fuses — and after that the data is permanent and cannot be erased or changed. EPROM can be erased with UV light; EEPROM can be erased electrically; DRAM is volatile RAM, not ROM."},{"id":"d2_q_045","domain":"D2","difficulty":"easy","question":"In the US government classification scheme, which level applies to information whose disclosure would cause NO harm to national security?","options":["Unregulated","Unclassified","Secret","Common Knowledge"],"answer":1,"explanation":"In the US government system, Unclassified is the designation for information that can be shared without harming national security. The harm-based hierarchy runs: Unclassified (no harm) → Confidential (damage) → Secret (serious damage) → Top Secret (exceptionally grave damage)."},{"id":"d2_q_046","domain":"D2","difficulty":"medium","question":"A data retention policy defines which data to keep, how long to keep it, and where to store it. Which of the following should NOT be a primary consideration in a data retention policy?","options":["Which categories of data must be retained","How to safely destroy data once the retention period expires","How long each category of data must be kept","Where backup copies will be stored"],"answer":1,"explanation":"Data destruction procedures belong in a separate data disposal or destruction policy, not the retention policy itself. A retention policy focuses on what data to keep, for how long, and where — not on how to destroy it when the period ends. Mixing the two can create confusion and compliance gaps."},{"id":"d2_q_047","domain":"D2","difficulty":"easy","question":"An attacker steals a backup tape from an off-site storage facility. What BEST prevents them from accessing the data on the tape?","options":["Proper physical handling procedures for backup media","Proper data encryption applied to the backup data","Proper labelling and inventory control of the tape","A robust data retention policy governing backup frequency"],"answer":1,"explanation":"If backup data is encrypted, a stolen tape is useless to an attacker — they cannot read the data without the decryption key. Physical handling procedures, labelling, and retention policies are all important, but only encryption directly prevents the attacker from reading the stolen data."},{"id":"d2_q_048","domain":"D2","difficulty":"easy","question":"End-to-end encryption is specifically designed to protect data in which state?","options":["Data at rest — stored on servers or hard drives","Data in motion — while being transmitted across a network","Data in use — while being actively processed","All three states simultaneously"],"answer":1,"explanation":"End-to-end encryption protects data in motion — it encrypts data at the source and keeps it encrypted across every hop of the network until it reaches the intended recipient. This prevents eavesdropping or interception during transmission."},{"id":"d2_q_049","domain":"D2","difficulty":"medium","question":"An organisation adds access logs to its backup servers, tracking who accesses backup data and when. This is an example of which data management practice?","options":["Proper data storage","Proper data handling","Data retention management","Data encryption at rest"],"answer":1,"explanation":"Access logging — recording who accesses data and when — is a component of proper data handling. Data handling covers all procedures around how data is accessed, used, transferred, and tracked throughout its lifecycle, ensuring accountability and auditability."},{"id":"d2_q_050","domain":"D2","difficulty":"easy","question":"Which of the following would be the MOST appropriate method for securely disposing of an SSD drive?","options":["Degaussing the drive using a strong magnetic field","Formatting the drive using a standard operating system format tool","Shredding the drive using an industrial media shredder","Simply deleting all files and emptying the recycle bin"],"answer":2,"explanation":"SSDs store data on flash memory chips, which are not magnetic — degaussing has no effect. Standard formatting and file deletion do not reliably erase SSD data due to wear-levelling. Physical shredding destroys the chips entirely, ensuring data remanence is eliminated."},{"id":"d2_q_051","domain":"D2","difficulty":"easy","question":"An organisation handles highly sensitive customer data. Which of these storage and transmission mediums should be encrypted?","options":["Hard disks only — network traffic is protected by the firewall","Backup tapes only — primary disks are physically secured","All of these — hard disks, backup tapes, and data sent over the network","Data sent over the network only — stored data is hard to intercept"],"answer":2,"explanation":"Sensitive data should be encrypted in all storage and transmission contexts: hard disks (data at rest), backup tapes (data at rest in another location), and network transmission (data in motion). Relying on physical security or firewalls alone is insufficient defence in depth."},{"id":"d2_q_052","domain":"D2","difficulty":"medium","question":"An SSD drive has been physically damaged and its chips are partially destroyed. The drive cannot be accessed or overwritten. Which disposal method BEST ensures no data remanence?","options":["Degauss the drive","Attempt to overwrite accessible sectors","Incinerate the drive","Format the drive using a secure erase utility"],"answer":2,"explanation":"When
